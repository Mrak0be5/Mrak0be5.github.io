function enterZone(i) {
  if (typeof setPalette === "function") setPalette(ZONES[i].pal);

function drawGround() {
  const g = wd_groundCache[G.zone];
  const shk = G.shake || { x: 0, y: 0 };
  const camX = Math.floor((G.cam && G.cam.x) || 0) - (shk.x || 0), camY = Math.floor((G.cam && G.cam.y) || 0) - (shk.y || 0);
  if (!g) { rect(0, 0, W, H, hx("#a86c38")); return; }
  for (let y = 0; y < H; y++) {
    const gy = camY + y, dst = y * W;
    if (gy < 0 || gy >= g.h) { pix.fill(INK, dst, dst + W); continue; }
    if (camX >= 0 && camX + W <= g.w) pix.set(g.d.subarray(gy * g.w + camX, gy * g.w + camX + W), dst);
    else for (let x = 0; x < W; x++) { const gx = camX + x; pix[dst + x] = (gx >= 0 && gx < g.w) ? g.d[gy * g.w + gx] : INK; }
  }
  wd_animGround();
}
function wd_animGround() {
  const z = ZONES[G.zone]; if (!z) return;
  const t = (G.t || 0);
  for (const bu of z.burrows) if (onScreen(bu.x, bu.y, 16)) wd_drawBurrowBreath(SX(bu.x), SY(bu.y), 11, t);
  if (G.zone === 1 && z._creek) for (let i = 0; i < z._creek.length - 1; i++) {
    const a = z._creek[i], b2 = z._creek[i + 1];
    if (!onScreen((a[0] + b2[0]) / 2, (a[1] + b2[1]) / 2, 30)) continue;
    const ph = (t * 0.5 + i * 0.3) % 1, x = a[0] + (b2[0] - a[0]) * ph, y = a[1] + (b2[1] - a[1]) * ph;
    put(SX(x - 9), SY(y - 2), hx("#8ef0ff")); put(SX(x + 8), SY(y + 3), mix(hx("#2a5a94"), hx("#8ef0ff"), 0.4));
  }
  if (G.zone === 2) for (const seg of z.rails) for (let i = 0; i < seg.length - 1; i++) {
    const a = seg[i], b2 = seg[i + 1];
    if (!onScreen((a[0] + b2[0]) / 2, (a[1] + b2[1]) / 2, 40)) continue;
    const glintY = a[1] + (b2[1] - a[1]) * ((t * 0.3) % 1);
    put(SX(a[0] + (b2[0] - a[0]) * ((t * 0.3) % 1) - 4), SY(glintY), hx("#f6f6ff"));
  }
  if (G.zone === 3) for (const [ox, oy, orr] of z._oil || []) if (onScreen(ox, oy, orr + 8)) {
    const k = 0.5 + 0.5 * Math.sin(t * 1.1 + ox);
    put(SX(ox + Math.sin(t) * orr * 0.3), SY(oy), mix(hx("#2a2a34"), hx("#8ef0ff"), k * 0.25));
  }
  if (G.zone === 5) for (const [px, py] of z._pools || []) if (onScreen(px, py, 30)) {
    const k = 0.5 + 0.5 * Math.sin(t * 2 + px);
    fillEllipseDither(SX(px), SY(py), 3 + k * 2, 1.6 + k, hx("#9cf03a"), 0.4, false);
  }
}
function worldCollect(push) {

      wd_shadow(SX(p.x), SY(p.y) - 1, (spr.w - 2) * 0.32, (spr.w - 2) * 0.16);

function gm_evictZoneSprites(zone) {

 for(const key of SPRITES.keys()){
  const a=String(key).split(':');let remove=false;
  if(a[0]==='pr'||a[0]==='p2'){
   if(PREY_DEF[a[1]])remove=!prey.has(a[1]);
   else if(a[1]==='mount')remove=!prey.has(a[2]);
  }else if(a[0]==='b1'&&['bull','hv','hvreel','horse','sc','scbag','gat','dz','dzd','dzm','trls','trlv','trcs','trcv','mortar'].includes(a[1]))remove=!boss.has(a[1]);
  else if(a[0]==='b2'){

function gm_prepareWarm(zone,tunnel=false) {

}

 const start=clock(),random=Math.random;Math.random=seeded(1729);
 try{
  do{const q=gm_warmQueue[gm_warmIndex++];
   try{
    if(!q.boss){const art=PREY_ART[q.kind];if(art&&art.frame){const p={kind:q.kind,def:PREY_DEF[q.kind],x:G.cam.x+90,y:G.cam.y+160,z:0,t:q.f*.12,st:q.f*.12,state:q.state,face:1,dir:q.d*Math.PI/4,aim:q.d*Math.PI/4,seed:0,flash:0,elite:false,alert:0,hp:100,ko:1};art.frame(p);if(art.over)art.over(p,90,160);}}
    else{const def=BOSS_DEF[q.kind];if(def){const b={kind:q.kind,def,x:G.cam.x+90,y:G.cam.y+160,z:0,t:0,st:0,state:'idle',phase:0,hp:100,maxHp:100,mem:{},dir:0,aim:0,face:1,flash:0,stun:0,dying:0,suck:0,age:0};if(def.init)def.init(b);b.state=q.state;b.phase=q.phase;b.t=b.st=q.f*.13;if(def.collect)def.collect((y,fn)=>fn(),b);else if(def.draw)def.draw(b,90,160);}}
   }catch(e){G.moduleWarnings['warm:'+q.kind]=String(e.message||e);}
  }while(gm_warmIndex<gm_warmQueue.length&&(headless||clock()-start<3));
 }finally{Math.random=random;}
}

<script>

"use strict";
const BOT = {skill:1,session:0,think:0,menu:0,target:null,targetT:0,last:{x:0,y:0},stuck:0,divePulse:false,noticed:new WeakMap(),decisions:0};
function gm_botSeen(o) {let at=BOT.noticed.get(o);if(at===undefined){at=G.t+.12+(1.2-clamp(BOT.skill,.6,1.2))*.5+Math.max(0,1-BOT.skill)*1.8;BOT.noticed.set(o,at);}return G.t>=at;}
function gm_botCard(c) {
 if(c.evo)return 120;const order={vortex:62,quake:61,plates:57,acid:53,spines:51,glutton:48,devils:44,storm:42,speed:40,spikes:38,tail:34,toxic:33,feast:1};
 return (order[c.id]||0)-(c.id==="plates"?Math.max(0,1-BOT.skill)*75:0)+(c.isNew?0:18)+((c.nextLvl||c.lvl)>=5?7:0);

function gm_botMenus(dt) {

  const u=G.upgrades,priority=["belly","hide","maw","burrow","speed"],score=id=>({belly:6,hide:5-Math.max(0,1-BOT.skill)*3,maw:5,burrow:3,speed:3}[id])/(1+u[id]);
  const items=G.shop.items.filter(i=>i.lvl<i.max&&i.cost<=G.coins).sort((a,b)=>score(b.id)-score(a.id));
  if(items.length&&BOT.decisions<6){buyUpgrade(items[0].id);BOT.decisions++;}
  else {if(G.golden>0&&G.gems>=BAL.economy.golden)buyUpgrade("golden:"+priority.sort((a,b)=>score(b)-score(a))[0]);BOT.decisions=0;leaveBurrow();}
 }

}
function gm_botGoal() {
 const w=G.worm,z=gm_zone();
 if(w.belly>=.93||(w.hp<w.maxHp*.28&&!G.boss)){const b=gm_nearestBurrow();return {x:b.x,y:b.y,kind:"burrow"};}
 if(G.gate.open>=1)return {x:z.gate.x,y:z.gate.y,kind:"gate"};

 let best=null,score=-Infinity;
 for(const p of G.prey){if(p.dead||p.state==="suck"||p.state==="air")continue;
  if(p.lvl>w.lvl&&p.state!=="ko")continue;const d=dist(w.x,w.y,p.x,p.y);
  let cluster=0;for(const q of G.prey)if(q!==p&&q.lvl<=w.lvl&&dist(p.x,p.y,q.x,q.y)<40)cluster++;
  const val=(p.state==="ko"?55:0)+(p.elite?65:0)+cluster*8+p.def.xp*.22-d*.5-(p.z>10?65:0);
  if(val>score){score=val;best=p;}
 }
 if(best)return {x:best.x,y:best.y,kind:"prey",ent:best};
 const near=G.prey.filter(p=>!p.dead&&p.state!=="suck").sort((a,b)=>dist(w.x,w.y,a.x,a.y)-dist(w.x,w.y,b.x,b.y))[0];
 return near?{x:near.x,y:near.y,kind:"threat",ent:near}:{x:z.start.x+Math.sin(G.t*.09)*100,y:z.start.y-80,kind:"wander"};
}
function botThink(dt,skill) {

 BOT.last={x:w.x,y:w.y};
 let target=BOT.target;

 if(!target||BOT.targetT<=0||urgent||target.ent&&(target.ent.dead||target.ent.state==="suck")){target=BOT.target=gm_botGoal();BOT.targetT=1.4;}
 if(target.ent){target.x=target.ent.x;target.y=target.ent.y;}
 let dx=target.x-w.x,dy=target.y-w.y,d=Math.hypot(dx,dy)||1,ax=dx/d,ay=dy/d;
 let wantDive=false,erupt=false;
 if(target.kind==="boss"){
  const b=target.ent,r=w.r+b.def.r-2;

  if(G.dive.cd<=0&&!G.dive.active&&d<85&&(b.z>10||b.stun<=0)){
   const hesitate=Math.max(0,1-BOT.skill)*7;

 }
 if(target.kind==="burrow"||target.kind==="gate"){
  if(d<40&&!G.dive.active&&G.dive.cd<=0)wantDive=true;
  if(G.dive.active&&d<14){ax=dx/d;ay=dy/d;}
 }
 if(target.kind==="threat"&&d<55){wantDive=G.dive.cd<=0;if(G.dive.active&&d<30&&G.dive.t>.35)erupt=true;}
 let danger=0;
 for(const tg of G.telegraphs){if(tg.dead||!gm_botSeen(tg))continue;
  const left=tg.dur-tg.t;if(left>.65)continue;
  if(gm_shape(tg.shape,tg.x,tg.y,tg,w.x+ax*18,w.y+ay*18,w.r+3)){
   danger++;
   let ex=w.x-tg.x,ey=w.y-tg.y;
   if(tg.shape==="line"||tg.shape==="cone"){const nx=-Math.sin(tg.ang),ny=Math.cos(tg.ang),sg=Math.sign(ex*nx+ey*ny)||1;ex=nx*sg;ey=ny*sg;}
   const n=Math.hypot(ex,ey)||1;ax+=ex/n*1.4;ay+=ey/n*1.4;
  }
 }
 for(const s of G.shots){if(!s.hostile||s.lob||!gm_botSeen(s))continue;
  const rx=s.x-w.x,ry=s.y-w.y,vx=s.vx-ax*w.speed,vy=s.vy-ay*w.speed,t=clamp(-(rx*vx+ry*vy)/(vx*vx+vy*vy||1),0,.4);
  if(Math.hypot(rx+vx*t,ry+vy*t)<w.r+s.r+3){danger++;const sp=Math.hypot(s.vx,s.vy)||1,nx=-s.vy/sp,ny=s.vx/sp,sg=Math.sign(-rx*nx-ry*ny)||1;ax+=nx*sg;ay+=ny*sg;}
 }
 if(!G.dive.active&&target.kind!=="boss")for(const p of G.prey){if(p.lvl<=w.lvl||p.state==="ko"||p.state==="suck"||p===target.ent)continue;
  const r=dist(w.x,w.y,p.x,p.y);if(r<40){ax+=(w.x-p.x)/(r||1)*.6;ay+=(w.y-p.y)/(r||1)*.6;}}
 if(danger&&G.dive.cd<=0&&!G.dive.active&&BOT.skill>=.85)wantDive=true;
 if(w.under<.5){const px=w.x+ax*24,py=w.y+ay*24;
  for(const s of gm_zone().solids||[]){const cx=s.r===undefined?clamp(px,s.x-s.w/2,s.x+s.w/2):s.x,cy=s.r===undefined?clamp(py,s.y-s.h/2,s.y+s.h/2):s.y,rr=(s.r||0)+w.r+9;
   const dd=dist(px,py,cx,cy);if(dd<rr){const ex=(px-cx)/(dd||1),ey=(py-cy)/(dd||1);ax+=ex*1.6;ay+=ey*1.6;if(G.dive.cd<=0)wantDive=true;}
  }
 }
 if(BOT.stuck>.7&&G.dive.cd<=0)wantDive=true;
 if(BOT.stuck>2){const a=w.ang+1.8;ax=Math.cos(a);ay=Math.sin(a);BOT.targetT=0;}
 const error=(1.2-BOT.skill)*.13*Math.sin(G.t*2.1+G.seed),aa=Math.atan2(ay,ax)+error;
 G.ctrl.ax=Math.cos(aa);G.ctrl.ay=Math.sin(aa);
 if((wantDive||erupt)&&!BOT.divePulse){G.ctrl.dive=true;BOT.divePulse=true;}else BOT.divePulse=false;
}

<script>
// ---- hud.js
"use strict";

const hu_bg = mix(INK, hx("#2a2230"), 0.3);
const hu_panelBg = hx("#2a2230"), hu_panelBg2 = hx("#1a1028");
const hu_green = hx("#5e8c3e"), hu_greenHi = hx("#86b85a"), hu_greenDk = hx("#1e3a1e");
const hu_red = hx("#e04a3a"), hu_redDk = hx("#8a2020");
const hu_purple = UI_PURPLE, hu_purpleD = UI_PURPLE_D, hu_purpleHi = hx("#9b6fbf");
const hu_gold = UI_YELLOW, hu_coinCol = hx("#f0b030"), hu_gemCol = hx("#9468a8"), hu_gemHi = hx("#d8b8e8");

function hu_num(n) {
  n = Math.max(0, Math.floor(n || 0));
  if (n >= 1000000) return (n / 1000000).toFixed(1) + "M";
  if (n >= 10000) return Math.round(n / 1000) + "K";
  if (n >= 1000) return (n / 1000).toFixed(1) + "K";
  return "" + n;
}
function hu_panel(x, y, w, h, bg) {
  x |= 0; y |= 0;
  rect(x, y, w, h, INK);
  rect(x + 1, y + 1, w - 2, h - 2, bg);
  rect(x + 1, y + 1, w - 2, 1, mix(bg, WHITE, 0.22));
  rect(x + 1, y + h - 2, w - 2, 1, mix(bg, BLACK, 0.3));
}
function hu_bar(x, y, w, h, frac, fillLo, fillHi, o) {
  o = o || {};
  x |= 0; y |= 0;
  rect(x, y, w, h, INK);
  rect(x + 1, y + 1, w - 2, h - 2, o.bg || hu_panelBg2);
  const fw = Math.max(0, Math.round((w - 2) * clamp(frac, 0, 1)));
  if (fw > 0) {
    rect(x + 1, y + 1, fw, h - 2, fillLo);
    rect(x + 1, y + 1, fw, 1, fillHi);
    if (o.shine) {
      const ph = (o.shine * 26) % (w + 10) - 10;
      for (let i = 0; i < fw; i++) {
        const dx = i - ph;
        if (dx > -3 && dx < 3) for (let j = 1; j < h - 1; j++) tint(x + 1 + i, y + j, WHITE, 0.3 - Math.abs(dx) * 0.08);
      }

  if (o.text) centerTextIn(o.text, x, y - (o.labelAbove ? 7 : 0), w, o.col || WHITE, o.k || 1, o.labelY != null ? o.labelY : y + Math.max(0, (h - 5) / 2 | 0));
}
function centerTextIn(s, x, _unused, w, col, k, ty) { text(s, x + Math.round((w - textW(s, k)) / 2), ty, col, k); }

function hu_pop(age, dur = 0.22) {
  if (age < 0 || age > dur) return 1;
  const u = age / dur;
  return 1 + (1 - u) * 0.6 * Math.sin(u * Math.PI);
}
function hu_scaleText(s, cx, cy, col, k, scale, outline) {
  if (Math.abs(scale - 1) < 0.02) { text(s, cx - Math.round(textW(s, k) / 2), cy, col, k, outline); return; }
  const key = "txtsc:" + s + ":" + k + ":" + col;
  text(s, cx - Math.round(textW(s, k) / 2), Math.round(cy - (scale - 1) * 4), col, k, outline);
}

const hu_prev = Object.create(null), hu_popT = Object.create(null);
function hu_track(key, val, t) {
  if (hu_prev[key] === undefined) hu_prev[key] = val;
  if (val !== hu_prev[key]) { hu_popT[key] = t; hu_prev[key] = val; }
  const age = t - (hu_popT[key] === undefined ? -99 : hu_popT[key]);
  return hu_pop(age);
}

function hudRects() {
  return {
    dive: [W - 32, H - 32, 28, 28],

    mute: [W - 10, 1, 9, 19],

}

  const hp = w0.hp != null ? w0.hp : 1, maxHp = Math.max(1, w0.maxHp || 1), hfrac = clamp(hp / maxHp, 0, 1);

    const frac = clamp((q.n || 0) / Math.max(1, q.need || 1), 0, 1);

  for (let p = 1; p <= 2; p++) { const px = x0 + 1 + Math.round((w0 - 2) * (1 - p / 3)); line(px, y0 + 1, px, y0 + h0 - 2, INK); }

 const KEY_CODE={KeyW:"up",ArrowUp:"up",KeyS:"down",ArrowDown:"down",KeyA:"left",ArrowLeft:"left",KeyD:"right",ArrowRight:"right",
  Space:"dive",ShiftLeft:"dive",ShiftRight:"dive",Enter:"ok",NumpadEnter:"ok",Escape:"back",KeyR:"reroll",KeyM:"mute"};
 const KEY_CHAR={w:"up","\u0446":"up",s:"down","\u044b":"down",a:"left","\u0444":"left",d:"right","\u0432":"right",arrowup:"up",arrowdown:"down",arrowleft:"left",arrowright:"right",
  " ":"dive",shift:"dive",enter:"ok",escape:"back",r:"reroll","\u043a":"reroll",m:"mute","\u044c":"mute"};
 const keyAct=e=>{const c=e.code||"";if(KEY_CODE[c])return KEY_CODE[c];const n=/^(?:Digit|Numpad)([1-9])$/.exec(c);if(n)return "n"+n[1];
  if(c&&c!=="Unidentified")return null;const k=(e.key||"").toLowerCase();return KEY_CHAR[k]||(/^[1-9]$/.test(k)?"n"+k:null);};
 const held=a=>{for(const v of keys.values())if(v===a)return true;return false;};
 const kbShop=()=>{const n=G.shop.items.length,g=G.golden>0?Object.keys(G.upgrades).length:0;return {n,g,total:n+g+1};};
 const kbAfford=i=>{const {n,g}=kbShop();if(i<n){const q=G.shop.items[i];return q.lvl<q.max&&G.coins>=q.cost;}
  if(i<n+g){const id=Object.keys(G.upgrades)[i-n];return G.gems>=BAL.economy.golden&&G.upgrades[id]<BAL.upgrades[id].max;}return true;};
 const kbDefault=()=>{if(G.mode!=="shop")return 0;const {total}=kbShop();let i=0;while(i<total-1&&!kbAfford(i))i++;return i;};
 let kbMode="",kbPhase="";
 const kbSync=()=>{const ph=G.mode==="shop"?G.shop.phase:"";if(G.mode!==kbMode||ph!==kbPhase){kbMode=G.mode;kbPhase=ph;G.kbSel=kbDefault();}
  if(ph==="shop"){const t=kbShop().total;if(G.kbSel>=t)G.kbSel=t-1;}}; // the golden row vanishes after its last buy
 const kbMenu=(act,repeat)=>{
  const shop=G.mode==="shop"&&G.shop.phase==="shop";
  if(G.mode==="end"){if((act==="ok"||act==="dive")&&!repeat&&G.modeT>1&&typeof openStore==="function")openStore(false);return;}
  if(G.mode!=="cards"&&!shop)return;
  const total=G.mode==="cards"?G.cards.length:kbShop().total;if(!total)return;
  const step=act==="up"||act==="left"?-1:act==="down"||act==="right"?1:0;
  if(step){G.kbSel=((G.kbSel|0)+step+total)%total;return;}
  if(repeat||G.modeT<.45)return; // a dive mashed as the menu pops up must not pick blindly
  if(act==="reroll"){if(G.mode==="cards"&&!rerollCards())gm_sfx("deny");return;}
  if(act==="back"){if(shop)leaveBurrow();return;}
  let i=-1;if(act==="ok"||act==="dive")i=G.kbSel|0;else if(act[0]==="n")i=+act.slice(1)-1;
  if(i<0||i>=total)return;
  if(G.mode==="cards"){pickCard(i);return;}
  const {n,g}=kbShop();if(act[0]==="n"&&i>=n)return;G.kbSel=i;
  if(i>=n+g){leaveBurrow();return;}
  if(!buyUpgrade(i<n?G.shop.items[i].id:"golden:"+Object.keys(G.upgrades)[i-n])){gm_sfx("deny");return;}
  kbSync();if(!kbAfford(G.kbSel)){const t=kbShop().total;let j=G.kbSel+1;while(j<t-1&&!kbAfford(j))j++;G.kbSel=j;}
 };
 window.addEventListener("keydown",e=>{
  unlockAudio();const act=keyAct(e);if(!act)return;
  e.preventDefault();gesture();G.kbd=true;kbSync();
  if(act!=="ok"&&act!=="back"&&act!=="reroll"&&act!=="mute"&&act[0]!=="n")keys.set(e.code||e.key,act);
  if(act==="mute"){if(!e.repeat&&typeof toggleMute==="function")toggleMute();return;}
  if(G.mode==="play"){if(act==="dive"&&!e.repeat)tapDive=true;return;}
  kbMenu(act,e.repeat);
 });
 window.addEventListener("keyup",e=>keys.delete(e.code||e.key));
 window.addEventListener("blur",resetInput);
 document.addEventListener("visibilitychange",syncPause);
 if(typeof mraid!=="undefined"&&mraid.addEventListener){
  if(typeof mraid.isViewable==="function")viewable=mraid.isViewable();
  mraid.addEventListener("viewableChange",v=>{viewable=!!v;syncPause();});
  mraid.addEventListener("exposureChange",pct=>{exposed=pct>0;syncPause();});
 }
 window.addEventListener("resize",resize);resize();syncPause();
 function frame(now) {
  window.requestAnimationFrame(frame);
  try{
   const fdt=last?Math.min(.1,Math.max(0,(now-last)/1000)):0;last=now;kbSync();G.kbDive=held("dive");
   if(!paused){acc=Math.min(.1,acc+fdt);
    while(acc>=BAL.step){
     if(G.demo){G.demoDive=true;botThink(BAL.step);}else{
      let ax=(held("right")?1:0)-(held("left")?1:0),ay=(held("down")?1:0)-(held("up")?1:0);
      if(G.input.down){const dx=G.input.x-G.input.x0,dy=G.input.y-G.input.y0;if(Math.hypot(dx,dy)>=6){ax=clamp(dx/23,-1,1);ay=clamp(dy/23,-1,1);}else ax=ay=0;}
      G.ctrl.ax=ax;G.ctrl.ay=ay;G.ctrl.dive=tapDive;tapDive=false;
     }
     acc-=BAL.step;update(BAL.step);
    }
    render();octx.putImageData(frameImg,0,0);sctx.imageSmoothingEnabled=false;sctx.drawImage(octx.canvas,0,0,canvas.width,canvas.height);
   }
  }catch(e){G.moduleWarnings=G.moduleWarnings||{};G.moduleWarnings.main=String(e&&e.stack||e);}
 }
 window.requestAnimationFrame(frame);
}
function gm_debugZone(zone) {
 const w=G.worm;w.lvl=BAL.flow.minLevel[zone];w.xp=0;w.xpNext=gm_xpNeed(w.lvl);w.tier=w.lvl>=26?3:w.lvl>=16?2:w.lvl>=8?1:0;
 const ids=["quake","vortex","plates","acid","glutton","spines"];
 for(let i=0;i<zone*6;i++){const id=ids[i%ids.length];w.abil[id]=Math.min(5,(w.abil[id]||0)+1);}
 for(const id of Object.keys(w.abil))G.abil[id]={t:0,cd:.2,list:[],ang:w.ang,len:65,r:70};
 for(const id of Object.keys(G.upgrades))G.upgrades[id]=Math.min(BAL.upgrades[id].max,zone);
 G.segCount=Math.min(26,5+zone*3);G.stats.lvl=w.lvl;gm_refreshStats();w.hp=w.maxHp;gm_startZone(zone);
}
function gm_readyBoot(){
 let started=false;const start=()=>{if(!started){started=true;gm_boot();}};
 if(typeof mraid!=="undefined"&&mraid.getState&&mraid.getState()==="loading")mraid.addEventListener("ready",start);else start();
}
if(typeof document!=="undefined") {
 if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",gm_readyBoot,{once:true});else gm_readyBoot();
}

</script>
