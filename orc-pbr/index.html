<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Orc — PBR</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #e7efe4;
      --dim: #8ea396;
      --line: rgba(180, 220, 170, 0.18);
      --glass: rgba(8, 14, 10, 0.72);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #070b09; color: var(--ink); font-family: "Segoe UI", sans-serif; }
    canvas { display: block; width: 100%; height: 100%; }
    #hud {
      position: fixed; left: 16px; right: 16px; bottom: 16px;
      display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
      padding: 12px 14px; border: 1px solid var(--line); border-radius: 16px;
      background: var(--glass); backdrop-filter: blur(16px);
    }
    button, label { font: inherit; color: inherit; }
    button {
      border: 1px solid var(--line); background: #142018; color: var(--ink);
      border-radius: 999px; padding: 8px 14px; cursor: pointer;
    }
    button[aria-pressed="true"] { background: #2f6b3a; border-color: transparent; }
    .slider { display: flex; align-items: center; gap: 8px; color: var(--dim); font-size: 13px; }
    input[type="range"] { accent-color: #7dffa2; width: 120px; }
    #status { margin-right: auto; font-size: 13px; letter-spacing: 0.04em; color: var(--dim); }
    #err { position: fixed; inset: 0; display: none; place-items: center; padding: 24px; text-align: center; }
  </style>
</head>
<body>
  <div id="err"></div>
  <div id="hud">
    <span id="status">загрузка</span>
    <button type="button" data-clip="punch" data-file="clips/punch.glb" aria-pressed="true">Удар</button>
    <button type="button" data-clip="kick" data-file="clips/kick.glb">Пинок</button>
    <button type="button" data-clip="run" data-file="clips/run.glb">Бег</button>
    <button type="button" data-clip="jump" data-file="clips/jump.glb">Прыжок</button>
    <button type="button" data-clip="roll" data-file="clips/roll.glb">Кувырок</button>
    <button type="button" data-clip="fingers" data-file="clips/fingers.glb">Пальцы</button>
    <button type="button" data-clip="toes" data-file="clips/toes.glb">Пальцы ног</button>
    <button type="button" data-clip="digits" data-file="clips/digits.glb">Вместе</button>
    <button type="button" data-clip="rest" data-file="model.glb">Покой</button>
    <button id="turn" type="button" aria-pressed="true">Поворот</button>
    <label class="slider">свет <input id="exposure" type="range" min="0.4" max="2.2" step="0.01" value="1.15" /></label>
    <label class="slider">металл <input id="env" type="range" min="0" max="2" step="0.01" value="1" /></label>
  </div>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
    import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

    const statusEl = document.getElementById("status");
    const errEl = document.getElementById("err");
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.prepend(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color("#070b09");
    scene.fog = new THREE.Fog("#070b09", 8, 18);
    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

    const camera = new THREE.PerspectiveCamera(32, innerWidth / innerHeight, 0.05, 80);
    camera.position.set(2.4, 1.35, 3.2);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(0, 0.95, 0);
    controls.maxPolarAngle = Math.PI * 0.49;
    controls.minDistance = 1.2;
    controls.maxDistance = 8;

    const key = new THREE.DirectionalLight("#fff4e0", 2.4);
    key.position.set(3.2, 6.5, 2.4);
    key.castShadow = true;
    key.shadow.mapSize.set(2048, 2048);
    key.shadow.camera.near = 0.5;
    key.shadow.camera.far = 16;
    key.shadow.camera.left = -3;
    key.shadow.camera.right = 3;
    key.shadow.camera.top = 3;
    key.shadow.camera.bottom = -3;
    scene.add(key);
    const rim = new THREE.DirectionalLight("#9ecbff", 0.55);
    rim.position.set(-4, 2, -2);
    scene.add(rim);
    scene.add(new THREE.HemisphereLight("#d7ffe4", "#1a140c", 0.45));

    const floor = new THREE.Mesh(
      new THREE.CircleGeometry(4.2, 80),
      new THREE.MeshStandardMaterial({ color: "#101612", metalness: 0.72, roughness: 0.28, envMapIntensity: 1 })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);
    const ring = new THREE.Mesh(
      new THREE.RingGeometry(1.15, 1.2, 80),
      new THREE.MeshBasicMaterial({ color: "#6dff9a", transparent: true, opacity: 0.35, side: THREE.DoubleSide })
    );
    ring.rotation.x = -Math.PI / 2;
    ring.position.y = 0.004;
    scene.add(ring);

    const root = new THREE.Group();
    scene.add(root);
    const loader = new GLTFLoader();
    const state = { mixer: null, model: null, turning: true, env: 1 };
    const clock = new THREE.Clock();

    function fit(object) {
      object.position.set(0, 0, 0);
      object.scale.set(1, 1, 1);
      object.updateMatrixWorld(true);
      const box = new THREE.Box3().setFromObject(object);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      object.position.sub(center);
      object.position.y += size.y / 2;
      object.scale.setScalar(1.85 / Math.max(size.y, 0.001));
      object.updateMatrixWorld(true);
      const fitted = new THREE.Box3().setFromObject(object);
      controls.target.set(0, fitted.getCenter(new THREE.Vector3()).y, 0);
    }

    function applyEnv(value) {
      state.env = value;
      floor.material.envMapIntensity = value;
      root.traverse((node) => {
        if (!node.isMesh) return;
        const mats = Array.isArray(node.material) ? node.material : [node.material];
        for (const mat of mats) if (mat) mat.envMapIntensity = value;
      });
    }

    function loadClip(file, label) {
      statusEl.textContent = "загрузка";
      loader.load(file, (gltf) => {
        if (state.model) {
          root.remove(state.model);
          state.mixer = null;
        }
        const model = gltf.scene;
        model.traverse((node) => {
          if (!node.isMesh) return;
          node.castShadow = true;
          node.receiveShadow = true;
          const mats = Array.isArray(node.material) ? node.material : [node.material];
          for (const mat of mats) {
            if (!mat) continue;
            mat.envMapIntensity = state.env;
            if (mat.map) mat.map.colorSpace = THREE.SRGBColorSpace;
            mat.needsUpdate = true;
          }
        });
        root.add(model);
        fit(model);
        state.model = model;
        if (gltf.animations.length) {
          state.mixer = new THREE.AnimationMixer(model);
          for (const clip of gltf.animations) state.mixer.clipAction(clip).play();
          statusEl.textContent = label + " · " + gltf.animations.map((clip) => clip.name.split("|")[1] || clip.name).join(", ");
        } else {
          statusEl.textContent = label + " · без клипа";
        }
        errEl.style.display = "none";
      }, undefined, () => {
        errEl.style.display = "grid";
        errEl.textContent = "Не удалось открыть " + file;
        statusEl.textContent = "ошибка";
      });
    }

    for (const button of document.querySelectorAll("[data-file]")) {
      button.addEventListener("click", () => {
        for (const other of document.querySelectorAll("[data-file]")) other.setAttribute("aria-pressed", "false");
        button.setAttribute("aria-pressed", "true");
        loadClip(button.dataset.file, button.textContent);
      });
    }
    document.getElementById("turn").addEventListener("click", (event) => {
      state.turning = !state.turning;
      event.currentTarget.setAttribute("aria-pressed", String(state.turning));
    });
    document.getElementById("exposure").addEventListener("input", (event) => {
      renderer.toneMappingExposure = Number(event.target.value);
    });
    document.getElementById("env").addEventListener("input", (event) => applyEnv(Number(event.target.value)));

    addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    renderer.setAnimationLoop(() => {
      const delta = clock.getDelta();
      if (state.mixer) state.mixer.update(delta);
      if (state.turning) root.rotation.y += delta * 0.28;
      controls.update();
      renderer.render(scene, camera);
    });

    loadClip("clips/punch.glb", "Удар");
  </script>
</body>
</html>
