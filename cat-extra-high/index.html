<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0907">
<title>Котик-шахтёр — CAT_EXTRA_HIGH (MB8)</title>
<style>
html, body { margin: 0; height: 100%; background: #0b0907; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
#wrap { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: #000; box-shadow: 0 0 40px rgba(0,0,0,.6); }
#c { width: 100%; height: 100%; display: block; outline: none; }
#load { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
        color: #f3dfb8; font: 600 16px system-ui, -apple-system, "Segoe UI", sans-serif; background: radial-gradient(#2a1d12, #0b0907 70%); }
#bar { width: 60%; height: 10px; border-radius: 5px; background: #2a2019; overflow: hidden; }
#fill { height: 100%; width: 0; background: linear-gradient(90deg, #f0a640, #ffd27a); transition: width .2s; }
#hint { font-weight: 400; font-size: 13px; opacity: .7; text-align: center; padding: 0 12%; }
#err { position: absolute; left: 8px; right: 8px; bottom: 8px; color: #ffb3a3; font: 12px/1.4 monospace; white-space: pre-wrap; pointer-events: none; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" tabindex="-1"></canvas>
  <div id="load">
    <div>Котик-шахтёр</div>
    <div id="bar"><div id="fill"></div></div>
    <div id="pct">загрузка 0%</div>
    <div id="hint">Управление: перетаскивай по экрану (джойстик) или WASD / стрелки</div>
  </div>
</div>
<div id="err"></div>
<script>
(function () {
  var wrap = document.getElementById('wrap'), load = document.getElementById('load');
  var fill = document.getElementById('fill'), pct = document.getElementById('pct'), err = document.getElementById('err');
  var A = 9 / 16;
  function fit() {
    var w = window.innerWidth, h = window.innerHeight;
    var cw = Math.min(w, h * A), ch = cw / A;
    wrap.style.width = Math.floor(cw) + 'px';
    wrap.style.height = Math.floor(ch) + 'px';
    return ch;
  }
  window.addEventListener('resize', fit);
  var ch = fit();
  // render close to the 1080x1920 reference: at least devicePixelRatio, up to 1920 px tall, capped at 2x
  var dpr = Math.min(Math.max(window.devicePixelRatio || 1, 1920 / Math.max(ch, 1)), 2);
  function showErr(m) { err.textContent += m + '\n'; console.error('[web] ' + m); }
  window.addEventListener('error', function (e) { showErr(String(e.message || e)); });
  var b = 'Build/';
  // GitHub refuses files over 100 MB: a big data file is published as parts and glued back into a Blob here
  var parts = ['WebGL.data.unityweb.part0', 'WebGL.data.unityweb.part1', 'WebGL.data.unityweb.part2', 'WebGL.data.unityweb.part3'], dataSize = 328086206, share = parts.length ? 0.85 : 0;
  function setP(p) { fill.style.width = Math.round(p * 100) + '%'; pct.textContent = 'загрузка ' + Math.round(p * 100) + '%'; }
  function loadData() {
    if (!parts.length) return Promise.resolve(b + 'WebGL.data.unityweb');
    var blobs = new Array(parts.length), done = 0;
    return Promise.all(parts.map(function (name, i) {
      return fetch(b + name).then(function (r) {
        if (!r.ok) throw new Error(name + ': HTTP ' + r.status);
        var rd = r.body.getReader(), chunks = [];
        function pump() {
          return rd.read().then(function (x) {
            if (x.done) { blobs[i] = new Blob(chunks); return; }
            chunks.push(x.value); done += x.value.length; setP(share * done / dataSize);
            return pump();
          });
        }
        return pump();
      });
    })).then(function () { return URL.createObjectURL(new Blob(blobs)); });
  }
  var config = {
    dataUrl: '',
    frameworkUrl: b + 'WebGL.framework.js.unityweb',
    codeUrl: b + 'WebGL.wasm.unityweb',
    streamingAssetsUrl: 'StreamingAssets',
    companyName: 'MinesCat',
    productName: 'CAT_EXTRA_HIGH',
    productVersion: 'MB8',
    devicePixelRatio: dpr,
    autoSyncPersistentDataPath: true,   // persistentDataPath (/idbfs: hero profile, save) -> IndexedDB, survives reloads
    cacheControl: function (url) { return url.indexOf('blob:') === 0 ? 'no-store' : 'must-revalidate'; },
    showBanner: function (msg, type) { if (type === 'error') showErr(msg); else console.warn('[web] ' + msg); }
  };
  var s = document.createElement('script');
  s.src = b + 'WebGL.loader.js';
  s.onload = function () {
    loadData().then(function (url) {
      config.dataUrl = url;
      return createUnityInstance(document.getElementById('c'), config, function (p) { setP(share + (1 - share) * p); });
    }).then(function (u) {
      window.unityInstance = u;
      load.style.display = 'none';
      console.log('[web] unity ready');
    }).catch(function (e) { showErr(String(e)); });
  };
  s.onerror = function () { showErr('не удалось загрузить ' + s.src); };
  document.body.appendChild(s);
})();
</script>
</body>
</html>
