<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Treasure Chest — Highlight Moment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Titan+One&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<style>
@property --bg1   { syntax:'<color>'; inherits:true; initial-value:#2E9A5A; }
@property --bg2   { syntax:'<color>'; inherits:true; initial-value:#0A2A22; }
@property --cmain { syntax:'<color>'; inherits:true; initial-value:#46D35B; }
@property --clight{ syntax:'<color>'; inherits:true; initial-value:#B8FF7A; }
@property --cdark { syntax:'<color>'; inherits:true; initial-value:#1A8A45; }
@property --ang   { syntax:'<angle>'; inherits:false; initial-value:0deg; }

:root{
  --ink:#1A1033;
  transition: --bg1 .7s ease, --bg2 .7s ease, --cmain .35s ease, --clight .35s ease, --cdark .35s ease;
  --hud-h:58px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0b0620;overflow:hidden;overscroll-behavior:none}
body{font-family:'Lilita One','Titan One',system-ui,sans-serif;color:#fff;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#app{position:fixed;inset:0;overflow:hidden;cursor:pointer}
#stage{position:absolute;inset:0;will-change:transform}
.layer{position:absolute;inset:0;pointer-events:none}

/* ---------- background ---------- */
#bg{background:radial-gradient(130% 85% at 50% 52%, var(--bg1) 0%, color-mix(in srgb,var(--bg1) 45%,var(--bg2)) 38%, var(--bg2) 78%)}
#bg::before{content:"";position:absolute;inset:0;opacity:.09;
  background:
   repeating-linear-gradient(45deg, #fff 0 2px, transparent 2px 38px),
   repeating-linear-gradient(-45deg, #fff 0 2px, transparent 2px 38px);
  -webkit-mask-image:radial-gradient(90% 70% at 50% 50%, #000 20%, transparent 80%);
          mask-image:radial-gradient(90% 70% at 50% 50%, #000 20%, transparent 80%)}
#bg::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 50%, transparent 55%, rgba(8,2,20,.65) 100%)}
.rays{position:absolute;left:50%;top:var(--ry,52%);width:240vmax;height:240vmax;margin:-120vmax 0 0 -120vmax;mix-blend-mode:screen;
  -webkit-mask-image:radial-gradient(circle, transparent 2%, #000 9%, rgba(0,0,0,.7) 22%, transparent 42%);
          mask-image:radial-gradient(circle, transparent 2%, #000 9%, rgba(0,0,0,.7) 22%, transparent 42%)}
#rays1{opacity:.55;background:repeating-conic-gradient(from 0deg, rgba(255,255,255,0) 0deg, color-mix(in srgb,var(--clight) 40%,transparent) 5deg, rgba(255,255,255,0) 10deg)}
#rays2{opacity:.45;background:repeating-conic-gradient(from 11deg, rgba(255,255,255,0) 0deg, color-mix(in srgb,#fff 26%,transparent) 8deg, rgba(255,255,255,0) 18deg, rgba(255,255,255,0) 24deg)}
#rays3{opacity:.5;background:repeating-conic-gradient(from 30deg, rgba(255,255,255,0) 0deg, color-mix(in srgb,var(--cmain) 45%,transparent) 22deg, rgba(255,255,255,0) 45deg)}
#chestHalo{position:absolute;width:70vmin;height:70vmin;left:0;top:0;margin:-35vmin 0 0 -35vmin;border-radius:50%;
  background:radial-gradient(circle, color-mix(in srgb,var(--clight) 80%,#fff) 0%, color-mix(in srgb,var(--clight) 45%,transparent) 22%, color-mix(in srgb,var(--cmain) 18%,transparent) 45%, transparent 68%);
  mix-blend-mode:screen;opacity:.35}

/* ---------- light pillar ---------- */
#pillar{position:absolute;left:0;top:0;width:0;height:0;opacity:0}
#pillar .beam{position:absolute;bottom:0;left:0;height:78vh;transform-origin:50% 100%;border-radius:50% 50% 40% 40% / 12% 12% 6% 6%;
  background:linear-gradient(to top, color-mix(in srgb,var(--clight) 70%,#fff) 0%, color-mix(in srgb,var(--clight) 55%,transparent) 30%, color-mix(in srgb,var(--cmain) 20%,transparent) 65%, transparent 100%);
  filter:blur(14px);mix-blend-mode:screen}
#pillar .pcore{position:absolute;left:-180px;top:-90px;width:360px;height:180px;border-radius:50%;
  background:radial-gradient(closest-side, #fff 0%, color-mix(in srgb,var(--clight) 80%,#fff) 25%, color-mix(in srgb,var(--clight) 35%,transparent) 60%, transparent 100%);
  filter:blur(6px);mix-blend-mode:screen}

/* ---------- reveal backdrop ---------- */
#backdrop{opacity:0;visibility:hidden;
  background:radial-gradient(circle at var(--cx,50%) var(--cy,38%), color-mix(in srgb,var(--cmain) 70%,#fff) 0%, var(--cmain) 16%, var(--cdark) 48%, color-mix(in srgb,var(--cdark) 35%,#0c0418) 100%)}
#backdrop .spin{position:absolute;left:var(--cx,50%);top:var(--cy,38%);width:200vmax;height:200vmax;margin:-100vmax 0 0 -100vmax;mix-blend-mode:screen;opacity:.55;
  background:repeating-conic-gradient(from 0deg, rgba(255,255,255,0) 0deg, rgba(255,255,255,.22) 15deg, rgba(255,255,255,0) 30deg);
  filter:blur(18px);
  -webkit-mask-image:radial-gradient(circle, #000 0%, rgba(0,0,0,.6) 18%, transparent 40%);
          mask-image:radial-gradient(circle, #000 0%, rgba(0,0,0,.6) 18%, transparent 40%)}
#backdrop .halo{position:absolute;left:var(--cx,50%);top:var(--cy,38%);width:var(--hw,420px);height:var(--hh,520px);transform:translate(-50%,-50%);border-radius:40%;
  background:radial-gradient(closest-side, color-mix(in srgb,var(--clight) 90%,#fff) 30%, color-mix(in srgb,var(--clight) 55%,transparent) 62%, transparent 100%);
  filter:blur(22px);mix-blend-mode:screen;opacity:.95}

canvas.fx,#gl{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#flash{position:absolute;left:0;top:0;width:120vmax;height:120vmax;margin:-60vmax 0 0 -60vmax;border-radius:50%;pointer-events:none;opacity:0;mix-blend-mode:screen;
  background:radial-gradient(circle, rgba(255,255,255,.95) 0%, rgba(255,255,255,.7) 7%, color-mix(in srgb,var(--clight) 60%,transparent) 22%, color-mix(in srgb,var(--clight) 14%,transparent) 42%, transparent 62%)}

/* ---------- title ---------- */
#title{position:absolute;left:0;right:0;top:calc(var(--hud-h) + 4.5vh);text-align:center;font-family:'Titan One',sans-serif;
  font-size:clamp(30px,9.2vw,62px);line-height:1;letter-spacing:.02em;pointer-events:none;white-space:nowrap}
#title .tin{display:inline-block}
#title .word{display:inline-block;margin:0 .16em}
.L{position:relative;display:inline-block;transform-origin:50% 90%}
.L .s{color:var(--ink);-webkit-text-stroke:.2em var(--ink);text-shadow:0 .1em 0 var(--ink),0 .2em .14em rgba(0,0,0,.45)}
.L .f{position:absolute;left:0;top:0;background:linear-gradient(180deg,var(--t1,#fff) 0%,var(--t1,#fff) 42%,var(--t2,#ccc) 58%,var(--t2,#ccc) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.L .f::after{content:attr(data-c);position:absolute;left:0;top:0;color:transparent;background:linear-gradient(180deg,rgba(255,255,255,.85),rgba(255,255,255,0) 35%);-webkit-background-clip:text;background-clip:text}
#subtitle{position:absolute;left:0;right:0;top:calc(var(--hud-h) + 4.5vh + clamp(38px,11vw,74px));display:flex;justify-content:center;gap:8px;pointer-events:none}
.pip{width:clamp(16px,4.4vw,24px);height:clamp(16px,4.4vw,24px);border-radius:50%;border:2.5px solid var(--ink);
  background:radial-gradient(circle at 35% 30%,#6b6384,#2c2548 70%);box-shadow:inset -2px -3px 0 rgba(0,0,0,.35),0 3px 0 var(--ink)}
.pip.on{background:radial-gradient(circle at 35% 30%,#fff 0%,var(--pc) 35%,color-mix(in srgb,var(--pc) 55%,#000) 100%);box-shadow:inset 2px 2px 0 rgba(255,255,255,.5),inset -2px -3px 0 rgba(0,0,0,.3),0 3px 0 var(--ink),0 0 14px var(--pc)}

.outl{color:#fff;text-shadow:
  -2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink),2px 2px 0 var(--ink),
  0 -2.5px 0 var(--ink),0 2.5px 0 var(--ink),-2.5px 0 0 var(--ink),2.5px 0 0 var(--ink),0 4.5px 0 var(--ink)}

/* ---------- tap hint ---------- */
#tapHint{position:absolute;left:0;right:0;bottom:calc(9vh + env(safe-area-inset-bottom));pointer-events:none;justify-content:center;
  font-size:clamp(20px,5.6vw,30px);letter-spacing:.04em;display:flex;align-items:center;gap:10px;white-space:nowrap}
#tapHint .hand{width:1.4em;height:1.4em}

/* ---------- HUD ---------- */
#hud{position:absolute;left:0;right:0;top:0;height:calc(var(--hud-h) + env(safe-area-inset-top));padding:calc(8px + env(safe-area-inset-top)) 10px 0;display:flex;align-items:flex-start;gap:8px;z-index:30;cursor:default}
#hud .sp{flex:1}
.metal{position:relative;border:2.5px solid var(--ink);
  background:
    repeating-linear-gradient(90deg, rgba(255,255,255,.07) 0 1px, rgba(0,0,0,.05) 1px 2px, transparent 2px 4px),
    linear-gradient(180deg,#f2f5fa 0%,#c3cbd8 46%,#98a3b6 54%,#cdd4df 100%);
  box-shadow:inset 2px 2px 0 rgba(255,255,255,.85),inset -2px -3px 0 rgba(30,20,60,.3),inset 0 0 9px rgba(20,10,50,.28),0 3px 0 var(--ink),0 6px 10px rgba(0,0,0,.35)}
.seg{display:flex;border-radius:14px;padding:3px;gap:3px}
.seg button{font:inherit;font-size:14px;letter-spacing:.04em;border:0;border-radius:10px;padding:7px 11px 8px;color:#4a4468;background:transparent;cursor:pointer}
.seg button.on{color:#fff;background:linear-gradient(180deg,var(--clight) 0%,var(--cmain) 55%,var(--cdark) 100%);
  box-shadow:inset 1.5px 2px 0 rgba(255,255,255,.6),inset -1.5px -2px 0 rgba(0,0,0,.25),0 0 0 2px var(--ink);
  text-shadow:-1.5px -1.5px 0 var(--ink),1.5px -1.5px 0 var(--ink),-1.5px 1.5px 0 var(--ink),1.5px 1.5px 0 var(--ink),0 2.5px 0 var(--ink)}
.seg.lock{opacity:.55;pointer-events:none}
.pill{display:flex;align-items:center;height:38px;border-radius:20px;padding:0 12px 0 34px;min-width:88px;justify-content:flex-end;
  background:
    repeating-linear-gradient(90deg, rgba(255,255,255,.035) 0 1px, transparent 1px 3px),
    linear-gradient(180deg,#3d3462 0%,#231b43 55%,#1b1535 100%) !important;
  box-shadow:inset 2px 2px 0 rgba(255,255,255,.18),inset -2px -3px 0 rgba(0,0,0,.4),inset 0 0 10px rgba(0,0,0,.5),0 3px 0 var(--ink),0 6px 10px rgba(0,0,0,.35) !important}
.pill .ico{position:absolute;left:-10px;top:50%;width:44px;height:44px;margin-top:-22px;background-size:contain;background-repeat:no-repeat}
.pill .num{font-size:19px;letter-spacing:.02em}
.mbtn{width:42px;height:42px;border-radius:13px;padding:0;cursor:pointer;display:grid;place-items:center}
.mbtn svg{width:24px;height:24px}

/* ---------- cards ---------- */
#cards{position:absolute;inset:0;pointer-events:none}
.card{position:absolute;left:0;top:0;width:var(--cw);height:calc(var(--cw) * 1.36);will-change:transform}
.card canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:calc(var(--cw) * .085);filter:drop-shadow(0 5px 0 rgba(26,16,51,.55)) drop-shadow(0 10px 12px rgba(0,0,0,.35))}
.card .cnt{position:absolute;left:0;right:0;bottom:calc(var(--cw) * .045);text-align:center;font-size:calc(var(--cw) * .185);line-height:1}
.card .rb{position:absolute;inset:calc(var(--cw) * -.045);border-radius:calc(var(--cw) * .12);opacity:0;
  background:conic-gradient(from var(--ang),#ff4d6d,#ffb13b,#fff35c,#5dff7a,#3be7ff,#5b7cff,#d45bff,#ff4d6d);animation:rbspin 2.2s linear infinite}
.card .rb.glow{filter:blur(10px);inset:calc(var(--cw) * -.07)}
@keyframes rbspin{to{--ang:360deg}}
.card .newb{position:absolute;right:calc(var(--cw) * -.1);top:calc(var(--cw) * -.1);font-family:'Titan One';font-size:calc(var(--cw) * .15);padding:.28em .45em .3em;border-radius:.6em;transform:rotate(12deg) scale(0);
  background:linear-gradient(180deg,#ff8a8a 0%,#ff3b5c 55%,#c8103a 100%);border:2.5px solid var(--ink);
  box-shadow:inset 1.5px 2px 0 rgba(255,255,255,.55),inset -1.5px -2px 0 rgba(0,0,0,.25),0 3px 0 var(--ink)}
.slot{position:absolute;left:0;top:0;width:var(--cw);height:calc(var(--cw)*1.36);border-radius:calc(var(--cw)*.085);border:3px dashed color-mix(in srgb,var(--clight) 70%,#fff);opacity:0;
  background:radial-gradient(circle,color-mix(in srgb,var(--clight) 35%,transparent),transparent 70%);display:grid;place-items:center;font-family:'Titan One';font-size:calc(var(--cw)*.4)}

/* ---------- info panel ---------- */
#panel{position:absolute;left:0;top:0;width:min(92vw,420px);border-radius:22px;padding:14px 16px 12px;pointer-events:none;opacity:0;cursor:default}
#panel .ptop{display:flex;align-items:center;gap:10px;margin-bottom:8px}
#panel .pname{font-family:'Titan One';font-size:clamp(22px,6.4vw,30px);flex:1;line-height:1}
#panel .tag{font-size:14px;padding:4px 10px 5px;border-radius:10px;border:2px solid var(--ink);box-shadow:inset 1.5px 1.5px 0 rgba(255,255,255,.5),inset -1.5px -2px 0 rgba(0,0,0,.25),0 2px 0 var(--ink)}
#panel .rar{background:linear-gradient(180deg,var(--clight),var(--cmain) 60%,var(--cdark))}
#panel .stars{color:#ffd23f;font-size:18px;letter-spacing:1px;white-space:nowrap}
.stat{display:grid;grid-template-columns:28px 70px 1fr 58px 52px;align-items:center;gap:8px;height:36px;position:relative}
.stat svg{width:28px;height:28px}
.stat b{font-weight:400;font-size:16px;color:#2a2148}
.stat .bar{height:14px;border-radius:8px;background:#261d45;border:2px solid var(--ink);box-shadow:inset 0 2px 3px rgba(0,0,0,.5);overflow:hidden}
.stat .bar i{display:block;height:100%;width:0;border-radius:6px;background:linear-gradient(180deg,#fff 0%,var(--clight) 30%,var(--cmain) 100%)}
.stat .val{font-size:20px;text-align:right}
.stat .up{font-size:15px;color:#6dff6d;opacity:0;white-space:nowrap;font-style:normal}
#panel .pdesc{font-size:14px;color:#3b3160;margin-top:4px;text-align:center}

/* rolling digits */
.roll{display:inline-flex;align-items:flex-start;height:1.3em;line-height:1.3em;vertical-align:middle}
.roll .col{display:inline-block;height:1.3em;overflow:hidden;position:relative;max-width:.8em;transition:max-width .12s}
.roll .strip{display:flex;flex-direction:column;will-change:transform}
.roll .strip span,.roll .sep{display:block;height:1.3em;line-height:1.3em;text-align:center}
.roll .col.dim{opacity:0;max-width:0}

/* ---------- buttons ---------- */
.gbtn{position:absolute;left:50%;bottom:calc(5vh + env(safe-area-inset-bottom));font-family:'Titan One';font-size:clamp(20px,5.8vw,28px);
  color:#fff;border:3px solid var(--ink);border-radius:18px;padding:12px 34px 14px;cursor:pointer;letter-spacing:.03em;z-index:25;white-space:nowrap;
  background:
    repeating-linear-gradient(90deg, rgba(255,255,255,.06) 0 1px, transparent 1px 3px),
    linear-gradient(180deg,#b9ff8a 0%,#4ad84a 48%,#27a83b 52%,#1f8a33 100%);
  box-shadow:inset 3px 3px 0 rgba(255,255,255,.55),inset -3px -4px 0 rgba(0,0,0,.25),inset 0 0 10px rgba(0,0,0,.18),0 5px 0 var(--ink),0 9px 14px rgba(0,0,0,.4);
  text-shadow:-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink),2px 2px 0 var(--ink),0 3.5px 0 var(--ink)}
.gbtn.gold{background:repeating-linear-gradient(90deg, rgba(255,255,255,.07) 0 1px, transparent 1px 3px),linear-gradient(180deg,#fff3a8 0%,#ffcc2e 48%,#f0a010 52%,#c77400 100%)}
.gbtn.blue{background:repeating-linear-gradient(90deg, rgba(255,255,255,.06) 0 1px, transparent 1px 3px),linear-gradient(180deg,#a6e8ff 0%,#3ea8ff 48%,#1f7ae0 52%,#1656b8 100%)}
.gbtn:active{filter:brightness(.92)}
.gbtn .gem{display:inline-block;width:.9em;height:.9em;vertical-align:-.1em;margin-left:.2em}
#openBtn{bottom:calc(16vh + env(safe-area-inset-bottom));font-size:clamp(16px,4.4vw,20px);padding:8px 20px 10px}

#loadErr{position:absolute;inset:0;display:none;place-items:center;text-align:center;padding:30px;font-size:18px}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <div id="bg" class="layer"></div>
    <div class="layer" id="raysWrap"><div class="rays" id="rays3"></div><div class="rays" id="rays2"></div><div class="rays" id="rays1"></div></div>
    <div class="layer"><div id="chestHalo"></div></div>
    <div class="layer"><div id="pillar"><div class="pcore"></div></div></div>
    <div id="backdrop" class="layer"><div class="spin"></div><div class="halo"></div></div>
    <canvas id="fxBack" class="fx"></canvas>
    <canvas id="gl"></canvas>
    <canvas id="fxFront" class="fx"></canvas>
    <div id="flash"></div>
  </div>
  <div id="ui" class="layer">
    <div id="title"></div>
    <div id="subtitle"></div>
    <div id="cards"></div>
    <div id="panel" class="metal"></div>
    <div id="tapHint" class="outl"><svg class="hand" viewBox="0 0 48 48"><path d="M18 22V9a4 4 0 0 1 8 0v10l9 2.2c3 .8 4.8 3.6 4.3 6.6L38 38c-.5 3-3 5-6 5H22c-2 0-3.8-1-4.9-2.7L10 29.8c-1.3-2 .2-4.6 2.6-4.5 1 0 2 .5 2.6 1.3L18 30z" fill="#fff" stroke="#1A1033" stroke-width="3.2" stroke-linejoin="round"/><path d="M26 22v8M31 23.5V30" stroke="#1A1033" stroke-width="2" stroke-linecap="round"/></svg><span id="tapText">TAP TO OPEN</span></div>
  </div>
  <button id="openBtn" class="gbtn blue">OPEN NOW</button>
  <button id="claimBtn" class="gbtn gold">CLAIM</button>
  <button id="againBtn" class="gbtn">OPEN ANOTHER</button>
  <div id="hud">
    <div class="seg metal" id="mode"><button data-m="auto" class="on">AUTO</button><button data-m="tap">TAP</button></div>
    <div class="sp"></div>
    <div class="pill metal" id="coinPill"><i class="ico" id="coinIco"></i><span class="num outl" id="coinNum">1,250</span></div>
    <div class="pill metal" id="gemPill"><i class="ico" id="gemIco"></i><span class="num outl" id="gemNum">85</span></div>
    <button class="mbtn metal" id="mute" aria-label="Mute"></button>
  </div>
  <canvas id="fxTop" class="fx" style="z-index:40"></canvas>
  <div id="loadErr" class="outl">Could not load Three.js / GSAP from the CDN.<br>Check your internet connection and reload.</div>
</div>
<script type="module">
import * as THREE from 'three';
const gsap = window.gsap;
if (!gsap) { document.getElementById('loadErr').style.display = 'grid'; throw new Error('gsap missing'); }

/* =====================================================================
   CONFIG — tune the presentation here
   ===================================================================== */
const Q = new URLSearchParams(location.search);
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches || Q.get('rm') === '1';
const CFG = {
  particleScale: REDUCED ? 0.35 : 1,   // global particle multiplier
  shake: REDUCED ? 0 : 1,              // screen-shake multiplier
  camPunch: REDUCED ? 0.35 : 1,        // camera push-in multiplier
  flashMax: 0.8,                       // white bloom never exceeds this opacity
  burstPower: [0.55, 0.7, 0.85, 1.0],  // per-tier burst intensity (Common→Legendary)
  chargeTime: 1.0,                     // charge-up length (s)
  upgradeGap: 0.22,                    // pause between auto upgrades (s)
  autoOdds: [0, 0.28, 0.34, 0.38],     // AUTO mode final-tier odds (Rare/Epic/Legendary)
  lineOuterCss: 3.6,                   // outline: outer silhouette thickness (CSS px)
  lineInnerCss: 0.75,                  // outline: seam half-thickness (CSS px)
  ss: 1.5,                             // supersampling factor
};
const INK = '#1A1033';
const TIERS = [
  { key:'common',    name:'COMMON',    main:'#46D35B', light:'#B8FF7A', dark:'#1A8A45', bg1:'#2E9A5A', bg2:'#0A2A22', metal:'#9AA6B6', gem:'#4CF08A', t1:'#F2FFE0', t2:'#8CF06A' },
  { key:'rare',      name:'RARE',      main:'#2F9BFF', light:'#9BE4FF', dark:'#1746C2', bg1:'#2C74DA', bg2:'#081A48', metal:'#DCE6F4', gem:'#48D6FF', t1:'#EAFBFF', t2:'#5EC4FF' },
  { key:'epic',      name:'EPIC',      main:'#B455FF', light:'#F2B0FF', dark:'#5F1DC2', bg1:'#7F36D6', bg2:'#1C0840', metal:'#E6E2F6', gem:'#F06BFF', t1:'#FFF0FF', t2:'#D98BFF' },
  { key:'legendary', name:'LEGENDARY', main:'#FFB915', light:'#FFF1A0', dark:'#D96A00', bg1:'#E2861A', bg2:'#3A1204', metal:'#FFD34D', gem:'#FF3F6C', t1:'#FFFBE0', t2:'#FFC935' },
];
const HEROES = [

/* =====================================================================

const AU = { ctx:null, out:null, noise:null, muted:false };
function initAudio(){
  if (AU.ctx) { if (AU.ctx.state === 'suspended') AU.ctx.resume(); return; }
  const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
  const ctx = AU.ctx = new C();
  const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4; comp.connect(ctx.destination);
  AU.out = ctx.createGain(); AU.out.gain.value = AU.muted ? 0 : 0.8; AU.out.connect(comp);
  const len = ctx.sampleRate * 2, buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
  for (let i=0;i<len;i++) d[i] = Math.random()*2-1;
  AU.noise = buf;
}
function tone(type, f0, f1, dur, vol, o={}){
  const ctx = AU.ctx; if (!ctx) return;
  const t0 = ctx.currentTime + (o.delay||0);
  const osc = ctx.createOscillator(), g = ctx.createGain();
  osc.type = type; osc.frequency.setValueAtTime(f0, t0);
  if (f1 && f1 !== f0) osc.frequency.exponentialRampToValueAtTime(f1, t0 + (o.glide || dur));
  if (o.detune) osc.detune.value = o.detune;
  const a = o.attack ?? 0.004;
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + a);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  let node = osc;
  if (o.lp){ const f = ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=o.lp; f.Q.value=o.q||0.7; osc.connect(f); node=f; }
  node.connect(g); g.connect(o.dest || AU.out); osc.start(t0); osc.stop(t0 + dur + 0.05);
  return { osc, g };
}
function noise(dur, vol, type, f0, f1, o={}){
  const ctx = AU.ctx; if (!ctx) return;
  const t0 = ctx.currentTime + (o.delay||0);
  const src = ctx.createBufferSource(); src.buffer = AU.noise; src.loop = true;
  const f = ctx.createBiquadFilter(); f.type = type; f.Q.value = o.q || 0.8;
  f.frequency.setValueAtTime(f0, t0); if (f1) f.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
  const g = ctx.createGain(); const a = o.attack ?? 0.005;
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + a); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(f); f.connect(g); g.connect(AU.out); src.start(t0, Math.random()); src.stop(t0 + dur + 0.05);
}

/* =====================================================================
   2D ILLUSTRATION ENGINE — 3-layer cel shading, variable line weight
   ===================================================================== */
const mkCanvas = (w,h) => { const c = document.createElement('canvas'); c.width = Math.max(1,Math.round(w)); c.height = Math.max(1,Math.round(h)); return c; };
const ell = (cx,cy,rx,ry,rot=0) => { const p = new Path2D(); p.ellipse(cx,cy,rx,ry,rot,0,TAU); return p; };
const rrp = (x,y,w,h,r) => { const p = new Path2D(); p.roundRect(x,y,w,h,r); return p; };
const P = d => new Path2D(d);
const xf = (p, m) => { const q = new Path2D(); q.addPath(p, m); return q; };
const mirror = (p, cx=130) => xf(p, new DOMMatrix([-1,0,0,1,cx*2,0]));
const rotAbout = (p, a, cx, cy) => xf(p, new DOMMatrix().translate(cx,cy).rotate(a*180/Math.PI).translate(-cx,-cy));

// base / shade / light fill with a thin interior line
function cel(ctx, p, col, o={}){
  const sd = o.sd ?? 8, hd = o.hd ?? 4, dx = -0.72, dy = -0.7;
  ctx.save(); ctx.clip(p);
  ctx.fillStyle = col[1]; ctx.fill(p);
  ctx.save(); ctx.translate(dx*sd, dy*sd); ctx.fillStyle = col[0]; ctx.fill(p); ctx.restore();
  if (col[2]){
    const q = new Path2D(); q.rect(-4000,-4000,8000,8000); q.addPath(p, new DOMMatrix([1,0,0,1,-dx*hd,-dy*hd]));
    ctx.fillStyle = col[2]; ctx.fill(q, 'evenodd');
  }
  if (o.gloss){ ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.fill(o.gloss); }
  ctx.restore();
  if (o.lw !== 0){ ctx.lineWidth = o.lw ?? 3; ctx.strokeStyle = INK; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.stroke(p); }
}
function ink(ctx, p, lw=2.5, col=INK){ ctx.lineWidth = lw; ctx.strokeStyle = col; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.stroke(p); }
function fillP(ctx, p, col){ ctx.fillStyle = col; ctx.fill(p); }
function star4(cx,cy,r,th=0.28){ const p = new Path2D(); for (let i=0;i<8;i++){ const a = i*Math.PI/4 - Math.PI/2, rr = i%2 ? r*th : r; i ? p.lineTo(cx+Math.cos(a)*rr, cy+Math.sin(a)*rr) : p.moveTo(cx+Math.cos(a)*rr, cy+Math.sin(a)*rr); } p.closePath(); return p; }
function star5(cx,cy,r,ri=0.48){ const p = new Path2D(); for (let i=0;i<10;i++){ const a = i*Math.PI/5 - Math.PI/2, rr = i%2 ? r*ri : r; i ? p.lineTo(cx+Math.cos(a)*rr, cy+Math.sin(a)*rr) : p.moveTo(cx+Math.cos(a)*rr, cy+Math.sin(a)*rr); } p.closePath(); return p; }
function eyeDot(ctx, cx, cy, rx, ry){ fillP(ctx, ell(cx,cy,rx,ry), INK); fillP(ctx, ell(cx-rx*0.35, cy-ry*0.4, rx*0.42, ry*0.34), '#fff'); fillP(ctx, ell(cx+rx*0.3, cy+ry*0.35, rx*0.18, ry*0.14), '#fff'); }
function blush(ctx, cx, cy, r=9){ ctx.save(); ctx.globalAlpha = 0.65; fillP(ctx, ell(cx,cy,r,r*0.55), '#FF7F9E'); ctx.restore(); }

// Draws `drawFn` into a layer then composites it with a thick dilated outline (outer contour) + ground shadow.
function outlined(ctx, s, w, h, drawFn, outer=6){
  const L = mkCanvas(w*s, h*s), lc = L.getContext('2d'); lc.scale(s,s); drawFn(lc);
  const T = mkCanvas(w*s, h*s), tc = T.getContext('2d'); tc.drawImage(L,0,0); tc.globalCompositeOperation = 'source-in'; tc.fillStyle = INK; tc.fillRect(0,0,T.width,T.height);
  const r = outer*s;
  ctx.save(); ctx.setTransform(1,0,0,1,0,0);
  const [ox, oy] = [ctx.__ox||0, ctx.__oy||0];
  for (const rr of [r, r*0.55]) for (let i=0;i<16;i++){ const a = i/16*TAU; ctx.drawImage(T, ox + Math.cos(a)*rr, oy + Math.sin(a)*rr); }
  ctx.drawImage(L, ox, oy);
  ctx.restore();
}

const GRAD = (() => { const v = [0, 0, 105, 190, 255], d = new Uint8Array(v.flatMap(x => [x,x,x,255]));
  const t = new THREE.DataTexture(d, v.length, 1, THREE.RGBAFormat); t.minFilter = t.magFilter = THREE.NearestFilter; t.generateMipmaps = false; t.needsUpdate = true; return t; })();
const RIM_U = { value: new THREE.Color(TIERS[0].light) };
function toon(hex, o={}){
  const m = new THREE.MeshToonMaterial({ color:new THREE.Color(hex), gradientMap:GRAD, ...o });
  m.onBeforeCompile = sh => {
    sh.uniforms.uRim = RIM_U;
    sh.fragmentShader = 'uniform vec3 uRim;\n' + sh.fragmentShader.replace('#include <opaque_fragment>',
      'float fr = 1.0 - clamp(dot(normal, normalize(vViewPosition)), 0.0, 1.0);\n outgoingLight += uRim * smoothstep(0.62, 0.68, fr) * 0.3;\n#include <opaque_fragment>');
  };
  m.customProgramCacheKey = () => 'rimtoon';
  return m;
}

// normal (xy) + part id + linear depth, all in one half-float target
const normalMat = new THREE.ShaderMaterial({
  uniforms:{ uId:{value:1}, uFar:{value:80} },
  vertexShader:`varying vec3 vVP; void main(){ vec4 mv = modelViewMatrix * vec4(position,1.0); vVP = mv.xyz; gl_Position = projectionMatrix * mv; }`,
  fragmentShader:`uniform float uId; uniform float uFar; varying vec3 vVP;
    void main(){ vec3 n = normalize(cross(dFdx(vVP), dFdy(vVP))); gl_FragColor = vec4(n.xy, uId, -vVP.z / uFar); }`,
});
function tagIds(root, start){
  let id = start;
  root.traverse(o => { if (!o.isMesh) return; o.userData.oid = o.userData.noEdge ? -1 : id++;
    o.onBeforeRender = () => { normalMat.uniforms.uId.value = o.userData.oid; normalMat.uniformsNeedUpdate = true; }; });
  return id;
}
const VS_QUAD = 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }';
const compMat = new THREE.ShaderMaterial({
  uniforms:{ tColor:{value:null}, tNormal:{value:null}, uTexel:{value:new THREE.Vector2()}, uThick:{value:6}, uThin:{value:1.2},
             uInk:{value:new THREE.Color(INK)}, uK:{value:0.07}, uAbs:{value:0.012} },
  vertexShader: VS_QUAD, depthTest:false, depthWrite:false, blending:THREE.NoBlending,
  fragmentShader:`
    uniform sampler2D tColor, tNormal; uniform vec2 uTexel; uniform float uThick, uThin, uK, uAbs; uniform vec3 uInk;
    varying vec2 vUv;
    vec3 dec(vec2 n){ return vec3(n, sqrt(max(0.0, 1.0 - dot(n,n)))); }
    void main(){
      vec4 c = texture2D(tColor, vUv);
      vec4 n0 = texture2D(tNormal, vUv);
      float d0 = n0.a;
      // thick outer line: something much nearer sits within the disc (loose depth threshold)
      float thr = d0 - max(d0 * uK, uAbs);
      float line = 0.0;
      for (int i = 0; i < 16; i++){
        float a = float(i) * 0.3926991;
        vec2 dir = vec2(cos(a), sin(a)) * uTexel * uThick;
        float s1 = texture2D(tNormal, vUv + dir).a;
        float s2 = texture2D(tNormal, vUv + dir * 0.55).a;
        if (min(s1, s2) < thr){ line = 1.0; break; }
      }
      // thin seams: part-id change or a sharp normal crease (bevel facets stay below the threshold)
      if (line < 0.5 && d0 < 0.999){
        vec3 N0 = dec(n0.xy);
        for (int i = 0; i < 4; i++){
          vec2 o = (i == 0 ? vec2(1.0,0.0) : i == 1 ? vec2(-1.0,0.0) : i == 2 ? vec2(0.0,1.0) : vec2(0.0,-1.0)) * uThin * uTexel;
          vec4 n = texture2D(tNormal, vUv + o);
          if (n.a >= 0.999){ line = 1.0; break; }
          if (n0.b < 0.0 || n.b < 0.0) continue;
          if (abs(n.b - n0.b) > 0.5 || dot(N0, dec(n.xy)) < 0.55){ line = 1.0; break; }
        }
      }
      gl_FragColor = c * (1.0 - line) + vec4(uInk, 1.0) * line;
    }`,
});
const finalMat = new THREE.ShaderMaterial({
  uniforms:{ tComp:{value:null}, uTexel:{value:new THREE.Vector2()} },
  vertexShader: VS_QUAD, depthTest:false, depthWrite:false, blending:THREE.NoBlending,
  fragmentShader:`uniform sampler2D tComp; uniform vec2 uTexel; varying vec2 vUv;
    void main(){ vec2 o = uTexel * 0.42;
      gl_FragColor = 0.25 * (texture2D(tComp, vUv + vec2(-o.x,-o.y)) + texture2D(tComp, vUv + vec2(o.x,-o.y)) + texture2D(tComp, vUv + vec2(-o.x,o.y)) + texture2D(tComp, vUv + vec2(o.x,o.y))); }`,
});
const RT = {
  color: new THREE.WebGLRenderTarget(4,4,{ samples:4, type:THREE.UnsignedByteType }),
  normal: new THREE.WebGLRenderTarget(4,4,{ type:THREE.HalfFloatType, minFilter:THREE.NearestFilter, magFilter:THREE.NearestFilter }),
  comp: new THREE.WebGLRenderTarget(4,4,{ type:THREE.UnsignedByteType, minFilter:THREE.LinearFilter, magFilter:THREE.LinearFilter }),
};
const quadScene = new THREE.Scene(), quadCam = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const quad = new THREE.Mesh(new THREE.PlaneGeometry(2,2), compMat); quad.frustumCulled = false; quadScene.add(quad);
const noOutline = [];
function renderFrame(){
  renderer.setRenderTarget(RT.color); renderer.setClearColor(0x000000, 0); renderer.render(scene, camera);
  for (const o of noOutline){ o.userData._v = o.visible; o.visible = false; }
  scene.overrideMaterial = normalMat; renderer.setRenderTarget(RT.normal); renderer.setClearColor(0x000000, 1); renderer.render(scene, camera);
  scene.overrideMaterial = null; for (const o of noOutline) o.visible = o.userData._v;
  compMat.uniforms.tColor.value = RT.color.texture; compMat.uniforms.tNormal.value = RT.normal.texture;
  quad.material = compMat; renderer.setRenderTarget(RT.comp); renderer.render(quadScene, quadCam);
  finalMat.uniforms.tComp.value = RT.comp.texture;

}

/* ---------------- geometry helpers ---------------- */
function rrShape(w,h,r){ const s = new THREE.Shape(), x = -w/2, y = -h/2; r = Math.min(r, w/2, h/2);
  s.moveTo(x+r,y); s.lineTo(x+w-r,y); s.quadraticCurveTo(x+w,y,x+w,y+r); s.lineTo(x+w,y+h-r); s.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  s.lineTo(x+r,y+h); s.quadraticCurveTo(x,y+h,x,y+h-r); s.lineTo(x,y+r); s.quadraticCurveTo(x,y,x+r,y); return s; }
function bevelBox(w,h,d,b=0.03){
  const bb = Math.min(b, w/3, h/3, d/3);
  const g = new THREE.ExtrudeGeometry(rrShape(w-2*bb, h-2*bb, bb*0.6), { depth:Math.max(0.002, d-2*bb), bevelEnabled:true, bevelThickness:bb, bevelSize:bb, bevelSegments:2, curveSegments:2 });
  g.translate(0, 0, -Math.max(0.002, d-2*bb)/2); return g;
}

  trim: toon(TIERS[0].main), trimDark: toon(TIERS[0].dark), metal: toon(TIERS[0].metal),
  gem: toon(TIERS[0].gem), gold: toon('#FFC933'), goldDark: toon('#E0921A'),

/* ---------------- the chest (all real geometry) ---------------- */
const CH = { W:2.3, H:1.02, D:1.42, t:0.13, y0:0.13 };
CH.y1 = CH.y0 + CH.H; CH.R = CH.D/2;
function buildChest(){
  const { W, H, D, t, y0, y1, R } = CH;
  const root = new THREE.Group(), model = new THREE.Group(); root.add(model);
  const add = (geo, mat, x, y, z, parent=model, rx=0, ry=0, rz=0) => { const m = new THREE.Mesh(geo, mat); m.position.set(x,y,z); m.rotation.set(rx,ry,rz); parent.add(m); return m; };
  const rivet = new THREE.SphereGeometry(0.042, 10, 8);
  add(bevelBox(W+0.16, 0.13, D+0.16, 0.045), MAT.trimDark, 0, 0.065, 0);
  const core = add(new THREE.BoxGeometry(W-2*t+0.03, H-0.02, D-2*t+0.03), MAT.core, 0, y0+H/2-0.01, 0); core.userData.noEdge = true;
  // planks: 3 per wall, separated by real gaps (the glowing core shows through during charge-up)
  const ph = H/3, gap = 0.042;
  const gF = bevelBox(W-0.02, ph-gap, t, 0.036), gS = bevelBox(t, ph-gap, D-2*t-0.004, 0.036);
  for (let i=0;i<3;i++){ const y = y0 + ph*(i+0.5);
    add(gF, WOOD[i%3], 0, y, D/2-t/2); add(gF, WOOD[(i+1)%3], 0, y, -(D/2-t/2));
    add(gS, WOOD[(i+2)%3], W/2-t/2, y, 0); add(gS, WOOD[i%3], -(W/2-t/2), y, 0); }
  // metal bands (top + bottom rim)
  const bh = 0.12, bt = 0.05;
  for (const y of [y1-bh/2+0.005, y0+bh/2+0.015]){
    const gx = bevelBox(W+0.05, bh, bt, 0.018), gz = bevelBox(bt, bh, D+0.05, 0.018);
    add(gx, MAT.trim, 0, y, D/2+bt/2-0.012); add(gx, MAT.trim, 0, y, -(D/2+bt/2-0.012));
    add(gz, MAT.trim, W/2+bt/2-0.012, y, 0); add(gz, MAT.trim, -(W/2+bt/2-0.012), y, 0);
  }
  // L-shaped corner guards with rivets
  const cg = 0.25, ct = 0.06, gCF = bevelBox(cg, H+0.05, ct, 0.02), gCS = bevelBox(ct, H+0.05, cg, 0.02);
  for (const sx of [-1,1]) for (const sz of [-1,1]){
    add(gCF, MAT.trim, sx*(W/2-cg/2+0.035), y0+H/2, sz*(D/2+ct/2));
    add(gCS, MAT.trim, sx*(W/2+ct/2), y0+H/2, sz*(D/2-cg/2+0.035));
    for (const yy of [y0+0.25, y0+H/2, y1-0.25]){
      add(rivet, MAT.metal, sx*(W/2-cg/2+0.035), yy, sz*(D/2+ct+0.004));
      add(rivet, MAT.metal, sx*(W/2+ct+0.004), yy, sz*(D/2-cg/2+0.035));
    }
  }
  // lock plate + keyhole
  add(bevelBox(0.46, 0.5, 0.07, 0.025), MAT.metal, 0, y1-0.28, D/2+0.045);
  for (const [x,y] of [[-0.17,-0.1],[0.17,-0.1],[-0.17,-0.46],[0.17,-0.46]]) add(new THREE.SphereGeometry(0.03,8,6), MAT.trimDark, x, y1+y, D/2+0.08);
  const kh = add(new THREE.CylinderGeometry(0.052,0.052,0.03,16), MAT.key, 0, y1-0.31, D/2+0.085, model, Math.PI/2);
  add(new THREE.BoxGeometry(0.04,0.1,0.03), MAT.key, 0, y1-0.37, D/2+0.085);
  // side handles
  const ringGeo = new THREE.TorusGeometry(0.15, 0.036, 8, 20, Math.PI).rotateZ(Math.PI).rotateY(Math.PI/2);
  for (const sx of [-1,1]){
    add(bevelBox(0.06, 0.22, 0.36, 0.02), MAT.trim, sx*(W/2+0.06), y0+H*0.6, 0);
    add(ringGeo, MAT.metal, sx*(W/2+0.13), y0+H*0.6+0.04, 0);
  }
  // treasure heap inside (seen when the lid opens)
  const heap = new THREE.Group(); model.add(heap);
  const hc = new THREE.CylinderGeometry(0.13,0.13,0.035,16);
  const R0 = mulberry(5);
  for (let i=0;i<22;i++){ const m = add(hc, i%3 ? MAT.gold : MAT.goldDark, (R0()-0.5)*(W-0.5), y1-0.02+R0()*0.06, (R0()-0.5)*(D-0.5), heap, (R0()-0.5)*0.8, 0, (R0()-0.5)*0.8); }
  // ---------- lid (pivots on the back edge) ----------
  const lidPivot = new THREE.Group(); lidPivot.position.set(0, y1, -R); model.add(lidPivot);
  const lid = new THREE.Group(); lid.position.set(0, 0, R); lidPivot.add(lid);
  const N = 5, chord = 2*R*Math.sin(Math.PI/(2*N));
  const gStave = bevelBox(W-0.22, t, chord-0.04, 0.034);
  for (let i=0;i<N;i++){ const th = (i+0.5)*Math.PI/N, rc = R - t/2; add(gStave, WOOD[(i+1)%3], 0, rc*Math.sin(th), rc*Math.cos(th), lid, Math.PI/2 - th); }
  const lcore = add(new THREE.CylinderGeometry(R-t+0.03, R-t+0.03, W-0.24, 28, 1, true, 0, Math.PI).rotateZ(Math.PI/2), MAT.core, 0, 0, 0, lid); lcore.userData.noEdge = true;
  const capS = new THREE.Shape(); capS.absarc(0,0,R-0.03,0,Math.PI,false); capS.lineTo(R-0.03,0);
  const capG = new THREE.ExtrudeGeometry(capS, { depth:0.08, bevelEnabled:true, bevelThickness:0.025, bevelSize:0.025, bevelSegments:2, curveSegments:24 }); capG.translate(0,0,-0.04); capG.rotateY(Math.PI/2);
  const bandS = new THREE.Shape(); bandS.absarc(0,0,R+0.045,0,Math.PI,false); bandS.lineTo(-(R-0.06),0); bandS.absarc(0,0,R-0.06,Math.PI,0,true); bandS.closePath();
  const bandG = new THREE.ExtrudeGeometry(bandS, { depth:0.1, bevelEnabled:true, bevelThickness:0.02, bevelSize:0.018, bevelSegments:2, curveSegments:28 }); bandG.translate(0,0,-0.05); bandG.rotateY(Math.PI/2);
  for (const sx of [-1,1]){
    add(capG, WOOD[0], sx*(W/2-0.09), 0, 0, lid);
    add(bandG, MAT.trim, sx*(W/2-0.08), 0, 0, lid);
    add(bandG, MAT.trim, sx*0.52, 0, 0, lid);
    for (const th of [0.42, Math.PI/2, Math.PI-0.42]) add(rivet, MAT.metal, sx*0.52, (R+0.07)*Math.sin(th), (R+0.07)*Math.cos(th), lid);
  }
  add(bevelBox(W-0.2, 0.1, 0.06, 0.02), MAT.trim, 0, 0.055, R+0.005, lid);
  add(bevelBox(0.3, 0.34, 0.06, 0.022), MAT.metal, 0, -0.04, R+0.115, lid);
  add(new THREE.TorusGeometry(0.1, 0.024, 8, 22), MAT.trimDark, 0, -0.02, R+0.15, lid);
  const gemG = new THREE.OctahedronGeometry(0.09, 0); gemG.scale(1, 1.15, 0.6);
  const gem = add(gemG, MAT.gem, 0, -0.02, R+0.16, lid);
  tagIds(root, 1);
  return { root, model, lidPivot, lid, heap, keyhole: kh, gem };
}
const chest = buildChest(); scene.add(chest.root);

/* ---------------- view / projection helpers ---------------- */
const _v3 = new THREE.Vector3(), _ray = new THREE.Raycaster(), _plane = new THREE.Plane(new THREE.Vector3(0,0,1), 0);
function toScreen(v){ _v3.copy(v).project(camera); return { x:(_v3.x+1)/2*VIEW.W, y:(1-_v3.y)/2*VIEW.H }; }
function toWorld(x, y, z=0){ _plane.constant = -z; _ray.setFromCamera(new THREE.Vector2(x/VIEW.W*2-1, 1-y/VIEW.H*2), camera); const o = new THREE.Vector3(); _ray.ray.intersectPlane(_plane, o); return o; }
function worldWidthFor(px, x, y){ return toWorld(x + px/2, y).distanceTo(toWorld(x - px/2, y)); }
/* =====================================================================
   PARTICLES — hand-written Canvas 2D system
   gravity, drag, lifetime, additive blending; modes: phys / suck / curve / orbit
   ===================================================================== */
const FX = (() => {
  const cvs = [$('#fxBack'), $('#fxFront'), $('#fxTop')], ctx = cvs.map(c => c.getContext('2d'));
  const P = [], rings = [], emitters = [], dirty = [true,true,true];
  const cache = new Map();
  function glow(col){ const k = 'g'+col; if (cache.has(k)) return cache.get(k);
    const c = mkCanvas(64,64), g = c.getContext('2d'), r = g.createRadialGradient(32,32,0,32,32,32);
    r.addColorStop(0, col); r.addColorStop(0.3, col + '88'); r.addColorStop(1, col + '00'); g.fillStyle = r; g.fillRect(0,0,64,64); cache.set(k,c); return c; }
  function core(col){ const k = 'c'+col; if (cache.has(k)) return cache.get(k);
    const c = mkCanvas(32,32), g = c.getContext('2d'), r = g.createRadialGradient(16,16,0,16,16,16);
    r.addColorStop(0,'#ffffff'); r.addColorStop(0.35,'#ffffff'); r.addColorStop(0.6, col); r.addColorStop(1, col + '00'); g.fillStyle = r; g.fillRect(0,0,32,32); cache.set(k,c); return c; }
  let pr = 1;
  function resize(){ pr = Math.min(window.devicePixelRatio || 1, 2); cvs.forEach((c,i) => { c.width = Math.round(VIEW.W*pr); c.height = Math.round(VIEW.H*pr); ctx[i].setTransform(pr,0,0,pr,0,0); dirty[i] = true; }); }
  function add(o){
    const p = Object.assign({ x:0, y:0, vx:0, vy:0, g:0, drag:0, t:0, life:1, size:3, color:'#ffffff', kind:'spark', mode:'phys', layer:1, rot:0, vr:0, a:1, delay:0, seed:Math.random()*100 }, o);
    P.push(p); return p;
  }
  const ring = o => rings.push(Object.assign({ t:0, life:0.7, r0:20, r1:200, w:6, color:'#ffffff', layer:1, delay:0 }, o));

/* ---------------- loot physics ---------------- */
function spawnLoot(nc, ng, power){
  const o = chest.root.localToWorld(new THREE.Vector3(0, CH.y1 + 0.2, 0));
  let c = 0, gg = 0;
  for (const L of loot){
    if (L.on) continue;
    if (L.kind === 'coin' ? c >= nc : gg >= ng) continue;
    L.kind === 'coin' ? c++ : gg++;
    L.on = true; L.obj.visible = true; L.obj.position.copy(o).add(new THREE.Vector3(rand(-0.5,0.5), rand(0,0.2), rand(-0.2,0.3)));
    const a = rand(-1,1);
    L.v = new THREE.Vector3(a*2.6*power, rand(5.5,9.5)*power, rand(-1.2,2.4));
    L.w = new THREE.Vector3(rand(-1,1), rand(-1,1), rand(-1,1)).normalize().multiplyScalar(rand(9,17));
    L.life = rand(1.1, 1.5); L.obj.scale.setScalar(1); L.obj.rotation.set(rand(0,TAU), rand(0,TAU), 0);
  }
}
function updateLoot(dt){
  for (const L of loot){
    if (!L.on) continue;
    L.v.y -= 15*dt; L.obj.position.addScaledVector(L.v, dt);
    if (L.obj.position.y < 0.1 && L.v.y < 0){ L.obj.position.y = 0.1; L.v.y *= -0.36; L.v.x *= 0.6; L.v.z *= 0.6; L.w.multiplyScalar(0.6); }
    L.obj.rotation.x += L.w.x*dt; L.obj.rotation.y += L.w.y*dt; L.obj.rotation.z += L.w.z*dt;
    L.life -= dt;
    if (L.life < 0.35) L.obj.scale.setScalar(Math.max(0.001, gsap.parseEase('back.in(2)')(1 - Math.max(0, L.life)/0.35) * -1 + 1));
    if (L.life <= 0){ L.on = false; L.obj.visible = false; }
  }
}
const clearLoot = () => loot.forEach(L => { L.on = false; L.obj.visible = false; });

  tl2.to(cardRig, { y:pos.y, duration:0.75, ease:'back.out(1.6)' }, 0)
     .to(cardRig, { s:ws*1.12, duration:0.9, ease:'power3.out' }, 0)
     .to(cardRig, { ry:0, rx:0, rz:0, duration:1.1, ease:'power3.out' }, 0)
     .call(() => {
        flash(0.55, cx, cy, 0.8); SFX.fanfare(t);
        gsap.fromTo('#backdrop .halo', { scale:0.5, opacity:0 }, { scale:1, opacity:0.95, duration:0.7, ease:'back.out(2)' });
        // glints spawn on a ring outside the card silhouette and drift outward
        for (let i=0;i<FX.n(14 + 4*t);i++){ const a = i/(14+4*t)*TAU + rand(-0.1,0.1), rx = cardPxW*0.62, ry = cardPxH*0.6, s = rand(40,110);
          FX.add({ kind:'star', x:cx + Math.cos(a)*rx, y:cy + Math.sin(a)*ry, vx:Math.cos(a)*s, vy:Math.sin(a)*s, drag:1.5, life:rand(0.9,1.5), size:rand(3,5.5)*U(), color:T.light, layer:1, rot:rand(0,1) }); }
        setTitle(T.name + '!', T);
      }, null, 0.8)
     .to(cardRig, { s:ws, duration:0.6, ease:'elastic.out(1.1,0.4)' }, 0.9);
  // stardust trail: a superellipse that stays entirely outside the card's silhouette (never crosses its face)
  const orb = { x:cx, y:cy }, rx = cardPxW/2 + 26, ry = cardPxH/2 + 26;
  for (let i=0;i<3;i++) FX.add({ kind:'dust', mode:'orbit', center:orb, n:6, ang:i*TAU/3, w:0.9, rx, ry, trail:26, life:0, size:3.2*U(), color:T.light, layer:1, delay:1.0 });
  // 3) info panel with rolling stats
  gsap.set(panel, { top:pTop, left:pLeft });
  gsap.fromTo(panel, { y:60, opacity:0, scale:0.9 }, { y:0, opacity:1, scale:1, duration:0.6, ease:'back.out(1.8)', delay:1.0 });
  const MAX = [1400, 2200, 200];
  [...panel.querySelectorAll('.stat')].forEach((row, i) => {
    const base = H.stats[i], up = H.up[i], bar = row.querySelector('.bar i'), upEl = row.querySelector('.up');
    const r = makeRoller(row.querySelector('.val'), base + up);
    const d0 = 1.3 + i*0.22;
    countTo(r, base, 0.85, { delay:d0 });
    gsap.to(bar, { width:(base/MAX[i]*100) + '%', duration:0.85, ease:'power2.out', delay:d0 });
    upEl.textContent = '▲+' + up;
    gsap.timeline({ delay:d0 + 1.0 })
      .fromTo(upEl, { opacity:0, scale:0.3, y:8 }, { opacity:1, scale:1, y:-2, duration:0.45, ease:'back.out(3)' })
      .call(() => { tone('triangle', 880 + i*120, 1320 + i*160, 0.16, 0.08); countTo(r, base + up, 0.5); gsap.to(bar, { width:((base+up)/MAX[i]*100) + '%', duration:0.5, ease:'back.out(2)' }); }, null, 0.05);
  });
  await tl2;
  // gentle idle for the card (tracked loop, killed + zeroed on exit)
  loops.card.push(gsap.to(cardRig, { sway:0.2, duration:2.2, ease:'sine.inOut', yoyo:true, repeat:-1 }));
  loops.card.push(gsap.to(cardRig, { bob:0.05, duration:1.4, ease:'sine.inOut', yoyo:true, repeat:-1 }));
  await wait(1.2);
  showHint('TAP TO CONTINUE');
  S.state = 'spotlight';
}
async function closeSpotlight(){
  S.state = 'toResults'; hideHint();
  killLoops('card', () => { cardRig.sway = 0; cardRig.bob = 0; });
  FX.clear(p => p.mode === 'orbit');
  const t = S.tier, T = TIERS[t], main = S.rewards[4], slot = S.slots[4];
  const target = toWorld(slot.x, slot.y), ws = worldWidthFor(S.cw, slot.x, slot.y);
  const tl = gsap.timeline();
  tl.to(panel, { y:40, opacity:0, duration:0.3, ease:'back.in(2)' }, 0)
    .to('#title', { opacity:0, duration:0.2 }, 0)
    .to('#backdrop', { opacity:0, duration:0.45, ease:'power2.inOut' }, 0.1)
    .set('#backdrop', { visibility:'hidden' }, 0.55)
    .to('#raysWrap, #chestHalo', { opacity:1, duration:0.5 }, 0.35)
    .to('#hud', { opacity:1, duration:0.4 }, 0.2)
    .to(cardRig, { x:target.x, y:target.y, s:ws, duration:0.62, ease:'power3.inOut' }, 0.12)
    .to(cardRig, { ry:'+=' + TAU, duration:0.62, ease:'power2.inOut' }, 0.12)
    .call(() => { SFX.whoosh(); }, null, 0.12)
    .call(() => { rig.visible = true; rig.lid = 2.05; }, null, 0.45)
    .to(rig, { scale:S.resPose.s, duration:0.6, ease:'back.out(2)' }, 0.45)
    .to('.card:not(.main)', { scale:1, opacity:1, duration:0.45, ease:'back.out(2)', stagger:0.04 }, 0.4)
    .call(() => {
      heroCard.g.visible = false; $('.slot')?.remove();
      const el = main.el; gsap.set(el, { x:slot.x, y:slot.y, opacity:1, rotation:0 });
      gsap.fromTo(el, { scale:1.22 }, { scale:1, duration:0.7, ease:'elastic.out(1.2,0.4)' });
      gsap.fromTo(el, { rotation:-7 }, { rotation:0, duration:0.9, ease:'elastic.out(1.4,0.25)' });
      gsap.to(el.querySelectorAll('.rb'), { opacity:1, duration:0.3 });
      gsap.fromTo(el.querySelector('.newb'), { scale:0, rotation:-40 }, { scale:1, rotation:12, duration:0.6, ease:'back.out(3)', delay:0.15 });
      SFX.pop(); sparkBurst(slot.x, slot.y, T.light, 22, 380, 2); starBurst(slot.x, slot.y, '#ffffff', 6, 260, 2);
      setTitle('REWARDS', T);
    }, null, 0.75);
  await tl;
  await wait(0.5);
  showBtn('#claimBtn');
  S.state = 'results';
}

/* ---------------- claim: coins & gems fly on Bézier curves to the HUD ---------------- */
let ICONS = null;
async function claim(){
  S.state = 'claiming'; hideBtn('#claimBtn');
  const R = S.rewards, t = S.tier;
  const jobs = [['coins', R[0], '#coinPill', ICONS.coin, '#FFD23F', SFX.coin], ['gems', R[1], '#gemPill', ICONS.gem, '#FF6FB5', SFX.gem]];
  let longest = 0;
  jobs.forEach(([key, card, pillSel, img, col, snd], j) => {
    const from = S.slots[j], pr = $(pillSel).getBoundingClientRect(), to = { x:pr.left + 12, y:pr.top + pr.height/2 };
    const n = Math.max(6, Math.round((8 + t*3) * Math.max(0.5, CFG.particleScale))), total = card.count;
    const skey = key === 'coins' ? 'coins' : 'gems';
    let given = 0;
    countTo(card.roller, 0, 0.35 + n*0.06 + 0.5, { ease:'power1.inOut', delay:j*0.35 + 0.1 });
    for (let i=0;i<n;i++){
      const share = i === n-1 ? total - given : Math.floor(total/n); given += share;
      const delay = j*0.35 + i*0.06, life = rand(0.7, 0.95);
      longest = Math.max(longest, delay + life);
      const p0 = [from.x + rand(-20,20), from.y + rand(-20,20)];
      FX.add({ kind:'sprite', mode:'curve', layer:2, img, color:col, size:30*Math.max(0.9, U()), flip:rand(6,10), rot:rand(-0.3,0.3), delay, life, a:1,
        p0, p1:[p0[0] + rand(-140,140), p0[1] - rand(60,200)], p2:[to.x + rand(-120,40), to.y + rand(60,160)], p3:[to.x, to.y],
        onDone:() => { S[skey] += share; bumpPill(pillSel, skey); snd(); sparkBurst(to.x, to.y, col, 5, 200, 2); } });
    }
  });
  await wait(longest + 0.5);
  gsap.to('.card', { y:'+=40', scale:0.6, opacity:0, duration:0.35, ease:'back.in(2)', stagger:0.05 });
  gsap.to('#title', { opacity:0, duration:0.3, delay:0.2 });
  await wait(0.6);
  $('#cards').innerHTML = '';
  showBtn('#againBtn');
  S.state = 'done';
}
function bumpPill(sel, key){
  const pill = $(sel);
  pill.querySelector('.num').textContent = fmt(S[key]);
  gsap.killTweensOf(pill); gsap.killTweensOf(pill.querySelector('.ico'));
  gsap.fromTo(pill, { scale:1.2 }, { scale:1, duration:0.45, ease:'elastic.out(1.2,0.4)' });
  gsap.fromTo(pill.querySelector('.ico'), { rotation:-18, scale:1.25 }, { rotation:0, scale:1, duration:0.5, ease:'elastic.out(1.2,0.4)' });
}

/* ---------------- flows ---------------- */
function pickTier(){ if (FORCE_TIER) return FORCE_TIER; let r = Math.random(), acc = 0; for (let i=1;i<4;i++){ acc += CFG.autoOdds[i]; if (r < acc) return i; } return 3; }
async function openSequence(){
  hideBtn('#openBtn');
  await charge();
  await burst();
  await revealCards();
  await spotlight();
}
async function playAuto(){
  hideHint(); lockMode(true); stopIdle();
  S.finalTier = Math.max(pickTier(), S.tier);
  S.state = 'upgrading';
  while (S.tier < S.finalTier){ await upgradeOnce(); await wait(CFG.upgradeGap); }
  await openSequence();
}
async function tapUpgrade(){
  hideHint(); lockMode(true); stopIdle();
  S.state = 'upgrading';
  await upgradeOnce();
  S.state = 'ready'; lockMode(false); startIdle();
  showHint(S.tier < 3 ? 'TAP TO UPGRADE' : 'TAP TO OPEN!');
}
async function openNow(){ hideHint(); lockMode(true); stopIdle(); S.finalTier = S.tier; await openSequence(); }
async function resetAll(){
  S.state = 'resetting'; hideBtn('#againBtn');
  $('#cards').innerHTML = ''; S.rewards = null;
  rig.spin %= TAU;
  gsap.to(rig, { spin:0, duration:0.5, ease:'power2.out' });
  gsap.to(rig, { lid:0, duration:0.55, ease:'bounce.out', delay:0.1 });
  gsap.to(rig, { glow:0, duration:0.5 });
  gsap.to('#chestHalo', { opacity:0.35, scale:1, duration:0.5 });
  gsap.to(rig, { baseY:0.55, scale:1, duration:0.7, ease:'back.out(1.5)' });
  gsap.to('#subtitle', { opacity:1, scale:1, duration:0.3 });
  applyTier(0, true); setTitle('COMMON CHEST', TIERS[0]); setPips(0);
  await wait(0.75);
  enterReady();
}
function enterReady(){
  S.state = 'ready'; lockMode(false); startIdle();
  if (S.mode === 'tap'){ showHint(S.tier < 3 ? 'TAP TO UPGRADE' : 'TAP TO OPEN!'); showBtn('#openBtn'); }
  else { showHint('TAP TO OPEN'); hideBtn('#openBtn'); }
}

/* ---------------- input: strict state machine ---------------- */
async function run(fn){
  if (S.busy) return;
  S.busy = true;
  try { await fn(); } catch (e){ console.error(e); }
  finally { S.busy = false; }
  if (S.pending){ S.pending = false; handleTap(); }
}
function handleTap(){
  if (S.busy){
    // a tap in the last part of an upgrade (after landing) is buffered, never swallowed
    if (S.state === 'upgrading' && S.mode === 'tap' && S.bufferOpen) S.pending = true;
    return;
  }
  if (S.state === 'ready'){
    if (S.mode === 'auto') run(playAuto);
    else if (S.tier < 3) run(tapUpgrade);
    else run(openNow);
  } else if (S.state === 'spotlight') run(closeSpotlight);
}
$('#app').addEventListener('pointerdown', e => { if (e.target.closest('button, #hud')) return; initAudio(); handleTap(); });
$('#openBtn').addEventListener('click', () => { initAudio(); if (!S.busy && S.state === 'ready') run(openNow); });
$('#claimBtn').addEventListener('click', () => { initAudio(); if (!S.busy && S.state === 'results') run(claim); });
$('#againBtn').addEventListener('click', () => { initAudio(); if (!S.busy && S.state === 'done') run(resetAll); });
$('#mode').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || S.busy || S.state !== 'ready') return;
  initAudio(); S.mode = b.dataset.m;
  [...$('#mode').children].forEach(x => x.classList.toggle('on', x === b));
  tone('sine', 600, 900, 0.08, 0.1);
  enterReady();
});
const SPK = on => `<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#fff" stroke="#1A1033" stroke-width="2.2" stroke-linejoin="round"/>${on ? '<path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="#1A1033" stroke-width="2.2" stroke-linecap="round"/>' : '<path d="M16 9l6 6M22 9l-6 6" stroke="#ff3b5c" stroke-width="2.6" stroke-linecap="round"/>'}</svg>`;
$('#mute').innerHTML = SPK(true);
$('#mute').addEventListener('click', () => {
  AU.muted = !AU.muted; $('#mute').innerHTML = SPK(!AU.muted);
  initAudio(); if (AU.out) AU.out.gain.setTargetAtTime(AU.muted ? 0 : 0.8, AU.ctx.currentTime, 0.02);
  gsap.fromTo('#mute', { scale:0.85 }, { scale:1, duration:0.4, ease:'elastic.out(1.2,0.4)' });
});

/* =====================================================================
   RESIZE + MAIN LOOP
   ===================================================================== */
let raysY = -1;
function resize(){
  const W = VIEW.W = innerWidth, H = VIEW.H = innerHeight;
  let pr = Math.min(window.devicePixelRatio || 1, 2);
  const budget = 3.6e6; if (W*H*pr*pr*CFG.ss*CFG.ss > budget) pr = Math.sqrt(budget/(W*H*CFG.ss*CFG.ss));
  VIEW.pr = pr;
  renderer.setPixelRatio(pr); renderer.setSize(W, H, false);
  const sw = Math.round(W*pr*CFG.ss), sh = Math.round(H*pr*CFG.ss);
  RT.color.setSize(sw, sh); RT.normal.setSize(sw, sh); RT.comp.setSize(sw, sh);
  compMat.uniforms.uTexel.value.set(1/sw, 1/sh); finalMat.uniforms.uTexel.value.set(1/sw, 1/sh);
  camera.aspect = W/H;
  const hvis = VIEW.hvis = Math.max(2.8/(0.64*camera.aspect), 6.4);
  const dist = VIEW.dist = hvis / (2*Math.tan(THREE.MathUtils.degToRad(camera.fov/2)));
  VIEW.target.set(0, 1.25 + 0.05*hvis, 0);
  const el = THREE.MathUtils.degToRad(15);
  camera.position.set(0, VIEW.target.y + Math.sin(el)*dist, Math.cos(el)*dist);
  camera.lookAt(VIEW.target); camera.near = dist*0.4; camera.far = dist + 20; camera.updateProjectionMatrix();
  normalMat.uniforms.uFar.value = camera.far; compMat.uniforms.uAbs.value = 1.0 / camera.far;
  // line weight scales gently with the on-screen size of the chest
  const lk = clamp((H/hvis) / 95, 0.85, 1.6);
  compMat.uniforms.uThick.value = CFG.lineOuterCss * lk * pr * CFG.ss;
  compMat.uniforms.uThin.value = Math.max(1, CFG.lineInnerCss * lk * pr * CFG.ss);
  FX.resize();
  if (S.rewards && S.state !== 'spotlight' && S.state !== 'spotlightIn'){
    layoutSlots();
    S.rewards.forEach((r, i) => r.el && gsap.set(r.el, { x:S.slots[i].x, y:S.slots[i].y }));
    if (['reveal','results','claiming','toResults'].includes(S.state)) { rig.baseY = S.resPose.y; rig.scale = S.resPose.s; }
  }
}
addEventListener('resize', resize);

let FROZEN = false;
gsap.ticker.add((time, deltaMs) => {
  const dt = FROZEN ? 0 : Math.min(0.1, deltaMs/1000);
  applyRig(time);
  updateLoot(dt);
  FX.update(dt);
  const h = $('#chestHalo');
  gsap.set(h, { x:LIVE.chest.x, y:LIVE.chest.y });
  gsap.set(pillar, { x:LIVE.mouth.x, y:LIVE.mouth.y });
  if (Math.abs(LIVE.chest.y - raysY) > 1.5 && S.state !== 'spotlight'){ raysY = LIVE.chest.y; $('#raysWrap').style.setProperty('--ry', raysY + 'px'); }
  renderFrame();
  FX.draw();
});

/* ---------------- boot: complete idle screen on the very first frame ---------------- */
resize();
applyTier(0, true);
setTitle('COMMON CHEST', TIERS[0], false);
setPips(0);
applyRig(0); renderFrame();
enterReady();
document.fonts.ready.then(() => {
  ICONS = { coin:drawIcon('coin', 96), gem:drawIcon('gem', 96) };
  const ip = Math.round(44 * Math.min(DPR(), 3) * 1.6);
  $('#coinIco').style.backgroundImage = `url(${drawIcon('coin', ip).toDataURL()})`;
  $('#gemIco').style.backgroundImage = `url(${drawIcon('gem', ip).toDataURL()})`;
  $('#gemIco').style.backgroundSize = 'contain';
  setTitle('COMMON CHEST', TIERS[0], false);
});
$('#coinNum').textContent = fmt(S.coins); $('#gemNum').textContent = fmt(S.gems);

// test hooks: ?auto=1 plays without a tap, ?freeze=SECONDS pauses everything at that moment, ?cont=1 continues through the reveal + claim
if (Q.get('mode') === 'tap') $('#mode [data-m=tap]').click();
if (Q.get('auto') === '1') gsap.delayedCall(0.6, () => handleTap());
if (Q.get('open') === '1') gsap.delayedCall(0.6, () => run(openNow));
if (Q.get('cont') === '1'){
  const iv = setInterval(() => {
    if (S.busy) return;
    if (S.state === 'spotlight') handleTap();
    else if (S.state === 'results' && Q.get('claim') === '1') run(claim);
  }, 400);
}
if (Q.has("freeze")) gsap.delayedCall(+Q.get("freeze"), () => { FROZEN = true; gsap.globalTimeline.pause(); setTimeout(() => window.__frozen = true, 300); });
if (Q.has('fstate')){ const [st, dl] = Q.get('fstate').split(':'); let armed = true;
  gsap.ticker.add(() => { if (armed && S.state === st){ armed = false; gsap.delayedCall(+dl || 0, () => { FROZEN = true; gsap.globalTimeline.pause(); setTimeout(() => window.__frozen = true, 300); }); } }); }
window.__S = S; window.__FX = FX;
</script>
