<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0c1021">
  <meta name="description" content="STARFALL. An original interactive 3D treasure reveal, built in Unity.">
  <title>STARFALL · Astral Vault</title>
  <style>
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#0c1021}
    body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#f4f1ff;overscroll-behavior:none}
    #unity-container{position:fixed;inset:0;background:#0c1021}
    #unity-canvas{display:block;width:100%;height:100%;outline:none;touch-action:none;background:#0c1021}
    #loading{position:fixed;inset:0;z-index:5;display:grid;place-items:center;padding:28px;background:radial-gradient(ellipse at 50% 40%,#242440 0%,#11162b 47%,#0c1021 80%);transition:opacity .4s ease,visibility .4s}
    #loading.loaded{opacity:0;visibility:hidden;pointer-events:none}
    .loading-content{width:min(340px,100%);text-align:center}
    .emblem{position:relative;width:88px;height:88px;margin:0 auto 34px;display:grid;place-items:center}
    .emblem:before{content:"";position:absolute;inset:0;border:1px solid #e6b66136;border-radius:25px;transform:rotate(45deg);box-shadow:0 0 65px #ffc57514,inset 0 0 24px #ffc57507}
    .emblem svg{position:relative;width:58px;height:58px;filter:drop-shadow(0 3px 0 #1a1033) drop-shadow(0 0 18px #ecb55a40)}
    .kicker{font-size:10px;letter-spacing:.36em;font-weight:750;color:#a8a8c7;margin:0 0 12px}
    h1{font-size:clamp(37px,10vw,47px);letter-spacing:.065em;margin:0;color:#ffe2a2;font-weight:900;text-shadow:0 3px 0 #070a15}
    .subtitle{font-size:13px;color:#989cb9;letter-spacing:.12em;margin:9px 0 35px}
    .track{height:7px;background:#070b17;border:1px solid #39334e;border-radius:6px;overflow:hidden;box-shadow:0 1px 0 #ffffff09}
    #progress{height:100%;width:0;background:linear-gradient(90deg,#c88b48,#ffe0a0);border-radius:5px;box-shadow:0 0 15px #e9ba6460;transition:width .2s ease}
    .status{display:flex;justify-content:space-between;gap:18px;margin-top:12px;font-size:11px;color:#9196b7;letter-spacing:.04em}
    #error{display:none;margin:24px 0 0;padding:16px;border:1px solid #bd727655;border-radius:12px;background:#251925;font-size:13px;line-height:1.5;color:#ffd4d2;text-align:left;overflow-wrap:anywhere}
    .loading-footer{position:absolute;bottom:max(24px,env(safe-area-inset-bottom));left:20px;right:20px;text-align:center;font-size:10px;letter-spacing:.15em;color:#747994}
    @media(prefers-reduced-motion:reduce){#loading,#progress{transition:none}}
  </style>
</head>
<body>
  <main id="unity-container" aria-label="Starfall interactive 3D reward presentation">
    <canvas id="unity-canvas" tabindex="0" aria-label="Starfall game. Tap to begin."></canvas>
  </main>
  <section id="loading" aria-label="Loading Starfall">
    <div class="loading-content">
      <div class="emblem" aria-hidden="true"><svg viewBox="0 0 64 64"><path d="M32 4 39 23 59 32 39 40 32 60 24 40 5 32 24 23Z" fill="#efb85e" stroke="#1a1033" stroke-width="3" stroke-linejoin="round"/><path d="m32 9 0 23L10 32l17-6Z" fill="#ffe6a5"/><path d="M32 32 54 32 36 39 32 55Z" fill="#c18444"/><path d="m32 23 9 9-9 9-9-9Z" fill="#fff0c4" stroke="#1a1033" stroke-width="2"/></svg></div>
      <p class="kicker">A LITTLE MAGIC AWAITS</p>
      <h1>STARFALL</h1>
      <p class="subtitle">THE ASTRAL VAULT</p>
      <div class="track" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress-track"><div id="progress"></div></div>
      <div class="status"><span id="status">Gathering starlight</span><span id="percentage">0%</span></div>
      <p id="error" role="alert"></p>
    </div>
    <div class="loading-footer">ORIGINAL ART · REAL 3D · MADE WITH UNITY</div>
  </section>
  <script>
    (() => {
      const canvas = document.getElementById('unity-canvas');
      const loading = document.getElementById('loading');
      const progress = document.getElementById('progress');
      const progressTrack = document.getElementById('progress-track');
      const percentage = document.getElementById('percentage');
      const status = document.getElementById('status');
      const error = document.getElementById('error');
      const buildUrl = 'Build';
      window.starfallUnity = null;
      window.starfallWebStatus = { state: 'loading', progress: 0, errors: [] };
      function showError(message) {
        const text = String(message);
        window.starfallWebStatus.state = 'error';
        window.starfallWebStatus.errors.push(text);
        loading.classList.remove('loaded');
        status.textContent = 'Unable to open the vault';
        error.textContent = text;
        error.style.display = 'block';
      }
      const config = {
        dataUrl: buildUrl + '/Web.data.unityweb',
        frameworkUrl: buildUrl + '/Web.framework.js.unityweb',
        codeUrl: buildUrl + '/Web.wasm.unityweb',
        streamingAssetsUrl: 'StreamingAssets',
        companyName: "Starfall Studio",
        productName: "STARFALL — Astral Vault",
        productVersion: "1.0.0",
        matchWebGLToCanvasSize: true,
        // URP adds its configured 1.5x supersampling on top of this output density.
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 1.5),
        showBanner: (message, type) => {
          if (type === 'error') showError(message);
          else console.warn('[STARFALL]', message);
        }
      };
      const script = document.createElement('script');
      script.src = buildUrl + '/Web.loader.js';
      script.onerror = () => showError('The game files could not be loaded. Check your connection and reload this page.');
      script.onload = () => {
        createUnityInstance(canvas, config, value => {
          const normalized = Math.max(0, Math.min(1, value));
          const amount = Math.round(normalized * 100);
          window.starfallWebStatus.progress = normalized;
          progress.style.width = amount + '%';
          progressTrack.setAttribute('aria-valuenow', amount);
          percentage.textContent = amount + '%';
          status.textContent = amount < 80 ? 'Gathering starlight' : 'Preparing the vault';
        }).then(instance => {
          window.starfallUnity = instance;
          window.starfallWebStatus.state = 'ready';
          window.starfallWebStatus.progress = 1;
          percentage.textContent = '100%';
          progress.style.width = '100%';
          loading.classList.add('loaded');
          // Do not focus the canvas automatically: preserve the user's browser focus.
        }).catch(showError);
      };
      document.body.appendChild(script);
    })();
  </script>
</body>
</html>
