<title>Butcher Hero — Pixel Rampage</title>

<body>
<canvas id="screen"></canvas>
<script>
// ---- core.js
"use strict";
// Pixel core: an RGBA buffer (320x180 landscape or 180x320 portrait), palette helpers, sprites with baked outlines,
// layers with live outlines, font.
let W = 320, H = 180;
const HEADLESS = typeof document === "undefined";
let screenCv = null, sctx = null, octx = null, frameImg = null, pix = new Uint32Array(W * H);
function setView(w, h) {
  W = w; H = h;

  frameImg = octx.createImageData(W, H);

}
const portrait = () => H > W;
if (!HEADLESS) {
  screenCv = document.getElementById("screen");
  sctx = screenCv.getContext("2d");
  octx = document.createElement("canvas").getContext("2d");
  setView(W, H);
}

const rgb = c => [c & 255, (c >>> 8) & 255, (c >>> 16) & 255];
const pack = (r, g, b) => ((255 << 24) | ((b & 255) << 16) | ((g & 255) << 8) | (r & 255)) >>> 0;

// ---- the master palette: hue-shifted ramps (darks lean cool, lights lean warm). Every colour the code asks for
// snaps to it; blends (light, fog, vignettes) snap through a lookup table that also holds the current biome's ground.
const PAL_BASE = [
  "#24101a", "#3a2a40", "#5e4e66", "#8a7c8e", "#b8acb4", "#e4dcdc", "#ffffff",   // ink and cool greys
  "#4a0a1e", "#8a1428", "#d0283a", "#ff5a4a",                                     // blood
  "#5a1e10", "#a8400e", "#e8701e", "#ffa24a",                                     // oranges: shirt, fire
  "#6a4410", "#b07a1a", "#f0b030", "#ffe04a", "#fff2a0",                          // golds
  "#7a3a3a", "#c0685a", "#f09c80", "#ffc8a4",                                     // skin
  "#2e1a14", "#5e3a1e", "#8a5a2a", "#b88a4a", "#e0c08a",                          // wood and earth
  "#4a4a14", "#8a8a24", "#c8c848",                                                // goblin olive
  "#10281c", "#1f5a36", "#3a8a3a", "#6ac04a", "#b8e880",                          // greens
  "#0e3a40", "#1a6a6a", "#2aa092", "#6ad8c0",                                     // teals
  "#1a2050", "#2e4a8a", "#4a78c8", "#8ab8f0", "#d8ecff",                          // blues: ice, snow
  "#2a1040", "#5a1e86", "#9a4ad0", "#d08aff",                                     // purples
  "#8a1a5a", "#ff6ad0", "#8ef0ff",                                                // magenta, cyan
];
const hexRGB = s => [parseInt(s.slice(1, 3), 16), parseInt(s.slice(3, 5), 16), parseInt(s.slice(5, 7), 16)];
const palEntry = s => { const [r, g, b] = hexRGB(s); return [r, g, b, pack(r, g, b)]; };
const BASE_LIST = PAL_BASE.map(palEntry);
function nearestIn(list, r, g, b) {   // "redmean" weighted distance: close enough to how the eye compares colours
  let best = list[0][3], bd = Infinity;
  for (const [pr, pg, pb, pc] of list) {
    const rm = (r + pr) / 2, dr = r - pr, dg = g - pg, db = b - pb;
    const d = (2 + rm / 256) * dr * dr + 4 * dg * dg + (2 + (255 - rm) / 256) * db * db;
    if (d < bd) { bd = d; best = pc; }

}
const SNAP = new Uint32Array(32768);
const snapRGB = (r, g, b) => SNAP[(((r & 255) >> 3) << 10) | (((g & 255) >> 3) << 5) | ((b & 255) >> 3)];
function setPalette(extraHex) {   // blends snap to the master palette plus a biome's ground colours
  const list = BASE_LIST.concat(extraHex.map(palEntry));
  for (let i = 0; i < 32768; i++) SNAP[i] = nearestIn(list, ((i >> 10) & 31) * 8 + 4, ((i >> 5) & 31) * 8 + 4, (i & 31) * 8 + 4);

setPalette([]);
// colours are parsed once (draw code calls hx("#...") every frame) and snapped to the master palette
const HX_CACHE = new Map();
function hx(s) {
  let v = HX_CACHE.get(s);
  if (v === undefined) { const [r, g, b] = hexRGB(s); v = nearestIn(BASE_LIST, r, g, b); HX_CACHE.set(s, v); }
  return v;
}
const hxRaw = s => { const [r, g, b] = hexRGB(s); return pack(r, g, b); };   // biome ground colours stay exact
// no temporary arrays: these run per pixel in the post effects
function mix(a, b, t) {

  return snapRGB(ar + ((b & 255) - ar) * t, ag + (((b >>> 8) & 255) - ag) * t, ab + (((b >>> 16) & 255) - ab) * t);
}
const mul = (c, k) => snapRGB((c & 255) * k[0], ((c >>> 8) & 255) * k[1], ((c >>> 16) & 255) * k[2]);
// selective outline: a dark tone of the colour it borders instead of flat black
const SELOUT = new Map();
function seloutOf(c) { let o = SELOUT.get(c); if (o === undefined) { o = mix(c, hx("#24101a"), 0.62); SELOUT.set(c, o); } return o; }

const INK = hx("#24101a"), WHITE = hx("#ffffff"), GOLD = hx("#ffe04a"), PALE = hx("#fff2a0"), RED = hx("#e02030");
const BLACK = hx("#000000"), CYAN = hx("#8ef0ff"), GREEN = hx("#4ad86a"), DIM = hx("#b09878");
const METAL = [hx("#f6f6ff"), hx("#b8bccb"), hx("#767a8c"), hx("#4a4c5c")];
const HANDLE = hx("#6a3a1a");
const BLOOD = [hx("#ff4a3a"), hx("#d81a2a"), hx("#9a0c1e"), hx("#5a0614")];

const BAYER = [[0, 8, 2, 10], [12, 4, 14, 6], [3, 11, 1, 9], [15, 7, 13, 5]];

// a boss breathing in: while BREATH is set, everything drawn above its line rises dy pixels (the row at the line doubles)
let BREATH = null, LAYER_GLOW = 0;
function put(x, y, c) {
  x |= 0; y |= 0;
  if (BREATH && y < BREATH.y) { if (y === BREATH.y - 1 && x >= 0 && x < W && y >= 0 && y < H) pix[y * W + x] = c; y -= BREATH.dy; }
  if (x >= 0 && x < W && y >= 0 && y < H) pix[y * W + x] = c;
}
function get(x, y) {
  x = Math.max(0, Math.min(W - 1, x | 0)); y = Math.max(0, Math.min(H - 1, y | 0));

}
function tint(x, y, c, t) {

}
function darken(x, y, k = SHADOW_K) {

function rect(x, y, w, h, c) {
  for (let j = Math.max(0, y | 0); j < Math.min(H, (y + h) | 0); j++)
    for (let i = Math.max(0, x | 0); i < Math.min(W, (x + w) | 0); i++) pix[j * W + i] = c;
}
function rectA(x, y, w, h, c, t) {
  for (let j = Math.max(0, y | 0); j < Math.min(H, (y + h) | 0); j++)
    for (let i = Math.max(0, x | 0); i < Math.min(W, (x + w) | 0); i++) pix[j * W + i] = mix(pix[j * W + i], c, t);
}
function shadowEllipse(cx, cy, rx, ry) {

    for (let x = Math.floor(cx - rx); x <= cx + rx; x++)
      if (((x - cx) / rx) ** 2 + ((y - cy) / ry) ** 2 <= 1) darken(x, y);

function ellipseRing(cx, cy, rx, ry, c, gaps = 0, phase = 0) {

    const t = a / n * Math.PI * 2;
    put(Math.round(cx + Math.cos(t) * rx), Math.round(cy + Math.sin(t) * ry), c);

}

  for (let y = Math.floor(cy - ry); y <= cy + ry; y++)
    for (let x = Math.floor(cx - rx); x <= cx + rx; x++) {
      const d = ((x - cx) / rx) ** 2 + ((y - cy) / ry) ** 2;
      if (d > 1) continue;
      const by = ((y % 4) + 4) % 4, bx = ((x % 4) + 4) % 4;

  const n = Math.max(1, Math.ceil(Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0))));
  for (let i = 0; i <= n; i++) put(Math.round(x0 + (x1 - x0) * i / n), Math.round(y0 + (y1 - y0) * i / n), c);

// ---- sprites: ASCII rows + palette, 1 px outline baked in ----
function makeSprite(rows, pal, outline = INK) {
  const h = rows.length, w = Math.max(...rows.map(r => r.length));
  const sw = w + 2, sh = h + 2, d = new Uint32Array(sw * sh);
  rows.forEach((row, j) => [...row].forEach((ch, i) => { if (ch !== "." && ch !== " ") d[(j + 1) * sw + i + 1] = pal[ch]; }));
  if (outline) {
    const o = d.slice(), ol = new Uint8Array(sw * sh);
    for (let y = 0; y < sh; y++) for (let x = 0; x < sw; x++) {
      if (d[y * sw + x]) continue;
      const n = (x > 0 && d[y * sw + x - 1]) || (x < sw - 1 && d[y * sw + x + 1]) || (y > 0 && d[(y - 1) * sw + x]) || (y < sh - 1 && d[(y + 1) * sw + x]);
      if (n) { o[y * sw + x] = outline === INK ? seloutOf(n) : outline; ol[y * sw + x] = 1; }
    }
    return { w: sw, h: sh, d: o, ol };

}
// o: scale | sx+sy (squash & stretch), flip, flash (+dither), fade, ol (outline colour), rect [x, y, w, h] = draw only that part of the sprite

  const [rx, ry, rw, rh] = o.rect || [0, 0, s.w, s.h];
  const tw = Math.round(rw * kx), th = Math.round(rh * ky);
  x = Math.round(x); y = Math.round(y);
  for (let ty = 0; ty < th; ty++) {
    const yy = y + ty;
    if (yy < 0 || yy >= H) continue;
    const sy = ry + Math.min(rh - 1, (ty / ky) | 0);
    for (let tx = 0; tx < tw; tx++) {
      const xx = x + tx;
      if (xx < 0 || xx >= W) continue;
      let sx = Math.min(rw - 1, (tx / kx) | 0);
      sx = flip ? rx + rw - 1 - sx : rx + sx;
      const si = sy * s.w + sx, isOl = s.ol && s.ol[si];
      let c = s.d[si];
      if (!c) continue;
      if (o.ol && isOl) c = o.ol;   // recoloured outline (elites, shooters)
      pix[yy * W + xx] = flash && !isOl && c !== INK && (!o.dither || (xx + yy) % 2 === 0) ? flash : (o.fade ? mix(pix[yy * W + xx], c, o.fade) : c);

// feet-anchored draw: (x, y) is the bottom centre
function blitFeet(s, x, y, o = {}) {
  const sc = o.scale || 1, kx = o.sx || sc, ky = o.sy || sc, r = o.rect || [0, 0, s.w, s.h];
  blit(s, x - r[2] * kx / 2, y - r[3] * ky + 1, o);

// ---- screen post effects ----
// pixel zoom about a screen point (z = 2 keeps pixels square)
function zoomView(cx, cy, z) {
  if (z <= 1.001) return;
  const src = pix.slice();
  for (let y = 0; y < H; y++) {
    const sy = Math.floor(cy + (y - cy) / z);
    for (let x = 0; x < W; x++) {
      const sx = Math.floor(cx + (x - cx) / z);
      pix[y * W + x] = sx >= 0 && sx < W && sy >= 0 && sy < H ? src[sy * W + sx] : INK;
    }

// darkness with dithered light pools: lights = [{x, y, r}] in screen pixels.
// Each light only touches its own box; the result is 4 dithered light bands.
let LIGHT = null;

    const r = L.r, ir2 = 1 / (r * r), x0 = Math.max(0, Math.floor(L.x - r)), x1 = Math.min(W - 1, Math.ceil(L.x + r));
    const y0 = Math.max(0, Math.floor(L.y - r / 1.25)), y1 = Math.min(H - 1, Math.ceil(L.y + r / 1.25));
    for (let y = y0; y <= y1; y++) {
      const dy = (y - L.y) * 1.25, dy2 = dy * dy, row = y * W;
      for (let x = x0; x <= x1; x++) {
        const dx = x - L.x, v = 1 - (dx * dx + dy2) * ir2;
        if (v > LIGHT[row + x]) LIGHT[row + x] = v;

  const tr = tintCol & 255, tg = (tintCol >>> 8) & 255, tb = (tintCol >>> 16) & 255, k = 1 - ambient;
  for (let y = 0; y < H; y++) {
    const B = BAYER[y & 3], row = y * W;
    for (let x = 0; x < W; x++) {
      const i = row + x, q = Math.floor((ambient + k * LIGHT[i]) * 3 + B[x & 3] / 16);
      if (q < 3) {

// screen-edge glow; the border mask (pixel index, depth, dither) is built once per view size and width
const VIG_CACHE = new Map();

  const key = W + "x" + H + ":" + width;

// ---- layers: pixels collected per object, outlined when drawn ----
class Layer {
  constructor() { this.m = new Map(); }
  set(x, y, c) { x = Math.round(x); y = Math.round(y); this.m.set((y + 512) * 4096 + x + 1024, c); }
  has(x, y) { return this.m.has((y + 512) * 4096 + x + 1024); }
  draw(outline = INK, flash = 0, dither = false) {
    if (outline) for (const [k, c] of this.m) {
      const x = (k % 4096) - 1024, y = Math.floor(k / 4096) - 512, oc = outline === INK ? LAYER_GLOW || seloutOf(c) : outline;   // LAYER_GLOW: a boss winding up
      if (!this.m.has(k + 1)) put(x + 1, y, oc);
      if (!this.m.has(k - 1)) put(x - 1, y, oc);
      if (!this.m.has(k + 4096)) put(x, y + 1, oc);
      if (!this.m.has(k - 4096)) put(x, y - 1, oc);

    for (const [k, c] of this.m) {
      const x = (k % 4096) - 1024, y = Math.floor(k / 4096) - 512;

}

      const d = ((x - cx) / rx) ** 2 + ((y - cy) / ry) ** 2;
      if (d > 1) continue;

  for (let y = Math.floor(cy) - r; y <= cy + r; y++)

const SWORD = [hx("#ffffff"), hx("#bff6ff"), hx("#6ab8d8"), hx("#2e5a86")];

function sword(L, hilt, ang, len = 28) {
  const ux = Math.cos(ang), uy = Math.sin(ang), vx = -uy, vy = ux, R = len + 6;
  for (let y = Math.floor(hilt[1]) - R; y <= hilt[1] + R; y++)
    for (let x = Math.floor(hilt[0]) - R; x <= hilt[0] + R; x++) {
      const dx = x - hilt[0], dy = y - hilt[1], u = dx * ux + dy * uy, v = dx * vx + dy * vy;

      else if (u >= -1.2 && u < 1 && Math.abs(v) <= 5.2) L.set(x, y, v > 0 ? GUARD[0] : GUARD[1]);
      else if (u >= -4.5 && u < -1.2 && Math.abs(v) <= 0.9) L.set(x, y, HANDLE);

const FENCE = {

const MEAT_RACK = dspr([
  "HH..................HH",
  "hHxxxxxxxxxxxxxxxxxxhH",
  "hH..s.....s.....s...hH",
  "hH..s.....s.....s...hH",
  "hH.sS....sS....sS...hH",
  "hH.rRr...rRr...rRr..hH",
  "hH.RwRr.rRwRr.rRRRr.hH",
  "hHrRRRr.rRRRr.RRwRr.hH",
  "hHrRwRr.rRRRr.rRRRr.hH",
  "hHrRRRr..rRr..rRRr..hH",
  "hH.rRr...rRr...rRr..hH",
  "hH..r.....r.....r...hH",
  "hH..................hH",
  "hH...r..........r...hH",
  "hH..................hH",
  "hH..................hH",
  "hHr...........r.....hH",
  "hH..................hH",
  "hhh................hhh",
], INK);
const BUCKET = dspr([".SSSSS.", "SrRRRrS", "sSSSSSk", "sSSSSSk", ".skkkk.", ".skkkk."], INK);
const BLOCK = dspr(["....s..", "...sSs.", "..sWs..", ".hHhh..", "tTTTTTh", "hTtTtTh", "htttttH", ".HHHHH."], INK);
const DECOR_BIOMES = { forest: true, snow: true, jungle: true, grave: true, desert: true, lava: true };

// ground detail goes under the trees; returns the grass tufts (with the ground they cover) that cleavers can cut
function dressGround(A, biomeKey, r) {
  const d = A.d, grass = [];
  const inside = () => ({ x: INSET.l + 8 + r() * (AW - INSET.l - INSET.r - 16), y: INSET.t + 10 + r() * (AH - INSET.t - INSET.b - 14) });
  const bits = GROUND_BITS[biomeKey] || [], tufts = GRASS[biomeKey] || [];
  for (let k = 0; k < 90 && bits.length; k++) { const o = inside(); stampSprite(d, bits[Math.floor(r() * bits.length)], o.x, o.y); }

    const o = inside(), spr = tufts[Math.floor(r() * tufts.length)];
    for (let j = 0; j < 3; j++) {   // grass grows in patches: a few tufts around each spot
      const x = o.x + (r() - 0.5) * 14, y = o.y + (r() - 0.5) * 8, x0 = Math.round(x - spr.w / 2), y0 = Math.round(y - spr.h), under = [];
      for (let yy = 0; yy < spr.h - 1; yy++) for (let xx = 0; xx < spr.w; xx++) {
        const X = x0 + xx, Y = y0 + yy;
        if (spr.d[yy * spr.w + xx] && X >= 0 && X < AW && Y >= 0 && Y < AH) under.push(Y * AW + X, d[Y * AW + X]);

}
// the fence and the butcher decor stand in front of the tree line at the top; blocks and buckets along the bottom
function dressBorder(A, biomeKey, r) {
  const d = A.d, fence = FENCE[biomeKey];
  if (fence) for (let x = INSET.l - 6; x < AW - INSET.r + 6; x += fence.w - 2) if (r() > 0.12) stampSprite(d, fence, x, INSET.t - 2);
  if (!DECOR_BIOMES[biomeKey]) return;
  for (let x = INSET.l + 40 + r() * 40; x < AW - INSET.r - 30; x += 110 + r() * 60) {
    stampSprite(d, MEAT_RACK, x, INSET.t - 1);
    stampSprite(d, r() < 0.5 ? BUCKET : BLOCK, x + 18 + r() * 8, INSET.t + 1);
  }
  for (let x = INSET.l + 20 + r() * 30; x < AW - INSET.r - 20; x += 70 + r() * 50) stampSprite(d, r() < 0.5 ? BUCKET : BLOCK, x, AH - 4 - r() * 6);
}

// ---------------------------------------------------------------- cutting grass: a cleaver sweeping over a tuft mows it
const GRASS_CELL = 16;
function grassIndex(A) {
  const idx = new Map();
  for (const t of A.grass) { const k = Math.floor(t.x / GRASS_CELL) + Math.floor(t.y / GRASS_CELL) * 64; if (!idx.has(k)) idx.set(k, []); idx.get(k).push(t); }
  return idx;
}
function cutGrassAt(x, y, rad = 5) {
  const A = G.arena;
  if (!A.grass || !A.grass.length) return;
  A.grassIdx = A.grassIdx || grassIndex(A);
  const k = Math.floor(x / GRASS_CELL) + Math.floor(y / GRASS_CELL) * 64;
  for (const key of [k, k - 1, k + 1, k - 64, k + 64]) {
    const list = A.grassIdx.get(key);
    if (!list) continue;
    for (const t of list) {
      if (t.cut > G.t || Math.abs(t.x - x) > rad + 3 || Math.abs(t.y - y) > rad) continue;
      t.cut = G.t + 20;   // it can be mown again once it has grown back
      // the blades fly: the ground under the tuft shows again, a row of stubble stays
      const col = t.spr.d.find(c => c) || DP.g;
      for (let i = 0; i < t.under.length; i += 2) A.d[t.under[i]] = t.under[i + 1];
      for (let i = 0; i < 4; i++) {
        const a = Math.random() * Math.PI * 2, sp = rnd(15, 45);
        addPart({ x: t.x, y: t.y, z: 3, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp * 0.5, vz: rnd(25, 60), c: col, life: 1 });
      }
    }
  }
}

// ---------------------------------------------------------------- foreground crowns at the arena edges (drawn over everyone, with parallax)
function crownSprite(pal, seed, w, h) {
  const r = seeded(seed), rows = [], blobs = [];
  for (let i = 0; i < 7; i++) blobs.push({ x: w * (0.15 + r() * 0.7), y: h * (0.2 + r() * 0.6), rr: Math.min(w, h) * (0.22 + r() * 0.16) });
  for (let y = 0; y < h; y++) {
    let row = "";
    for (let x = 0; x < w; x++) {
      let best = -1;
      for (const b of blobs) { const dd = ((x - b.x) ** 2 + (y - b.y) ** 2) / (b.rr * b.rr); if (dd <= 1) best = Math.max(best, 1 - dd + (b.y - y) / h * 0.4 - (x - b.x) / w * 0.2); }
      if (best < 0 || ((x * 7 + y * 13) % 11 === 0 && best < 0.25)) { row += "."; continue; }
      const n = fxHash(x, y + seed);
      row += best > 0.75 ? (n < 0.5 ? "a" : "b") : best > 0.4 ? (n < 0.3 ? "a" : "b") : best > 0.15 ? "c" : "d";
    }
    rows.push(row);
  }
  const P_ = { a: hx(pal[0]), b: hx(pal[1]), c: hx(pal[2]), d: hx(pal[3]) };

}
const CROWN_PALS = {
  forest: [["#ffe04a", "#ffa24a", "#e8701e", "#a8400e"], ["#ffa24a", "#e8701e", "#d0283a", "#8a1428"]],
  jungle: [["#b8e880", "#6ac04a", "#3a8a3a", "#1f5a36"], ["#6ac04a", "#3a8a3a", "#1f5a36", "#10281c"]],
  snow: [["#ffffff", "#d8ecff", "#6ad8c0", "#1a6a6a"], ["#ffffff", "#8ab8f0", "#2aa092", "#0e3a40"]],
  grave: [["#8a7c8e", "#5e4e66", "#3a2a40", "#24101a"]],
};
const CROWNS_CACHE = {};
function crownsFor(biome) {
  if (!CROWN_PALS[biome]) return null;
  if (!CROWNS_CACHE[biome]) CROWNS_CACHE[biome] = [0, 1, 2, 3].map(i => crownSprite(CROWN_PALS[biome][i % CROWN_PALS[biome].length], 11 + i * 17, 34 + (i % 2) * 10, 26 + (i % 3) * 5));
  return CROWNS_CACHE[biome];
}
function drawCanopies() {
  const C = crownsFor(G.CH.key);

  if (!A.crowns) {   // anchor points along the side and bottom edges

    for (let y = INSET.t + 40; y < AH - 20; y += 60 + r() * 50) { list.push({ x: 18 + r() * 6, y, i: Math.floor(r() * 4) }); list.push({ x: AW - 18 - r() * 6, y: y + 25, i: Math.floor(r() * 4) }); }
    for (let x = 40; x < AW - 30; x += 70 + r() * 60) list.push({ x, y: AH - 24 + r() * 6, i: Math.floor(r() * 4) });

    const sway = Math.round(Math.sin(G.t * 1.3 + c.x * 0.1) * 1);
    blit(s, Math.round(px - s.w / 2) + sway, Math.round(py - s.h / 2));

}

// ---------------------------------------------------------------- crows (forest, graveyard): they peck and hop, and flap away when you come close
const CROW_PAL = { K: hx("#24101a"), k: hx("#3a2a40"), u: hx("#5e4e66"), y: hx("#f0b030"), W: WHITE };
const CROW = {
  sit: makeSprite(["..KK..", ".KKyW.", "KKKKy.", "kKKK..", ".kk...", ".y.y.."], CROW_PAL, 0),
  peck: makeSprite(["......", "..KK..", ".KKKW.", "KKKKKy", "kKK...", ".y.y.."], CROW_PAL, 0),
  fly1: makeSprite(["K.......K", "KK.....KK", ".KKKKKKK.", "..KKKKy..", "...k.k..."], CROW_PAL, 0),

function drawCritters() {
  const b = G.CH.key;
  if (b === "forest" || b === "grave") drawCrows();
  else if (b === "jungle") drawFish();
}
function drawCrows() {
  const A = G.arena;
  if (!A.crows) {
    const r = seeded(A.w + G.ch * 7 + 3);
    A.crows = [];
    for (let i = 0; i < 6; i++) A.crows.push({ x: INSET.l + 20 + r() * (AW - 100), y: INSET.t + 20 + r() * (AH - 90), z: 0, st: "sit", t: r() * 3, face: r() < 0.5 ? 1 : -1 });
  }
  const dt = 1 / 60;
  for (const c of A.crows) {
    c.t += dt;
    if (c.st === "sit") {
      const near = Math.hypot(P.x - c.x, P.y - c.y) < 48 || G.enemies.some(e => !e.T.crate && Math.abs(e.x - c.x) < 14 && Math.abs(e.y - c.y) < 10);
      if (near) { c.st = "fly"; c.vx = (c.x > P.x ? 1 : -1) * rnd(40, 70); c.vy = rnd(-30, 10); c.face = c.vx > 0 ? 1 : -1; c.t = 0; }
      else if (c.t > 1.2 && Math.random() < 0.01) { c.x += c.face * 3; c.t = 0; if (Math.random() < 0.3) c.face *= -1; }   // a hop
    } else if (c.st === "fly") {
      c.x += c.vx * dt; c.y += c.vy * dt; c.z += 38 * dt;
      if (c.t > 3) { c.st = "gone"; c.t = 0; }
    } else if (c.t > 8 + Math.random() * 4) {   // lands again somewhere else, out of the way
      const a = Math.random() * Math.PI * 2;

    else blitFeet(Math.floor(c.t * 12) % 2 ? CROW.fly1 : CROW.fly2, sx, sy - c.z, { flip: c.face < 0 });

}

const FISH = makeSprite(["..OOo.o", ".OWOOoo", "OOOOo.o", ".ooo..."], { O: hx("#ffa24a"), o: hx("#e8701e"), W: WHITE }, 0);

  const A = G.arena;
  if (!A.pools || !A.pools.length) return;
  A.fish = A.fish || { t: 0, next: 1.5, j: null };
  const F = A.fish;
  F.t += 1 / 60;
  if (!F.j && F.t > F.next) {
    const pool = A.pools[Math.floor(Math.random() * A.pools.length)], [sx, sy] = worldToScreen(pool.x, pool.y);
    F.t = 0; F.next = rnd(1.5, 3.5);
    if (sx > 0 && sx < W && sy > 0 && sy < H) {
      const dir = Math.random() < 0.5 ? 1 : -1;
      F.j = { x0: pool.x - dir * pool.rx * 0.5, x1: pool.x + dir * pool.rx * 0.5, y: pool.y, t: 0, dir };
      G.fx.push({ kind: "splash", x: F.j.x0, y: F.j.y, t: 0, life: 0.35 });
    }
  }
  if (F.j) {
    const j = F.j; j.t += 1 / 60;
    const k = j.t / 0.6, x = lerp(j.x0, j.x1, k), z = Math.sin(k * Math.PI) * 12, [sx, sy] = worldToScreen(x, j.y);
    blitFeet(FISH, sx, sy - z, { flip: j.dir < 0 });
    if (k >= 1) { G.fx.push({ kind: "splash", x: j.x1, y: j.y, t: 0, life: 0.35 }); F.j = null; }
  }
}

function tryDash(dx = 0, dy = 0) {

const AUTO_HOOK_R = 120, AUTO_HOOK_GOLD_R = 210;
function autoHook(dt) {

  if ((P.autoHookT = (P.autoHookT || 0) - dt) > 0) return;

// what is about to hit the butcher right now: an escape direction, or null
function dangerDir() {

// filled polygon; col may be a function (x, y) -> colour for shading

// ---------------------------------------------------------------- goblin chief: horned helmet, fur cape, huge axe

// ---------------------------------------------------------------- yeti alpha: hunched steel-blue silverback, ice crystals on the back
function drawAlpha(B, sx, sy) {

// living decor: glowing mushrooms, candle flames, crystal glints, lava rocks; biome ambience in view
function drawAmbient() {

    const [sx, sy] = worldToScreen(pr.x, pr.y);

"use strict";

function titleTick(dt) {
  G.t += dt; G.clock += dt; titleT += dt;
  P.ang += dt * 3.4; P.walkT += dt * 3; P.moving = false;
  for (const e of G.enemies) {
    const a = Math.atan2(P.y - e.y, P.x - e.x) + 1.2;
    e.x += Math.cos(a) * 10 * dt; e.y += Math.sin(a) * 7 * dt; e.walkT += dt * 3; e.face = Math.cos(a) > 0 ? 1 : -1;
  }
}

// ---------------------------------------------------------------- loop
function present() {
  octx.putImageData(frameImg, 0, 0);
  const s = Math.min(innerWidth / W, innerHeight / H), k = s >= 2 ? Math.floor(s) : s;
  const cw = Math.round(W * k), ch = Math.round(H * k);
  if (screenCv.width !== cw || screenCv.height !== ch) { screenCv.width = cw; screenCv.height = ch; }
  sctx.imageSmoothingEnabled = false;
  sctx.drawImage(octx.canvas, 0, 0, cw, ch);
}
function loop(now) {
  const dt = Math.min(0.05, (now - (lastT || now)) / 1000) * SPEED;
  lastT = now;
  const m = G.mode;
  G.menuT = (G.menuT || 0) + dt;
  G.demo = !TOUCHED && !BOTPLAY;
  if (m === "title") {
    titleTick(dt);
    drawWorld();
    rectA(0, 0, W, H, hx("#0a0408"), 0.35);
    drawTitle(titleT, loadSave(), { won: UNLOCKS.won, dark: UNLOCKS.dark, hard: OPTS.hard, skin: OPTS.skin });
    if (BOTPLAY && titleT > 1) uiAction("new");
  } else {
    if (m === "play") {
      acc += dt;
      let n = 0;
      while (acc >= 1 / 60 && n++ < 8) { if (BOTPLAY) BOT.act(); update(1 / 60); acc -= 1 / 60; if (G.mode !== "play") { acc = 0; break; } }
    } else { acc = 0; G.clock += dt; }
    if (m === "intro") { G.introT = (G.introT || 0) + dt; if (G.introT > (BOTPLAY ? 1.5 : window.BH_AD_BUILD ? 3 : 60)) setMode("play"); }
    if (m === "victory" && !G.endCancel) {
      G.endT = (G.endT || 0) + dt;
      if (G.endT >= END_AUTO_OPEN && !G.endOpened) { G.endOpened = true; G.endCancel = true; autoOpenStore(); }
    }
    if (BOTPLAY && ["levelup", "reward", "relic", "clear", "dead", "map", "shop", "node"].includes(m)) {
      botWait += dt;
      if (botWait > 0.6) { botWait = 0; BOT.decide(); }
    }
    drawWorld();
    drawHUD();
    if (G.mode !== "play") drawScreen();
  }
  drawWipe(dt);
  present();
  requestAnimationFrame(loop);
}
function boot() {
  applyOrientation();
  if (window.BH_AD_BUILD && !BOTPLAY) newGame(0); else goTitle();   // an ad starts with gameplay, not a menu
  requestAnimationFrame(loop);
}
if (window.mraid && mraid.getState && mraid.getState() === "loading") mraid.addEventListener("ready", boot);
else boot();

</script>
