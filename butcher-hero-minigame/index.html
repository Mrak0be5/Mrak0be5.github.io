<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Butcher Hero — pixel mini-game</title>
<style>
  html, body { margin: 0; height: 100%; background: #12080c; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
</style>
</head>
<body>
<canvas id="screen"></canvas>
<script>
"use strict";
const W = 256, H = 160, FPS = 16, LAST = 449;
const STORE = "https://play.google.com/store/apps/details?id=com.multicastgames.butcher";
const INK = "#24101a", GOLD = "#ffe04a", WHITE = "#ffffff", RED = "#e02030", PALE = "#fff2a0";
const RADIUS = 30, DODGE_TIME = 1.7, BEAT = 0.9, SLAM = 332, FAIL_DMG = 40;

// Pause points: story frame shown while waiting, what the player does, where (art pixels), the hint.
const STEPS = [
  { f: 4, type: "swipe", from: [136, 74], t: [206, 73], txt: "SWIPE TO THE GOBLIN!" },
  { f: 47, type: "eat", t: [143, 82], txt: "TAP FAST TO EAT!" },
  { f: 63, type: "eat", t: [140, 76], txt: "EAT! 2/3" },
  { f: 79, type: "eat", t: [140, 76], txt: "EAT! 3/3" },
  { f: 150, type: "swipe", from: [103, 66], t: [44, 100], txt: "SWIPE TO HOOK AGAIN!" },
  { f: 189, type: "eat", t: [108, 80], txt: "TAP FAST TO EAT!" },
  { f: 205, type: "eat", t: [110, 80], txt: "EAT! 2/2" },
  { f: 324, type: "dodge", t: [82, 97], txt: "DODGE! TAP HERE!" },
];
for (let i = 0; i < 7; i++) STEPS.push({ f: 345 + 6 * i, type: "attack", t: [194, 48], txt: "HIT ON THE BEAT! " + (i + 1) + "/7" });
STEPS.push({ f: 389, type: "finish", t: [194, 48], txt: "FINISH HIM!" });
STEPS.push({ f: 438, type: "tap", t: [160, 90], txt: "OPEN THE CHEST!" });
const SLOW = [390, 401];

const SFX = { 10: "whoosh", 18: "hit", 56: "chomp", 72: "chomp", 88: "chomp", 97: "charge", 104: "levelup",
  158: "whoosh", 164: "hit", 198: "chomp", 214: "chomp", 223: "charge", 226: "squish", 229: "squish",
  232: "weapon", 240: "whoosh", 256: "whoosh", 272: "whoosh", 290: "warning", 301: "stomp", 309: "stomp",
  317: "stomp", 318: "charge", 326: "whoosh", 332: "slam", 348: "hit", 354: "hit", 360: "hit", 366: "hit",
  372: "hit", 378: "hit", 384: "hit", 390: "whoosh", 396: "crit", 402: "bones", 406: "bones", 426: "whoosh",
  434: "stomp", 441: "chest" };
const BUZZ = { hit: 25, chomp: 30, slam: 90, crit: 120, stomp: 40, hurt: 160 };

const FONT = {
  A: "010101111101101", B: "110101110101110", C: "111100100100111", D: "110101101101110",
  E: "111100110100111", F: "111100110100100", G: "111100101101111", H: "101101111101101",
  I: "111010010010111", J: "001001001101111", K: "101101110101101", L: "100100100100111",
  M: "101111111101101", N: "110101101101101", O: "111101101101111", P: "110101110100100",
  Q: "111101101111001", R: "110101110101101", S: "111100111001111", T: "111010010010010",
  U: "101101101101111", V: "101101101101010", W: "101101111111101", X: "101101010101101",
  Y: "101101010010010", Z: "111001010100111", "0": "111101101101111", "1": "010110010010111",
  "2": "111001111100111", "3": "111001111001111", "4": "101101111001001", "5": "111100111001111",
  "6": "111100111101111", "7": "111001010010010", "8": "111101111101111", "9": "111101111001111",
  "!": "010010010000010", "/": "001001010100100", ":": "000010000010000", ".": "000000000000010",
  "-": "000000111000000", "+": "000010111010000", "?": "111001011000010", " ": "000000000000000",
  "%": "101001010100101",
};
const HAND = [
  "..##.......", ".#ww#......", ".#wg#......", ".#wg###....", ".#wg#wg##..", "##wg#wg#g#.",
  "#wwwwwwwgg#", "#wwwwwwwwg#", ".#wwwwwwwg#", "..#wwwwwg#.", "...######..",
];

const screen = document.getElementById("screen");
const sctx = screen.getContext("2d");
const buf = document.createElement("canvas");
buf.width = W; buf.height = H;
const ctx = buf.getContext("2d");

let META = null, sheets = [], loaded = 0;
let mode = "load", step = 0, shown = 0, story = 0;
let seq = [], pos = 0, acc = 0, last = 0, clock = 0, waitClock = 0, shake = 0;
let muted = false, audio = null;
let hp = 100, queued = 0, combo = 0, bestCombo = 0, lastTap = -9, perfects = 0, fails = 0, startAt = 0;
let drag = null, pops = [], deadline = 0, beatStart = 0, pendingTap = null;

const px = (x, y, c) => { ctx.fillStyle = c; ctx.fillRect(x | 0, y | 0, 1, 1); };
const textW = (s, k = 1) => s.length * 4 * k - k;
function text(s, x, y, col, k = 1) {
  const pts = [], set = new Set();
  [...s].forEach((ch, n) => {
    const g = FONT[ch] || FONT[" "];
    for (let j = 0; j < 5; j++) for (let i = 0; i < 3; i++)
      if (g[j * 3 + i] === "1") for (let dy = 0; dy < k; dy++) for (let dx = 0; dx < k; dx++) {
        const a = x + n * 4 * k + i * k + dx, b = y + j * k + dy;
        pts.push([a, b]); set.add(a + "," + b);
      }
  });
  ctx.fillStyle = INK;
  for (const [a, b] of pts) for (const [u, v] of [[1, 0], [-1, 0], [0, 1], [0, -1], [1, 1]])
    if (!set.has((a + u) + "," + (b + v))) ctx.fillRect(a + u, b + v, 1, 1);
  ctx.fillStyle = col;
  for (const [a, b] of pts) ctx.fillRect(a, b, 1, 1);
}
const centered = (s, y, col, k = 1) => text(s, Math.round((W - textW(s, k)) / 2), y, col, k);
const near = (p, t, r = RADIUS) => Math.hypot(p.x - t[0], (p.y - t[1]) * 1.2) < r;

function drawIndex(i) {
  const s = Math.floor(i / META.per), j = i % META.per, img = sheets[s];
  ctx.drawImage(img, (j % META.cols) * W, Math.floor(j / META.cols) * H, W, H, 0, 0, W, H);
}
function ring(cx, cy, r, col, gaps = 0) {
  const n = Math.max(24, Math.round(r * 7));
  for (let a = 0; a < n; a++) {
    if (gaps && a % gaps === 0) continue;
    const t = a / n * Math.PI * 2;
    px(Math.round(cx + Math.cos(t) * r), Math.round(cy + Math.sin(t) * r * 0.7), col);
  }
}
function hand(tx, ty, press) {
  const x0 = Math.round(tx) - 2, y0 = Math.round(ty) + 3 + (press ? 0 : 3);
  HAND.forEach((row, j) => [...row].forEach((ch, i) => {
    if (ch !== ".") px(x0 + i, y0 + j, ch === "#" ? INK : ch === "w" ? WHITE : "#b8bccb");
  }));
}
function chainLine(a, b, col) {
  const n = Math.max(2, Math.round(Math.hypot(b[0] - a[0], b[1] - a[1]) / 2.4));
  for (let i = 1; i < n; i++) {
    const x = Math.round(a[0] + (b[0] - a[0]) * i / n), y = Math.round(a[1] + (b[1] - a[1]) * i / n);
    px(x, y, i % 2 ? (col || "#b8bccb") : "#4a4c5c");
    if (i % 2) px(x, y - 1, col || "#f6f6ff");
  }
}
function hint(s, urgent) {
  const w = textW(s, 1) + 8, x = Math.round((W - w) / 2), y = 122;
  ctx.fillStyle = "rgba(20,8,12,0.8)"; ctx.fillRect(x, y, w, 11);
  const c = urgent && (waitClock * 4) % 1 < 0.5 ? WHITE : GOLD;
  ctx.fillStyle = c; ctx.fillRect(x, y, w, 1); ctx.fillRect(x, y + 10, w, 1);
  text(s, x + 4, y + 3, c);
}
function pop(s, x, y, col, k = 1, life = 0.9) { pops.push({ s, x, y, col, k, t: 0, life }); }

function hpBar() {
  if (story < 290 && mode !== "dead") return;
  const x = 4, y = 13, w = 40;
  text("HP", x, y, WHITE);
  ctx.fillStyle = INK; ctx.fillRect(x + 9, y, w + 2, 5);
  ctx.fillStyle = "#3a1418"; ctx.fillRect(x + 10, y + 1, w, 3);
  const col = hp > 50 ? "#4ad86a" : hp > 20 ? "#ffc23a" : RED;
  ctx.fillStyle = col; ctx.fillRect(x + 10, y + 1, Math.round(w * hp / 100), 3);
  ctx.fillStyle = "rgba(255,255,255,0.5)"; ctx.fillRect(x + 10, y + 1, Math.round(w * hp / 100), 1);
}
function muteIcon() {
  const x = 243, y = 148, c = muted ? "#8a7a6a" : WHITE;
  ctx.fillStyle = "rgba(20,8,12,0.6)"; ctx.fillRect(x - 2, y - 2, 13, 10);
  [[0, 2], [0, 3], [1, 2], [1, 3], [2, 1], [2, 2], [2, 3], [2, 4], [3, 0], [3, 1], [3, 2], [3, 3], [3, 4], [3, 5]]
    .forEach(([a, b]) => px(x + a, y + b, c));
  if (muted) [[5, 1], [6, 2], [7, 3], [8, 4], [8, 1], [7, 2], [6, 3], [5, 4]].forEach(([a, b]) => px(x + a, y + b, RED));
  else [[5, 2], [5, 3], [7, 1], [7, 2], [7, 3], [7, 4]].forEach(([a, b]) => px(x + a, y + b, c));
}

const BTN_L = [30, 116, 90, 16], BTN_R = [136, 116, 90, 16];
function button([x, y, w, h], label, green) {
  ctx.fillStyle = INK; ctx.fillRect(x - 1, y - 1, w + 2, h + 2);
  ctx.fillStyle = green ? "#3fbf5a" : "#e08a1a"; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = green ? "#7ae88a" : "#ffc24a"; ctx.fillRect(x, y, w, 2);
  ctx.fillStyle = green ? "#1f7a3a" : "#8a4a12"; ctx.fillRect(x, y + h - 2, w, 2);
  text(label, x + Math.round((w - textW(label)) / 2), y + 5, WHITE);
}
const inside = (p, [x, y, w, h]) => p.x >= x && p.x < x + w && p.y >= y && p.y < y + h;

function beatPhase() { return ((clock - beatStart) / BEAT) % 1; }
function onBeat() { const b = beatPhase(); return b > 0.78 || b < 0.06; }

function render() {
  if (mode === "load") {
    ctx.fillStyle = "#12080c"; ctx.fillRect(0, 0, W, H);
    centered("BUTCHER HERO", 58, GOLD, 3);
    centered("LOADING " + loaded + "/" + (META ? META.sheets : "?"), 90, WHITE);
    return;
  }
  if (mode === "wait") {
    const s = STEPS[step], idle = META.idle[String(s.f)];
    shown = idle !== undefined ? idle + Math.floor(waitClock * FPS) % META.idleLen : s.f;
  }
  drawIndex(shown);
  if (mode === "wait") drawWait(STEPS[step]);
  if (mode === "play" && drag === null && combo >= 2 && clock - lastTap < 0.8) {
    const s = STEPS[step];
    text("COMBO X" + combo, Math.round(s.t[0] - textW("COMBO X" + combo, 2) / 2), Math.max(26, s.t[1] - 40), GOLD, 2);
  }
  for (const p of pops) {
    if (p.t > p.life * 0.75 && Math.floor(p.t * 12) % 2) continue;
    text(p.s, Math.round(p.x - textW(p.s, p.k) / 2), Math.round(p.y - p.t * 14), p.col, p.k);
  }
  hpBar();
  if (mode === "end") endScreen();
  if (mode === "dead") deadScreen();
  muteIcon();
}

function drawWait(s) {
  const urgent = waitClock > 3.5;
  const press = (waitClock * 2) % 1 < 0.35;
  const wob = shake > 0 ? Math.round(Math.sin(shake * 40) * 2) : 0;
  if (s.type === "swipe") {
    if (drag) {
      const cur = [drag.x, drag.y], ok = near(drag, s.t);
      chainLine(s.from, cur, ok ? GOLD : null);
      ring(cur[0], cur[1], 3, ok ? GOLD : WHITE);
      px(cur[0], cur[1], ok ? GOLD : WHITE);
      ring(s.t[0], s.t[1], 8 + Math.sin(clock * 12) * 1.5, ok ? GOLD : PALE, 3);
    } else {
      const k = (waitClock * 0.8) % 1, e = Math.min(1, k / 0.7);
      const hx = s.from[0] + (s.t[0] - s.from[0]) * e, hy = s.from[1] + (s.t[1] - s.from[1]) * e;
      chainLine(s.from, [hx, hy]);
      ring(s.t[0], s.t[1], 6 + (waitClock * 3 % 1) * (urgent ? 12 : 8), GOLD);
      ring(s.from[0], s.from[1], 4, WHITE, 3);
      hand(hx + wob, hy, k < 0.08 || k > 0.7);
    }
  } else if (s.type === "dodge") {
    const left = Math.max(0, deadline - clock), k = left / DODGE_TIME;
    ring(s.t[0], s.t[1], 4 + k * 16, k > 0.45 ? GOLD : RED);
    ring(s.t[0], s.t[1], 3, WHITE);
    hand(s.t[0] + wob, s.t[1], press);
    ctx.fillStyle = INK; ctx.fillRect(77, 134, 102, 5);
    ctx.fillStyle = k > 0.45 ? GOLD : RED; ctx.fillRect(78, 135, Math.round(100 * k), 3);
    if ((clock * 6) % 1 < 0.5) text("!", s.t[0] - 1, s.t[1] - 26, RED, 2);
  } else if (s.type === "attack") {
    const b = beatPhase(), r = 3 + (1 - b) * 18;
    ring(s.t[0], s.t[1], 4, onBeat() ? WHITE : GOLD);
    ring(s.t[0], s.t[1], r, onBeat() ? WHITE : GOLD, onBeat() ? 0 : 2);
    hand(s.t[0] + 10 + wob, s.t[1] + 8, onBeat());
  } else {
    const pulse = (waitClock * 3) % 1;
    ring(s.t[0], s.t[1], 4 + pulse * (urgent ? 16 : 10), pulse < 0.5 ? GOLD : PALE);
    ring(s.t[0], s.t[1], 3, WHITE);
    hand(s.t[0] + wob, s.t[1], press);
  }
  hint(s.txt, urgent);
  if (step === 0 && waitClock < 2.5 && !drag) centered("BUTCHER HERO", 30, GOLD, 3);
}

function endScreen() {
  ctx.fillStyle = "rgba(10,4,8,0.66)"; ctx.fillRect(0, 0, W, H);
  centered("VICTORY!", 22, GOLD, 4);
  const secs = Math.round((performance.now() - startAt) / 1000);
  centered("GOBLINS: 8   BOSS: SKELETON KING   LV4", 50, WHITE);
  centered("BEST COMBO X" + bestCombo + "   PERFECT HITS " + perfects + "/7", 62, PALE);
  centered("HP LEFT " + hp + "%   HITS TAKEN " + fails + "   TIME " + secs + "S", 74, PALE);
  centered("HOOK. DEVOUR. EVOLVE.", 92, GOLD, 2);
  button(BTN_L, "PLAY AGAIN", false);
  button(BTN_R, "GET THE GAME", true);
}
function deadScreen() {
  ctx.fillStyle = "rgba(60,0,10,0.62)"; ctx.fillRect(0, 0, W, H);
  centered("YOU DIED", 34, RED, 4);
  centered("THE SKELETON KING CRUSHED YOU", 66, WHITE);
  centered("TAP THE GOLD RING BEFORE THE FIST LANDS!", 80, PALE);
  button(BTN_L, "TRY AGAIN", false);
  button(BTN_R, "GET THE GAME", true);
}

function present() {
  const s = Math.min(innerWidth / W, innerHeight / H), k = s >= 2 ? Math.floor(s) : s;
  const cw = Math.round(W * k), ch = Math.round(H * k);
  if (screen.width !== cw || screen.height !== ch) { screen.width = cw; screen.height = ch; }
  sctx.imageSmoothingEnabled = false;
  const sx = shake > 0 && mode === "play" ? Math.round(Math.sin(clock * 90) * k) : 0;
  sctx.fillStyle = "#12080c"; sctx.fillRect(0, 0, cw, ch);
  sctx.drawImage(buf, sx, 0, cw, ch);
}

// ---- flow ----
function storyRange(from, to) {
  const out = [];
  for (let f = from; f <= to; f++) out.push({ i: f, f, slow: f >= SLOW[0] && f <= SLOW[1] });
  return out;
}
function play(list) { seq = list; pos = -1; acc = 1 / FPS; mode = "play"; }
function nextPause() { return step + 1 < STEPS.length ? STEPS[step + 1].f : LAST; }

function succeed() {
  const s = STEPS[step];
  sfx("go");
  if (s.type === "dodge") {
    const left = deadline - clock;
    if (left > DODGE_TIME * 0.5) { pop("PERFECT!", 90, 70, GOLD, 2); }
    else pop("GOOD!", 90, 70, WHITE, 2);
  }
  if (s.type === "attack") {
    if (onBeat()) { perfects++; pop("PERFECT X2!", 194, 30, GOLD, 2); buzz(50); sfx("crit"); }
    else pop("HIT", 194, 30, WHITE, 1, 0.6);
  }
  play(storyRange(s.f + 1, nextPause()));
}

function failDodge() {
  const s = STEPS[step];
  const list = [];
  for (let f = META.failFrom; f <= META.failTo; f++) list.push({ i: META.fail + f - META.failFrom, f, fail: true });
  for (let f = 318; f <= s.f; f++) list.push({ i: f, f, again: true });
  play(list);
}

function arrive() {
  const cur = seq[seq.length - 1];
  if (cur && cur.again) {
    if (hp <= 0) { mode = "dead"; sfx("dead"); return; }
    enterWait(step);
    return;
  }
  if (story >= LAST) { mode = "end"; sfx("win"); return; }
  enterWait(step + 1);
}

function enterWait(k) {
  step = k; mode = "wait"; waitClock = 0; drag = null;
  const s = STEPS[step];
  if (s.type === "dodge") deadline = clock + DODGE_TIME;
  if (s.type === "attack" && step === 8) beatStart = clock;
  if ((s.type === "eat" || s.type === "attack") && queued > 0) { queued--; succeed(); return; }
  queued = 0;
  if (pendingTap && clock - pendingTap.at < 0.35 && near(pendingTap, s.t) && s.type !== "swipe") { pendingTap = null; succeed(); }
  pendingTap = null;
}

function restart(toBoss) {
  hp = 100; pops = []; queued = 0; combo = 0;
  if (toBoss) { play(storyRange(318, STEPS[7].f)); seq[seq.length - 1].again = true; step = 7; return; }
  bestCombo = 0; perfects = 0; fails = 0; startAt = performance.now();
  story = STEPS[0].f; enterWait(0);
}

function speed() {
  const s = STEPS[step];
  return s && s.type === "eat" ? 1 + 0.6 * Math.min(2, queued) : 1;
}

function tick(now) {
  const dt = Math.min(0.1, (now - (last || now)) / 1000);
  last = now; clock += dt; waitClock += dt; shake = Math.max(0, shake - dt);
  pops.forEach(p => p.t += dt); pops = pops.filter(p => p.t < p.life);
  if (mode === "wait" && STEPS[step].type === "dodge" && clock > deadline) { fails++; failDodge(); }
  if (mode === "play") {
    acc += dt * speed();
    while (mode === "play") {
      const curDelay = pos >= 0 && seq[pos].slow ? 2 / FPS : 1 / FPS;
      if (acc < curDelay) break;
      acc -= curDelay;
      pos++;
      if (pos >= seq.length) { pos = seq.length - 1; arrive(); break; }
      const e = seq[pos];
      shown = e.i; story = e.f;
      if (e.fail && e.f === 326) continue;
      if (SFX[e.f]) { sfx(SFX[e.f]); if (BUZZ[SFX[e.f]]) buzz(BUZZ[SFX[e.f]]); }
      if (META.mobHits.includes(e.f) && !e.fail && !e.again) sfx("hit");
      if (e.fail && e.f === SLAM) { hp = Math.max(0, hp - FAIL_DMG); sfx("hurt"); buzz(BUZZ.hurt); pop("-" + FAIL_DMG + " HP", 60, 40, RED, 2, 1.2); }
    }
  }
  render(); present();
  requestAnimationFrame(tick);
}

function toArt(e) {
  const r = screen.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H, at: clock };
}

screen.addEventListener("pointerdown", e => {
  e.preventDefault();
  unlockAudio();
  const p = toArt(e);
  if (p.x > 238 && p.y > 144) { muted = !muted; return; }
  if (mode === "end" || mode === "dead") {
    if (inside(p, BTN_L)) { sfx("go"); restart(mode === "dead"); }
    else if (inside(p, BTN_R)) window.open(STORE, "_blank");
    return;
  }
  if (mode === "play") {
    const s = STEPS[step];
    if (s && (s.type === "eat" || s.type === "attack")) {
      combo = clock - lastTap < 0.7 ? combo + 1 : 1;
      bestCombo = Math.max(bestCombo, combo); lastTap = clock;
      const nextS = STEPS[step + 1];
      if (nextS && nextS.type === s.type && queued < 3) queued++;
      if (s.type === "eat") sfx("tick");
    }
    pendingTap = p;
    return;
  }
  if (mode !== "wait") return;
  const s = STEPS[step];
  if (s.type === "swipe") { drag = { x: p.x, y: p.y, sx: p.x, sy: p.y }; try { screen.setPointerCapture(e.pointerId); } catch (err) { } return; }
  if (near(p, s.t)) {
    if (s.type === "eat" || s.type === "attack") { combo = clock - lastTap < 0.7 ? combo + 1 : 1; bestCombo = Math.max(bestCombo, combo); lastTap = clock; }
    succeed();
  } else { shake = 0.35; sfx("nope"); }
});
screen.addEventListener("pointermove", e => {
  if (!drag) return;
  const p = toArt(e); drag.x = p.x; drag.y = p.y;
});
screen.addEventListener("pointerup", e => {
  if (!drag || mode !== "wait") { drag = null; return; }
  const p = toArt(e), s = STEPS[step];
  drag = null;
  if (near(p, s.t)) { pop("HOOKED!", s.t[0], s.t[1] - 22, GOLD, 2, 0.8); succeed(); }
  else { shake = 0.35; sfx("nope"); pop("MISS", p.x, p.y - 6, WHITE, 1, 0.6); }
});
screen.addEventListener("pointercancel", () => { drag = null; });

// ---- tiny synth ----
function unlockAudio() {
  if (!audio) { try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (err) { audio = null; } }
  if (audio && audio.state === "suspended") audio.resume();
}
function buzz(ms) { if (!muted && navigator.vibrate) navigator.vibrate(ms); }
function tone(freq, dur, type = "square", vol = 0.12, slideTo = null, delay = 0) {
  const t0 = audio.currentTime + delay, o = audio.createOscillator(), g = audio.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t0);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g).connect(audio.destination); o.start(t0); o.stop(t0 + dur + 0.02);
}
function noise(dur, vol = 0.2, freq = 1200, delay = 0, q = 0.8) {
  const t0 = audio.currentTime + delay, n = Math.floor(audio.sampleRate * dur);
  const b = audio.createBuffer(1, n, audio.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = audio.createBufferSource(), f = audio.createBiquadFilter(), g = audio.createGain();
  f.type = "bandpass"; f.frequency.value = freq; f.Q.value = q; g.gain.value = vol;
  s.buffer = b; s.connect(f).connect(g).connect(audio.destination); s.start(t0);
}
function sfx(name) {
  if (!audio || muted) return;
  switch (name) {
    case "go": tone(660, 0.06, "square", 0.06); break;
    case "tick": tone(880, 0.03, "square", 0.04); break;
    case "nope": tone(140, 0.12, "square", 0.08, 90); break;
    case "whoosh": noise(0.25, 0.25, 900, 0, 0.6); break;
    case "hit": noise(0.12, 0.35, 1800); tone(180, 0.14, "square", 0.12, 60); break;
    case "chomp": tone(220, 0.07, "square", 0.14, 90); noise(0.1, 0.3, 700, 0.03); tone(120, 0.08, "square", 0.1, 60, 0.08); break;
    case "squish": noise(0.18, 0.3, 500); tone(90, 0.15, "sawtooth", 0.08, 50); break;
    case "charge": tone(200, 0.45, "sawtooth", 0.06, 900); break;
    case "levelup": [523, 659, 784, 1047].forEach((fq, i) => tone(fq, 0.14, "square", 0.08, null, i * 0.09)); break;
    case "weapon": [392, 523, 659, 784, 1047, 1319].forEach((fq, i) => tone(fq, 0.12, "square", 0.08, null, i * 0.07)); noise(0.4, 0.2, 3000, 0.1); break;
    case "warning": [0, 1, 2, 3].forEach(i => tone(i % 2 ? 330 : 440, 0.2, "square", 0.08, null, i * 0.22)); break;
    case "stomp": tone(70, 0.3, "sine", 0.4, 35); noise(0.2, 0.25, 200); break;
    case "slam": tone(60, 0.6, "sine", 0.5, 25); noise(0.5, 0.4, 250, 0, 0.5); break;
    case "hurt": tone(300, 0.3, "sawtooth", 0.12, 80); noise(0.25, 0.3, 600, 0.02); break;
    case "crit": tone(1200, 0.08, "square", 0.1); tone(80, 0.5, "sine", 0.5, 30, 0.05); noise(0.4, 0.45, 1500, 0.05); break;
    case "bones": for (let i = 0; i < 6; i++) noise(0.04, 0.25, 2500 + i * 300, i * 0.06, 4); break;
    case "chest": [784, 988, 1175, 1568, 1976].forEach((fq, i) => tone(fq, 0.18, "triangle", 0.1, null, i * 0.08)); break;
    case "win": [523, 659, 784, 659, 784, 1047].forEach((fq, i) => tone(fq, 0.16, "square", 0.07, null, i * 0.12)); break;
    case "dead": [392, 330, 262, 196].forEach((fq, i) => tone(fq, 0.25, "square", 0.08, null, i * 0.2)); break;
  }
}

// ---- loading: hosts may serve .webp as text/plain with nosniff, so label the bytes ourselves ----
function loadSheet(k) {
  return fetch("sheet" + k + ".webp").then(r => r.arrayBuffer()).then(b => new Promise((ok, bad) => {
    const img = new Image();
    img.onload = () => { loaded++; ok(img); };
    img.onerror = bad;
    img.src = URL.createObjectURL(new Blob([b], { type: "image/webp" }));
  }));
}
fetch("meta.json").then(r => r.json()).then(m => {
  META = m;
  return Promise.all(Array.from({ length: m.sheets }, (_, k) => loadSheet(k)));
}).then(list => { sheets = list; restart(false); });
requestAnimationFrame(tick);
</script>
