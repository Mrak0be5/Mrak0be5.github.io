<canvas id="screen"></canvas>
<script>
// ---- core.js
"use strict";
// Pixel core: an RGBA buffer (320x180 landscape or 180x320 portrait), palette helpers, sprites with baked outlines,
// layers with live outlines, font.
let W = 320, H = 180;
const HEADLESS = typeof document === "undefined";
let screenCv = null, sctx = null, octx = null, frameImg = null, pix = new Uint32Array(W * H);
function setView(w, h) {

const portrait = () => H > W;

  setView(W, H);
}

// colours are parsed once: draw code calls hx("#...") every frame
const HX_CACHE = new Map();
function hx(s) {

const pack = (r, g, b) => ((255 << 24) | ((b & 255) << 16) | ((g & 255) << 8) | (r & 255)) >>> 0;
// no temporary arrays: these run per pixel in the post effects

const INK = hx("#24101a"), WHITE = hx("#ffffff"), GOLD = hx("#ffe04a"), PALE = hx("#fff2a0"), RED = hx("#e02030");
const BLACK = hx("#000000"), CYAN = hx("#8ef0ff"), GREEN = hx("#4ad86a"), DIM = hx("#b09878");

const HANDLE = hx("#6a3a1a");
const BLOOD = [hx("#ff4a3a"), hx("#d81a2a"), hx("#9a0c1e"), hx("#5a0614")];
const SKIN = { k: hx("#ffc8a4"), S: hx("#f09c80"), s: hx("#c0685a") };
const SHADOW_K = [0.66, 0.58, 0.74];
const BAYER = [[0, 8, 2, 10], [12, 4, 14, 6], [3, 11, 1, 9], [15, 7, 13, 5]];

function put(x, y, c) {
  x |= 0; y |= 0;
  if (x >= 0 && x < W && y >= 0 && y < H) pix[y * W + x] = c;
}
function get(x, y) {
  x = Math.max(0, Math.min(W - 1, x | 0)); y = Math.max(0, Math.min(H - 1, y | 0));

}

}
function rect(x, y, w, h, c) {

}
function rectA(x, y, w, h, c, t) {
  for (let j = Math.max(0, y | 0); j < Math.min(H, (y + h) | 0); j++)
    for (let i = Math.max(0, x | 0); i < Math.min(W, (x + w) | 0); i++) pix[j * W + i] = mix(pix[j * W + i], c, t);
}
function shadowEllipse(cx, cy, rx, ry) {

      if (((x - cx) / rx) ** 2 + ((y - cy) / ry) ** 2 <= 1) darken(x, y);

function ellipseRing(cx, cy, rx, ry, c, gaps = 0, phase = 0) {

    if (gaps && (a + phase) % gaps === 0) continue;

      const d = ((x - cx) / rx) ** 2 + ((y - cy) / ry) ** 2;

// ---- sprites: ASCII rows + palette, 1 px outline baked in ----
function makeSprite(rows, pal, outline = INK) {

  rows.forEach((row, j) => [...row].forEach((ch, i) => { if (ch !== "." && ch !== " ") d[(j + 1) * sw + i + 1] = pal[ch]; }));

    const o = d.slice();
    for (let y = 0; y < sh; y++) for (let x = 0; x < sw; x++) {
      if (d[y * sw + x]) continue;

// o: scale | sx+sy (squash & stretch), flip, flash (+dither), fade, rect [x, y, w, h] = draw only that part of the sprite
function blit(s, x, y, o = {}) {

  const [rx, ry, rw, rh] = o.rect || [0, 0, s.w, s.h];
  const tw = Math.round(rw * kx), th = Math.round(rh * ky);
  x = Math.round(x); y = Math.round(y);
  for (let ty = 0; ty < th; ty++) {
    const yy = y + ty;
    if (yy < 0 || yy >= H) continue;
    const sy = ry + Math.min(rh - 1, (ty / ky) | 0);
    for (let tx = 0; tx < tw; tx++) {
      const xx = x + tx;
      if (xx < 0 || xx >= W) continue;
      let sx = Math.min(rw - 1, (tx / kx) | 0);
      sx = flip ? rx + rw - 1 - sx : rx + sx;
      const c = s.d[sy * s.w + sx];
      if (!c) continue;
      pix[yy * W + xx] = flash && c !== INK && (!o.dither || (xx + yy) % 2 === 0) ? flash : (o.fade ? mix(pix[yy * W + xx], c, o.fade) : c);

// feet-anchored draw: (x, y) is the bottom centre
function blitFeet(s, x, y, o = {}) {
  const sc = o.scale || 1, kx = o.sx || sc, ky = o.sy || sc, r = o.rect || [0, 0, s.w, s.h];
  blit(s, x - r[2] * kx / 2, y - r[3] * ky + 1, o);
}

// ---- screen post effects ----
// pixel zoom about a screen point (z = 2 keeps pixels square)
function zoomView(cx, cy, z) {
  if (z <= 1.001) return;
  const src = pix.slice();
  for (let y = 0; y < H; y++) {
    const sy = Math.floor(cy + (y - cy) / z);
    for (let x = 0; x < W; x++) {
      const sx = Math.floor(cx + (x - cx) / z);
      pix[y * W + x] = sx >= 0 && sx < W && sy >= 0 && sy < H ? src[sy * W + sx] : INK;
    }
  }
}
// darkness with dithered light pools: lights = [{x, y, r}] in screen pixels.
// Each light only touches its own box; the result is 4 dithered light bands.
let LIGHT = null;
function lightPass(lights, ambient, tintCol) {
  if (!LIGHT || LIGHT.length !== W * H) LIGHT = new Float32Array(W * H); else LIGHT.fill(0);

    const r = L.r, ir2 = 1 / (r * r), x0 = Math.max(0, Math.floor(L.x - r)), x1 = Math.min(W - 1, Math.ceil(L.x + r));
    const y0 = Math.max(0, Math.floor(L.y - r / 1.25)), y1 = Math.min(H - 1, Math.ceil(L.y + r / 1.25));
    for (let y = y0; y <= y1; y++) {
      const dy = (y - L.y) * 1.25, dy2 = dy * dy, row = y * W;
      for (let x = x0; x <= x1; x++) {
        const dx = x - L.x, v = 1 - (dx * dx + dy2) * ir2;
        if (v > LIGHT[row + x]) LIGHT[row + x] = v;
      }
    }
  }
  const tr = tintCol & 255, tg = (tintCol >>> 8) & 255, tb = (tintCol >>> 16) & 255, k = 1 - ambient;
  for (let y = 0; y < H; y++) {
    const B = BAYER[y & 3], row = y * W;
    for (let x = 0; x < W; x++) {
      const i = row + x, q = Math.floor((ambient + k * LIGHT[i]) * 3 + B[x & 3] / 16);
      if (q < 3) {
        const t = (3 - q) * 0.2, c = pix[i], r = c & 255, g = (c >>> 8) & 255, b = (c >>> 16) & 255;
        pix[i] = ((255 << 24) | (((b + (tb - b) * t) & 255) << 16) | (((g + (tg - g) * t) & 255) << 8) | ((r + (tr - r) * t) & 255)) >>> 0;
      }
    }
  }
}
// screen-edge glow; the border mask (pixel index, depth, dither) is built once per view size and width
const VIG_CACHE = new Map();
function vignette(col, strength, width = 0.35) {
  const key = W + "x" + H + ":" + width;
  let M = VIG_CACHE.get(key);
  if (!M) {
    const idx = [], ks = [], bay = [];
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const dx = Math.abs(x - W / 2) / (W / 2), dy = Math.abs(y - H / 2) / (H / 2), d = Math.max(dx, dy), k = (d - (1 - width)) / width;
      if (k > 0) { idx.push(y * W + x); ks.push(k); bay.push(BAYER[y & 3][x & 3] / 16); }

    M = { idx: Int32Array.from(idx), k: Float64Array.from(ks), bay: Float64Array.from(bay) };
    VIG_CACHE.set(key, M);
  }
  const cr = col & 255, cg = (col >>> 8) & 255, cb = (col >>> 16) & 255, s14 = strength * 1.4;
  for (let j = 0; j < M.idx.length; j++) {
    const k = M.k[j];
    if (M.bay[j] >= k * s14) continue;
    const i = M.idx[j], t = 0.5 * k * strength + 0.15, c = pix[i], r = c & 255, g = (c >>> 8) & 255, b = (c >>> 16) & 255;
    pix[i] = ((255 << 24) | (((b + (cb - b) * t) & 255) << 16) | (((g + (cg - g) * t) & 255) << 8) | ((r + (cr - r) * t) & 255)) >>> 0;

// ---- layers: pixels collected per object, outlined when drawn ----
class Layer {
  constructor() { this.m = new Map(); }
  set(x, y, c) { x = Math.round(x); y = Math.round(y); this.m.set((y + 512) * 4096 + x + 1024, c); }
  has(x, y) { return this.m.has((y + 512) * 4096 + x + 1024); }

    if (outline) for (const k of this.m.keys()) {
      const x = (k % 4096) - 1024, y = Math.floor(k / 4096) - 512;
      if (!this.m.has(k + 1)) put(x + 1, y, outline);
      if (!this.m.has(k - 1)) put(x - 1, y, outline);
      if (!this.m.has(k + 4096)) put(x, y + 1, outline);
      if (!this.m.has(k - 4096)) put(x, y - 1, outline);

    for (const [k, c] of this.m) {
      const x = (k % 4096) - 1024, y = Math.floor(k / 4096) - 512;

}
function disc(L, cx, cy, r, c) {

    for (let x = Math.floor(cx - r - 1); x <= cx + r + 1; x++)
      if ((x - cx) ** 2 + (y - cy) ** 2 <= r * r) L.set(x, y, c);
}
function blob(L, cx, cy, rx, ry, pal) {
  for (let y = Math.floor(cy - ry) - 1; y <= cy + ry + 1; y++)
    for (let x = Math.floor(cx - rx) - 1; x <= cx + rx + 1; x++) {
      const d = ((x - cx) / rx) ** 2 + ((y - cy) / ry) ** 2;
      if (d > 1) continue;
      const rel = (x - cx) / rx + (y - cy) / ry * 0.8;
      L.set(x, y, rel < -0.55 ? pal[0] : rel > 0.6 ? pal[2] : pal[1]);

  const n = Math.max(2, Math.round(Math.hypot(b[0] - a[0], b[1] - a[1])));
  for (let i = 0; i <= n; i++) disc(L, a[0] + (b[0] - a[0]) * i / n, a[1] + (b[1] - a[1]) * i / n, r, pal[1]);
  for (let i = 0; i <= n; i++) {

  for (let y = Math.floor(cy) - r; y <= cy + r; y++)

const SWORD = [hx("#ffffff"), hx("#bff6ff"), hx("#6ab8d8"), hx("#2e5a86")];
const GUARD = [hx("#ffe04a"), hx("#c08a1a")];
function sword(L, hilt, ang, len = 28) {
  const ux = Math.cos(ang), uy = Math.sin(ang), vx = -uy, vy = ux, R = len + 6;
  for (let y = Math.floor(hilt[1]) - R; y <= hilt[1] + R; y++)
    for (let x = Math.floor(hilt[0]) - R; x <= hilt[0] + R; x++) {
      const dx = x - hilt[0], dy = y - hilt[1], u = dx * ux + dy * uy, v = dx * vx + dy * vy;

// ---- 3x5 font with outline ----
const FONT = {
  A: "010101111101101", B: "110101110101110", C: "111100100100111", D: "110101101101110",
  E: "111100110100111", F: "111100110100100", G: "111100101101111", H: "101101111101101",
  I: "111010010010111", J: "001001001101111", K: "101101110101101", L: "100100100100111", "=": "000111000111000", "&": "010101010101011",
  M: "101111111101101", N: "110101101101101", O: "111101101101111", P: "110101110100100",
  Q: "111101101111001", R: "110101110101101", S: "011100010001110", T: "111010010010010",
  U: "101101101101111", V: "101101101101010", W: "101101111111101", X: "101101010101101",
  Y: "101101010010010", Z: "111001010100111", "0": "111101101101111", "1": "010110010010111",
  "2": "111001111100111", "3": "111001111001111", "4": "101101111001001", "5": "111100111001111",
  "6": "111100111101111", "7": "111001010010010", "8": "111101111101111", "9": "111101111001111",

  "-": "000000111000000", "+": "000010111010000", "?": "111001011000010", " ": "000000000000000",
  "%": "101001010100101", ",": "000000000010100", "'": "010010000000000",
  ">": "100010001010100", "<": "001010100010001", "(": "010100100100010", ")": "010001001001010",

const textW = (s, k = 1) => s.length * 4 * k - k;
function text(s, x, y, col, k = 1, outline = INK) {
  x = Math.round(x); y = Math.round(y);
  const pts = [], set = new Set();
  let n = 0;
  for (const ch of s) {
    const g = FONT[ch] || FONT[" "];
    for (let j = 0; j < 5; j++) for (let i = 0; i < 3; i++)
      if (g[j * 3 + i] === "1") for (let dy = 0; dy < k; dy++) for (let dx = 0; dx < k; dx++) {
        const a = x + n * 4 * k + i * k + dx, b = y + j * k + dy;
        pts.push(a, b); set.add(a * 1000 + b);

  if (outline) for (let i = 0; i < pts.length; i += 2) {
    const a = pts[i], b = pts[i + 1];
    for (const [u, v] of [[1, 0], [-1, 0], [0, 1], [0, -1], [1, 1]])
      if (!set.has((a + u) * 1000 + b + v)) put(a + u, b + v, outline);

const centered = (s, y, col, k = 1) => text(s, Math.round((W - textW(s, k)) / 2), y, col, k);
function wrap(s, maxChars) {
  const out = [];

    else cur += " " + w;

  if (cur.trim()) out.push(cur.trim());

const lerp = (a, b, t) => a + (b - a) * t;

function valueNoise(seed, cell, w, h) {
  const r = seeded(seed), gw = Math.ceil(w / cell) + 2, g = new Float32Array(gw * (Math.ceil(h / cell) + 2));
  for (let i = 0; i < g.length; i++) g[i] = r();
  return (x, y) => {
    const gx = x / cell, gy = y / cell, i = Math.floor(gx), j = Math.floor(gy);
    let u = gx - i, v = gy - j;
    u = u * u * (3 - 2 * u); v = v * v * (3 - 2 * v);

// Arena bitmap: ground, cracks, tufts, rocks and props inside; a ring of trees / cliffs around the walkable area.
const AW = 480, AH = 440, INSET = { l: 28, r: 28, t: 44, b: 22 };
function makeArena(biomeKey, seed) {
  const B = BIOMES[biomeKey], d = new Uint32Array(AW * AH), r = seeded(seed);
  const G = B.ground.map(hx), n1 = valueNoise(seed + 1, 34, AW, AH), n2 = valueNoise(seed + 2, 9, AW, AH);
  for (let y = 0; y < AH; y++) for (let x = 0; x < AW; x++) {
    const v = n1(x, y) * 0.72 + n2(x, y) * 0.28 + (BAYER[y % 4][x % 4] / 16 - 0.47) * 0.07;
    d[y * AW + x] = G[clamp(Math.floor((v - 0.12) * 5), 0, 3)];
  }
  const A = { w: AW, h: AH, d, biome: biomeKey, base: null, props: [] };
  const P = (x, y, c) => { x |= 0; y |= 0; if (x >= 0 && x < AW && y >= 0 && y < AH) d[y * AW + x] = c; };
  const crack = hx(B.crack);
  for (let k = 0; k < (B.crackGlow ? 11 : 7); k++) {
    let x = r() * AW, y = r() * AH, dx = r() - 0.5, dy = r() - 0.5;
    const l = Math.hypot(dx, dy) || 1; dx /= l; dy /= l;
    const glow = B.crackGlow ? hx(B.crackGlow) : 0, n = (B.crackGlow ? 140 : 90) + r() * 80;
    for (let i = 0; i < n; i++) {
      P(x, y, crack);
      if (glow) { P(x + 1, y, i % 3 ? crack : glow); P(x, y - 1, mix(crack, G[1], 0.5)); }
      x += dx + (r() - 0.5) * 0.9; y += dy + (r() - 0.5) * 0.9;
    }
  }
  const tuft = B.tuft.map(hx);
  for (let k = 0; k < 70; k++) {
    const x = r() * AW, y = r() * AH;
    if (biomeKey === "snow") { P(x, y, tuft[0]); P(x + 1, y, tuft[0]); P(x, y + 1, tuft[1]); continue; }
    [[1, 0, 1], [3, 0, 1], [0, 1, 1], [2, 1, 1], [3, 1, 0], [1, 2, 0], [2, 2, 1], [3, 2, 0]].forEach(([a, b, c]) => P(x + a, y + b, tuft[c]));
  }
  if (biomeKey === "jungle") for (let k = 0; k < 9; k++) {
    const cx = INSET.l + r() * (AW - 80), cy = INSET.t + r() * (AH - 80), rx = 6 + r() * 10, ry = rx * 0.5;
    for (let y = -ry; y <= ry; y++) for (let x = -rx; x <= rx; x++)
      if ((x / rx) ** 2 + (y / ry) ** 2 <= 1) P(cx + x, cy + y, (x + y * 1.5) < -rx * 0.4 ? hx("#6ab0c0") : hx("#3a7a8a"));
  }
  const decals = [];
  const rockPal = B.rock.map(hx);
  for (let k = 0; k < 6; k++) decals.push({ kind: "rock", x: INSET.l + 20 + r() * (AW - 100), y: INSET.t + 20 + r() * (AH - 90), s: 6 + r() * 6 });
  for (let k = 0; k < (B.props.length ? 9 : 0); k++) decals.push({ kind: "prop", spr: B.props[Math.floor(r() * B.props.length)], x: INSET.l + 10 + r() * (AW - 70), y: INSET.t + 16 + r() * (AH - 80) });
  // border trees / rocks
  if (B.dead) {
    for (let x = -10; x < AW + 20; x += 18 + r() * 10) {
      decals.push({ kind: "dead", x, y: 14 + r() * 24, h: 36 + r() * 18 });
      decals.push({ kind: "dead", x: x + 7, y: AH + 16 + r() * 8, h: 30 + r() * 12 });
    }
    for (let y = 30; y < AH; y += 18 + r() * 8) {
      decals.push({ kind: "dead", x: 6 + r() * 10, y: y + 30, h: 34 + r() * 16 });
      decals.push({ kind: "dead", x: AW - 6 - r() * 10, y: y + 30, h: 34 + r() * 16 });
    }
  } else if (B.trees.length) {
    for (let x = -10; x < AW + 20; x += 15 + r() * 8) {
      decals.push({ kind: "tree", x, y: 8 + r() * 26, h: 40 + r() * 22, pal: B.trees[Math.floor(r() * 2)] });
      decals.push({ kind: "tree", x: x + 6, y: AH + 20 + r() * 10, h: 34 + r() * 16, pal: B.trees[Math.floor(r() * 2)] });
    }
    for (let y = 30; y < AH; y += 16 + r() * 8) {
      decals.push({ kind: "tree", x: 4 + r() * 12, y: y + 30, h: 38 + r() * 20, pal: B.trees[Math.floor(r() * 2)] });
      decals.push({ kind: "tree", x: AW - 4 - r() * 12, y: y + 30, h: 38 + r() * 20, pal: B.trees[Math.floor(r() * 2)] });
    }
  } else {
    for (let x = -6; x < AW + 10; x += 12 + r() * 10) {
      decals.push({ kind: "cliff", x, y: 4 + r() * 22, s: 10 + r() * 8 });
      decals.push({ kind: "cliff", x, y: AH + 2 - r() * 10, s: 9 + r() * 6 });
    }
    for (let y = 20; y < AH; y += 12 + r() * 8) {
      decals.push({ kind: "cliff", x: r() * 16, y, s: 10 + r() * 6 });
      decals.push({ kind: "cliff", x: AW - r() * 16, y, s: 10 + r() * 6 });

  }

  const L2 = [];

    const L = new Layer();

      for (let y = -s; y <= s * 0.4; y++) for (let x = -s * 1.2; x <= s * 1.2; x++) {
        const dd = (x / (s * 1.2)) ** 2 + (y / s) ** 2;
        if (dd <= 1 && !(y > s * 0.2 && dd > 0.7)) L.set(cx + x, cy + y, (x + y * 1.4) < -s * 0.3 ? rockPal[0] : (x + y) < s * 0.5 ? rockPal[1] : rockPal[2]);

    } else if (dc.kind === "tree") {
      pineLayer(L, dc.x, dc.y - dc.h, dc.h, dc.h * 0.7, dc.pal.map(hx), B.trunk.map(hx));
    }
    L2.push({ L, dc });
  }
  for (const { L, dc } of L2) {
    if (dc.kind === "tree" || dc.kind === "cliff" || dc.kind === "dead") {
      const sh = dc.kind !== "cliff" ? { x: dc.x + 8, y: dc.y, rx: dc.h * 0.3, ry: 4 } : { x: dc.x + 3, y: dc.y + 3, rx: dc.s, ry: 3 };
      for (let y = -sh.ry; y <= sh.ry; y++) for (let x = -sh.rx; x <= sh.rx; x++)
        if ((x / sh.rx) ** 2 + (y / sh.ry) ** 2 <= 1) {
          const xx = (sh.x + x) | 0, yy = (sh.y + y) | 0;
          if (xx >= 0 && xx < AW && yy >= 0 && yy < AH) d[yy * AW + xx] = mul(d[yy * AW + xx], SHADOW_K);
        }
    }
    if (dc.kind === "prop") { stampSprite(d, dc.spr, dc.x, dc.y); continue; }
    stampLayer(d, L);
  }
  A.base = d.slice();
  A.props = decals.filter(dc => dc.kind === "prop").map(dc => ({ x: dc.x, y: dc.y, spr: dc.spr, ph: r() * 6 }));
  return A;
}
function stampLayer(d, L) {
  const P = (x, y, c) => { if (x >= 0 && x < AW && y >= 0 && y < AH) d[y * AW + x] = c; };
  for (const k of L.m.keys()) {
    const x = (k % 4096) - 1024, y = Math.floor(k / 4096) - 512;
    if (!L.m.has(k + 1)) P(x + 1, y, INK);
    if (!L.m.has(k - 1)) P(x - 1, y, INK);
    if (!L.m.has(k + 4096)) P(x, y + 1, INK);
    if (!L.m.has(k - 4096)) P(x, y - 1, INK);

  for (const [k, c] of L.m) P((k % 4096) - 1024, Math.floor(k / 4096) - 512, c);
}
function stampSprite(d, s, x0, y0) {
  x0 = Math.round(x0 - s.w / 2); y0 = Math.round(y0 - s.h);
  for (let y = 0; y < s.h; y++) for (let x = 0; x < s.w; x++) {
    const c = s.d[y * s.w + x], xx = x0 + x, yy = y0 + y;
    if (c && xx >= 0 && xx < AW && yy >= 0 && yy < AH) d[yy * AW + xx] = c;

}
function deadTreeLayer(L, x, base, h, pal, r) {
  const branch = (x0, y0, ang, len, w, depth) => {
    const n = Math.ceil(len);
    for (let i = 0; i <= n; i++) {
      const cx = x0 + Math.cos(ang) * i, cy = y0 + Math.sin(ang) * i;
      for (let o = -w / 2; o <= w / 2; o += 1) L.set(cx + o * Math.sin(ang), cy - o * Math.cos(ang), o < 0 ? pal[0] : pal[1]);

      branch(ex, ey, ang + 0.4 + r() * 0.3, len * 0.55, Math.max(1, w - 1), depth - 1);
    }

}
function pineLayer(L, cx, top, h, w, pal, trunk) {
  for (let y = top + h * 0.86; y < top + h * 1.02; y++) for (let x = cx - 2; x < cx + 2; x++) L.set(x, y, x < cx ? trunk[0] : trunk[1]);

        const rel = (x - cx) / Math.max(half, 1);
        let c = y >= Math.floor(t1) - 2 ? (rel > 0.1 ? pal[3] : pal[2]) : rel < -0.45 ? pal[0] : rel < 0.2 ? pal[1] : pal[2];
        if (frac < 0.12) c = pal[0];
        L.set(x, y, c);
      }
    }
  }
}

// ---------------------------------------------------------------- projectiles, lobs, telegraphs, puddles, fx
function updateShots(dt) {

// ---------------------------------------------------------------- cards

<script>
// ---- minis.js

const GOB_SKIN = [hx("#d4da60"), hx("#9aa632"), hx("#5e661e")];

// filled polygon; col may be a function (x, y) -> colour for shading
function poly(L, pts, col) {
  let y0 = Infinity, y1 = -Infinity;
  for (const p of pts) { y0 = Math.min(y0, p[1]); y1 = Math.max(y1, p[1]); }
  for (let y = Math.floor(y0); y <= Math.ceil(y1); y++) {

    for (let i = 0; i < pts.length; i++) {
      const a = pts[i], b = pts[(i + 1) % pts.length];

const shadeX = (pal, x0, x1) => x => { const k = (x - Math.min(x0, x1)) / (Math.abs(x1 - x0) || 1); return k < 0.33 ? pal[0] : k < 0.7 ? pal[1] : pal[2]; };

// ---------------------------------------------------------------- goblin chief: horned helmet, fur cape, huge axe
function drawChief(B, sx, sy) {

<script>
// ---- render.js
"use strict";
// World rendering into the 256x160 pixel buffer. Works headless too (sim screenshots).

let camX = 0, camY = 0;
const worldToScreen = (x, y) => [x - camX, y - camY];
const TRAIL = [hx("#f0ffff"), hx("#8ef0ff"), hx("#3aa8e0"), hx("#1a5a9a")];
const METEOR = makeSprite(["..oo..", ".oOOo.", "oOYYOo", "oOYYOo", ".oOOo.", "..oo.."], { o: hx("#a02a1a"), O: hx("#ff6a1a"), Y: hx("#ffe060") });
const ROCKSPR = makeSprite([".kkk.", "kKKkk", "kKkkk", ".kkk."], { K: hx("#9a8a88"), k: hx("#5e4e4c") });
const GUT = makeSprite([".rR.", "rRRr", ".rr."], { r: hx("#8a1a2a"), R: hx("#e04a5a") });
const BLOB_G = makeSprite([".gG.", "gGGg", ".gg."], { g: hx("#3aa82a"), G: hx("#9aff6a") });
const SPIKE = makeSprite(["..W..", "..W..", ".WwW.", ".WwW.", "WwwbW", "wwbbw"], { W: WHITE, w: hx("#bff6ff"), b: hx("#6ab8d8") });

function drawWorld() {
  const sm = G.shake > 0 ? G.shakeMag : 0;
  let fx_ = P.x, fy_ = P.y - 14;
  const B = G.boss;
  if (G.cine) { fx_ = G.cine.x; fy_ = G.cine.y; }
  else if (B && !B.dying) {
    const c = bossCircles(B)[0];
    fx_ += clamp((c.x - P.x) * 0.3, -W / 2 + 70, W / 2 - 70);
    fy_ += clamp((c.y - 10 - P.y) * 0.3, -H / 2 + 60, H / 2 - 70);
  }
  const far = G.camX === undefined || Math.abs(G.camX - fx_) > W * 0.6 || Math.abs(G.camY - fy_) > H * 0.6;
  const ck = G.cine ? 0.18 : 0.08;
  G.camX = far ? fx_ : lerp(G.camX, fx_, ck);
  G.camY = far ? fy_ : lerp(G.camY, fy_, ck);
  camX = Math.round(clamp(G.camX - W / 2, 0, AW - W) + (sm ? rnd(-sm, sm) : 0));
  camY = Math.round(clamp(G.camY - H / 2, 0, AH - H) + (sm ? rnd(-sm, sm) : 0));
  const A = G.arena;
  if (camX >= 0 && camX + W <= AW && camY >= 0 && camY + H <= AH) {
    for (let y = 0; y < H; y++) { const row = (y + camY) * AW + camX; pix.set(A.d.subarray(row, row + W), y * W); }
  } else for (let y = 0; y < H; y++) {   // screen shake can push the view past the arena edge
    const ay = clamp(y + camY, 0, AH - 1), row = ay * AW;
    for (let x = 0; x < W; x++) pix[y * W + x] = A.d[row + clamp(x + camX, 0, AW - 1)];
  }
  for (const f of G.fx) if (f.kind === "cracks") drawCracks(f); else if (f.kind === "wreck") drawWreck(f);
  for (const p of G.puddles) {
    const [sx, sy] = worldToScreen(p.x, p.y);
    const col = p.col === "lava" ? hx("#ff6a1a") : hx("#6ae03a");
    fillEllipseDither(sx, sy, p.r, p.r * 0.6, col, 0.5 + 0.2 * Math.sin(G.t * 8 + p.x), p.life < 1 && (G.t * 8) % 1 < 0.5);
    if (Math.random() < 0.3) put(sx + rnd(-p.r, p.r) * 0.7, sy + rnd(-p.r, p.r) * 0.4, p.col === "lava" ? hx("#ffe060") : hx("#caff9a"));
  }
  drawAmbient();
  if (P.w.aura) drawAura();
  for (const t of G.tele) drawTele(t);
  for (const r of G.rings) {
    const [sx, sy] = worldToScreen(r.x, r.y), c = r.col || GOLD;
    ellipseRing(sx, sy, r.r, r.r * 0.6, r.t < 0.15 ? WHITE : c);
    ellipseRing(sx, sy, r.r * 0.8, r.r * 0.48, r.col ? mix(r.col, WHITE, 0.4) : PALE, 3);
  }
  for (const f of G.fx) if (f.kind === "quake") {
    const [sx, sy] = worldToScreen(f.x, f.y);
    fillEllipseDither(sx, sy, f.R, f.R * 0.6, hx("#8a5a2a"), 0.35 * (1 - f.t / f.life), false);
  }
  for (const pl of G.piles) {
    const [sx, sy] = worldToScreen(pl.x, pl.y), sh = pl.t > 1.8 ? Math.round(Math.sin(G.t * 40)) : 0;
    blitFeet(SPR.bonepile, sx + sh, sy);
  }
  for (const d of G.drops) {
    const [sx, sy] = worldToScreen(d.x, d.y);
    if (sx < -6 || sx > W + 6 || sy < -6 || sy > H + 6) continue;
    const bob = Math.round(Math.sin(d.t * 5) * 1.2);
    darken(sx, sy + 1); darken(sx - 1, sy + 1); darken(sx + 1, sy + 1);
    blitFeet(d.kind === "heart" ? SPR.heart : d.kind === "big" ? SPR.bigmeat : SPR.meat, sx, sy - 1 + bob);
    if ((d.t * 1.3 + d.x * 0.1) % 1 < 0.12) { put(sx + 1, sy - 5 + bob, WHITE); put(sx, sy - 6 + bob, WHITE); put(sx + 2, sy - 6 + bob, WHITE); put(sx + 1, sy - 7 + bob, WHITE); }
  }
  if (G.chest) {
    const c = G.chest, [sx, sy] = worldToScreen(c.x, c.y);

// ---- bot.js
"use strict";
// Autoplayer for balance runs (node sim) and ?bot=1 in the browser. Plays like a decent, not perfect, human.

  skill: 1,          // 0..1: how well it reads telegraphs (reaction), lower = sloppier
  reaction: 0.25,    // seconds before it notices a new telegraph
  noticed: new WeakMap(),
  wander: 0,
  inputVector() {
    const v = { x: 0, y: 0 };
    const add = (x, y, w) => { v.x += x * w; v.y += y * w; };
    const now = G.t;

    let danger = 0;
    for (const t of G.tele) {
      if (!this.noticed.has(t)) this.noticed.set(t, now);
      if (now - this.noticed.get(t) < this.reaction * (2 - this.skill)) continue;
      if (!t.dmg) { if (t.shape !== "line") continue; }

        const dx = P.x - t.x, dy = (P.y - t.y) * 1.3, d = Math.hypot(dx, dy) || 0.01;

        const dy = P.y - t.y;
        if (Math.abs(dy) < t.h / 2 + 10) { add(0, dy >= 0 ? 1 : -1, 6 * urgency); danger++; if (P.y < INSET.t + 20) add(0, 1, 6); if (P.y > AH - INSET.b - 20) add(0, -1, 6); }

        if (Math.abs(dx) < t.w / 2 + 10) { add(dx >= 0 ? 1 : -1, 0, 6 * urgency); danger++; if (P.x < INSET.l + 20) add(1, 0, 6); if (P.x > AW - INSET.r - 20) add(-1, 0, 6); }

        const d = segDist(P.x, P.y, t.x1, t.y1, t.x2, t.y2);
        if (d < t.w / 2 + 14) {
          const lx = t.x2 - t.x1, ly = t.y2 - t.y1, l = Math.hypot(lx, ly) || 1, nx = -ly / l, ny = lx / l;
          const side = (P.x - t.x1) * nx + (P.y - t.y1) * ny >= 0 ? 1 : -1;
          add(nx * side, ny * side, 7 * urgency); danger++;

    for (const e of G.enemies) if (e.state === "aim" || e.state === "dash") {
      const x2 = e.x + e.cdx * 110, y2 = e.y + e.cdy * 110;
      if (segDist(P.x, P.y, e.x, e.y, x2, y2) < 18) { const nx = -e.cdy, ny = e.cdx, side = (P.x - e.x) * nx + (P.y - e.y) * ny >= 0 ? 1 : -1; add(nx * side, ny * side, 4); }
    }

  choose(cards) {
    const score = c => {
      if (c.kind === "evo") return 100;
      if (c.kind === "feast") return P.hp < P.maxHp * 0.5 ? 14 : 6;
      if (c.kind === "snack") return P.hp < P.maxHp * 0.5 ? 10 : 2;
      if (c.kind === "plus2") return 9;

const BTN_COLORS = {

};
function button(x, y, w, h, label, id, color = "orange", k = 1) {

// trail: where the bar was a moment ago; the lost chunk shows pale before it drains
function bar(x, y, w, h, k, col, bg = hx("#3a1418"), trail = 0) {
  rect(x - 1, y - 1, w + 2, h + 2, INK); rect(x, y, w, h, bg);
  if (trail > k) rect(x, y, Math.round(w * clamp(trail, 0, 1)), h, PALE);
  rect(x, y, Math.round(w * clamp(k, 0, 1)), h, col);
  rect(x, y, Math.round(w * clamp(k, 0, 1)), 1, mix(col, WHITE, 0.45));
}
function fitK(s, maxW, k) { while (k > 1 && textW(s, k) > maxW) k--; return k; }
function ctext(s, y, col, k = 1) { k = fitK(s, W - 8, k); centered(s, y, col, k); return y + 5 * k + 3; }
function cwrap(s, y, col, lh = 8) { for (const l of wrap(s, Math.floor((W - 8) / 4))) { centered(l, y, col); y += lh; } return y; }
const fmt = s => { s = Math.max(0, Math.ceil(s)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
// a vertical stack of buttons centred on screen
function stack(y, items, w = 110, h = 15, gap = 5) {
  for (const it of items) { if (!it) continue; button((W - w) / 2, y, w, it[3] || h, it[0], it[1], it[2]); y += (it[3] || h) + gap; }
  return y;
}

function drawIcon(key, cx, cy, scale = 2) {
  if (key === "cleaver") { const L = new Layer(); cleaver(L, cx - 4, cy + 3, -0.9, 1.4); L.draw(); return; }
  if (key === "sword") { const L = new Layer(); sword(L, [cx - 7, cy + 6], -0.8, 18); L.draw(); return; }
  if (key === "saw") { const L = new Layer(); sawDisc(L, cx, cy, G ? G.t * 3 : 0, 6); L.draw(); return; }
  if (key === "slam") { ellipseRing(cx, cy + 3, 10, 5, GOLD); ellipseRing(cx, cy + 3, 6, 3, PALE); blitFeet(SPR.butcher.idle0, cx, cy + 4, { scale: 0.45 }); return; }
  const s = SPR.icons[key] || SPR.icons.might;
  blit(s, cx - s.w * scale / 2, cy - s.h * scale / 2, { scale });
}

function drawCineBars() {
  const c = G.cine, port = portrait(), t = Math.max(0, c.t), full = port ? 40 : 30;
  const k = Math.max(0, Math.min(1, t / 0.25, (c.dur - t) / 0.25)), top = Math.round(k * (port ? 26 : 16)), bh = Math.round(k * full);
  rect(0, 0, W, top, BLACK); rect(0, H - bh, W, bh, BLACK);
  if (t > 0.3 && t < c.dur - 0.2 && bh >= full - 1) {
    const kk = fitK(c.title, W - 8, 3), subLines = c.sub ? wrap(c.sub, Math.floor((W - 8) / 4)).length : 0;
    const blockH = 5 * kk + (subLines ? 3 + subLines * 7 : 0), y = H - bh + Math.round((bh - blockH) / 2);

function drawTutorial() {
  if (G.ch !== 0 || G.tutorialDone || G.endless) return;
  const hand = (x, y, press) => blit(SPR.hand, x - 2, y + (press ? 3 : 6));
  if ((G.movedOnce || 0) < 0.8) {
    const k = (G.t * 0.8) % 1, x = W * 0.25 + Math.sin(k * Math.PI * 2) * 18, y = H - 56 + Math.cos(k * Math.PI * 2) * 8;
    hand(x, y, true);
    hint("DRAG ANYWHERE TO MOVE");
    return;
  }
  if (!G.hookedOnce) {
    let best = null, bd = 1e9;
    for (const e of G.enemies) { const d = Math.hypot(e.x - P.x, e.y - P.y); if (d < bd && !e.elite) { bd = d; best = e; } }
    if (best && bd < 110) {
      const [sx, sy] = worldToScreen(best.x, best.y - best.h / 2);
      ellipseRing(sx, sy + 3, 8 + (G.t * 3 % 1) * 6, 5, GOLD);
      hand(sx, sy, Math.floor(G.t * 2) % 2);
      hint("TAP A GOBLIN TO HOOK AND EAT IT!");
    }
    return;
  }
  if (G.t > 40) G.tutorialDone = true;
}
function hint(s) {
  const lines = wrap(s, Math.floor((W - 16) / 4)), w = Math.max(...lines.map(l => textW(l))) + 8, h = lines.length * 8 + 3;
  const x = Math.round((W - w) / 2), y = H - 40 - (lines.length - 1) * 8;
  rectA(x, y, w, h, hx("#140a0e"), 0.8);
  rect(x, y, w, 1, GOLD); rect(x, y + h - 1, w, 1, GOLD);
  lines.forEach((l, i) => text(l, x + Math.round((w - textW(l)) / 2), y + 3 + i * 8, GOLD));
}

function drawCard(c, x, y, w, h, i, tall) {

  panel(x, y, w, h, border);

  const tagCol = c.isNew || c.kind === "evo" ? GOLD : DIM;
  if (tall) {
    if (tag) text(tag, x + Math.round((w - textW(tag)) / 2), y + 4, tagCol);
    drawIcon(c.icon, x + w / 2, y + 22, 2);
    const tl = wrap(c.title, Math.floor((w - 6) / 4));
    tl.forEach((l, j) => text(l, x + Math.round((w - textW(l)) / 2), y + 36 + j * 7, WHITE));
    wrap(c.desc, Math.floor((w - 6) / 4)).slice(0, 5).forEach((l, j) => text(l, x + Math.round((w - textW(l)) / 2), y + 38 + tl.length * 7 + j * 7, PALE));
  } else {

    wrap(c.desc, cw).slice(0, 4).forEach((l, j) => text(l, tx, y + 16 + j * 8, PALE));

function drawCards(cards, y0) {

  const w = 88, gap = 8, x0 = Math.round((W - (n * w + (n - 1) * gap)) / 2);

}

      [196, 294, 392].forEach(f => tone(f, 0.35, "sawtooth", 0.07, null)); [392, 587, 784].forEach(f => tone(f, 0.45, "square", 0.04, null, 0.12));
      noise(0.5, 0.2, 5000, 0.12, 1.5);
      break;
    case "heart": tone(58, 0.11, "sine", 0.35, 45); tone(52, 0.13, "sine", 0.28, 40, 0.15); break;
    case "burp": tone(110 + Math.random() * 30, 0.32, "sawtooth", 0.08, 60); noise(0.25, 0.12, 300, 0.02, 1); break;
    // stingers: short scored moments over a ducked music track
    case "bossintro":
      music.duck(2.3);
      tone(55, 1.2, "sawtooth", 0.14, 40); tone(82.4, 1.2, "sawtooth", 0.09, 60); noise(0.8, 0.3, 200, 0, 0.5);
      tone(58.3, 1.0, "sawtooth", 0.14, 42, 0.45); tone(87.3, 1.0, "square", 0.05, null, 0.45); noise(0.5, 0.25, 250, 0.45, 0.5);
      tone(110, 1.0, "square", 0.04, 220, 0.9); tone(165, 1.0, "square", 0.03, 330, 0.9);
      tone(49, 0.9, "sawtooth", 0.16, 30, 1.6); noise(0.7, 0.35, 300, 1.6, 0.5);
      break;
    case "ministing":
      music.duck(1.1);
      tone(98, 0.3, "sawtooth", 0.12, null); tone(92.5, 0.55, "sawtooth", 0.13, 70, 0.18); tone(185, 0.5, "square", 0.04, null, 0.18); noise(0.4, 0.25, 300, 0.18, 0.6);
      break;
    case "evo":
      music.duck(1.7);
      [262, 330, 392, 494, 523, 659, 784, 988].forEach((f, i) => { tone(f, 0.16, "triangle", 0.08, null, i * 0.06); tone(f * 2, 0.08, "square", 0.02, null, i * 0.06); });
      [523, 659, 784, 988].forEach(f => tone(f, 0.9, "triangle", 0.05, null, 0.55));
      noise(0.8, 0.12, 6000, 0.5, 2);
      break;
    case "fanfare":
      music.duck(3.3);
      [[392, 0, 0.12], [392, 0.14, 0.12], [392, 0.28, 0.12], [523, 0.42, 0.5], [466, 0.98, 0.22], [523, 1.24, 0.22], [587, 1.5, 0.22], [659, 1.76, 1.1]]
        .forEach(([f, d, l]) => { tone(f, l, "square", 0.08, null, d); tone(f / 2, l, "triangle", 0.1, null, d); });
      [523, 659, 784].forEach(f => tone(f, 1.2, "triangle", 0.06, null, 1.76));
      noise(1.2, 0.15, 5000, 1.76, 1.5);
      break;
  }
};
sfxThrottled = (name, gap) => {
  const now = performance.now();
  if (now - (lastSfx[name] || 0) < gap * 1000) return;
  lastSfx[name] = now; sfx(name);
};
buzz = ms => { if (!MUTED && navigator.vibrate) try { navigator.vibrate(ms); } catch (e) { } };

// ---------------------------------------------------------------- music: tiny 3-track sequencer per chapter
const SONGS = [
  { bpm: 132, bass: [45, 0, 45, 0, 48, 0, 50, 0, 45, 0, 45, 0, 52, 0, 50, 48], lead: [69, 72, 76, 72, 69, 72, 77, 76, 69, 72, 76, 79, 77, 76, 72, 69] },
  { bpm: 116, bass: [40, 0, 40, 0, 43, 0, 47, 0, 38, 0, 38, 0, 42, 0, 45, 43], lead: [64, 67, 71, 74, 76, 0, 71, 67, 62, 66, 69, 74, 72, 0, 69, 67] },
  { bpm: 140, bass: [38, 0, 50, 0, 38, 0, 48, 0, 41, 0, 53, 0, 43, 0, 55, 0], lead: [74, 0, 72, 74, 77, 0, 76, 74, 72, 0, 69, 72, 74, 0, 72, 69] },
  { bpm: 110, bass: [36, 0, 36, 0, 39, 0, 43, 0, 34, 0, 34, 0, 38, 0, 41, 39], lead: [72, 0, 75, 0, 79, 78, 75, 0, 70, 0, 74, 0, 77, 75, 74, 0] },
  { bpm: 150, bass: [40, 40, 0, 40, 41, 0, 40, 0, 43, 43, 0, 43, 41, 0, 40, 0], lead: [76, 77, 76, 0, 79, 77, 76, 74, 76, 0, 72, 74, 76, 0, 77, 0] },
  { bpm: 128, bass: [40, 0, 41, 0, 40, 0, 43, 0, 40, 0, 41, 0, 44, 0, 43, 41], lead: [76, 77, 80, 77, 76, 0, 73, 76, 77, 80, 82, 80, 77, 76, 73, 72] },
];
const midi = n => 440 * Math.pow(2, (n - 69) / 12);
music = {
  song: null, boss: false, step: 0, next: 0, timer: null, paused: false, gain: null,
  play(i, boss) {
    this.song = SONGS[i % SONGS.length]; this.boss = boss; this.step = 0; this.paused = false;
    if (!audio) return;
    if (!this.gain) { this.gain = audio.createGain(); this.gain.gain.value = 0.55; this.gain.connect(masterGain); }
    this.next = audio.currentTime + 0.05;
    if (!this.timer) this.timer = setInterval(() => this.tick(), 30);
  },
  stop() { this.song = null; },
  duck(sec) {
    if (!audio || !this.gain) return;
    const g = this.gain.gain, t = audio.currentTime;
    g.cancelScheduledValues(t); g.setValueAtTime(g.value, t);
    g.linearRampToValueAtTime(0.12, t + 0.06); g.setValueAtTime(0.12, t + sec); g.linearRampToValueAtTime(0.55, t + sec + 0.5);
  },
  pause(p) { this.paused = p; },
  tick() {
    if (!audio || !this.song || this.paused || MUTED) { if (audio) this.next = audio.currentTime + 0.05; return; }
    const S = this.song, spb = 60 / (S.bpm * (this.boss ? 1.15 : 1)) / 2;
    while (this.next < audio.currentTime + 0.12) {
      const i = this.step % 16, d = this.next - audio.currentTime;
      if (S.bass[i]) tone(midi(S.bass[i]), spb * 0.9, "triangle", 0.09, null, d, this.gain);
      if (S.lead[i] && (this.step % 32 >= 16 || this.boss || i % 2 === 0)) tone(midi(S.lead[i] + (this.boss && this.step % 64 >= 32 ? 12 : 0)), spb * 0.6, "square", 0.028, null, d, this.gain);
      if (i % 4 === 0 || (this.boss && i % 2 === 0)) tone(120, 0.12, "sine", 0.14, 40, d, this.gain);
      if (i % 2 === 1) noise(0.03, 0.035, 7000, d, 1, this.gain);
      this.step++; this.next += spb;
    }
  },
};


// ---------------------------------------------------------------- title scene
function goTitle() {
  newRun({ god: Q.has("god"), opts: OPTS });
  prepChapter(0);
  G.mode = "title";
  P.x = AW / 2; P.y = AH / 2 + 10;
  for (let i = 0; i < 6; i++) { const e = spawnEnemy("goblin", P.x + Math.cos(i) * 90, P.y + Math.sin(i) * 55); e.spd = 6; }
  music.play(0, false);
}
function titleTick(dt) {
  G.t += dt; G.clock += dt; titleT += dt;
  P.ang += dt * 3.4; P.walkT += dt * 3; P.moving = false;
  for (const e of G.enemies) {
    const a = Math.atan2(P.y - e.y, P.x - e.x) + 1.2;
    e.x += Math.cos(a) * 10 * dt; e.y += Math.sin(a) * 7 * dt; e.walkT += dt * 3; e.face = Math.cos(a) > 0 ? 1 : -1;
  }
}

// ---------------------------------------------------------------- loop
function present() {
  octx.putImageData(frameImg, 0, 0);
  const s = Math.min(innerWidth / W, innerHeight / H), k = s >= 2 ? Math.floor(s) : s;
  const cw = Math.round(W * k), ch = Math.round(H * k);
  if (screenCv.width !== cw || screenCv.height !== ch) { screenCv.width = cw; screenCv.height = ch; }
  sctx.imageSmoothingEnabled = false;
  sctx.drawImage(octx.canvas, 0, 0, cw, ch);
}
function loop(now) {
  const dt = Math.min(0.05, (now - (lastT || now)) / 1000) * SPEED;
  lastT = now;
  const m = G.mode;
  if (m === "title") {
    titleTick(dt);
    drawWorld();
    rectA(0, 0, W, H, hx("#0a0408"), 0.35);
    drawTitle(titleT, loadSave(), { won: UNLOCKS.won, dark: UNLOCKS.dark, hard: OPTS.hard, skin: OPTS.skin });
    if (BOTPLAY && titleT > 1) uiAction("new");
  } else {
    if (m === "play") {
      acc += dt;
      let n = 0;
      while (acc >= 1 / 60 && n++ < 8) { if (BOTPLAY) BOT.act(); update(1 / 60); acc -= 1 / 60; if (G.mode !== "play") { acc = 0; break; } }
    } else { acc = 0; G.clock += dt; }
    if (m === "intro") { G.introT = (G.introT || 0) + dt; if (G.introT > (BOTPLAY ? 1.5 : window.BH_AD_BUILD ? 3 : 60)) setMode("play"); }
    if (m === "victory" && !G.endCancel) {
      G.endT = (G.endT || 0) + dt;
      if (G.endT >= END_AUTO_OPEN && !G.endOpened) { G.endOpened = true; G.endCancel = true; autoOpenStore(); }
    }
    if (BOTPLAY && (m === "levelup" || m === "reward" || m === "clear" || m === "dead")) {
      botWait += dt;
      if (botWait > 0.6) { botWait = 0; if (m === "clear") nextChapter(); else if (m === "dead") retryChapter(); else chooseCard(BOT.choose(G.cards)); }
    }
    drawWorld();
    drawHUD();
    if (G.mode !== "play") drawScreen();
  }
  drawWipe(dt);
  present();
  requestAnimationFrame(loop);
}
function boot() {
  applyOrientation();
  if (window.BH_AD_BUILD && !BOTPLAY) newGame(0); else goTitle();   // an ad starts with gameplay, not a menu
  requestAnimationFrame(loop);
}
if (window.mraid && mraid.getState && mraid.getState() === "loading") mraid.addEventListener("ready", boot);
else boot();

</script>
