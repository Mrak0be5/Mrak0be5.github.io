<script>
// ---- src/world/22-hg-actors.js
// HUNGRY engine, part 3: the actors — the butcher (pose by T), the prey (placement, death, hook, flight,
// the bite), the chained weapons, the hooks and chains, the dragon's fire, and the eat effects.
// Prey bodies come from src/world/3N-prey-*.js (HG.prey.<id>); this file owns where and how big they are.
(function () {
  'use strict';
  const HG = (window.HG = window.HG || {});
  const BH = window.BH;
  const { clamp, lerp, sstep, seg } = HG;
  const TAU = Math.PI * 2;
  const E = BH.E;
  HG.prey = HG.prey || {};

  // ------------------------------------------------------------------ plans (metres; x right, z away from camera)
  // size: world size of the module's `units`; strike: where the weapon kills it; from: where the approach starts.
  const PLAN = {
    rat: { size: 0.36, strike: [0.95, -1.3], from: [2.4, -1.9], enter: 0.3, color: ['#6E6A8C', '#E02B38', '#F0A0B8'] },
    goblin: { size: 1.35, strike: [-1.35, -1.6], from: [-4.6, -2.4], enter: 0.9, color: ['#9A9A2E', '#E02B38', '#DCE4F4'] },
    knight: { size: 3.0, strike: [2.0, -2.1], from: [9, -3.2], enter: 2.3, color: ['#8E9CC2', '#E02B38', '#D8352B'] },
    bear: { size: 4.2, strike: [-3.0, -3.1], from: [-12, -4.5], enter: 3.9, color: ['#7E4A2E', '#E02B38', '#2B3350'] },
    golem: { size: 9.5, strike: [6.6, -2.4], from: [17, -2], enter: 5.3, color: ['#4A3F6B', '#F51F00', '#FF6621'] },
    dragon: { size: 26, strike: [-13, -7], y: 21, from: [-70, -25], fromY: 75, enter: 7.2, color: ['#B01A2A', '#FF8E00', '#2A0A10'] },
    tower: { size: 220, strike: [110, 260], from: null, enter: -1, color: ['#3A2E5A', '#6D5F99', '#5B3F33'] },
  };
  HG.PLAN = PLAN;

  // ------------------------------------------------------------------ hero pose
  function punch(t, t0, d) { return t < t0 ? 0 : Math.max(0, 1 - (t - t0) / d) * (t - t0 < 0.03 ? (t - t0) / 0.03 : 1); }
  HG.punch = punch;
  function throwArm(T, L) {
    // wind up over the 8th before the throw, snap out on the throw, hold out while the chain is taut, relax after
    if (L.hook == null) return null;
    const w = seg(T, L.hook - 0.18, L.hook), r = seg(T, L.hook, L.hook + 0.08), back = seg(T, L.chomp - 0.1, L.chomp + 0.25);
    if (T < L.hook - 0.18 || T > L.chomp + 0.3) return null;
    const up = [2.7, 0.55], out = [1.55, 0.05], rest = [0.3, -0.12];
    let a = [lerp(rest[0], up[0], E('power2.out', w)), lerp(rest[1], up[1], E('power2.out', w))];
    if (r > 0) a = [lerp(up[0], out[0], E('power3.out', r)), lerp(up[1], out[1], r)];
    // the yank: the arm hauls back toward the chest
    const y = seg(T, L.yank, L.yank + 0.15);
    if (y > 0) a = [lerp(a[0], 1.0, E('power2.out', y)), lerp(a[1], 1.1, y)];
    if (back > 0) a = [lerp(a[0], rest[0], E('power2.inOut', back)), lerp(a[1], rest[1], back)];
    return a;
  }
  HG.heroPose = function (T) {
    const L = HG.levelAt(T);
    let jaw = 0, puff = 0, gulp = 0, eyes = 1.05, sq = 0, blood = 0, fat = 0;
    for (const l of HG.LEVELS) {
      // jaw opens as the meal arrives, snaps on the chomp, two chews after
      if (l.chomp != null) {
        const open = seg(T, l.chomp - 0.28, l.chomp - 0.04);
        const shut = seg(T, l.chomp - 0.04, l.chomp + 0.02);
        const j = open * (1 - shut) * (l.id === 'moon' ? 1.6 : 1.25);
        const chew = T > l.chomp ? Math.max(0, Math.sin((T - l.chomp) * 22)) * 0.55 * (1 - seg(T, l.chomp, l.chomp + 0.5)) : 0;
        jaw = Math.max(jaw, j, chew);
        puff = Math.max(puff, punch(T, l.chomp, 0.45) * 0.9);
        sq = Math.max(sq, punch(T, l.chomp, 0.2) * 0.35);
        eyes = Math.max(eyes, 1.05 + punch(T, l.chomp, 0.35) * 0.6 + punch(T, l.hook || l.chomp, 0.25) * 0.4);
        gulp = Math.max(gulp, BH.pulse(T, l.gulp, 0.08, 0.3));
        fat = Math.max(fat, BH.pulse(T, l.gulp + 0.02, 0.1, 0.5) * 0.7);
      }
      if (T > l.chomp) blood = Math.min(1, blood + 0.22);
    }
    // eyes: the opening glow-up, the moon stare, the stare into the lens
    eyes = Math.max(eyes, 1.0 + punch(T, 0.36, 0.5) * 0.9, 1.2 + punch(T, 18.8, 0.8) * 1.0);
    if (T > 23.6) eyes = Math.max(eyes, 1.6 + punch(T, 23.6, 0.6) * 0.8);
    const blink = T > 0.16 && T < 0.3 ? 0 : 1;               // one blink in the macro opening
    let look = [0, 0];
    if (L.side != null && L.id !== 'moon') look = [lerp(0, L.side * 7, sstep(L.S - 0.2, L.S + 0.1, T)), 0];
    if (T > 18.8 && T < 22.4) look = [6, -6];
    if (T > 24.2) look = [0, 2 * sstep(24.2, 24.6, T)];
    const arm = throwArm(T, L);
    const p = { t: T, breath: 1, jaw, puff, sq, eyes: eyes * blink, look, blood, gulp, fat, rim: '#FF6A5A', detail: null };
    // screen-right prey → the screen-right arm (armL in the rig), else armR
    if (arm) { if (L.side > 0) p.armL = arm; else p.armR = arm; }
    // burp (23.2): chest heave + jaw pop
    const bp = punch(T, 23.2, 0.5);
    if (bp > 0) { p.jaw = Math.max(p.jaw, bp * 1.3); p.puff = Math.max(p.puff, bp); p.sq = Math.max(p.sq, bp * 0.3); }
    // the lens throw (24.8): the arm again, straight at camera
    if (T > 24.4 && T < 25.2) { const u = seg(T, 24.45, 24.8); p.armL = [lerp(0.3, 2.6, E('power2.out', u)), lerp(-0.1, 0.5, u)]; if (T > 24.8) p.armL = [lerp(2.6, 0.9, E('power3.out', seg(T, 24.8, 24.9))), 0.2]; }
    return p;
  };

  // Hero screen transform: feet at the world origin; scale from the depth of the body centre.
  HG.heroXf = function (cam) {
    const feet = HG.project(cam, [0, 0, 0]);
    const mid = HG.toCam(cam, [0, 0.5 * cam.g, 0]);
    const s = (cam.F / mid[2]) * (cam.g / HG.RIG);
    return { x: feet[0], y: feet[1], s, depth: mid[2] };
  };

  // ------------------------------------------------------------------ prey state
  // Returns null when not on screen yet / already eaten. {pos (world pivot), phase, u, face, rot, k (size mul), flash}
  function preyWorld(id, T) {
    const L = HG.level(id), P = PLAN[id], M = HG.prey[id];
    if (!L || !P) return null;
    if (T >= L.chomp) return null;
    const units = M ? M.units : 500, mpu = P.size / units;
    const pv = M && M.pivot ? M.pivot : [0, -units * 0.45];
    const face = P.strike[0] > 0 ? -1 : 1;           // face the hero
    const baseY = P.y || 0;
    let feet, phase = 'alive', u = 0, rot = 0, k = 1, flash = 0, fire = 0;
    const strike = HG.ground(P.strike[0], P.strike[1], baseY);
    const hitT = L.hit == null ? L.bite : L.hit;
    if (T < hitT) {
      if (P.enter < 0) { feet = strike; u = 0.5; }
      else {
        const a = seg(T, P.enter, hitT - 0.05);
        const from = HG.ground(P.from[0], P.from[1], P.fromY != null ? P.fromY : baseY);
        const e = id === 'dragon' ? E('power2.out', a) : a;
        feet = [lerp(from[0], strike[0], e), lerp(from[1], strike[1], e) + (id === 'dragon' ? Math.sin(a * Math.PI) * 25 : 0), lerp(from[2], strike[2], e)];
        u = a;
        if (T < P.enter) return null;
      }
      if (id === 'dragon' && L.fire != null) fire = seg(T, L.fire - 0.1, L.fire + 0.1) * (1 - seg(T, hitT - 0.35, hitT - 0.1));
    } else if (T < L.bite) {
      phase = 'dead'; u = seg(T, hitT, hitT + 0.35);
      const kb = E('power3.out', seg(T, hitT, hitT + 0.12)) * P.size * 0.12 * -face;
      feet = [strike[0] + kb, strike[1] + (id === 'dragon' ? -u * P.size * 0.2 : 0), strike[2]];
      rot = -face * 0.52 * E('power3.out', u);
      flash = 1 - seg(T, hitT, hitT + 0.15);
    } else if (T < L.yank + 0.02) {
      phase = 'hooked'; u = seg(T, L.bite, L.yank + 0.02);
      const kb = P.size * 0.12 * -face;
      feet = [strike[0] + kb * (1 - u * 0.5), strike[1] - (id === 'dragon' ? P.size * 0.2 : 0), strike[2]];
      rot = -face * 0.52;
      if (L.hit == null) flash = 1 - seg(T, L.bite, L.bite + 0.12);
    } else {
      phase = 'flying';
      u = seg(T, L.yank + 0.02, L.chomp);
      const g = HG.g(T);
      const mouth = [0, 0.6 * g, -0.12 * g];
      const kb = P.size * 0.06 * -face;
      const s0 = [strike[0] + kb, strike[1] + pv[1] * -mpu - (id === 'dragon' ? P.size * 0.2 : 0), strike[2]];
      const e = E('power2.in', u);
      const apex = Math.max(s0[1], mouth[1]) + g * 0.35 * Math.sin(u * Math.PI);
      const pos = [lerp(s0[0], mouth[0], e), lerp(s0[1], mouth[1], e) + (apex - Math.max(s0[1], mouth[1])) * (1 - e) , lerp(s0[2], mouth[2], e)];
      rot = -face * (0.52 + u * 2.2);
      // shrink toward ~0.55 of the hero's height at the mouth (big meals are squeezed in, cartoon-style)
      const want = Math.min(1, (0.55 * g) / P.size);
      k = lerp(1, want, E('power2.in', u));
      return { pos, phase, u, face, rot, k, flash, fire, pivotWorld: true, mpu, pv };
    }
    // pivot world position = feet + pivot offset (units → metres, up)
    const pos = [feet[0], feet[1] + -pv[1] * mpu, feet[2]];
    return { pos, phase, u, face, rot, k, flash, fire, mpu, pv };
  }
  HG.preyWorld = preyWorld;

  // Draw one prey billboard at its world pivot. Returns screen anchors {hook, mouth, pivot, s}.
  function drawPrey(ctx, cam, id, st, T) {
    const M = HG.prey[id];
    const q = HG.toCam(cam, st.pos);
    if (q[2] <= cam.d * 0.02) return null;
    const c = HG.camToScreen(cam, q);
    const s = (cam.F / q[2]) * st.mpu * st.k;           // px per unit
    const pv = st.pv;
    const M2 = (x, y) => {                              // unit point → screen
      const lx = (x - pv[0]) * st.face, ly = y - pv[1], cr = Math.cos(st.rot), sr = Math.sin(st.rot);
      return [c[0] + (lx * cr - ly * sr) * s, c[1] + (lx * sr + ly * cr) * s];
    };
    const hook = M && M.hook ? M.hook : [0, -0.6 * (M ? M.units : 500)];
    const out = { hook: M2(hook[0], hook[1]), pivot: [c[0], c[1]], s, mouth: M && M.mouth ? M2(M.mouth[0], M.mouth[1]) : null };
    if (s * (M ? M.units : 500) < 1.2) return out;
    const lwK = BH.lwK;
    BH.lwK = clamp(1.15 * Math.pow(s, -0.62), 0.02, 40) / Math.max(1e-6, 1);
    BH.lwK = Math.min(BH.lwK, 1.6 / Math.max(s, 1e-6));
    BH.lwK = Math.max(BH.lwK, 0.9 / Math.max(s, 1e-6));
    const draw = () => {
      ctx.save();
      ctx.translate(c[0], c[1]);
      ctx.rotate(st.rot);
      ctx.scale(s * st.face, s);
      ctx.translate(-pv[0], -pv[1]);
      if (id === 'golem') {
        BH.golem(ctx, 0, 0, M ? 1 : 1, { t: T, facing: 0.35, pitch: 0.12, dead: st.phase !== 'alive' ? 1 : 0, jaw: st.phase === 'alive' ? 0.3 + 0.3 * Math.sin(T * 6) : 0.8,
          eyes: st.phase === 'alive' ? 1 : 0.2, breath: 1, lean: st.phase === 'alive' ? 0.1 * st.u : 0, crouch: st.phase === 'flying' ? 0.4 : 0 });
      } else if (M) {
        M.draw(ctx, { T, phase: st.phase, u: st.u, px: s, fire: st.fire });
      }
      ctx.restore();
    };
    draw();
    if (st.flash > 0) BH.flashPass(ctx, st.flash, '#FFFFFF', draw);
    BH.lwK = lwK;
    return out;
  }
  // golem module shim (uses the approved lava-golem rig from the first reel)
  HG.prey.golem = HG.prey.golem || { units: 1000, hook: [30, -820], pivot: [0, -480], draw() {} };

  // ------------------------------------------------------------------ hook, chains, weapons
  function chainStyle(sc) { return { pitch: clamp(26 * sc, 5, 60), lw: clamp(2.6 * sc, 1.2, 6) }; }
  function drawHook(ctx, x, y, ang, sc, hot) {
    const lwK = BH.lwK; BH.lwK = clamp(1 / Math.max(0.2, sc), 0.2, 3);
    BH.hook(ctx, x, y, ang, sc, { flip: 1, mat: hot ? { fill: '#FF8A3A', ramp: ['#A02A10', '#E0501A', '#FF8A3A', '#FFC060', '#FFF0B0'] } : null });
    if (hot) BH.glow(ctx, x, y, 90 * sc, '#FF8A20', 0.6 * hot);
    BH.lwK = lwK;
  }
  // The hook's ring sits at (x, y); its bite point is ~(84, 34)·s from the ring in hook space.
  function hookRingFor(tip, ang, sc) { const c = Math.cos(ang), s = Math.sin(ang); return [tip[0] - (84 * c - 34 * s) * sc * 0.9, tip[1] - (84 * s + 34 * c) * sc * 0.9]; }

  function chainTo(ctx, a, b, T, o) {
    const st = chainStyle(o.sc);
    const pts = BH.chainPts(a[0], a[1], b[0], b[1], { sag: (o.sag || 0), dance: o.dance || 0, waves: o.waves || 2.5, phase: T * 40 });
    BH.chain(ctx, pts, { pitch: st.pitch, lw: st.lw, body: '#2B3350', lit: '#6E7BA8', line: '#030407', to: o.to == null ? 1 : o.to, hot: o.hot, glow: o.glow });
    return pts;
  }

  // Weapon strike for a level: swings in from behind the shoulder, hits at L.hit, recoils out.
  function drawWeapon(ctx, cam, L, anchor, target, heroS, T) {
    if (L.hit == null || !L.weapon) return;
    const a0 = L.hit - 0.34, a1 = L.hit + 0.42;
    if (T < a0 || T > a1 || !target) return;
    const kind = L.weapon === 'cleaver' ? 'ice' : L.weapon;
    const u = seg(T, a0, L.hit), back = seg(T, L.hit + 0.08, a1);
    const sc = clamp(heroS * 0.85, 0.2, 30);
    // arc: up and over from the shoulder to the target
    const side = L.side;
    // wind up high and OUT to the prey's side (never across the face), then chop down onto the target
    const wind = [anchor[0] + side * 230 * heroS, anchor[1] - 330 * heroS];
    let head;
    if (back <= 0) {
      const e = E('power3.in', u);
      head = [lerp(wind[0], target[0], e) + side * Math.sin(e * Math.PI) * 90 * heroS, lerp(wind[1], target[1], e) - Math.sin(e * Math.PI) * 80 * heroS];
    } else {
      const e = E('power2.out', back);
      head = [lerp(target[0], anchor[0] + side * 260 * heroS, e), lerp(target[1], anchor[1] - 120 * heroS, e) - Math.sin(e * Math.PI) * 60 * heroS];
    }
    const ang = Math.atan2(head[1] - anchor[1], head[0] - anchor[0]);
    const ring = BH.gearRing(kind, head[0], head[1], ang, sc);
    const st = chainStyle(heroS);
    const alpha = 1 - sstep(0.7, 1, back);
    ctx.save();
    ctx.globalAlpha *= alpha;
    const lwK = BH.lwK; BH.lwK = clamp(1 / sc, 0.1, 5);
    const infl = punch(T, L.hit, 0.18) * 0.35;
    const res = BH.chainWeapon(ctx, anchor[0], anchor[1], ring[0], ring[1], { kind, s: sc, sag: 30 * heroS * (1 - u), pitch: st.pitch, lw: st.lw, infl, flash: punch(T, L.hit, 0.12), hot: kind === 'hammer' ? 1 : 0 });
    BH.lwK = lwK;
    if (kind === 'hammer' && T > L.hit - 0.05 && T < L.hit + 0.3 && res && res.pts) {
      BH.chainBolt(ctx, T, res.pts, 0, 1, 7, { w: 6 * clamp(heroS, 0.5, 3), jag: 16 * clamp(heroS, 0.5, 3), head: 40 * heroS });
    }
    ctx.restore();
    // impact
    if (T >= L.hit && T < L.hit + 0.25) {
      const p = seg(T, L.hit, L.hit + 0.25);
      BH.impactStar(ctx, target[0], target[1], 150 * heroS, 3 + L.S, p, { fill: '#FFF4D6' });
      BH.shockwave(ctx, target[0], target[1], p, { r: 260 * heroS, w: 14 * heroS, color: '#FFFFFF' });
      if (kind === 'hammer') BH.burst(ctx, T, { t0: L.hit, x: target[0], y: target[1], n: 20, seed: 9, speed: [500 * heroS, 1400 * heroS], size: [3 * heroS, 7 * heroS], color: '#FF3A1A', core: '#FFE080' });
      else BH.burst(ctx, T, { t0: L.hit, x: target[0], y: target[1], n: 16, seed: 5, speed: [400 * heroS, 1100 * heroS], size: [3 * heroS, 6 * heroS], color: kind === 'ice' ? '#7FE8FF' : kind === 'green' ? '#7CFF6A' : '#FFD34A', core: '#FFFFFF' });
    }
  }

  // Dragon fire: a thick, wavy cel flame ribbon from the dragon's mouth toward the hero's head.
  function drawFire(ctx, from, to, amt, T, heroS) {
    if (amt <= 0.01 || !from) return;
    const n = 26, pts = [];
    const reach = amt;
    for (let i = 0; i <= n; i++) {
      const u = (i / n) * reach;
      const x = lerp(from[0], to[0], u), y = lerp(from[1], to[1], u);
      const dx = to[0] - from[0], dy = to[1] - from[1], L = Math.hypot(dx, dy) || 1;
      const nx = -dy / L, ny = dx / L;
      const w = Math.sin(u * 9 - T * 26) * 12 * heroS * u;
      pts.push([x + nx * w, y + ny * w, lerp(8, 46, Math.sqrt(u)) * heroS]);
    }
    const layer = (col, k, a) => {
      ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = col;
      for (let i = 0; i < pts.length; i++) {
        const p = pts[i], j = BH.noise1(i * 0.7 - T * 18, 5) * 0.25 + 1;
        ctx.beginPath(); ctx.arc(p[0], p[1], p[2] * k * j, 0, TAU); ctx.fill();
      }
      ctx.restore();
    };
    ctx.save();
    layer('#3A0A08', 1.12, 0.55);
    layer('#FF3D1F', 1.0, 1);
    layer('#FF8E00', 0.72, 1);
    layer('#FFE36A', 0.42, 1);
    ctx.globalCompositeOperation = 'lighter';
    BH.glow(ctx, pts[n][0], pts[n][1], 160 * heroS, '#FF6A10', 0.5 * amt);
    ctx.globalCompositeOperation = 'source-over';
    // splash where it lands: a flat fan of flame licks
    if (amt > 0.95) for (let i = 0; i < 7; i++) {
      const a = -Math.PI / 2 + (i - 3) * 0.42, L = (40 + 30 * BH.noise1(T * 12 + i, 3)) * heroS, p = pts[n];
      ctx.fillStyle = i % 2 ? '#FF8E00' : '#FFE36A';
      ctx.beginPath(); ctx.moveTo(p[0] - 14 * heroS, p[1]); ctx.quadraticCurveTo(p[0] + Math.cos(a) * L * 0.6, p[1] + Math.sin(a) * L * 0.6 - 10 * heroS, p[0] + Math.cos(a) * L, p[1] + Math.sin(a) * L); ctx.lineTo(p[0] + 14 * heroS, p[1]); ctx.fill();
    }
    ctx.restore();
    BH.burst(ctx, T, { t0: 8.4, x: pts[n][0], y: pts[n][1], n: 24, seed: 44, kind: 'ember', speed: [200 * heroS, 600 * heroS], size: [2 * heroS, 5 * heroS], life: [0.3, 0.8], g: -300, delay: 0.7 });
  }

  // ------------------------------------------------------------------ eat effects at the mouth
  function chompFX(ctx, T, mouth, heroS) {
    for (const L of HG.LEVELS) {
      if (L.chomp == null || T < L.chomp || T > L.chomp + 1.0) continue;
      const P = PLAN[L.id], col = P ? P.color : ['#E02B38', '#E02B38', '#FFFFFF'];
      const a = T - L.chomp, big = L.id === 'moon' ? 1.3 : 1;
      if (a < 0.2) BH.impactStar(ctx, mouth[0], mouth[1], 170 * heroS * big, 11 + L.S, a / 0.2, { fill: '#FFF4D6' });
      BH.burst(ctx, T, { t0: L.chomp, x: mouth[0], y: mouth[1], n: 18, seed: 21 + L.S * 3, kind: 'blood', speed: [500 * heroS, 1500 * heroS], size: [5 * heroS, 12 * heroS], g: 2600 * heroS, dir: -Math.PI / 2, spread: 1.4, color: '#E02B38' });
      BH.burst(ctx, T, { t0: L.chomp, x: mouth[0], y: mouth[1], n: 14, seed: 31 + L.S * 3, kind: 'debris', speed: [600 * heroS, 1700 * heroS], size: [7 * heroS * big, 16 * heroS * big], g: 2400 * heroS, dir: -Math.PI / 2, spread: 1.6, color: col[0], color2: col[2], color3: col[1], life: [0.6, 1.0] });
    }
  }

  // ------------------------------------------------------------------ the frame's actor layer
  // Draws: tower + prey + hero + weapons + chains + hooks + fire + fx, depth-sorted. Returns hero anchors.
  HG.drawActors = function (ctx, cam, T) {
    const hx = HG.heroXf(cam);
    const L = HG.levelAt(T);
    const list = [];
    // prey billboards
    for (const id of ['rat', 'goblin', 'knight', 'bear', 'golem', 'dragon', 'tower']) {
      const st = preyWorld(id, T);
      if (!st) continue;
      const q = HG.toCam(cam, st.pos);
      if (q[2] <= 0) continue;
      let depth = q[2];
      if (st.phase === 'flying' && st.u > 0.35) depth = Math.min(depth, hx.depth * 0.98);
      list.push({ depth, kind: 'prey', id, st });
    }
    list.push({ depth: hx.depth, kind: 'hero' });
    list.sort((a, b) => b.depth - a.depth);
    let anchors = null;
    const preyA = {};
    for (const it of list) {
      if (it.kind === 'hero') {
        const lwK = BH.lwK;
        BH.lwK = clamp(1.2 * Math.pow(hx.s, -0.62), 0.01, 10);
        const pose = HG.heroPose(T);
        anchors = BH.butcher(ctx, hx.x, hx.y, hx.s, pose);
        BH.lwK = lwK;
      } else {
        preyA[it.id] = drawPrey(ctx, cam, it.id, it.st, T);
      }
    }
    HG._anchors = anchors; HG._preyA = preyA; HG._hx = hx;
    const hs = hx.s;
    // dragon fire
    const dr = preyWorld('dragon', T);
    if (dr && dr.fire > 0 && preyA.dragon) drawFire(ctx, preyA.dragon.mouth || preyA.dragon.pivot, [lerp(anchors.shoulderR[0], anchors.head[0], 0.3), anchors.shoulderR[1] - 30 * hs], dr.fire, T, hs);
    // weapons (kill first)
    for (const l of HG.LEVELS) {
      if (l.hit == null || T < l.hit - 0.35 || T > l.hit + 0.45) continue;
      const tgt = preyA[l.id] ? preyA[l.id].hook : null;
      const anchor = l.side > 0 ? anchors.shoulderL : anchors.shoulderR;
      drawWeapon(ctx, cam, l, anchor, tgt, hs, T);
    }
    // hooks for the creature levels
    for (const l of HG.LEVELS.slice(0, 7)) {
      if (T < l.hook || T >= l.chomp + 0.02) continue;
      const hand = l.side > 0 ? anchors.handL : anchors.handR;
      const pa = preyA[l.id];
      if (!pa) continue;
      const target = pa.hook;
      const fly = E('power4.out', seg(T, l.hook, l.bite));
      const tip = [lerp(hand[0], target[0], fly), lerp(hand[1], target[1], fly) - Math.sin(fly * Math.PI) * 60 * hs];
      const slack = 1 - seg(T, l.yank - 0.02, l.yank + 0.08);
      const ang = Math.atan2(tip[1] - hand[1], tip[0] - hand[0]);
      const ring = hookRingFor(tip, ang, hs);
      const hot = l.id === 'dragon' ? sstep(9.35, 9.5, T) * (1 - seg(T, 9.9, 10.3)) : 0;
      chainTo(ctx, hand, ring, T, { sc: hs, sag: 60 * hs * slack, dance: 40 * hs * slack * (T < l.bite ? 1 : 0.4), hot: hot });
      drawHook(ctx, ring[0], ring[1], ang, hs, hot);
      if (T >= l.bite && T < l.bite + 0.25) BH.splat(ctx, target[0], target[1], 22 * hs, 40 + l.S, { grow: seg(T, l.bite, l.bite + 0.06) });
    }
    chompFX(ctx, T, anchors.mouth, hs);
    return anchors;
  };
})();

</script>
<script>
// ---- src/world/23-hg-big.js
// HUNGRY engine, part 4: the big meals — the neighbour island (lasso), the archipelago (five chains, islands
// going dark one by one), the red moon (hook across space, yank, bite, crescent back to the sky), the burp and
// the hook thrown at the lens.
(function () {
  'use strict';
  const HG = (window.HG = window.HG || {});
  const BH = window.BH;
  const { clamp, lerp, sstep, seg } = HG;
  const TAU = Math.PI * 2;
  const E = BH.E;
  const punch = (t, t0, d) => HG.punch(t, t0, d);

  const mouthW = (T) => { const g = HG.g(T); return [0, 0.6 * g, -0.12 * g]; };

  function chain(ctx, a, b, T, sc, o) {
    o = o || {};
    const pts = BH.chainPts(a[0], a[1], b[0], b[1], { sag: o.sag || 0, dance: o.dance || 0, waves: o.waves || 2.5, phase: T * 40 });
    BH.chain(ctx, o.pts || pts, { pitch: clamp(26 * sc, 5, 60), lw: clamp(2.6 * sc, 1.2, 6), body: '#2B3350', lit: '#6E7BA8', line: '#030407', to: o.to == null ? 1 : o.to, hot: o.hot });
  }
  function hook(ctx, x, y, ang, sc) {
    const k = BH.lwK; BH.lwK = clamp(1 / Math.max(0.2, sc), 0.2, 3);
    BH.hook(ctx, x, y, ang, sc, { flip: 1 });
    BH.lwK = k;
  }

  // ------------------------------------------------------------------ neighbour island (shot 08)
  const NB = () => HG.NEIGHBOUR;
  const IL = () => HG.level('island');
  function neighbourState(T) {
    const L = IL(), I = NB();
    if (T >= L.chomp) return null;
    const home = HG.ground(I.cx, I.cz);
    if (T < L.yank) return { pos: home, lift: 0, tilt: 0, lights: 1, T };
    const up = seg(T, L.yank, L.yank + 0.4), fly = seg(T, L.yank + 0.4, L.chomp);
    const g = HG.g(T), m = mouthW(T);
    const lifted = [home[0], home[1] + E('power2.out', up) * 0.9 * g, home[2]];
    const e = E('power2.in', fly);
    const want = (0.5 * g) / (2 * I.R);
    return {
      pos: [lerp(lifted[0], m[0] - 0.25 * g, e), lerp(lifted[1], m[1], e), lerp(lifted[2], m[2], e)],
      lift: up, tilt: lerp(0, -0.9, up) - e * 0.6, spin: e * 1.2, waterfalls: up * (1 - e * 0.5), lights: 1,
      scale: lerp(1, want, E('power2.in', fly)), T,
    };
  }
  HG.neighbourState = neighbourState;
  // layer: 'ground' (sitting in the sea) or 'air' (lifted, in front of the hero)
  HG.drawNeighbour = function (ctx, cam, T, layer) {
    const st = neighbourState(T);
    if (!st) return;
    const L = IL();
    const air = T >= L.yank;
    if ((layer === 'air') !== air) return;
    const box = HG.drawIsland(ctx, cam, NB(), st);
    HG._nbBox = box;
    if (layer === 'ground' && T >= L.yank - 0.8 && T < L.yank) {
      // the sea bulges and churns around the coast as the lasso cinches
      const k = seg(T, L.yank - 0.8, L.yank);
      if (box && box.top) {
        ctx.save(); ctx.globalAlpha = 0.5 * k; ctx.strokeStyle = '#BFEFFF'; ctx.lineWidth = 3;
        ctx.stroke(HG.pathOf(box.top)); ctx.restore();
      }
    }
  };
  // The lasso: hook flies to the far shore, then the chain runs round the coast (draw-on), cinches, hauls.
  function drawLasso(ctx, cam, T, A, hs) {
    const L = IL(), I = NB();
    if (T < L.hook || T >= L.chomp) return;
    const st = neighbourState(T);
    const hand = A.handR;
    const lassoU = seg(T, L.hook + 0.2, L.bite);
    // coast ring in world (slightly outside the rim, a little above the sea)
    const ring = [];
    const n = 40, sc = st.scale == null ? 1 : st.scale;
    const cs = Math.cos(st.spin || 0), ss = Math.sin(st.spin || 0), ct = Math.cos(st.tilt || 0), stl = Math.sin(st.tilt || 0);
    for (let i = 0; i <= n; i++) {
      const p = I.shape[Math.floor((i / n) * I.shape.length) % I.shape.length];
      const cinch = T >= L.bite ? 0.96 : 1.04;
      let x = p[0] * I.R * cinch, z = p[1] * I.R * cinch, y = I.R * 0.01;
      const x2 = x * cs - z * ss, z2 = x * ss + z * cs;
      const y2 = y * ct - z2 * stl, z3 = y * stl + z2 * ct;
      ring.push(HG.project(cam, [st.pos[0] + x2 * sc, st.pos[1] + y2 * sc, st.pos[2] + z3 * sc]));
    }
    // start of the loop: the ring point nearest the hero, rotate the list so the chain wraps from there
    let best = 0, bd = 1e18;
    for (let i = 0; i < ring.length; i++) { const d = Math.hypot(ring[i][0] - hand[0], ring[i][1] - hand[1]); if (d < bd) { bd = d; best = i; } }
    const loop = ring.slice(best).concat(ring.slice(0, best + 1)).map((p) => [p[0], p[1]]);
    const fly = E('power4.out', seg(T, L.hook, L.hook + 0.2));
    if (T < L.hook + 0.2) {
      const tip = [lerp(hand[0], loop[0][0], fly), lerp(hand[1], loop[0][1], fly) - Math.sin(fly * Math.PI) * 120 * hs];
      chain(ctx, hand, tip, T, hs, { sag: 60 * hs, dance: 40 * hs });
      hook(ctx, tip[0], tip[1], Math.atan2(tip[1] - hand[1], tip[0] - hand[0]), hs);
      return;
    }
    // lead chain hand → loop start
    const slack = 1 - seg(T, L.bite, L.bite + 0.1);
    chain(ctx, hand, loop[0], T, hs, { sag: 70 * hs * slack, dance: 30 * hs * slack });
    // the loop, drawn on
    const cut = Math.max(2, Math.round(loop.length * lassoU));
    const lp = loop.slice(0, cut);
    BH.chain(ctx, lp, { pitch: clamp(20 * hs, 4, 40), lw: clamp(2.2 * hs, 1, 5), body: '#2B3350', lit: '#6E7BA8', line: '#030407' });
    const tip = lp[lp.length - 1], prev = lp[Math.max(0, lp.length - 2)];
    if (lassoU < 1) hook(ctx, tip[0], tip[1], Math.atan2(tip[1] - prev[1], tip[0] - prev[0]), hs * 0.8);
    if (T >= L.bite && T < L.bite + 0.3) {
      const p = seg(T, L.bite, L.bite + 0.3);
      BH.shockwave(ctx, loop[0][0], loop[0][1], p, { r: 300 * hs, w: 10 * hs, color: '#BFEFFF' });
    }
  }

  // ------------------------------------------------------------------ archipelago (shot 09)
  const AL = () => HG.level('archipelago');
  function archiTimes(I) {
    const k = I.order, w = Math.floor(k / 5), j = k % 5;
    const hook = 16.4 + w * 0.4 + (w === 3 ? 0 : 0), bite = hook + 0.16, yank = hook + 0.22 + j * 0.035, chomp = yank + 0.2;
    return { hook, bite, yank, chomp, j };
  }
  HG.archiTimes = archiTimes;
  function archiState(I, T) {
    const t = archiTimes(I);
    if (T >= t.chomp) return null;
    const home = HG.ground(I.cx, I.cz);
    const lights = 1 - seg(T, t.bite, t.bite + 0.12);
    if (T < t.yank) return { pos: home, lift: 0, lights, T, t };
    const u = seg(T, t.yank, t.chomp), e = E('power2.in', u), g = HG.g(T), m = mouthW(T);
    const want = (0.35 * g) / (2 * I.R);
    return { pos: [lerp(home[0], m[0], e), lerp(home[1], m[1], e) + Math.sin(u * Math.PI) * 0.3 * g, lerp(home[2], m[2], e)],
      lift: Math.min(1, u * 3), tilt: -u * 1.1, spin: u * 2, lights: 0, scale: lerp(1, want, e), T, t };
  }
  HG.drawArchipelago = function (ctx, cam, T, layer) {
    if (T < 12.5 || T > 18.8) return;
    for (const I of HG.ARCHI) {
      const st = archiState(I, T);
      if (!st) continue;
      const air = T >= st.t.yank;
      if ((layer === 'air') !== air) continue;
      HG.drawIsland(ctx, cam, I, st);
    }
  };
  function drawArchiHooks(ctx, cam, T, A, hs) {
    if (T < 16.4 || T > 18.2) return;
    const hands = [A.handL, A.handR, A.shoulderL, A.shoulderR, A.top || A.head];
    for (const I of HG.ARCHI) {
      const t = archiTimes(I);
      if (T < t.hook || T >= t.chomp) continue;
      const st = archiState(I, T);
      const home = HG.project(cam, HG.ground(I.cx, I.cz));
      let from = hands[0], bd = 1e18;       // the chain leaves from the anchor nearest the island: no chains across the body
      for (const h of hands) { if (!h) continue; const d = Math.hypot(h[0] - home[0], h[1] - home[1]); if (d < bd) { bd = d; from = h; } }
      const c = HG.project(cam, st.pos);
      const fly = E('power4.out', seg(T, t.hook, t.bite));
      const tip = [lerp(from[0], c[0], fly), lerp(from[1], c[1], fly) - Math.sin(fly * Math.PI) * 90 * hs];
      const slack = 1 - seg(T, t.bite, t.yank);
      chain(ctx, from, tip, T + t.j, hs * 0.7, { sag: 50 * hs * slack, dance: 30 * hs * slack });
      hook(ctx, tip[0], tip[1], Math.atan2(tip[1] - from[1], tip[0] - from[0]), hs * 0.7);
      if (T >= t.bite && T < t.bite + 0.2) BH.impactStar(ctx, c[0], c[1], 30 * hs, 5 + t.j, seg(T, t.bite, t.bite + 0.2), { fill: '#FFF4D6' });
    }
  }
  HG.archiEaten = (T) => HG.ARCHI.filter((I) => T >= archiTimes(I).chomp).length;

  // ------------------------------------------------------------------ the moon (shot 10)
  HG.moonState = function (T) {
    const M = HG.MOON, L = HG.level('moon');
    const home = M.home;
    let bite = 0;
    if (T >= L.chomp) bite = E('power3.out', seg(T, L.chomp, L.chomp + 0.1));
    if (T < L.yank) return { pos: home, bite: 0, near: false, rot: 0 };
    // Cartoon squeeze: like every meal, it arrives at ~the hero's height (real: 2.3× bigger).
    const gb = HG.g(L.chomp - 0.01), m = mouthW(L.chomp - 0.01);
    const want = (1.0 * gb) / (2 * M.R);
    const near = [m[0] + M.R * want * 0.92, m[1] + M.R * want * 0.12, m[2] - M.R * want * 0.3];
    if (T < L.chomp + 0.5) {
      const u = seg(T, L.yank, L.chomp - 0.06), e = E('power3.in', u);
      const pos = [lerp(home[0], near[0], e), lerp(home[1], near[1], e), lerp(home[2], near[2], e)];
      return { pos, bite, near: u > 0.05, rot: -0.35 * u, scale: lerp(1, want, E('power2.in', u)) };
    }
    // tossed back to its place in the sky
    const u = seg(T, L.chomp + 0.8, L.chomp + 1.6), e = E('power3.out', u);
    const pos = [lerp(near[0], home[0], e), lerp(near[1], home[1], e), lerp(near[2], home[2], e)];
    return { pos, bite, near: u < 0.9, rot: lerp(-0.35, -0.5, e), scale: lerp(want, 1, e) };
  };
  function drawMoonHook(ctx, cam, T, A, hs, moon) {
    const L = HG.level('moon');
    if (T < L.hook || T >= L.chomp) return;
    const hand = A.handL;
    const mq = HG.toCam(cam, moon.pos);
    const ms = HG.camToScreen(cam, mq), mr = (cam.F * HG.MOON.R * (moon.scale || 1)) / mq[2];
    const bitePt = [ms[0] - mr * 0.85, ms[1] + mr * 0.1];
    const fly = E('power3.out', seg(T, L.hook, L.bite));
    const tip = [lerp(hand[0], bitePt[0], fly), lerp(hand[1], bitePt[1], fly) - Math.sin(fly * Math.PI) * 260 * hs];
    const slack = 1 - seg(T, L.bite + 0.2, L.yank);
    const twang = T > L.yank ? Math.sin((T - L.yank) * 60) * 14 * hs * Math.max(0, 1 - (T - L.yank) / 0.4) : 0;
    chain(ctx, hand, tip, T, hs, { sag: 120 * hs * slack, dance: 60 * hs * slack + twang });
    hook(ctx, tip[0], tip[1], Math.atan2(tip[1] - hand[1], tip[0] - hand[0]), hs * 1.1);
    if (T >= L.bite && T < L.bite + 0.6) {
      BH.burst(ctx, T, { t0: L.bite, x: bitePt[0], y: bitePt[1], n: 22, seed: 77, kind: 'debris', speed: [80, 320], size: [3, 8], g: 0, color: '#8A1020', color2: '#5A0810', color3: '#E0402A', life: [0.5, 1] });
      BH.impactStar(ctx, bitePt[0], bitePt[1], 70 * hs, 9, seg(T, L.bite, L.bite + 0.2), { fill: '#FFE0C0' });
    }
  }

  // ------------------------------------------------------------------ burp (23.2) and the lens throw (24.8 → 25.2)
  HG.burpShake = (T) => (T > 23.2 && T < 24.2 ? Math.pow(1 - (T - 23.2), 2) : 0);
  function drawBurp(ctx, T, A, hs) {
    if (T < 23.2 || T > 24.4) return;
    const m = A.mouth;
    for (let i = 0; i < 3; i++) {
      const p = seg(T, 23.2 + i * 0.1, 24.1 + i * 0.1);
      if (p > 0 && p < 1) BH.shockwave(ctx, m[0], m[1], p, { r: 1300 * (0.6 + i * 0.3), w: 26 - i * 6, color: i ? '#FFD0B0' : '#FFFFFF', sq: 0.6 });
    }
    BH.burst(ctx, T, { t0: 23.2, x: m[0], y: m[1], n: 16, seed: 91, kind: 'debris', speed: [300, 900], size: [5, 12], g: 0, k: 1.2, color: '#8A1020', color2: '#5A0810', color3: '#E0402A', life: [0.8, 1.2] });
  }
  HG.lensHook = function (T, A) {
    if (T < 24.8 || T >= 25.2 || !A) return null;
    const u = seg(T, 24.8, 25.2), e = E('power3.in', u);
    const hand = A.handL;
    const s0 = HG._hx.s, s = s0 * Math.pow(18 / Math.max(0.05, s0), e);
    return { x: lerp(hand[0], 560, e), y: lerp(hand[1], 900, e), s, ang: lerp(-0.6, -2.2, e), hand };
  };
  function drawLensHook(ctx, T, A, hs) {
    const h = HG.lensHook(T, A);
    if (!h) return;
    chain(ctx, h.hand, [h.x, h.y], T, Math.min(hs * 2, 6), { sag: 0, dance: 20 * hs * (1 - seg(T, 24.8, 25.1)) });
    hook(ctx, h.x - 84 * h.s * 0.5, h.y - 34 * h.s * 0.5, h.ang, h.s);
    BH.speedLines(ctx, T, 540, 900, { n: 40, alpha: 0.5 * seg(T, 24.9, 25.15) });
  }

  // ------------------------------------------------------------------ one call from the frame
  HG.drawBigHooks = function (ctx, cam, T, A, moon) {
    if (!A) return;
    const hs = HG._hx.s;
    drawLasso(ctx, cam, T, A, hs);
    drawArchiHooks(ctx, cam, T, A, hs);
    drawMoonHook(ctx, cam, T, A, hs, moon);
    drawBurp(ctx, T, A, hs);
    drawLensHook(ctx, T, A, hs);
  };
})();

</script>
<script>
// ---- src/world/24-hg-hud.js
// HUNGRY engine, part 5: screen overlays — the POWER counter, the slogan slams, the lens hit and the logo
// end card (the approved logo-on-chains drop from the first reel), plus the finishing pass.
(function () {
  'use strict';
  const HG = (window.HG = window.HG || {});
  const BH = window.BH;
  const { clamp, lerp, sstep, seg } = HG;
  const E = BH.E;
  const punch = (t, t0, d) => HG.punch(t, t0, d);

  // ------------------------------------------------------------------ POWER value at T
  const ARCHI_FROM = 48000000, ARCHI_TO = 595430090;
  function powerAt(T) {
    let v = null, since = -1;
    let prev = 0;
    for (const L of HG.LEVELS) {
      if (L.id === 'archipelago') {
        if (T < 16.4) break;
        const n = HG.ARCHI.length;
        let eaten = 0;
        for (const I of HG.ARCHI) { const t = HG.archiTimes(I); eaten += clamp((T - t.chomp) / 0.12, 0, 1); }
        v = eaten >= n - 1e-6 ? ARCHI_TO : Math.round(ARCHI_FROM + (ARCHI_TO - ARCHI_FROM) * Math.pow(eaten / n, 1.3));
        since = T >= 18.0 ? 18.0 : -1;
        prev = v;
        continue;
      }
      if (T < L.chomp) break;
      if (L.power === Infinity) { v = T < L.chomp + 0.24 ? -1 : Infinity; since = L.chomp; break; }
      const u = E('power2.out', seg(T, L.chomp, L.chomp + 0.3));
      v = prev <= 0 ? L.power : Math.round(Math.exp(lerp(Math.log(prev), Math.log(L.power), u)));
      since = L.chomp;
      prev = L.power;
    }
    return { v, since };
  }
  HG.powerAt = powerAt;
  function fmt(v, T) {
    if (v === -1) { // the overflow spin before ∞
      const r = BH.rng(Math.floor(T * 30) * 7 + 3);
      let s = ''; for (let i = 0; i < 12; i++) s += Math.floor(r() * 10) + (i % 3 === 2 && i < 11 ? ' ' : '');
      return s;
    }
    if (v >= 10000000 && v !== ARCHI_TO && (v < ARCHI_FROM + 1 || v % 1000000 === 0)) return (v / 1e6).toFixed(0) + 'M';
    if (v >= 50000000) return String(v).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
    if (v >= 1e6) return (v / 1e6).toFixed(v < 1e7 ? 1 : 0).replace(/\.0$/, '') + 'M';
    if (v >= 1000) return (v / 1000).toFixed(v < 1e4 ? 1 : 0).replace(/\.0$/, '') + 'K';
    return String(v);
  }

  function drawCounter(ctx, T) {
    if (T < 1.2 || T >= 25.2) return;
    const p = powerAt(T);
    if (p.v == null) return;
    const intro = BH.slamScale(T, 1.2, 1.8, 0.22);
    const kick = 1 + punch(T, p.since, 0.28) * 0.28;
    const out = seg(T, 24.9, 25.2);
    const y = 350 - out * 300;
    ctx.save();
    ctx.globalAlpha = 1 - out;
    BH.line(ctx, 'POWER', 540, y - 104, { px: 50, style: 'white', align: 'center', scale: intro, tracking: 0.04 });
    if (p.v === Infinity) {
      const k = BH.slamScale(T, 21.44, 2.6, 0.22);
      if (k > 0) { ctx.save(); ctx.translate(540, y + 4); ctx.scale(k * kick, k * kick); BH.infinity(ctx, 0, 0, 250, {}); ctx.restore(); }
    } else {
      const s = fmt(p.v, T);
      const px = s.length > 9 ? 104 : 132;
      BH.line(ctx, s, 540, y, { px, style: 'title', align: 'center', scale: intro * kick, tracking: 0 });
    }
    if (T >= 18.0 && T < 18.5) BH.flash(ctx, '#FFFFFF', 0.25 * (1 - seg(T, 18.0, 18.5)));
    ctx.restore();
  }

  // ------------------------------------------------------------------ slogans
  const CAPS = [
    { t: 1.2, out: 2.9, small: null, big: 'START SMALL', y: 540, px: 118 },
    { t: 7.6, out: 9.1, small: null, big: 'EAT', y: 560, px: 190 },
    { t: 10.4, out: 11.8, small: null, big: 'AND EAT', y: 560, px: 170 },
    { t: 13.2, out: 16.0, small: 'THE MORE YOU', big: 'CONSUME', y: 470, px: 150, t2: 13.4 },
    { t: 21.2, out: 22.9, small: 'THE MORE YOU', big: 'DOMINATE', y: 470, px: 150, t2: 21.44 },
    { t: 23.6, out: 25.1, small: null, big: 'STILL HUNGRY.', y: 560, px: 136 },
  ];
  function drawCaptions(ctx, T) {
    for (const c of CAPS) {
      if (T < c.t || T > c.out + 0.25) continue;
      const out = E('power2.in', seg(T, c.out, c.out + 0.25));
      if (c.small) BH.caption(ctx, T, { x: 540, y: c.y, small: c.small, big: c.big, t1: c.t, t2: c.t2, pxSmall: 84, pxBig: c.px, align: 'center', out });
      else BH.slam(ctx, T, c.t, c.big, 540, c.y - out * 260, { px: c.px, style: 'title', align: 'center', rot: BH.rad(-4), alpha: 1 - out, from: 2.4 });
    }
  }

  // ------------------------------------------------------------------ lens hit + end card (25.2 → 30.0)
  const T0 = 25.2;
  const CLACK = 1.2, FALL = 0.3, HOLD = 0.05, LAND = [0, 0.4, 0, 0.4, 0, 0.4, 0, 0.8, 0.8, 0.8, 0.8];
  function letterPose(n, t) {
    if (t >= CLACK) return null;
    const tl = LAND[n], side = n % 2 ? -1 : 1;
    const spread = lerp(1.06, 1, E('power2.in', seg(t, 1.1, CLACK))), damp = 1 - seg(t, 1.1, CLACK);
    if (t < tl) {
      const u = seg(t, tl - FALL, tl);
      if (u <= 0) return { hide: true };
      return { spread, oy: -1150 * (1 - u * u), sy: 1 + 0.1 * u, sx: 1 - 0.05 * u, rot: side * 0.08 };
    }
    const te = Math.max(0, t - tl - HOLD), d = Math.exp(-te / 0.4) * damp;
    const sq = 0.12 * Math.exp(-te / 0.07) * Math.cos((te * 2 * Math.PI) / 0.18) * damp;
    return { spread, oy: 26 * Math.exp(-te / 0.14) * Math.sin((te * 2 * Math.PI) / 0.29) * damp, ox: side * 9 * d * Math.sin((te * 2 * Math.PI) / 0.52),
      rot: side * 0.08 * d * Math.cos((te * 2 * Math.PI) / 0.52), sx: 1 + sq * 0.6, sy: 1 - sq };
  }
  function endCard(ctx, T) {
    const t = T - T0;
    const Lg = BH.BRAND.LOGO10;
    const P = []; for (let n = 0; n < 11; n++) P.push(letterPose(n, t));
    const kk = Lg.k * (t < CLACK ? 1 : 1 + 0.075 * Math.max(0, 1 - (t - CLACK) / 0.16));
    const y0 = Lg.y - 250;
    // space backdrop: the crescent moon behind the logo, stars
    ctx.save();
    const G = BH.brandLetterGeo(ctx), rel = E('power2.in', seg(t, CLACK, CLACK + 0.26));
    if (t < CLACK + 0.3) {
      for (let n = 0; n < 11; n++) {
        if (P[n] && P[n].hide) continue;
        const g = G.list[n], side = n % 2 ? -1 : 1, hp = BH.brandHangPoint(g, Lg.x, y0, kk, P[n]);
        const lean = -(hp[0] - 540) / 2600 + (P[n] ? (P[n].rot || 0) * 0.15 : 0) + side * 0.3 * rel;
        BH.brandHangChain(ctx, hp[0], hp[1] + 7 * kk, lean, { s: 0.64 * kk, flip: side, pitch: 21, lift: 1700 * rel, part: 'chain' });
      }
    }
    BH.brandLogo(ctx, Lg.x, y0, kk, (g) => P[g.w === 0 ? g.i : 7 + g.i]);
    if (t < CLACK + 0.3) {
      for (let n = 0; n < 11; n++) {
        if (P[n] && P[n].hide) continue;
        const g = G.list[n], side = n % 2 ? -1 : 1, hp = BH.brandHangPoint(g, Lg.x, y0, kk, P[n]);
        const lean = -(hp[0] - 540) / 2600 + (P[n] ? (P[n].rot || 0) * 0.15 : 0) + side * 0.3 * rel;
        BH.brandHangChain(ctx, hp[0], hp[1] + 7 * kk, lean, { s: 0.64 * kk, flip: side, pitch: 21, lift: 1700 * rel, part: 'hook' });
      }
    }
    // PLAY FREE (26.4), pulsing on the beats
    const bt = T - 26.4;
    if (bt >= 0) {
      const BT = BH.BRAND.BTN;
      const pop = BH.slamScale(T, 26.4, 0.2, 0.3);
      const beat = (T - 26.4) % 0.4, pulse = 1 + 0.05 * Math.exp(-beat / 0.08);
      const press = T > 28.4 && T < 28.7 ? Math.sin(seg(T, 28.4, 28.7) * Math.PI) : 0;
      BH.button(ctx, BT.x, 1330, 'PLAY FREE', { px: BT.px, scale: pop * pulse, press, bg: '#4BE630' });
    }
    ctx.restore();
  }
  function lensHit(ctx, T) {
    const a = T - T0;
    if (a < 0 || a > 0.5) return;
    // white impact frame, then cracks radiating from the hit point
    BH.flash(ctx, '#FFF6EE', a < 1 / 30 ? 1 : 0.9 * Math.pow(1 - a / 0.5, 2));
    ctx.save();
    ctx.globalAlpha = 1 - seg(T, T0 + 0.25, T0 + 0.5);
    ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    const r = BH.rng(515);
    for (let i = 0; i < 14; i++) {
      let x = 560, y = 900, ang = (i / 14) * Math.PI * 2 + r() * 0.3;
      ctx.beginPath(); ctx.moveTo(x, y);
      for (let k = 0; k < 6; k++) { ang += (r() - 0.5) * 0.6; const L = 60 + r() * 140; x += Math.cos(ang) * L; y += Math.sin(ang) * L; ctx.lineTo(x, y); }
      ctx.stroke();
    }
    ctx.restore();
  }

  // ------------------------------------------------------------------ the whole overlay pass
  HG.drawHUD = function (ctx, cam, T, A) {
    if (T >= T0) {
      // the end card owns the frame: the world dims to a starfield with the crescent moon
      ctx.save();
      ctx.fillStyle = BH.rgba('#05030F', 0.42);
      ctx.fillRect(-50, -50, 1180, 2020);
      ctx.restore();
      endCard(ctx, T);
      BH.embers(ctx, T, { x: 0, y: 0, w: 1080, h: 1920, n: 30, speed: 110, size: 3.4 });
      lensHit(ctx, T);
    } else {
      drawCounter(ctx, T);
      drawCaptions(ctx, T);
    }
    // fade in from black on frame 0? No: frame 0 is the thumbnail. Only the finishing vignette + grain.
    BH.vignette ? BH.vignette(ctx, 0.35) : null;
    BH.grain(ctx, T, 0.05);
  };
})();

</script>
<script>
// ---- src/world/29-hg-frame.js
// HUNGRY engine, last part: one frame of the one continuous shot. Every shot file calls HG.frame(ctx, T).
(function () {
  'use strict';
  const HG = (window.HG = window.HG || {});
  const BH = window.BH;

  HG.frame = function (ctx, T) {
    const cam = HG.camera(T);
    HG.cam = cam;
    ctx.save();
    // 1 · sky, stars
    HG.drawSky(ctx, cam, T);
    // 2 · the moon in the sky (while it hangs far away)
    const moon = HG.moonState ? HG.moonState(T) : { pos: HG.MOON.home, bite: 0 };
    if (!moon.near) HG.drawMoon(ctx, cam, moon);
    // 3 · planet, sea, islands on it
    HG.drawPlanet(ctx, cam, T);
    HG.drawSeaZones(ctx, cam, T);
    HG.drawSeaTexture(ctx, cam, T);
    if (HG.drawArchipelago) HG.drawArchipelago(ctx, cam, T, 'ground');
    HG.drawHomeIsland(ctx, cam, T);
    if (HG.drawNeighbour) HG.drawNeighbour(ctx, cam, T, 'ground');
    // 4 · clouds, forest, rocks
    HG.drawClouds(ctx, cam, T);
    HG.drawPines(ctx, cam, T, -1e9, 1e9);
    HG.drawRocks(ctx, cam);
    // 5 · actors (depth-sorted billboards, weapons, hooks)
    const A = HG.drawActors(ctx, cam, T);
    if (HG.drawNeighbour) HG.drawNeighbour(ctx, cam, T, 'air');
    if (HG.drawArchipelago) HG.drawArchipelago(ctx, cam, T, 'air');
    if (moon.near) HG.drawMoon(ctx, cam, moon);
    if (HG.drawBigHooks) HG.drawBigHooks(ctx, cam, T, A, moon);
    // 6 · screen overlays: HUD, captions, finish
    if (HG.drawHUD) HG.drawHUD(ctx, cam, T, A);
    ctx.restore();
  };
})();

</script>
<script>
// ---- src/world/30-prey-rat.js
// src/world/30-prey-rat.js — HG.prey.rat: shot 01, the very first tiny meal ("START SMALL").
// A chunky low-poly cel rat: grey-lilac fur, pink ears / paws / tail / nose, big buck teeth, beady red eye.
// Side view facing +x, feet on y = 0, 300 units nose-to-rump. Every point is mapped through small
// frame functions (body / head) into figure space, so the key light stays world-fixed whatever the pose.
(function () {
  'use strict';
  const HG = (window.HG = window.HG || {});
  const BH = window.BH;
  HG.prey = HG.prey || {};
  const TAU = Math.PI * 2;
  const clamp = BH.clamp, lerp = BH.lerp, M = BH.M;
  const sst = function (a, b, x) { return BH.sstep(a, b, x); };

  // ---------------------------------------------------------------- frames
  // mk: local → parent = translate(tx, ty) · rotate(rot) · scale(sx, sy) · translate(−ox, −oy)
  function mk(ox, oy, rot, sx, sy, tx, ty) {
    const c = Math.cos(rot), s = Math.sin(rot);
    return function (x, y) { const a = (x - ox) * sx, b = (y - oy) * sy; return [tx + a * c - b * s, ty + a * s + b * c]; };
  }
  function then(f, g) { return function (x, y) { const q = g(x, y); return f(q[0], q[1]); }; } // f(g(p))
  function mp(pts, f) { return BH.mapPts(pts, f); }
  function lp(a, b, t) { return [lerp(a[0], b[0], t), lerp(a[1], b[1], t)]; }

  // ---------------------------------------------------------------- materials
  const FUR = { fill: '#7D789C', ramp: ['#302C4C', '#4E4972', '#7D789C', '#A7A2C6', '#D2CEEA'], gain: 0.95, h: 0.55,
    shade: '#C4B2E6', sd: 17, deep: '#9C86CC', dd: 6, rim: '#C6CCFF', rd: 3, hi: '#DCD8F4', hd: 3.5, lw: 3 };
  const FUR_FAR = M(FUR, { fill: '#5E5A80', ramp: ['#221F3A', '#3A365A', '#5E5A80', '#7E7AA2', '#9E9AC0'], hi: '#8E8AB2' });
  const PINK = { fill: '#F28AA8', ramp: ['#8A2E54', '#C4557C', '#F28AA8', '#FFB3C8', '#FFDDE8'], gain: 0.95, h: 0.5,
    shade: '#D6A0D6', sd: 7, rim: '#FFC6DC', rd: 2, hi: '#FFE4EE', hd: 2.2, lw: 3 };
  const PINK_FAR = M(PINK, { fill: '#C86A8E', ramp: ['#5E1E3C', '#8E3A60', '#C86A8E', '#E08CAA', '#F0B0C6'], hi: '#E8A0BA' });
  const EARIN = M(PINK, { fill: '#F7A0B8', rim: null, sd: 5, lw: 0, noLine: true });
  const TOOTH = { fill: '#FFF4CF', ramp: ['#B8A274', '#DCCB9C', '#FFF4CF', '#FFFFFF', '#FFFFFF'], gain: 0.8, h: 0.4,
    shade: '#D8C4D8', sd: 3, rim: '#FFFFFF', rd: 1, hi: '#FFFFFF', hd: 1.2, lw: 2.4, k: 1, rings: [0.5], zs: [0.8] };
  const SMALL = { k: 1, rings: [0.5], zs: [0.8] };

  let LOD = 2; // 2 full · 1 simple facets, no fine lines · 0 flat silhouette
  function mt(base, over) {
    const o = M(base, over);
    if (LOD === 0) { o.flat = true; o.shade = null; o.rim = null; o.hi = null; o.ramp = null; }
    else if (LOD === 1 || !o.big) { o.k = 1; o.rings = [0.5]; o.zs = [0.8]; o.deep = null; }
    else { o.k = 1; }
    return o;
  }
  function form(ctx, pts, base, over) { return BH.form(ctx, pts, mt(base, over)); }
  function ink(ctx, pts, w, col, close) {
    ctx.strokeStyle = BH.mono || col || BH.INK; ctx.lineWidth = w * BH.lwK;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    if (close) ctx.closePath();
    ctx.stroke();
  }
  function blob(ctx, x, y, rx, ry, col, rot) {
    ctx.fillStyle = BH.mono || col; ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot || 0, 0, TAU); ctx.fill();
  }

  // ---------------------------------------------------------------- shapes (body / head local space)
  const BODY = [[-152, -74], [-142, -118], [-104, -148], [-46, -152], [8, -140], [52, -118], [84, -90], [94, -60], [76, -32],
    [36, -18], [-24, -14], [-84, -18], [-126, -30], [-148, -50]];
  const HAUNCH = [[-128, -96], [-96, -118], [-58, -108], [-40, -76], [-48, -44], [-80, -30], [-114, -40], [-132, -66]];
  // head: neck at the back-left, snout pointing right; tufty cheek
  const HEAD = [[30, -110], [40, -146], [70, -166], [108, -160], [140, -134], [166, -104], [182, -86], [178, -70], [156, -60],
    [118, -54], [90, -54], [66, -36, 1], [64, -56], [44, -60, 1], [38, -78]];
  const EAR_N = BH.ellPts(0, 0, 30, 38, 0, 10);
  const EAR_IN = BH.ellPts(2, 2, 18, 26, 0, 8);
  const NECK = [58, -104];

  // ---------------------------------------------------------------- pose
  // Returns everything in figure space: body frame bf, head frame hf, legs [{hip, foot, far}], tail pts, face state.
  function pose(st) {
    const T = st.T || 0, u = clamp(st.u || 0, 0, 1), ph = st.phase || 'alive';
    const o = { dead: false, open: 0, squeak: 0, tongue: 0, lod: LOD };
    let bf, brot = 0, hr = 0, legs, tail, earFlap = 0;
    const HIPN = [-82, -58], HIPF = [-62, -60], SHN = [60, -56], SHF = [76, -58];
    if (ph === 'alive') {
      const f = T * TAU * 3.4, r = sst(0.7, 0.84, u), run = 1 - r;
      const bob = -Math.abs(Math.sin(f)) * 8 * run;
      const rot = -1.02 * r + Math.sin(f * 2) * 0.03 * run;
      bf = mk(-124, -24, rot, 1, 1, -124 + 58 * r, -24 + bob); brot = rot;
      hr = 0.62 * r + Math.sin(f * 2 + 0.6) * 0.04 * run + Math.sin(T * 38) * 0.05 * r;
      o.open = r; o.squeak = r; earFlap = Math.sin(f * 2) * 0.08 * run - 0.25 * r;
      function stepFoot(x0, pp, amp) {
        return [x0 + Math.sin(pp) * amp * run + 12 * r, -Math.max(0, Math.cos(pp)) * 22 * run];
      }
      const wave = Math.sin(T * 17) * 10;
      legs = [
        { hip: bf(HIPF[0], HIPF[1]), foot: stepFoot(-50, f + Math.PI, 30), far: true, hind: true },
        { hip: bf(SHF[0], SHF[1]), foot: lp(stepFoot(92, f + Math.PI * 0.5, 28), [62, -150 + wave], r), far: true, raise: r },
        { hip: bf(HIPN[0], HIPN[1]), foot: stepFoot(-70, f, 32), hind: true },
        { hip: bf(SHN[0], SHN[1]), foot: lp(stepFoot(76, f + Math.PI * 1.5, 28), [44, -158 - wave], r), raise: r },
      ];
      const b = bf(-150, -58);
      const tw = run * 22, tf = f * 0.55;
      const run0 = [b, [b[0] - 50, b[1] + 18 + Math.sin(tf) * tw * 0.4], [b[0] - 110, -18 + Math.sin(tf - 1.2) * tw],
        [b[0] - 170, -24 + Math.sin(tf - 2.4) * tw], [b[0] - 220, -46 + Math.sin(tf - 3.6) * tw * 1.2], [b[0] - 250, -78 + Math.sin(tf - 4.6) * tw * 1.3]];
      const rear = [b, [b[0] - 34, -12], [b[0] - 90, -8], [b[0] - 150, -10], [b[0] - 200, -24], [b[0] - 224, -58 + Math.sin(T * 9) * 8]];
      tail = run0.map(function (p, i) { return lp(p, rear[i], r); });
    } else if (ph === 'dead') {
      o.dead = true; o.tongue = sst(0.1, 0.45, u);
      // cartoon flip onto its back: squash to a 45 % sliver, snap over, stretch back (never degenerate)
      const k = BH.E('power2.inOut', BH.seg(u, 0, 0.3)), c = Math.cos(Math.PI * k), hop = Math.sin(Math.PI * k) * 70;
      const flip = (c >= 0 ? 1 : -1) * Math.max(0.45, Math.abs(c));
      bf = mk(0, -84, 0, 1 + 0.12 * Math.sin(Math.PI * k), flip, 0, -84 - hop);
      hr = -0.42 * k;
      const tw = Math.sin(T * 34) * 5 * (1 - sst(0.3, 0.9, u));
      legs = [
        { hip: bf(HIPF[0], HIPF[1]), foot: bf(HIPF[0] - 18, 2 + tw), far: true, hind: true, stiff: true },
        { hip: bf(SHF[0], SHF[1]), foot: bf(SHF[0] + 22, 0 - tw), far: true, stiff: true },
        { hip: bf(HIPN[0], HIPN[1]), foot: bf(HIPN[0] - 34, 8 - tw), hind: true, stiff: true },
        { hip: bf(SHN[0], SHN[1]), foot: bf(SHN[0] + 8, 6 + tw), stiff: true },
      ];
      const b = bf(-150, -58);
      tail = [[0, 0], [-40, 30], [-90, 70], [-150, 96], [-205, 100], [-240, 90]].map(function (q, i) {
        return i ? [b[0] + q[0], Math.min(-7 - (i === 5 ? 12 : 0), b[1] + q[1])] : b;
      });
    } else { // hooked / flying: limp, hanging from the scruff
      o.dead = true; o.tongue = 1;
      const fly = ph === 'flying';
      const sway = Math.sin(T * 7) * (fly ? 0.05 : 0.09);
      brot = (fly ? 0.12 : 0.38) + sway;
      bf = mk(40, -132, brot, 1, 1, 40, -132);
      hr = fly ? -0.1 + Math.sin(T * 11) * 0.12 : 0.34;
      earFlap = fly ? Math.sin(T * 23) * 0.3 : 0.2;
      function dang(h, dx, dy, i) {
        const sw = Math.sin(T * (fly ? 13 : 6) + i * 1.7) * (fly ? 14 : 6);
        return [h[0] + dx + sw, h[1] + dy + (fly ? sw * 0.5 : 0)];
      }
      const hF = bf(HIPF[0], HIPF[1]), sF = bf(SHF[0], SHF[1]), hN = bf(HIPN[0], HIPN[1]), sN = bf(SHN[0], SHN[1]);
      legs = fly ? [
        { hip: hF, foot: dang(hF, -44, 40, 0), far: true, hind: true },
        { hip: sF, foot: dang(sF, 50, 36, 1), far: true },
        { hip: hN, foot: dang(hN, -58, 52, 2), hind: true },
        { hip: sN, foot: dang(sN, 34, 54, 3) },
      ] : [
        { hip: hF, foot: dang(hF, -8, 62, 0), far: true, hind: true },
        { hip: sF, foot: dang(sF, 14, 56, 1), far: true },
        { hip: hN, foot: dang(hN, -22, 66, 2), hind: true },
        { hip: sN, foot: dang(sN, 4, 60, 3) },
      ];
      const b = bf(-150, -58), w = Math.sin(T * (fly ? 14 : 5)) * (fly ? 26 : 12);
      tail = fly
        ? [b, [b[0] - 56, b[1] + 6 + w * 0.3], [b[0] - 110, b[1] + 4 - w * 0.6], [b[0] - 160, b[1] + 10 + w], [b[0] - 206, b[1] - 4 - w], [b[0] - 240, b[1] + 8 + w * 1.2]]
        : [b, [b[0] - 20, b[1] + 50], [b[0] - 10 + w * 0.4, b[1] + 110], [b[0] - 30 - w, b[1] + 160], [b[0] - 14 + w, b[1] + 210], [b[0] - 34 - w * 0.6, b[1] + 244]];
    }
    // the head follows the body's position and rotation but never its flip (dead: belly up, head upright)
    const nk = bf(NECK[0], NECK[1]);
    const hf = mk(NECK[0], NECK[1], brot + hr, 1.12, 1.12, nk[0], nk[1]);
    o.bf = bf; o.hf = hf; o.legs = legs; o.tail = tail; o.earFlap = earFlap; o.T = T;
    return o;
  }

  // ---------------------------------------------------------------- parts
  function leg(ctx, L) {
    const h = L.hip, f = L.foot;
    const fur = L.far ? FUR_FAR : FUR, pink = L.far ? PINK_FAR : PINK;
    const dx = f[0] - h[0], dy = f[1] - h[1], d = Math.hypot(dx, dy) || 1;
    // knee kicks back a little for hind legs, forward for front legs
    const kn = L.hind ? -1 : 1, bend = L.stiff ? 4 : 16;
    const m = [h[0] + dx * 0.55 + (-dy / d) * bend * kn * -1, h[1] + dy * 0.55 + (dx / d) * bend * kn * -1];
    const r0 = L.hind ? 17 : 13, r1 = L.hind ? 11 : 9;
    form(ctx, BH.limbPts(h[0], h[1], r0, m[0], m[1], r1 + 2, r0 * 0.9), fur, SMALL);
    form(ctx, BH.limbPts(m[0], m[1], r1 + 1, f[0], f[1], r1 - 1, r1), pink, M(SMALL, { sd: 5 }));
    // paw / foot: long for hind legs, little mitten for front
    const a = Math.atan2(dy, dx);
    let fx = f[0], fy = f[1], fa, fl, fw;
    if (L.stiff || L.raise > 0.5 || !L.hind && L.raise > 0) { fa = a; fl = L.hind ? 20 : 13; fw = L.hind ? 10 : 9; }
    else if (L.hind) { fa = -0.05; fl = 26; fw = 9; fx += 14; fy -= 8; }
    else { fa = -0.1; fl = 15; fw = 8.5; fx += 6; fy -= 8; }
    if (!L.hind && L.raise) { fa = lerp(-0.1, a, L.raise); fx = lerp(f[0] + 6, f[0], L.raise); fy = lerp(f[1] - 8, f[1], L.raise); }
    form(ctx, BH.ellPts(fx, fy, fl, fw, fa, 8), pink, M(SMALL, { sd: 4, seed: 11 }));
    if (LOD === 2) { // toes
      const c = Math.cos(fa), s = Math.sin(fa);
      for (let i = -1; i <= 1; i++) {
        const tx = fx + c * fl * 0.72 - s * i * fw * 0.55, ty = fy + s * fl * 0.72 + c * i * fw * 0.55;
        ink(ctx, [[tx - c * 4, ty - s * 4], [tx + c * 2, ty + s * 2]], 1.6, '#8A2E54');
      }
    }
  }

  function tail(ctx, pts) {
    const rib = BH.ribbon(pts, function (u) { return lerp(15, 2.5, Math.pow(u, 0.8)); }, 22);
    form(ctx, rib, PINK, { flat: true, sd: 6, rd: 2, hd: 2.4 });
    if (LOD < 2) return;
    const c = BH.curve(pts, 48);
    ctx.save();
    for (let i = 1; i <= 11; i++) {
      const s = i / 12, q = c.at(s * c.len), w = lerp(15, 2.5, Math.pow(s, 0.8)) * 0.85;
      const nx = -Math.sin(q[2]), ny = Math.cos(q[2]);
      ink(ctx, [[q[0] + nx * w, q[1] + ny * w], [q[0] - nx * w, q[1] - ny * w]], 1.5, '#A8406A');
    }
    ctx.restore();
  }

  function ear(ctx, hf, x, y, rot, far) {
    const f = then(hf, mk(0, 0, rot, 1, 1, x, y));
    form(ctx, mp(EAR_N, f), far ? FUR_FAR : FUR, M(SMALL, { sd: 7, seed: far ? 3 : 4 }));
    if (LOD > 0) BH.form(ctx, mp(EAR_IN, f), mt(far ? M(EARIN, { fill: '#C86A8E' }) : EARIN, SMALL));
  }

  function face(ctx, o) {
    const hf = o.hf, T = o.T;
    // muzzle / cheek patch (lighter fur) and blush
    ctx.save();
    ctx.globalAlpha *= 0.55;
    BH.decal(ctx, mp(BH.ellPts(150, -80, 30, 20, -0.35, 8), hf), BH.mono || '#C9C3E0');
    ctx.globalAlpha /= 0.55;
    if (LOD === 2 && !o.dead) { ctx.globalAlpha *= 0.5; BH.decal(ctx, mp(BH.ellPts(118, -86, 13, 8, -0.2, 8), hf), BH.mono || '#FF8FB4'); }
    ctx.restore();
    const E = hf(124, -122);
    if (o.dead) {
      const s = 10;
      ink(ctx, [[E[0] - s, E[1] - s], [E[0] + s, E[1] + s]], 4.6, '#1A0612');
      ink(ctx, [[E[0] + s, E[1] - s], [E[0] - s, E[1] + s]], 4.6, '#1A0612');
    } else {
      blob(ctx, E[0], E[1], 11.5, 12.5, '#1A0612');
      if (LOD > 0) {
        blob(ctx, E[0] + 1, E[1] + 1, 8, 9, '#D8243E');
        blob(ctx, E[0] + 2, E[1] + 2, 4.2, 5, '#3A0612');
        blob(ctx, E[0] - 3, E[1] - 4, 3.2, 3.2, '#FFFFFF');
        // determined little brow
        ink(ctx, [hf(108, -138), hf(126, -140 + 4 * o.squeak), hf(138, -134)], 3.2, '#2A1830');
      }
    }
    // nostril line under the nose + mouth
    if (LOD === 2) {
      ink(ctx, [hf(168, -70), hf(160, -66), hf(150, -68)], 2.2, '#2A1830');
    }
  }

  function snout(ctx, o) {
    const hf = o.hf;
    // open mouth (squeak / dead)
    const open = Math.max(o.open * (0.7 + 0.3 * Math.sin(o.T * 40)), o.dead ? 0.55 : 0);
    if (open > 0.05) {
      BH.form(ctx, mp([[134, -66], [162, -64], [164, -56 + 10 * open], [150, -46 + 14 * open], [136, -52 + 8 * open]], hf),
        mt({ fill: '#5A0A22', shade: null, lw: 2.4 }, { flat: true }));
      if (o.tongue > 0 && LOD > 0) {
        const tl = o.tongue;
        BH.form(ctx, mp([[140, -54], [152, -52], [158 + 6 * tl, -40 + 16 * tl], [150 + 6 * tl, -30 + 20 * tl], [142 + 4 * tl, -38 + 14 * tl]], hf),
          mt(PINK, M(SMALL, { fill: '#FF6F94', sd: 3, lw: 2 })));
      }
    }
    // buck teeth
    const tl = 22 - 3 * open;
    [[146, 0], [156, 1]].forEach(function (t, i) {
      const x = t[0], y0 = -68;
      BH.form(ctx, mp([[x - 5, y0, 1], [x + 5, y0, 1], [x + 5.5, y0 + tl - 3], [x + 3, y0 + tl, 1], [x - 4.5, y0 + tl - 2]], o.hf), mt(TOOTH, { seed: 20 + i }));
    });
    // pink nose
    form(ctx, mp(BH.ellPts(180, -82, 11, 9.5, 0.2, 8), hf), PINK, M(SMALL, { sd: 4, seed: 9, fill: '#FF7FA2' }));
    if (LOD === 2) {
      // whiskers
      const w = Math.sin(o.T * 21) * 3;
      [[-12, -8], [0, 0], [12, 7]].forEach(function (q, i) {
        ink(ctx, [hf(162, -80 + q[1] * 0.3), hf(196, -86 + q[0] + w * (i - 1) * 0.5), hf(224, -92 + q[0] * 2 + w * (i - 1))], 1.6, '#2A1830');
      });
    }
    if (o.squeak > 0.3 && LOD === 2 && !BH.mono) { // squeak marks
      const a = clamp((o.squeak - 0.3) / 0.3, 0, 1) * (0.6 + 0.4 * Math.abs(Math.sin(o.T * 20)));
      ctx.save(); ctx.globalAlpha *= a;
      const c = hf(170, -52);
      [[0.1, 30], [-0.5, 34], [0.7, 26]].forEach(function (q) {
        const ang = q[0] - 0.2, r0 = 28, r1 = r0 + q[1];
        const p0 = [c[0] + Math.cos(ang) * r0, c[1] + Math.sin(ang) * r0], p1 = [c[0] + Math.cos(ang) * r1, c[1] + Math.sin(ang) * r1];
        ink(ctx, [p0, p1], 7, BH.INK); ink(ctx, [p0, p1], 3.5, '#FFFFFF');
      });
      ctx.restore();
    }
  }

  function drawRat(ctx, st) {
    const px = st.px == null ? 1 : st.px;
    LOD = px < 0.15 ? 0 : px < 0.5 ? 1 : 2;
    const o = pose(st), bf = o.bf, hf = o.hf;
    ctx.save();
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    // far legs, tail, body
    o.legs.filter(function (L) { return L.far; }).forEach(function (L) { leg(ctx, L); });
    tail(ctx, o.tail);
    form(ctx, mp(BODY, bf), FUR, {
      big: true, seed: 5, inner: function (c) {
        if (LOD === 0) return;
        c.save(); c.globalAlpha *= 0.5;
        BH.decal(c, mp(BH.ellPts(10, -26, 92, 24, 0.03, 10), bf), BH.mono || '#C8C1DE');
        c.restore();
      },
    });
    form(ctx, mp(HAUNCH, bf), FUR, { big: true, seed: 6, sd: 10, dd: 4 });
    o.legs.filter(function (L) { return !L.far && !L.raise; }).forEach(function (L) { leg(ctx, L); });
    // head
    ear(ctx, hf, 98, -170, 0.35 + o.earFlap, true);
    form(ctx, mp(HEAD, hf), FUR, { big: true, seed: 8, sd: 13, dd: 5, peak: hf(104, -120) });
    ear(ctx, hf, 58, -162, -0.3 + o.earFlap, false);
    face(ctx, o);
    snout(ctx, o);
    o.legs.filter(function (L) { return !L.far && L.raise; }).forEach(function (L) { leg(ctx, L); });
    ctx.restore();
  }

  HG.prey.rat = {
    units: 300,
    hook: [40, -132],
    pivot: [0, -76],
    draw: drawRat,
  };
})();

</script>
<script>
// ---- src/world/31-prey-goblin.js
// src/world/31-prey-goblin.js — HG.prey.goblin: shot 02, the cleaver goblin from the autumn forest.
// Olive / mustard skin, huge pointy ears, hunched pot belly, angry underbite, ragged leather vest + loincloth,
// a steel cleaver on a wooden handle. 3/4 view facing +x, feet on y = 0, ~500 units tall.
// A small 2D skeleton (hip → torso → head, shoulders → arms, hip → legs) is posed per phase; every part is
// mapped into figure space before BH.form so the key light and outline stay world-fixed.
(function () {
  'use strict';
  const HG = (window.HG = window.HG || {});
  const BH = window.BH;
  HG.prey = HG.prey || {};
  const TAU = Math.PI * 2;
  const clamp = BH.clamp, lerp = BH.lerp, M = BH.M;
  const sst = function (a, b, x) { return BH.sstep(a, b, x); };

  // ---------------------------------------------------------------- frames
  function mk(ox, oy, rot, sx, sy, tx, ty) {
    const c = Math.cos(rot), s = Math.sin(rot);
    return function (x, y) { const a = (x - ox) * sx, b = (y - oy) * sy; return [tx + a * c - b * s, ty + a * s + b * c]; };
  }
  function mp(pts, f) { return BH.mapPts(pts, f); }

    if (lod > 0 && cl > 0) {
      for (let i = 0; i < n; i++) {
        const oi = (i / (n - 1) - 0.5) * 1.3, bx = rx * Math.cos(oi) * 0.9, by = ry * Math.sin(oi) * 0.9;
        const dx = Math.cos(oi * 0.7), dy = Math.sin(oi * 0.7), nx = -dy, ny = dx, L = cl * (1 - Math.abs(oi) * 0.25), wb = rx * 0.14 + 2;
        const pts = [
          W(bx + nx * wb, by + ny * wb).concat(1),
          W(bx + dx * L * 0.6 + nx * wb * 0.7, by + dy * L * 0.6 + ny * wb * 0.7 + L * 0.12),
          W(bx + dx * L + nx * 1, by + dy * L + L * 0.42).concat(1),
          W(bx + dx * L * 0.55 - nx * wb * 0.3, by + dy * L * 0.55 - ny * wb * 0.3 + L * 0.2),
          W(bx - nx * wb, by - ny * wb).concat(1),
        ];
        BH.form(ctx, pts, M(clawMat, { flat: lod < 2 }));
      }
    }
    BH.form(ctx, BH.ellPts(x, y, rx, ry, a, 10), M(mat, { seed: seed, inner: lod < 2 ? null : function (g) {
      g.globalCompositeOperation = 'multiply';
      for (let k = -1; k <= 1; k++) line(g, [W(rx * 0.45, k * ry * 0.34), W(rx * 0.9, k * ry * 0.4)], 3, '#9C80AE');
      g.globalCompositeOperation = 'source-over';
    } }));
  }

  function limb(ctx, A, r1, B, r2, rm, m) { BH.form(ctx, BH.limbPts(A[0], A[1], r1, B[0], B[1], r2, rm), m); }

  // Iron cuff across a limb at point P, limb direction a.
  function cuff(ctx, P, a, half, mt) {
    const c = Math.cos(a), s = Math.sin(a), nx = -s, ny = c, w = 14, bl = 7;
    const Q = (u, v) => [P[0] + c * u + nx * v, P[1] + s * u + ny * v];
    const pts = [Q(-w, half).concat(1), Q(w, half).concat(1), Q(w + bl, 0), Q(w, -half).concat(1), Q(-w, -half).concat(1), Q(-w + bl, 0)];
    BH.form(ctx, pts, mt(IRON, { peak: Q(0, -8), sd: 5, inner: (g) => {
      if (BH.mono) return;
      for (const v of [-0.55, 0, 0.55]) { const q = Q(bl * (1 - v * v) * 0.8, v * half); dot(g, q[0] + 1, q[1] + 1, 3.6, '#141828'); dot(g, q[0], q[1], 3, '#A9B4DE'); }
    } }));
  }
  // Chain hanging from P: n segments, each bending by the swing angle with a lag down the chain.
  function chainPts(P, len, n, sw, T, ground) {
    const base = sw[0], amp = sw[1], w = sw[2], lag = sw[3], seg = len / n, pts = [[P[0], P[1]]];
    let x = P[0], y = P[1];
    for (let i = 1; i <= n; i++) {
      const th = base * (0.6 + 0.4 * i / n) + amp * Math.sin(w * T - i * lag);
      let nx = x + Math.sin(th) * seg, ny = y + Math.cos(th) * seg;
      if (ground && ny > -9) { ny = -9; nx = x + seg * (Math.sin(th) >= 0 ? 1 : -1); }
      x = nx; y = ny; pts.push([x, y]);
    }
    return pts;
  }
  function brokenLink(ctx, pts, lod) {
    const a = pts[pts.length - 2], b = pts[pts.length - 1], ang = Math.atan2(b[1] - a[1], b[0] - a[0]);
    const p = CHAIN.pitch, th = p * 0.3, lw = p * 0.14 * BH.lwK;
    ctx.save();
    ctx.translate(b[0], b[1]); ctx.rotate(ang + 0.5);
    ctx.lineCap = 'round';
    const P = new Path2D();
    P.ellipse(p * 0.35, 0, p * 0.62, p * 0.36, 0, 0.75, TAU - 0.55);
    ctx.strokeStyle = col(CHAIN.line); ctx.lineWidth = th + lw * 2; ctx.stroke(P);
    ctx.strokeStyle = col(CHAIN.body); ctx.lineWidth = th; ctx.stroke(P);
    if (!BH.mono && lod > 0) {
      const ld = BH.localDir(ctx, BH.LIGHT[0], BH.LIGHT[1]);
      ctx.translate(ld[0] * th * 0.22, ld[1] * th * 0.22);
      ctx.strokeStyle = CHAIN.lit; ctx.lineWidth = th * 0.34; ctx.stroke(P);
    }
    ctx.restore();
  }
  function drawChain(ctx, pts, lod) {
    if (lod === 0) {
      ctx.strokeStyle = col(CHAIN.body); ctx.lineWidth = 10; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.stroke(BH.spline(pts, false));
      return;
    }
    BH.chain(ctx, pts, CHAIN);
    brokenLink(ctx, pts, lod);
  }
  function ring(ctx, P, r, lod) {
    const lw = 3 * BH.lwK;
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(P[0], P[1], r, 0, TAU);
    ctx.strokeStyle = col(CHAIN.line); ctx.lineWidth = 10 + lw * 2; ctx.stroke();
    ctx.strokeStyle = col('#4A5378'); ctx.lineWidth = 10; ctx.stroke();
    if (!BH.mono && lod > 0) {
      ctx.strokeStyle = '#A9B4DE'; ctx.lineWidth = 3.4; ctx.beginPath(); ctx.arc(P[0], P[1], r + 1, 3.3, 4.9); ctx.stroke();
      ctx.strokeStyle = '#8C84E0'; ctx.lineWidth = 2.4; ctx.beginPath(); ctx.arc(P[0], P[1], r + 3, 0.1, 1.6); ctx.stroke();
    }
  }

  // ------------------------------------------------------------------ head (head frame)
  function head(ctx, p, mt, lod, T) {
    const det = lod === 2, jawA = p.jaw * 0.95, R = (q) => rot(q, jawA, HINGE);
    // far ear, skull, near ear
    BH.form(ctx, BH.ellPts(92, -104, 25, 22, -0.3, 8), mt(FAR, { sd: 6, seed: 71, inner: (g) => {
      BH.decal(g, BH.ellPts(96, -104, 13, 11, -0.3, 8), col('#3A1E16'));
    } }));
    BH.form(ctx, SKULL, mt(FUR, { peak: [56, -52], sd: 16, h: 0.6, seed: 73, inner: det ? (g) => {
      g.globalCompositeOperation = 'multiply';
      line(g, [[14, 10], [26, 22], [22, 34]], 3.2, '#A48CB8');
      line(g, [[40, 30], [54, 40]], 3, '#A48CB8');
      g.globalCompositeOperation = 'source-over';
      // old scar across the brow
      line(g, [[98, -96], [112, -76], [118, -64]], 5, '#4A2018');
      line(g, [[99, -94], [113, -75]], 1.6, '#C98B6E');
    } : null }));
    BH.form(ctx, BH.ellPts(32, -90, 30, 27, -0.5, 9), mt(FUR, { sd: 8, hd: 2.5, seed: 75, inner: (g) => {
      BH.decal(g, BH.ellPts(38, -90, 16, 14, -0.5, 8), col('#3E2016'), '#2A140E', 4);
    } }));
    // mouth interior + tongue + teeth (behind the jaws)
    const open = p.jaw > 0.05;
    if (open) {
      const mouth = [[88, 12], [140, 20], [186, 18], R([188, 30]), R([146, 32]), R([100, 32])];
      ctx.fillStyle = col(MOUTH);
      const MP = BH.spline(mouth, true);
      ctx.lineJoin = 'round';
      ctx.strokeStyle = col(INK); ctx.lineWidth = 6 * BH.lwK; ctx.stroke(MP);
      ctx.fill(MP);
      if (lod > 0 && !BH.mono) {
        ctx.save(); ctx.clip(MP);
        dot(ctx, 120, 30, 22 * p.jaw, '#1E0208');
        BH.decal(ctx, BH.ellPts(...R([144, 30]), 40, 13, jawA, 10), TONGUE, '#B8385A', 4);
        ctx.restore();
      }
      if (lod > 0) {
        const tooth = (b, len, a, w) => {
          const c = Math.cos(a), s = Math.sin(a);
          BH.form(ctx, [[b[0] - c * w, b[1] - s * w, 1], [b[0] + c * w, b[1] + s * w, 1], [b[0] - s * len * 0.2 + c * 1, b[1] + c * len * 0.2 + s * 1],
            [b[0] - s * len, b[1] + c * len, 1]].map((q, i) => i === 3 ? q : q),
            { fill: TEETH, shade: '#C8BCD8', sd: 3, hi: '#FFFFFF', hd: 1.2, lw: 2, rim: null });
        };
        tooth([170, 20], 24 * p.jaw + 6, 0, 7);             // upper canine
        tooth([126, 20], 12 * p.jaw + 3, 0, 5);
        if (det) { tooth([150, 20], 8 * p.jaw + 3, 0, 4.5); tooth([182, 18], 8, 0.1, 4); }
        tooth(R([172, 26]), 22 * p.jaw + 6, jawA + Math.PI, 7);   // lower canine (points up)
        if (det) tooth(R([136, 28]), 9, jawA + Math.PI, 4.5);
      }
    }
    // lower jaw
    BH.form(ctx, rotPts(JAW, jawA, HINGE), mt(CREAM, { fill: '#C98E5C', ramp: ['#5E3A2A', '#8A5A3E', '#C98E5C', '#DCA878', '#EEC89A'], hi: '#E8BE8C', sd: 7, seed: 77 }));
    // hanging tongue (dead / stunned)
    if (p.tongue > 0.02) {
      const tl = p.tongue, b = R([146, 38]);
      const tp = [[b[0] - 16, b[1] - 6], [b[0] + 18, b[1] - 6], [b[0] + 22, b[1] + 26 * tl], [b[0] + 8, b[1] + 50 * tl, 1], [b[0] - 10, b[1] + 44 * tl], [b[0] - 16, b[1] + 14 * tl]];
      BH.form(ctx, tp, { fill: TONGUE, shade: '#C890B8', sd: 5, hi: '#FFB0C0', hd: 2, lw: 2.6, rim: '#FFA0C0', rd: 1.4,
        inner: lod < 2 ? null : (g) => line(g, [[b[0] + 2, b[1] - 2], [b[0] + 5, b[1] + 34 * tl]], 2.6, '#B8385A') });
    }
    // upper muzzle + nose
    BH.form(ctx, MUZZLE, mt(CREAM, { peak: [156, -22], seed: 79, inner: det ? (g) => {
      g.globalCompositeOperation = 'multiply';
      const k = clamp(p.jaw * 1.4, 0, 1);
      if (k > 0.2) for (let i = 0; i < 2; i++) {
        g.strokeStyle = BH.mono || '#A98298'; g.lineWidth = 3; g.lineCap = 'round';
        g.beginPath(); g.moveTo(124 + i * 12, -46 + i * 6); g.quadraticCurveTo(138 + i * 12, -40 - 8 * k + i * 6, 152 + i * 10, -48 + i * 6); g.stroke();
      }
      dot(g, 164, 2, 2.4, '#9C7890'); dot(g, 174, -2, 2.4, '#9C7890'); dot(g, 168, 10, 2.4, '#9C7890');
      g.globalCompositeOperation = 'source-over';
    } : null }));
    BH.form(ctx, NOSEP, mt(NOSE, { seed: 81, inner: lod > 0 ? (g) => { g.fillStyle = '#9A8EB8'; g.beginPath(); g.ellipse(194, -37, 5, 2.4, 0.3, 0, TAU); g.fill(); } : null }));
    // eye + brow (profile: one eye; dead = X)
    if (p.x > 0.5) {
      const ink = col(INK), e = [128, -52, 12];
      line(ctx, [[e[0] - e[2], e[1] - e[2]], [e[0] + e[2], e[1] + e[2]]], 6, ink);
      line(ctx, [[e[0] + e[2], e[1] - e[2]], [e[0] - e[2], e[1] + e[2]]], 6, ink);
    } else if (lod > 0) {
      const sq = clamp(p.jaw, 0, 1);
      ctx.save();
      ctx.translate(128, -50); ctx.rotate(-0.22);
      ctx.strokeStyle = col(INK); ctx.lineWidth = 5.5;
      ctx.beginPath(); ctx.ellipse(0, 0, 12, 8.5 - sq * 1.5, 0, 0, TAU); ctx.stroke();
      ctx.fillStyle = col('#FFEFC8'); ctx.fill();
      dot(ctx, 3, 1, 5, '#D2261C');
      dot(ctx, 3.5, 1, 2.6, '#140608');
      if (!BH.mono) dot(ctx, 5.4, -1.6, 1.5, '#FFFFFF');
      ctx.restore();
    }
    if (p.x <= 0.5 || lod === 0) {
      // heavy angry brow: thick end over the temple, pointed low end toward the snout
      BH.form(ctx, [[100, -74, 1], [126, -70], [156, -58, 1], [150, -50, 1], [124, -56], [104, -60, 1]],
        { fill: '#2A140C', hi: '#6A3E28', hd: 2.2, lw: 2.4 });
    }
  }

  // ------------------------------------------------------------------ the rig
  function drawBear(ctx, st, p) {
    const px = st.px || 1, lod = px < 0.15 ? 0 : px < 0.5 ? 1 : 2, T = st.T || 0;
    const mt = mtFor(lod), f = frames(p);
    const br = Math.sin(T * 2.4) * (p.x > 0.5 ? 0 : 1);
    // leg anchors + IK
    const anch = [f.T([6, 26]), f.T([252, 14]), f.T([6, 26]), f.T([252, 14])];
    const L = [[112, 108], [118, 106], [112, 108], [118, 106]];
    const legs = p.legs.map((lg, i) => {
      const A = anch[i];
      const P = [lg.t[0] + lg.rel[0] * A[0], lg.t[1] + lg.rel[1] * A[1]];
      const kw = ik(A, P, L[i][0], L[i][1], lg.b);
      return { A: A, K: kw[0], W: kw[1], flat: lg.flat, front: i % 2 === 1, near: i >= 2 };
    });
    function drawLeg(l, i) {
      const m = l.near ? FUR : FAR, fa = Math.atan2(l.W[1] - l.K[1], l.W[0] - l.K[0]);
      if (l.front) {
        limb(ctx, l.A, 54, l.K, 40, 50, mt(m, { sd: 16, seed: 11 + i }));
        limb(ctx, l.K, 40, l.W, 34, 42, mt(m, { sd: 14, seed: 21 + i }));
        const pa = lerp(fa, 0, l.flat);
        paw(ctx, l.W[0] + Math.cos(pa) * 10, l.W[1] + Math.sin(pa) * 10 + 6 * l.flat, pa, 44, 32, mt(m, { sd: 10, hd: 2.5, seed: 31 + i }), CLAW,
          lerp(40, 24, l.flat), 4, lod, 31 + i);
        if (l.near && lod > 0) {
          const cp = [lerp(l.K[0], l.W[0], 0.62), lerp(l.K[1], l.W[1], 0.62)];
          cuff(ctx, cp, fa, 42, mt);
          l.cuff = cp; l.fa = fa;
        }
      } else {
        limb(ctx, l.A, 68, l.K, 44, 62, mt(m, { sd: 18, seed: 41 + i }));
        limb(ctx, l.K, 44, l.W, 32, 38, mt(m, { sd: 12, seed: 51 + i }));
        const pa = lerp(fa, 0, l.flat);
        paw(ctx, l.W[0] + Math.cos(pa) * 18, l.W[1] + Math.sin(pa) * 18 + 6 * l.flat, pa, 50, 28, mt(m, { sd: 9, hd: 2.5, seed: 61 + i }), CLAW,
          lerp(26, 16, l.flat), 4, lod, 61 + i);
      }
    }
    // far legs
    drawLeg(legs[0], 0); drawLeg(legs[1], 1);
    // torso
    ctx.save();
    ctx.translate(p.hip[0], p.hip[1]); ctx.rotate(p.sa);
    ctx.scale(p.kx, p.ky * (1 + br * 0.012));
    BH.form(ctx, TAIL, mt(FUR, { sd: 6, seed: 5 }));
    BH.form(ctx, TORSO, mt(FUR, { peak: [150, -40], h: 0.5, seed: 7, inner: lod < 1 ? null : (g) => {
      // lighter chest / belly fur
      BH.decal(g, [[300, -30], [340, -40], [378, -6], [372, 52, 1], [330, 76], [276, 96, 1], [232, 88], [262, 40]], col('rgba(214,150,92,0.8)'));
      if (lod < 2) return;
      g.globalCompositeOperation = 'multiply';
      const fm = [[40, -70], [100, -84], [168, -96], [70, -30], [140, -44], [-40, -50], [0, 10], [200, 0], [-70, 10], [110, 30]];
      for (const q of fm) line(g, [[q[0] - 10, q[1] - 6], [q[0], q[1] + 4], [q[0] + 10, q[1] - 4]], 3, '#A48CB8');
      g.globalCompositeOperation = 'source-over';
    } }));
    ctx.restore();
    // near hind leg
    drawLeg(legs[2], 2);
    // head
    ctx.save();
    drawLeg(legs[3], 3);   // the near foreleg sits under the (big) head: raised paws frame the roaring face
    ctx.translate(f.neck[0], f.neck[1]); ctx.rotate(p.ha); ctx.scale(HS, HS);
    head(ctx, p, mt, lod, T);
    ctx.restore();
    // collar band: over the head's neck ruff, so it reads as a ring round the neck
    ctx.save();
    ctx.translate(f.collarO[0], f.collarO[1]); ctx.rotate(f.ca);
    // spikes sticking out of the top of the ring (read at small sizes)
    if (lod > 0) for (const sx of [-26, -2]) {
      BH.form(ctx, [[sx - 11, -96], [sx - 4 - (sx + 14) * 0.25, -134, 1], [sx + 11, -98]], mt(IRON, { ramp: null, sd: 3, hd: 1.8, lw: 2.6 }));
    }
    BH.form(ctx, COLLAR, mt(IRON, { peak: [-6, -50], seed: 91, inner: lod < 1 ? null : (g) => {
      g.globalCompositeOperation = 'multiply';
      const P = [];
      for (let i = 0; i <= 10; i++) { const a = -1.45 + i / 10 * 2.9; P.push([-10 + 22 * Math.cos(a), 102 * Math.sin(a)]); }
      line(g, P, 3, '#8A86B4');
      g.globalCompositeOperation = 'source-over';
      if (lod < 2) return;
      for (const a of [-1.05, -0.35, 0.35, 1.05]) {
        const x = -4 + 22 * Math.cos(a), y = 104 * Math.sin(a);
        dot(g, x + 1.5, y + 1.5, 5.4, '#141828'); dot(g, x, y, 4.6, '#A9B4DE'); dot(g, x - 1.4, y - 1.4, 1.7, '#FFFFFF');
      }
    } }));
    ctx.restore();
    // cuff stub chain, collar ring + main chain
    const nf = legs[3];
    const ground = p.cuff > 0.5;
    if (nf.cuff && lod > 0) {
      const nx = -Math.sin(nf.fa), ny = Math.cos(nf.fa), sg = ny >= 0 ? 1 : -1;
      const start = [nf.cuff[0] + nx * 40 * sg, nf.cuff[1] + ny * 40 * sg];
      const cpts = chainPts(start, 58, 3, [p.chain[0] * 0.6, p.chain[1] * 1.2, p.chain[2], p.chain[3]], T - 0.1, ground);
      drawChain(ctx, cpts, lod);
    }
    ring(ctx, f.ring, 17, lod);
    const main = chainPts([f.ring[0], f.ring[1] + 12], 150, 6, p.chain, T, ground);
    main.unshift([f.ring[0], f.ring[1]]);
    drawChain(ctx, main, lod);
    return f;
  }

  // anchors of the hanging pose (hook = back of the collar, pivot = belly centre). The rig is modelled ~640 tall
  // when rearing; K brings the standing height to the contract's 520 units.
  const K = 0.81;
  const REST = ragPose(0, false, 0);
  const RF = frames(REST);
  const HOOK0 = RF.back;
  const PIV0 = RF.T([150, 30]);

  HG.prey.bear = {
    units: 520,
    hook: [Math.round(HOOK0[0] * K), Math.round(HOOK0[1] * K)],
    pivot: [Math.round(PIV0[0] * K), Math.round(PIV0[1] * K)],
    draw(ctx, st) {
      const p = poseFor(st), lwK = BH.lwK;
      ctx.save();
      ctx.scale(K, K);
      BH.lwK = lwK / K;
      if (st.phase === 'hooked' || st.phase === 'flying') {
        const f = frames(p);
        ctx.translate(HOOK0[0] - f.back[0], HOOK0[1] - f.back[1]);
      }
      try { drawBear(ctx, { T: st.T, px: (st.px || 1) * K }, p); } finally { BH.lwK = lwK; ctx.restore(); }
    },
  };
})();

</script>
<script>
// ---- src/world/34-prey-dragon.js
// Prey: the Fire Dragon (red / black, fire #FF7D29 / #FF8E00). Side view, flying, faces RIGHT.
// 700 units nose → tail; (0, 0) sits just under the belly (no ground contact). Wingspan exceeds 700.
// Parts back → front: far wing, far legs, tail, neck, back plates + body, head, near legs, near wing, mouth flame.
// Every shape handed to BH.form is ONE simple contour (the cel shader's minus()/evenodd trick needs that).
(function () {
  'use strict';
  const HG = (window.HG = window.HG || {});
  const BH = window.BH;
  HG.prey = HG.prey || {};
  const TAU = Math.PI * 2, clamp = BH.clamp, lerp = BH.lerp, mix = BH.mix, M = BH.M;

  // ---------------------------------------------------------------- tiny vector kit
  function fr(x) { return x - Math.floor(x); }
  function rot(p, a) { const c = Math.cos(a), s = Math.sin(a); return [p[0] * c - p[1] * s, p[0] * s + p[1] * c]; }
  function add(a, b) { return [a[0] + b[0], a[1] + b[1]]; }
  function L2(a, b, k) { return [lerp(a[0], b[0], k), lerp(a[1], b[1], k)]; }
  function mid(a, b) { return [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2]; }
  function sharp(p) { return [p[0], p[1], 1]; }
  function ss(a, b, x) { return BH.sstep(a, b, x); }

  // ---------------------------------------------------------------- materials
  const DM = {
    hide: { fill: '#C9252D', ramp: ['#4A0712', '#88131F', '#C9252D', '#EA4E3C', '#FF8A5E'], gain: 0.9, h: 0.5,
      shade: '#B79CDC', sd: 20, deep: '#9277C4', dd: 7, rim: '#FFA24A', rd: 3.2, hi: '#FF8D62', hd: 3.5, lw: 3 },
    black: { fill: '#2C1824', ramp: ['#06030A', '#140A12', '#2C1824', '#4E3044', '#7A526C'], gain: 1.05, h: 0.55,
      shade: '#AFA0D6', sd: 7, rim: '#FF7D29', rd: 2.4, hi: '#6E4C64', hd: 2.2, lw: 3 },
    belly: { fill: '#F5AA3C', ramp: ['#9A4012', '#D46E1E', '#F5AA3C', '#FFD06A', '#FFF1AC'], gain: 0.9, h: 0.4,
      shade: '#D6A6CC', sd: 12, deep: '#B48AC0', dd: 4, rim: '#FFE38A', rd: 2, hi: '#FFF4BE', hd: 2.6, lw: 3 },
    memb: { fill: '#5E0C20', ramp: ['#1A0209', '#360612', '#5E0C20', '#84182C', '#A8283A'], gain: 0.8, h: 0.28,
      shade: '#B097D0', sd: 26, deep: '#8C72B6', dd: 9, rim: '#FF8E00', rd: 3, hi: '#9A2436', hd: 3, lw: 3 },
    fang: { fill: '#FFF3DA', shade: '#CDBEDD', sd: 3, rim: '#FFFFFF', rd: 1, hi: '#FFFFFF', hd: 1.2, lw: 2.2 },
    tongue: { fill: '#F0507A', ramp: ['#7A1030', '#B82A50', '#F0507A', '#FF7C9C', '#FFB0C4'], gain: 0.8, h: 0.4,
      shade: '#D0A0C8', sd: 5, rim: '#FF9AB4', rd: 1.5, hi: '#FFB6C8', hd: 1.6, lw: 2.4 },
  };

  // ---------------------------------------------------------------- head (local: jaw hinge at 0,0, snout → +x)
  const UPPER = [[-40, -6], [-36, -38], [-12, -58], [26, -60], [58, -46], [92, -38], [116, -40], [133, -30], [139, -12], [133, 2, 1], [100, 4], [60, 6], [20, 8], [-12, 14], [-34, 10]];

  // ---------------------------------------------------------------- legs
