  // ===========================================================================
  // Backgrounds: paper, blueprint, stripes
  // ===========================================================================

  function renderScale() {
    return FILM.S || 1;
  }

  /**
   * paper(ctx, opts) : cream paper with mottling, grain and fibres. Cached by size, seed and options.
   *   x, y, w, h   0, 0, 1080, 1920
   *   color        pal.paper
   *   seed         3
   *   grain        1      fine grain strength
   *   fibres       1      fibre count multiplier
   *   mottle       1      large soft blotches
   *   vignette     0.35   darkened edges
   */
  function paper(ctx, o = {}) {
    const x = o.x || 0, y = o.y || 0;
    const w = o.w || W(), h = o.h || H();
    const S = renderScale();
    const color = o.color || pal.paper;
    const seed = seedInt(o.seed === undefined ? 3 : o.seed);
    const grain = o.grain != null ? o.grain : 1;
    const fibres = o.fibres != null ? o.fibres : 1;
    const mottle = o.mottle != null ? o.mottle : 1;
    const vignette = o.vignette != null ? o.vignette : 0.35;
    const key = ['paper', w, h, S, color, seed, grain, fibres, mottle, vignette].join('|');
    const c = cached(key, () => makePaper(Math.max(1, Math.round(w * S)), Math.max(1, Math.round(h * S)), S, color, seed, grain, fibres, mottle, vignette));
    ctx.drawImage(c, x, y, w, h);
  }

  function makePaper(cw, ch, S, color, seed, grain, fibres, mottle, vignette) {
    const c = newCanvas(cw, ch);
    const g = c.getContext('2d');
    const [br, bg, bb] = parseColor(color);
    // mottling from a low-resolution noise field, upscaled smooth
    const mw = Math.max(4, Math.ceil(cw / 18)), mh = Math.max(4, Math.ceil(ch / 18));
    const mf = new Float32Array(mw * mh);
    for (let j = 0; j < mh; j++) {
      for (let i = 0; i < mw; i++) {
        mf[j * mw + i] = lib.fbm2(i * 0.11, j * 0.11, seed, 4) * 0.8 + noise2(i * 0.5, j * 0.5, seed + 9) * 0.2;
      }
    }
    const img = g.createImageData(cw, ch);
    const d = img.data;
    const fx = (mw - 1) / cw, fy = (mh - 1) / ch;
    const cxv = cw / 2, cyv = ch / 2;
    const vr = Math.hypot(cxv, cyv);
    for (let py = 0; py < ch; py++) {
      const my = py * fy;
      const jy = Math.floor(my), ty = my - jy;
      const jy1 = Math.min(mh - 1, jy + 1);
      for (let px = 0; px < cw; px++) {
        const mx = px * fx;
        const ix = Math.floor(mx), tx = mx - ix;
        const ix1 = Math.min(mw - 1, ix + 1);
        const m =
          lerp(lerp(mf[jy * mw + ix], mf[jy * mw + ix1], tx), lerp(mf[jy1 * mw + ix], mf[jy1 * mw + ix1], tx), ty);
        const n = h3(px, py, seed + 77);
        const n2 = h3(px >> 1, py >> 1, seed + 78);
        const gr = ((n - 0.5) * 0.6 + (n2 - 0.5) * 0.4) * 0.07 * grain;
        const dxv = (px - cxv) / vr, dyv = (py - cyv) / vr;
        const vig = vignette * Math.max(0, dxv * dxv + dyv * dyv - 0.35) * 0.18;
        const k = 1 + m * 0.055 * mottle + gr - vig;
        const i = (py * cw + px) * 4;
        // darker areas go slightly warmer, like aged paper
        d[i] = br * k;
        d[i + 1] = bg * (k - (1 - k) * 0.12);
        d[i + 2] = bb * (k - (1 - k) * 0.35);
        d[i + 3] = 255;
      }
    }
    g.putImageData(img, 0, 0);
    // fibres
    const r = rng(seed + 5);
    const count = Math.round(((cw * ch) / (S * S)) / 1500 * fibres);
    const dark = new Path2D(), light = new Path2D();
    for (let i = 0; i < count; i++) {
      const x = r() * cw, y = r() * ch;
      const L = r.range(5, 26) * S * (r() < 0.08 ? 2.5 : 1);
      const a = r() * TAU;
      const bend = r.range(-0.5, 0.5) * L;
      const p = r() < 0.55 ? dark : light;
      const ex = x + Math.cos(a) * L, ey = y + Math.sin(a) * L;
      p.moveTo(x, y);
      p.quadraticCurveTo((x + ex) / 2 - Math.sin(a) * bend, (y + ey) / 2 + Math.cos(a) * bend, ex, ey);
    }
    g.lineCap = 'round';
    g.lineWidth = 0.7 * S;
    g.strokeStyle = lib.rgba(pal.inkSoft, 0.07);
    g.stroke(dark);
    g.lineWidth = 1.1 * S;
    g.strokeStyle = 'rgba(255,252,242,0.22)';
    g.stroke(light);
    // specks and faint foxing spots
    const specks = new Path2D();
    for (let i = 0; i < count * 0.08; i++) {
      const x = r() * cw, y = r() * ch, rad = r.range(0.3, 1.1) * S;
      specks.moveTo(x + rad, y);
      specks.arc(x, y, rad, 0, TAU);
    }
    g.fillStyle = lib.rgba(pal.inkSoft, 0.22);
    g.fill(specks);
    for (let i = 0; i < 6 * mottle; i++) {
      const x = r() * cw, y = r() * ch, rad = r.range(30, 120) * S;
      const gr = g.createRadialGradient(x, y, 0, x, y, rad);
      gr.addColorStop(0, lib.rgba(pal.paperDeep, 0.07));
      gr.addColorStop(1, lib.rgba(pal.paperDeep, 0));
      g.fillStyle = gr;
      g.fillRect(x - rad, y - rad, rad * 2, rad * 2);
    }
    return c;
  }
  lib.paper = paper;

  /**
   * blueprint(ctx, opts) : navy plate with faint grid, big guide circles, long diagonals and noise.
   * Cached by size, seed and options.
   *   x, y, w, h   0, 0, 1080, 1920
   *   color        pal.navy
   *   seed         5
   *   grid         60      grid pitch (px); 0 turns the grid off
   *   major        5       every Nth grid line is stronger
   *   center       [0.5w, 0.44h]  centre of the guide circles
   *   circles      4
   *   diagonals    5
   *   noise        1
   *   marks        true    corner registration marks
   */
  function blueprint(ctx, o = {}) {
    const x = o.x || 0, y = o.y || 0;
    const w = o.w || W(), h = o.h || H();
    const S = renderScale();
    const opt = {
      color: o.color || pal.navy,
      seed: seedInt(o.seed === undefined ? 5 : o.seed),
      grid: o.grid != null ? o.grid : 60,
      major: o.major || 5,
      center: o.center || [w * 0.5, h * 0.44],
      circles: o.circles != null ? o.circles : 4,
      diagonals: o.diagonals != null ? o.diagonals : 5,
      noise: o.noise != null ? o.noise : 1,
      marks: o.marks !== false,
      line: o.line || pal.lavender,
    };
    const key = ['blueprint', w, h, S, JSON.stringify(opt)].join('|');
    const c = cached(key, () => makeBlueprint(w, h, S, opt));
    ctx.drawImage(c, x, y, w, h);
  }

  function makeBlueprint(w, h, S, o) {
    const cw = Math.max(1, Math.round(w * S)), ch = Math.max(1, Math.round(h * S));
    const c = newCanvas(cw, ch);
    const g = c.getContext('2d');
    const [br, bgc, bb] = parseColor(o.color);
    const [dr, dg, db] = parseColor(pal.navyDeep);
    const [lr, lg, lb] = parseColor(pal.navyLight);
    const img = g.createImageData(cw, ch);
    const d = img.data;
    const ccx = o.center[0] * S, ccy = o.center[1] * S;
    const R = Math.hypot(cw, ch) * 0.62;
    for (let py = 0; py < ch; py++) {
      for (let px = 0; px < cw; px++) {
        const rd = Math.min(1, Math.hypot(px - ccx, py - ccy) / R);
        // light centre falling to deep edges
        const t = rd * rd;
        let r = rd < 0.35 ? lerp(lr, br, rd / 0.35) : lerp(br, dr, (t - 0.1225) / 0.8775);
        let gg = rd < 0.35 ? lerp(lg, bgc, rd / 0.35) : lerp(bgc, dg, (t - 0.1225) / 0.8775);
        let b = rd < 0.35 ? lerp(lb, bb, rd / 0.35) : lerp(bb, db, (t - 0.1225) / 0.8775);
        const n = (h3(px, py, o.seed + 3) - 0.5) * 9 * o.noise + (h3(px >> 2, py >> 2, o.seed + 4) - 0.5) * 5 * o.noise;
        const i = (py * cw + px) * 4;
        d[i] = r + n * 0.8;
        d[i + 1] = gg + n * 0.85;
        d[i + 2] = b + n;
        d[i + 3] = 255;
      }
    }
    g.putImageData(img, 0, 0);
    g.scale(S, S);
    const r = rng(o.seed);
    const line = o.line;
    // grid
    if (o.grid > 0) {
      const minor = new Path2D(), major = new Path2D();
      let k = 0;
      for (let gx = (w / 2) % o.grid; gx <= w; gx += o.grid, k++) {
        const p = Math.round((gx - w / 2) / o.grid) % o.major === 0 ? major : minor;
        p.moveTo(gx, 0);
        p.lineTo(gx, h);
      }
      for (let gy = (h / 2) % o.grid; gy <= h; gy += o.grid) {
        const p = Math.round((gy - h / 2) / o.grid) % o.major === 0 ? major : minor;
        p.moveTo(0, gy);
        p.lineTo(w, gy);
      }
      g.lineWidth = 1;
      g.strokeStyle = lib.rgba(pal.grid, 0.3);
      g.stroke(minor);
      g.strokeStyle = lib.rgba(pal.grid, 0.5);
      g.stroke(major);
    }
    // long diagonals
    const [cx, cy] = o.center;
    for (let i = 0; i < o.diagonals; i++) {
      const a = r.range(0, Math.PI);
      const ox = cx + r.range(-0.35, 0.35) * w, oy = cy + r.range(-0.3, 0.3) * h;
      const L = Math.hypot(w, h);
      g.beginPath();
      g.moveTo(ox - Math.cos(a) * L, oy - Math.sin(a) * L);
      g.lineTo(ox + Math.cos(a) * L, oy + Math.sin(a) * L);
      g.lineWidth = r.range(0.8, 1.3);
      g.strokeStyle = lib.rgba(line, r.range(0.07, 0.14));
      if (r() < 0.35) g.setLineDash([r.range(6, 14), r.range(6, 12)]);
      else g.setLineDash([]);
      g.stroke();
    }
    g.setLineDash([]);
    // guide circles
    const minDim = Math.min(w, h);
    for (let i = 0; i < o.circles; i++) {
      const rad = minDim * (0.2 + i * 0.17) * r.range(0.95, 1.05);
      g.beginPath();
      g.arc(cx, cy, rad, 0, TAU);
      g.lineWidth = i === o.circles - 1 ? 1.4 : 1;
      g.strokeStyle = lib.rgba(line, i % 2 ? 0.1 : 0.16);
      if (i === 1) g.setLineDash([2, 7]);
      else g.setLineDash([]);
      g.stroke();
    }
    g.setLineDash([]);
    if (o.circles > 0) {
      const rad = minDim * (0.2 + (o.circles - 1) * 0.17);
      ticksImpl(g, cx, cy, { r: rad, n: 120, len: 7, major: 10, majorLen: 16, color: line, alpha: 0.2, width: 1 });
      // off-centre satellite circle
      const a = r.range(0, TAU);
      const sr = minDim * r.range(0.07, 0.12);
      g.beginPath();
      g.arc(cx + Math.cos(a) * rad, cy + Math.sin(a) * rad, sr, 0, TAU);
      g.lineWidth = 1;
      g.strokeStyle = lib.rgba(line, 0.14);
      g.stroke();
      // centre crosshair
      g.beginPath();
      g.moveTo(cx - 18, cy);
      g.lineTo(cx + 18, cy);
      g.moveTo(cx, cy - 18);
      g.lineTo(cx, cy + 18);
      g.strokeStyle = lib.rgba(line, 0.22);
      g.stroke();
    }
    // corner registration marks
    if (o.marks) {
      g.strokeStyle = lib.rgba(line, 0.32);
      g.lineWidth = 1.2;
      const m = 34, s = 22;
      for (const [mx, my, sx, sy] of [[m, m, 1, 1], [w - m, m, -1, 1], [m, h - m, 1, -1], [w - m, h - m, -1, -1]]) {
        g.beginPath();
        g.moveTo(mx, my + sy * s);
        g.lineTo(mx, my);
        g.lineTo(mx + sx * s, my);
        g.stroke();
      }
    }
    // faint scattered star specks
    const sp = new Path2D();
    for (let i = 0; i < (w * h) / 5000 * o.noise; i++) {
      const x = r() * w, y = r() * h, rad = r.range(0.4, 1.1);
      sp.moveTo(x + rad, y);
      sp.arc(x, y, rad, 0, TAU);
    }
    g.fillStyle = lib.rgba(pal.lineWhite, 0.22);
    g.fill(sp);
    return c;
  }
  lib.blueprint = blueprint;

  /**
   * stripes(ctx, opts) : the wide diagonal stripe background with softly irregular edges.
   *   colors   [pal.stripeCream, pal.stripeYellow]
   *   width    140     band width (px); both colours use it
   *   angle    -0.52   stripe direction (radians): 30 degrees rising left to right
   *   offset   0       scroll along the normal (animate this)
   *   wobble   1.4     edge irregularity (px)
   *   bounds   frame
   *   seed     21
   */
  function stripes(ctx, o = {}) {
    const B = normBounds(o.bounds);
    const cols = o.colors || [pal.stripeCream, pal.stripeYellow];
    const sw = o.width || 140;
    const angle = o.angle != null ? o.angle : -0.52;
    const offset = o.offset || 0;
    const wobble = o.wobble != null ? o.wobble : 1.4;
    const seed = seedInt(o.seed === undefined ? 21 : o.seed);
    const dx = Math.cos(angle), dy = Math.sin(angle);
    const nx = -dy, ny = dx;
    const cx = B.x + B.w / 2, cy = B.y + B.h / 2;
    const half = Math.hypot(B.w, B.h) / 2 + sw * 2;
    ctx.save();
    ctx.beginPath();
    ctx.rect(B.x, B.y, B.w, B.h);
    ctx.clip();
    ctx.fillStyle = cols[0];
    ctx.fillRect(B.x, B.y, B.w, B.h);
    const period = sw * cols.length;
    const shift = ((offset % period) + period) % period;
    const edge = (v, k, forward) => {
      const pts = [];
      const n = Math.ceil((half * 2) / 40);
      for (let i = 0; i <= n; i++) {
        const u = -half + (i / n) * half * 2;
        const vv = v + wobble * noise1(u * 0.012 + k * 3.7, seed) + wobble * 0.3 * noise1(u * 0.05, seed + k);
        pts.push([cx + dx * u + nx * vv, cy + dy * u + ny * vv]);
      }
      if (!forward) pts.reverse();
      return pts;
    };
    for (let ci = 1; ci < cols.length; ci++) {
      const p = new Path2D();
      const first = Math.floor((-half - shift) / period) - 1;
      const last = Math.ceil((half - shift) / period) + 1;
      for (let k = first; k <= last; k++) {
        const v0 = k * period + shift + sw * ci - half * 0;
        const a = edge(v0, k * 2 + ci, true);
        const b = edge(v0 + sw, k * 2 + ci + 1, false);
        a.forEach((pt, i) => (i === 0 ? p.moveTo(pt[0], pt[1]) : p.lineTo(pt[0], pt[1])));
        b.forEach((pt) => p.lineTo(pt[0], pt[1]));
        p.closePath();
      }
      ctx.fillStyle = cols[ci];
      ctx.fill(p);
    }
    ctx.restore();
  }
  lib.stripes = stripes;

  // ===========================================================================
  // Schematic helpers
  // ===========================================================================

  /**
   * hexLattice(ctx, clip, opts) : hexagonal cell lattice with shared, slightly irregular vertices.
   *   r         16       cell circumradius (px)
   *   pointy    true     pointy-top cells (false = flat-top)
   *   width     1
   *   color     pal.lavender
   *   alpha     0.35
   *   jitter    1.0      vertex irregularity (px), shared by neighbouring cells
   *   inset     0        >0 draws each cell as its own hexagon shrunk by this many px
   *   cellFn    null     fn(cx, cy, i, j) => false (skip) | true | { fill, alpha, stroke }
   *   dots      0        radius of a dot at each cell centre (0 = none)
   *   boilAmp   0.35
   *   clip      true     hard-clip to the shape
   *   bounds    frame    when clip is a function, Path2D or null
   *   seed      17
   */
  function hexLattice(ctx, clip, o = {}) {
    const shape = shapeOf(clip, Object.assign({ pad: (o.r || 16) * 2 }, o));
    const R = o.r || 16;
    const pointy = o.pointy !== false;
    const seed = seedInt(o.seed === undefined ? 17 : o.seed);
    const jitter = o.jitter != null ? o.jitter : 1.0;
    const boilAmp = o.boil === false ? 0 : o.boilAmp != null ? o.boilAmp : 0.35;
    const bi = boilIndex(o);
    const inset = o.inset || 0;
    const B = shape.bounds;
    const sq3 = Math.sqrt(3);
    const colW = pointy ? sq3 * R : 1.5 * R;
    const rowH = pointy ? 1.5 * R : sq3 * R;
    const vtx = (x, y) => {
      const kx = Math.round(x * 4), ky = Math.round(y * 4);
      const jx = (h3(kx, ky, seed) - 0.5) * 2 * jitter + (boilAmp ? (h3(kx, ky, seed + bi * 13 + 1) - 0.5) * 2 * boilAmp : 0);
      const jy = (h3(ky, kx, seed + 2) - 0.5) * 2 * jitter + (boilAmp ? (h3(ky, kx, seed + bi * 17 + 3) - 0.5) * 2 * boilAmp : 0);
      return [x + jx, y + jy];
    };
    const edges = new Path2D();
    const dots = new Path2D();
    const fills = [];
    const i0 = Math.floor(B.y / rowH) - 1, i1 = Math.ceil((B.y + B.h) / rowH) + 1;
    const j0 = Math.floor(B.x / colW) - 1, j1 = Math.ceil((B.x + B.w) / colW) + 1;
    for (let i = i0; i <= i1; i++) {
      for (let j = j0; j <= j1; j++) {
        let cx, cy;
        if (pointy) {
          cx = j * colW + (i & 1 ? colW / 2 : 0);
          cy = i * rowH;
        } else {
          cx = j * colW;
          cy = i * rowH + (j & 1 ? rowH / 2 : 0);
        }
        if (shape.polys && !polysContain(shape.polys, cx, cy)) {
          // keep cells that straddle the edge so the hard clip cuts them cleanly
          let near = false;
          for (let k = 0; k < 6 && !near; k++) {
            const a = (k / 6) * TAU + (pointy ? Math.PI / 6 : 0);
            near = polysContain(shape.polys, cx + Math.cos(a) * R, cy + Math.sin(a) * R);
          }
          if (!near) continue;
        }
        let cell = true;
        if (o.cellFn) {
          cell = o.cellFn(cx, cy, i, j);
          if (!cell) continue;
        }
        const V = [];
        for (let k = 0; k < 6; k++) {
          const a = (k / 6) * TAU + (pointy ? Math.PI / 6 : 0);
          V.push(vtx(cx + Math.cos(a) * R, cy + Math.sin(a) * R));
        }
        if (typeof cell === 'object' && cell.fill) fills.push([V, cell]);
        if (inset > 0) {
          for (let k = 0; k < 6; k++) {
            const v = V[k];
            const f = Math.max(0, 1 - inset / R);
            const x = cx + (v[0] - cx) * f, y = cy + (v[1] - cy) * f;
            if (k === 0) edges.moveTo(x, y);
            else edges.lineTo(x, y);
          }
          edges.closePath();
        } else {
          // three edges per cell so shared edges are drawn once
          const ks = pointy ? [5, 0, 1] : [0, 1, 2];
          for (const k of ks) {
            edges.moveTo(V[k][0], V[k][1]);
            edges.lineTo(V[(k + 1) % 6][0], V[(k + 1) % 6][1]);
          }
          // cells on the left/top border of the drawn set need their other edges
          if (o.cellFn || shape.polys) {
            for (const k of pointy ? [2, 3, 4] : [3, 4, 5]) {
              edges.moveTo(V[k][0], V[k][1]);
              edges.lineTo(V[(k + 1) % 6][0], V[(k + 1) % 6][1]);
            }
          }
        }
        if (o.dots) {
          dots.moveTo(cx + o.dots, cy);
          dots.arc(cx, cy, o.dots, 0, TAU);
        }
      }
    }
    ctx.save();
    if (shape.apply && o.clip !== false) shape.apply(ctx);
    const color = o.color || pal.lavender;
    const alpha = o.alpha != null ? o.alpha : 0.35;
    for (const [V, cell] of fills) {
      ctx.beginPath();
      lib.tracePath(ctx, V, true);
      ctx.globalAlpha = cell.alpha != null ? cell.alpha : 0.35;
      ctx.fillStyle = cell.fill;
      ctx.fill();
    }
    ctx.globalAlpha = alpha;
    ctx.lineWidth = o.width != null ? o.width : 1;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.strokeStyle = color;
    ctx.stroke(edges);
    if (o.dots) {
      ctx.fillStyle = color;
      ctx.fill(dots);
    }
    ctx.restore();
  }
  lib.hexLattice = hexLattice;

  function needle(p, x0, y0, x1, y1, w0, w1) {
    const dx = x1 - x0, dy = y1 - y0;
    const L = Math.hypot(dx, dy) || 1;
    const nx = -dy / L, ny = dx / L;
    p.moveTo(x0 + nx * w0, y0 + ny * w0);
    p.lineTo(x1 + nx * w1, y1 + ny * w1);
    p.lineTo(x1 - nx * w1, y1 - ny * w1);
    p.lineTo(x0 - nx * w0, y0 - ny * w0);
    p.closePath();
  }

  /**
   * glowDot(ctx, x, y, r, opts) : soft glow, hot core and star rays (a nucleus, a spark, a star).
   *   color     pal.glow    glow colour
   *   core      '#ffffff'
   *   rays      8           ray count (0 = none); long and short alternate
   *   rayLen    3.4         ray length as a multiple of r
   *   rayWidth  0.22        ray base width as a multiple of r
   *   rot       0
   *   glow      4.5         glow radius as a multiple of r
   *   intensity 1
   *   twinkle   0.18        per boil drawing flicker
   *   additive  true        'lighter' blending (use false on paper)
   *   seed      19
   */
  function glowDot(ctx, x, y, r, o = {}) {
    const seed = seedInt(o.seed === undefined ? 19 : o.seed);
    const bi = boilIndex(o);
    const tw = o.twinkle != null ? o.twinkle : 0.18;
    const k = (o.intensity != null ? o.intensity : 1) * (1 - tw + tw * 2 * h3(bi, seed, 23));
    const color = o.color || pal.glow;
    const glowR = r * (o.glow != null ? o.glow : 4.5);
    ctx.save();
    if (o.additive !== false) ctx.globalCompositeOperation = 'lighter';
    const base = ctx.globalAlpha;
    const g = ctx.createRadialGradient(x, y, 0, x, y, glowR);
    g.addColorStop(0, lib.rgba(color, 0.55 * k));
    g.addColorStop(0.18, lib.rgba(color, 0.22 * k));
    g.addColorStop(0.5, lib.rgba(color, 0.06 * k));
    g.addColorStop(1, lib.rgba(color, 0));
    ctx.fillStyle = g;
    ctx.fillRect(x - glowR, y - glowR, glowR * 2, glowR * 2);
    const rays = o.rays != null ? o.rays : 8;
    if (rays > 0) {
      const p = new Path2D();
      const rot = o.rot || 0;
      const rl = r * (o.rayLen != null ? o.rayLen : 3.4);
      const rw = r * (o.rayWidth != null ? o.rayWidth : 0.22);
      for (let i = 0; i < rays; i++) {
        const a = rot + (i / rays) * TAU;
        const L = (i % 2 ? 0.52 : 1) * rl * (0.9 + 0.2 * h3(i, bi, seed));
        needle(p, x, y, x + Math.cos(a) * L, y + Math.sin(a) * L, rw, 0.05);
      }
      ctx.globalAlpha = base * Math.min(1, 0.85 * k);
      ctx.fillStyle = o.core || '#ffffff';
      ctx.fill(p);
    }
    ctx.globalAlpha = base * Math.min(1, k);
    const cg = ctx.createRadialGradient(x, y, 0, x, y, r);
    cg.addColorStop(0, o.core || '#ffffff');
    cg.addColorStop(0.55, lib.rgba(o.core || '#ffffff', 0.9));
    cg.addColorStop(1, lib.rgba(color, 0));
    ctx.fillStyle = cg;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, TAU);
    ctx.fill();
    ctx.restore();
  }
  lib.glowDot = glowDot;

  function ticksImpl(ctx, x, y, o) {
    const p = new Path2D();
    const pm = new Path2D();
    const n = o.n || 24;
    const len = o.len != null ? o.len : 12;
    const major = o.major || 0;
    const majorLen = o.majorLen != null ? o.majorLen : len * 1.8;
    const prog = o.p != null ? clamp(o.p) : 1;
    const count = Math.round(n * prog);
    if (o.kind === 'linear' || (o.r == null && o.length != null)) {
      const L = o.length || 300;
      const a = o.angle || 0;
      const dx = Math.cos(a), dy = Math.sin(a);
      const side = o.side || 1;
      const nx = -dy * side, ny = dx * side;
      for (let i = 0; i <= Math.round(n * prog); i++) {
        const u = (i / n) * L;
        const isMajor = major && i % major === 0;
        const l = isMajor ? majorLen : len;
        const tgt = isMajor ? pm : p;
        tgt.moveTo(x + dx * u, y + dy * u);
        tgt.lineTo(x + dx * u + nx * l, y + dy * u + ny * l);
      }
      if (o.baseline !== false) {
        pm.moveTo(x, y);
        pm.lineTo(x + dx * L * prog, y + dy * L * prog);
      }
    } else {
      const r = o.r != null ? o.r : 40;
      const a0 = (o.start || 0) + (o.rot || 0);
      const span = o.span != null ? o.span : TAU;
      const full = Math.abs(span - TAU) < 1e-6;
      const dir = o.inward ? -1 : 1;
      for (let i = 0; i < count; i++) {
        const a = a0 + (i / (full ? n : Math.max(1, n - 1))) * span;
        const isMajor = major && i % major === 0;
        const l = (isMajor ? majorLen : len) * dir;
        const tgt = isMajor ? pm : p;
        const c = Math.cos(a), s = Math.sin(a);
        tgt.moveTo(x + c * r, y + s * r);
        tgt.lineTo(x + c * (r + l), y + s * (r + l));
      }
    }
    ctx.save();
    ctx.lineCap = 'round';
    ctx.strokeStyle = o.color || pal.lineWhite;
    ctx.globalAlpha *= o.alpha != null ? o.alpha : 0.6;
    ctx.lineWidth = o.width != null ? o.width : 1.5;
    ctx.stroke(p);
    ctx.lineWidth = (o.width != null ? o.width : 1.5) * 1.35;
    ctx.stroke(pm);
    ctx.restore();
  }

  /**
   * ticks(ctx, x, y, opts) : radial ticks around a circle, or a linear ruler.
   * Radial (default):  r 40, n 24, len 12, start 0, span TAU, major 0, majorLen len*1.8, inward false, rot 0
   * Linear (kind 'linear' or length given): length 300, angle 0, n 24, len 12, major 0, side 1, baseline true
   * Both: color pal.lineWhite, alpha 0.6, width 1.5, p 1 (draw-on progress)
   */
  lib.ticks = (ctx, x, y, o = {}) => ticksImpl(ctx, x, y, o);

  function labelAt(ctx, str, x, y, o) {
    lib.text(ctx, str, x, y, {
      size: o.labelSize || 22,
      color: o.labelColor || o.color,
      alpha: o.alpha != null ? o.alpha : 0.9,
      align: o.labelAlign || 'center',
      baseline: 'middle',
      weight: 400,
      tracking: 1,
    });
  }

  /**
   * bracket(ctx, x1, y1, x2, y2, opts) : a measurement bracket between two points.
   *   style    'dim'    'dim' = dimension line with end bars and arrow ticks, 'square' = [ shape
   *   offset   0        perpendicular offset of the bracket from the measured points (px)
   *   cap      16       end bar length
   *   color    pal.lavender
   *   alpha    0.6
   *   width    1.5
   *   label    null     text at the middle
   *   p        1        draw-on progress
   */
  lib.bracket = (ctx, x1, y1, x2, y2, o = {}) => {
    const dx = x2 - x1, dy = y2 - y1;
    const L = Math.hypot(dx, dy) || 1;
    const ux = dx / L, uy = dy / L;
    const nx = -uy, ny = ux;
    const off = o.offset || 0;
    const cap = o.cap != null ? o.cap : 16;
    const prog = o.p != null ? clamp(o.p) : 1;
    const ax = x1 + nx * off, ay = y1 + ny * off;
    const bx = x2 + nx * off, by = y2 + ny * off;
    const mx = (ax + bx) / 2, my = (ay + by) / 2;
    const h = (L / 2) * prog;
    const p = new Path2D();
    const style = o.style || 'dim';
    const labelGap = o.label ? Math.min(h * 0.9, (String(o.label).length * (o.labelSize || 22)) * 0.34 + 10) : 0;
    const sx = mx - ux * h, sy = my - uy * h, ex = mx + ux * h, ey = my + uy * h;
    if (style === 'square') {
      const sgn = off >= 0 ? -1 : 1;
      p.moveTo(sx + nx * cap * sgn, sy + ny * cap * sgn);
      p.lineTo(sx, sy);
      p.lineTo(mx - ux * labelGap, my - uy * labelGap);
      p.moveTo(mx + ux * labelGap, my + uy * labelGap);
      p.lineTo(ex, ey);
      p.lineTo(ex + nx * cap * sgn, ey + ny * cap * sgn);
    } else {
      p.moveTo(sx, sy);
      p.lineTo(mx - ux * labelGap, my - uy * labelGap);
      p.moveTo(mx + ux * labelGap, my + uy * labelGap);
      p.lineTo(ex, ey);
      p.moveTo(sx - nx * cap * 0.5, sy - ny * cap * 0.5);
      p.lineTo(sx + nx * cap * 0.5, sy + ny * cap * 0.5);
      p.moveTo(ex - nx * cap * 0.5, ey - ny * cap * 0.5);
      p.lineTo(ex + nx * cap * 0.5, ey + ny * cap * 0.5);
      const ah = Math.min(9, h * 0.3);
      p.moveTo(sx + ux * ah + nx * ah * 0.5, sy + uy * ah + ny * ah * 0.5);
      p.lineTo(sx, sy);
      p.lineTo(sx + ux * ah - nx * ah * 0.5, sy + uy * ah - ny * ah * 0.5);
      p.moveTo(ex - ux * ah + nx * ah * 0.5, ey - uy * ah + ny * ah * 0.5);
      p.lineTo(ex, ey);
      p.lineTo(ex - ux * ah - nx * ah * 0.5, ey - uy * ah - ny * ah * 0.5);
      if (off) {
        // extension lines back to the measured points
        p.moveTo(x1 + nx * Math.sign(off) * 4, y1 + ny * Math.sign(off) * 4);
        p.lineTo(ax + nx * Math.sign(off) * cap * 0.6, ay + ny * Math.sign(off) * cap * 0.6);
        p.moveTo(x2 + nx * Math.sign(off) * 4, y2 + ny * Math.sign(off) * 4);
        p.lineTo(bx + nx * Math.sign(off) * cap * 0.6, by + ny * Math.sign(off) * cap * 0.6);
      }
    }
    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = o.color || pal.lavender;
    ctx.globalAlpha *= o.alpha != null ? o.alpha : 0.6;
    ctx.lineWidth = o.width != null ? o.width : 1.5;
    ctx.stroke(p);
    ctx.restore();
    if (o.label && prog > 0.6) {
      ctx.save();
      ctx.translate(mx, my);
      let a = Math.atan2(uy, ux);
      if (a > Math.PI / 2 || a < -Math.PI / 2) a += Math.PI;
      ctx.rotate(a);
      ctx.globalAlpha *= clamp((prog - 0.6) / 0.4);
      labelAt(ctx, o.label, 0, 0, Object.assign({ color: o.color || pal.lavender }, o));
      ctx.restore();
    }
  };

  /**
   * guideCircle(ctx, cx, cy, r, opts) : a faint construction circle.
   *   color pal.lavender, alpha 0.15, width 1.5, dash null ([on, off]),
   *   p 1 (draw-on progress), start -PI/2, cross 0 (centre crosshair half-size),
   *   quadrants 0 (tick length at the four quadrant points), ink false (hand-drawn via inkPath), seed
   */
  lib.guideCircle = (ctx, cx, cy, r, o = {}) => {
    const prog = o.p != null ? clamp(o.p) : 1;
    if (prog <= 0) return;
    const start = o.start != null ? o.start : -Math.PI / 2;
    const color = o.color || pal.lavender;
    const alpha = o.alpha != null ? o.alpha : 0.15;
    const width = o.width != null ? o.width : 1.5;
    ctx.save();
    if (o.ink) {
      const n = Math.max(12, Math.ceil(r * TAU * prog / 10));
      const pts = [];
      for (let i = 0; i <= n; i++) {
        const a = start + (i / n) * TAU * prog;
        pts.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]);
      }
      inkPath(ctx, pts, { closed: prog >= 1, width: width * 1.4, color, alpha, seed: o.seed, taper: [6, 12], wobble: 1.2 });
    } else {
      ctx.beginPath();
      ctx.arc(cx, cy, r, start, start + TAU * prog);
      ctx.strokeStyle = color;
      ctx.globalAlpha *= alpha;
      ctx.lineWidth = width;
      ctx.lineCap = 'round';
      if (o.dash) ctx.setLineDash(o.dash);
      ctx.stroke();
      ctx.setLineDash([]);
    }
    if (o.cross || o.quadrants) {
      const p = new Path2D();
      if (o.cross) {
        p.moveTo(cx - o.cross, cy);
        p.lineTo(cx + o.cross, cy);
        p.moveTo(cx, cy - o.cross);
        p.lineTo(cx, cy + o.cross);
      }
      if (o.quadrants) {
        for (let k = 0; k < 4; k++) {
          const a = (k * Math.PI) / 2;
          const c = Math.cos(a), s = Math.sin(a);
          p.moveTo(cx + c * (r - o.quadrants), cy + s * (r - o.quadrants));
          p.lineTo(cx + c * (r + o.quadrants), cy + s * (r + o.quadrants));
        }
      }
      if (o.ink) {
        ctx.strokeStyle = color;
        ctx.globalAlpha *= alpha;
      }
      ctx.lineWidth = width;
      ctx.stroke(p);
    }
    ctx.restore();
  };

  /**
   * arcAnnotation(ctx, cx, cy, r, a0, a1, opts) : a thin coloured arc over an illustration
   * (flight paths, sound, attention), with an arrowhead and an origin dot.
   *   color pal.annMagenta, width 2, alpha 1, p 1 (draw-on progress), endTicks 8 (0 = none),
   *   arrow 0 (arrowhead size), dot 0 (origin dot radius), dash null, label null, labelOffset 26
   */
  lib.arcAnnotation = (ctx, cx, cy, r, a0, a1, o = {}) => {
    const prog = o.p != null ? clamp(o.p) : 1;
    if (prog <= 0) return;
    const color = o.color || pal.annMagenta;
    const width = o.width != null ? o.width : 2;
    const ae = a0 + (a1 - a0) * prog;
    const ccw = a1 < a0;
    ctx.save();
    ctx.globalAlpha *= o.alpha != null ? o.alpha : 1;
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.lineWidth = width;
    ctx.lineCap = 'round';
    if (o.dash) ctx.setLineDash(o.dash);
    ctx.beginPath();
    ctx.arc(cx, cy, r, a0, ae, ccw);
    ctx.stroke();
    ctx.setLineDash([]);
    const et = o.endTicks != null ? o.endTicks : 8;
    if (et) {
      ctx.beginPath();
      for (const a of prog >= 1 ? [a0, ae] : [a0]) {
        ctx.moveTo(cx + Math.cos(a) * (r - et / 2), cy + Math.sin(a) * (r - et / 2));
        ctx.lineTo(cx + Math.cos(a) * (r + et / 2), cy + Math.sin(a) * (r + et / 2));
      }
      ctx.stroke();
    }
    const dot = o.dot != null ? o.dot : 0;
    if (dot) {
      ctx.beginPath();
      ctx.arc(cx + Math.cos(a0) * r, cy + Math.sin(a0) * r, dot, 0, TAU);
      ctx.fill();
    }
    const ah = o.arrow != null ? o.arrow : 0;
    if (ah) {
      const ex = cx + Math.cos(ae) * r, ey = cy + Math.sin(ae) * r;
      const tdir = ae + (ccw ? -Math.PI / 2 : Math.PI / 2);
      const tx = Math.cos(tdir), ty = Math.sin(tdir);
      const nx = -ty, ny = tx;
      ctx.beginPath();
      ctx.moveTo(ex + tx * ah * 0.35, ey + ty * ah * 0.35);
      ctx.lineTo(ex - tx * ah * 0.75 + nx * ah * 0.45, ey - ty * ah * 0.75 + ny * ah * 0.45);
      ctx.lineTo(ex - tx * ah * 0.45, ey - ty * ah * 0.45);
      ctx.lineTo(ex - tx * ah * 0.75 - nx * ah * 0.45, ey - ty * ah * 0.75 - ny * ah * 0.45);
      ctx.closePath();
      ctx.fill();
    }
    if (o.label) {
      const am = (a0 + ae) / 2;
      const lo = o.labelOffset != null ? o.labelOffset : 26;
      lib.text(ctx, o.label, cx + Math.cos(am) * (r + lo), cy + Math.sin(am) * (r + lo), {
        size: o.labelSize || 24,
        color,
        align: 'center',
        baseline: 'middle',
        weight: 500,
      });
    }
    ctx.restore();
  };

  // ===========================================================================
  // Camera and text
  // ===========================================================================

  /**
   * camera(ctx, { x, y, zoom, rot }, fn) : draws fn(ctx) with world point (x, y) at the frame centre,
   * scaled by zoom and rotated by rot. Defaults: the frame centre, zoom 1, rot 0.
   */
  lib.camera = (ctx, cam, fn) => {
    const c = cam || {};
    const x = c.x != null ? c.x : W() / 2;
    const y = c.y != null ? c.y : H() / 2;
    ctx.save();
    ctx.translate(W() / 2, H() / 2);
    if (c.rot) ctx.rotate(c.rot);
    if (c.zoom != null && c.zoom !== 1) ctx.scale(c.zoom, c.zoom);
    ctx.translate(-x, -y);
    let out;
    try {
      out = fn(ctx);
    } finally {
      ctx.restore();
    }
    return out;
  };

  const FONT_STACK = '"SF Pro Rounded", ui-rounded, "Helvetica Neue", system-ui, -apple-system, "Segoe UI", Arial, sans-serif';

  /**
   * text(ctx, str, x, y, opts) : a thin single-line wordmark in the system sans-serif (no font files).
   *   size 42, weight 300, color pal.ink, alpha 1, align 'left', baseline 'alphabetic',
   *   tracking 0 (px number, or a css length such as '0.12em'; letterSpacing is an alias),
   *   family (system stack), p 1 (typewriter reveal fraction), italic false
   */
  const HAND_STACK = '"Chalkboard SE", "Marker Felt", "Comic Sans MS", cursive';
  lib.text = (ctx, str, x, y, o = {}) => {
    let s = String(str);
    if (o.p != null) s = s.slice(0, Math.round(s.length * clamp(o.p)));
    if (!s) return;
    ctx.save();
    ctx.font = `${o.italic ? 'italic ' : ''}${o.weight || 300} ${o.size || 42}px ${o.family || FONT_STACK}`;
    ctx.fillStyle = o.color || pal.ink;
    ctx.globalAlpha *= o.alpha != null ? o.alpha : 1;
    ctx.textAlign = o.align || 'left';
    ctx.textBaseline = o.baseline || 'alphabetic';
    if ('letterSpacing' in ctx) {
      const tr = o.letterSpacing != null ? o.letterSpacing : o.tracking;
      ctx.letterSpacing = typeof tr === 'string' ? tr : `${tr || 0}px`;
    }
    ctx.fillText(s, x, y);
    ctx.restore();
  };

  // ===========================================================================
  // Read-only
  // ===========================================================================

  // A scene that changed lib, lib.pal or lib.ease would leak into every shot drawn after it, in
  // whatever order frames happen to be drawn (and differently in each render worker). So all of
  // it is frozen:
  //   - lib itself is a plain frozen object: a write throws in strict code and is ignored in
  //     non-strict code, so nothing leaks, and reading lib.fn in a hot loop stays at full speed.
  //   - pal and ease are also wrapped so a write throws even from non-strict scene code (core
  //     records it as a draw error, tools/check.cjs reports it). The wrapper makes each read about
  //     20 ns slower, so hoist colours out of per-point loops (const ink = P.ink). Code inside lib
  //     uses the raw objects and pays nothing.
  function readOnly(target, name) {
    const fail = (verb, prop) => {
      throw new TypeError(
        `${name} is read-only: a scene cannot ${verb} '${String(prop)}' (it would leak into other shots). ` +
          `Make a local copy instead, for example const P = Object.assign({}, FILM.lib.pal, { ink: '#000' }).`
      );
    };
    return new Proxy(Object.freeze(target), {
      set: (t, prop) => fail('set', prop),
      defineProperty: (t, prop) => fail('define', prop),
      deleteProperty: (t, prop) => fail('delete', prop),
      setPrototypeOf: () => fail('change the prototype of', name),
    });
  }
  for (const key of Object.keys(ease)) Object.freeze(ease[key]);
  lib.pal = readOnly(pal, 'FILM.lib.pal');
  lib.ease = readOnly(ease, 'FILM.lib.ease');
  for (const key of Object.keys(lib)) {
    const v = Object.getOwnPropertyDescriptor(lib, key).value;
    if (typeof v === 'function') Object.freeze(v);
  }
  Object.defineProperty(FILM, 'lib', { value: Object.freeze(lib), writable: false, enumerable: true, configurable: false });
})();

</script>
<script>
// ---- src/props.js
/*
 * props.js : the shared doodle props and primitives for photo-doodle films, drawn once here so
 * every shot draws them identically. Loaded after lib.js and before the scenes.
 *
 * Everything is a pure function of its arguments (no state between frames) and every stroke goes
 * through FILM.lib.inkPath, so the boil and the draw-on behave like the rest of the film.
 *
 *   props:       bubble, sparkle, speedLines, starburst, cloud, sun, moon, heart, note, flag,
 *                trail, zzz, dust, drop (see each function's comment)
 *   primitives:  step (stroke i of n from a figure's draw fraction), place (translate/scale/flip),
 *                ink, wash, eye, blush, blob — what src/cast.js builds its characters from
 *
 * The film's own characters live in src/cast.js and call these. Keep them out of scene files: a
 * character redrawn per scene drifts, and sixteen agents will each drift differently.
 *
 * Draw-on: every function takes draw 0..1 and reveals its strokes in order, each stroke taking
 * 1/n of the range with a small overlap, so a figure assembles the way a hand would draw it.
 * Night shots pass night: true, which swaps ink for chalk and drops the pigment.
 */
(function () {
  'use strict';

  const FILM = window.FILM;
  const L = FILM.lib;
  const P = L.pal;
  const TAU = Math.PI * 2;
  const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);

  /** progress of stroke i of n, given the whole-figure draw fraction */
  const step = (d, i, n) => clamp((d * n - i) * 1.35);

  /** rotate + scale helper: maps local coords (x right, y down, origin at the figure's base) */
  function place(ctx, o, fn) {
    ctx.save();
    ctx.translate(o.x, o.y);
    if (o.tilt) ctx.rotate(o.tilt);
    const s = o.s != null ? o.s : 1;
    ctx.scale(o.flip ? -s : s, s);
    fn();
    ctx.restore();
  }

  const inkOf = (o) => (o.night ? P.chalk : P.doodleInk);

  function ink(ctx, pts, o, extra) {
    // o.alpha applies to the whole figure; extra.alpha (per stroke) multiplies it.
    const base = { color: inkOf(o), width: 3.4, wobble: 1.6, tremble: 0.4 };
    const q = Object.assign(base, extra);
    if (o.alpha != null) q.alpha = (q.alpha != null ? q.alpha : 1) * o.alpha;
    L.inkPath(ctx, pts, q);
  }

  function wash(ctx, pts, o, color, extra) {
    if (o.night) return; // night shots are chalk line only, no pigment
    L.wash(ctx, pts, Object.assign({ color, alpha: 0.5, seed: (extra && extra.seed) || 7 }, extra));
  }

  /** a closed blob path: centre, radius, per-angle radius function */
  function blob(cx, cy, n, rf) {
    const pts = [];
    for (let i = 0; i < n; i++) {
      const a = (i / n) * TAU;
      const r = rf(a, i);
      pts.push([cx + Math.cos(a) * r[0], cy + Math.sin(a) * r[1]]);
    }
    return pts;
  }

  const eye = (ctx, x, y, r, o, blink) => {
    if (blink > 0.5) ink(ctx, [[x - r * 1.3, y], [x + r * 1.3, y]], o, { width: 2.6, smooth: false, taper: 3 });
    else {
      ctx.save();
      ctx.fillStyle = inkOf(o);
      ctx.beginPath();
      ctx.ellipse(x, y, r, r * 1.08, 0, 0, TAU);
      ctx.fill();
      ctx.restore();
    }
  };

  const blush = (ctx, x, y, r, o) => {
    if (o.night) return;
    ctx.save();
    ctx.globalAlpha *= 0.55;
    ctx.fillStyle = P.blush;
    ctx.beginPath();
    ctx.ellipse(x, y, r, r * 0.68, 0, 0, TAU);
    ctx.fill();
    ctx.restore();
  };

  // ---------------------------------------------------------------------------
  // Props
  // ---------------------------------------------------------------------------

  /** bubble(ctx, o) : speech bubble with a tail. x, y is the bubble centre; tail points at tx, ty. */
  function bubble(ctx, o = {}) {
    const d = o.draw == null ? 1 : clamp(o.draw);
    const w = o.w || 200, h = o.h || 110;
    const pts = blob(o.x, o.y, 34, (a) => [w / 2 + Math.cos(a * 3) * 5, h / 2 + Math.sin(a * 2) * 4]);
    if (!o.night) {
      L.wash(ctx, pts, { color: o.fill || P.washCream, alpha: o.fillAlpha != null ? o.fillAlpha : 0.75, p: d, seed: (o.seed || 5) + 1, offset: [2, 2], edge: 0 });
    }
    ink(ctx, pts, o, { closed: true, draw: d, width: 3, seed: o.seed || 5 });
    if (o.tx != null) {
      const dx = o.tx - o.x, dy = o.ty - o.y;
      const l = Math.hypot(dx, dy) || 1;
      const bx = o.x + (dx / l) * (w / 2) * 0.8, by = o.y + (dy / l) * (h / 2) * 0.9;
      ink(ctx, [[bx - 14, by - 2], [o.tx, o.ty], [bx + 12, by + 8]], o, { draw: d, width: 2.8, seed: (o.seed || 5) + 2 });
    }
    if (o.label && d > 0.85) {
      L.hand(ctx, o.label, o.x, o.y + (o.size || 42) * 0.34, {
        size: o.size || 42,
        align: 'center',
        color: inkOf(o),
        p: clamp((d - 0.85) / 0.15),
      });
    }
  }

  /** sparkle(ctx, x, y, r, o) : a four-point twinkle. */
  function sparkle(ctx, x, y, r, o = {}) {
    const d = o.draw == null ? 1 : clamp(o.draw);
    if (d <= 0) return;
    const k = r * d;
    ink(ctx, [[x - k, y], [x + k, y]], o, { width: o.width || 2.4, seed: (o.seed || 3) });
    ink(ctx, [[x, y - k], [x, y + k]], o, { width: o.width || 2.4, seed: (o.seed || 3) + 1 });
    ink(ctx, [[x - k * 0.45, y - k * 0.45], [x + k * 0.45, y + k * 0.45]], o, { width: (o.width || 2.4) * 0.7, seed: (o.seed || 3) + 2 });
    ink(ctx, [[x + k * 0.45, y - k * 0.45], [x - k * 0.45, y + k * 0.45]], o, { width: (o.width || 2.4) * 0.7, seed: (o.seed || 3) + 3 });
  }

  /** speedLines(ctx, o) : n trailing lines behind something moving. x, y is the trailing edge. */
  function speedLines(ctx, o = {}) {
    const d = o.draw == null ? 1 : clamp(o.draw);
    const n = o.n || 3, len = o.len || 90, gap = o.gap || 22, dir = o.dir != null ? o.dir : -1;
    for (let i = 0; i < n; i++) {
      const y = o.y + (i - (n - 1) / 2) * gap;
      const l = len * (i === Math.floor(n / 2) ? 1 : 0.7);
      ink(ctx, [[o.x, y], [o.x + dir * l, y + (i - (n - 1) / 2) * 4]], o, {
        draw: clamp(d * 1.4 - i * 0.12),
        width: o.width || 3,
        seed: (o.seed || 40) + i,
        smooth: false,
      });
    }
  }

  /** starburst(ctx, x, y, r, o) : the impact star behind a loud moment. */
  function starburst(ctx, x, y, r, o = {}) {
    const d = o.draw == null ? 1 : clamp(o.draw);
    if (d <= 0) return;
    const n = o.n || 10;
    const pts = [];
    for (let i = 0; i < n * 2; i++) {
      const a = (i / (n * 2)) * TAU - Math.PI / 2;
      const rr = (i % 2 ? r * 0.52 : r) * (0.9 + 0.2 * Math.sin(i * 2.7 + (o.seed || 1)));
      pts.push([x + Math.cos(a) * rr, y + Math.sin(a) * rr]);
    }
    if (!o.night && o.fill !== false) L.wash(ctx, pts, { color: o.fill || P.washYellow, alpha: 0.45, p: d, seed: (o.seed || 9) + 4, offset: [3, 2] });
    ink(ctx, pts, o, { closed: true, draw: d, width: o.width || 3.4, seed: o.seed || 9 });
  }

  /** cloud(ctx, x, y, w, o) : a bumpy cloud. o.face: 'angry' | 'happy' draws a face on it. */
  function cloud(ctx, x, y, w, o = {}) {
    const d = o.draw == null ? 1 : clamp(o.draw);
    const h = o.h || w * 0.46;
    const pts = [];
    const bumps = o.bumps || 5;
    for (let i = 0; i <= 44; i++) {
      const u = i / 44, a = u * TAU;
      const r = 1 + 0.16 * Math.cos(a * bumps + (o.seed || 2));
      pts.push([x + Math.cos(a) * (w / 2) * r, y + Math.sin(a) * (h / 2) * (a > Math.PI ? r : r * 0.82)]);
    }
    if (!o.night) L.wash(ctx, pts, { color: o.fill || P.washBlue, alpha: o.fillAlpha != null ? o.fillAlpha : 0.35, p: d, seed: (o.seed || 2) + 1 });
    ink(ctx, pts, o, { closed: true, draw: d, width: o.width || 3.2, seed: o.seed || 2 });
    if (o.face && d > 0.9) {
      const ey = y - h * 0.05;
      eye(ctx, x - w * 0.12, ey, 4.6, o, o.blink || 0);
      eye(ctx, x + w * 0.12, ey, 4.6, o, o.blink || 0);
      const m = o.face === 'angry'
        ? [[x - w * 0.1, y + h * 0.2], [x, y + h * 0.12], [x + w * 0.1, y + h * 0.2]]
        : [[x - w * 0.1, y + h * 0.12], [x, y + h * 0.24], [x + w * 0.1, y + h * 0.12]];
      ink(ctx, m, o, { width: 2.4, seed: (o.seed || 2) + 6 });
      if (o.face === 'angry') {
        ink(ctx, [[x - w * 0.2, ey - 16], [x - w * 0.06, ey - 8]], o, { width: 2.4, seed: (o.seed || 2) + 7 });
        ink(ctx, [[x + w * 0.2, ey - 16], [x + w * 0.06, ey - 8]], o, { width: 2.4, seed: (o.seed || 2) + 8 });
      }
    }
  }

  /** sun(ctx, x, y, r, o) / moon(ctx, x, y, r, o) : with rays / with a sleepy face. */
  function sun(ctx, x, y, r, o = {}) {
    const d = o.draw == null ? 1 : clamp(o.draw);
    const disc = blob(x, y, 30, () => [r, r]);

<script>
// ---- src/world/02-type.js
// Type without a font file: fillText / strokeText / measureText stand-ins that draw the Londrina Solid
// outlines from 01-glyphs.js with Path2D. They read the size, weight, tracking and alignment from the
// context exactly like the canvas text calls (ctx.font = "900 120px 'Londrina Solid'", ctx.letterSpacing,
// ctx.textAlign), so the ported BH type code only swaps `ctx.fillText(` for `HG.fillText(ctx, `.
(function () {
  'use strict';
  const HG = (window.HG = window.HG || {});
  const G = HG.GLYPHS;
  const paths = { black: {}, regular: {} };

  function face(ctx) {
    const f = String(ctx.font || '');
    const m = f.match(/([\d.]+)px/);
    const px = m ? Number(m[1]) : 10;
    const w = /\b(900|800|700|bold|black)\b/.test(f) ? 'black' : 'regular';
    let ls = 0;
    const l = ctx.letterSpacing ? String(ctx.letterSpacing).match(/(-?[\d.]+)px/) : null;
    if (l) ls = Number(l[1]);
    return { px, w, ls };
  }
  function glyph(w, ch) {
    const set = G[w].g;
    const c = set[ch] ? ch : set[ch.toUpperCase()] ? ch.toUpperCase() : ' ';
    if (!paths[w][c]) paths[w][c] = { adv: set[c][0], p: set[c][1] ? new Path2D(set[c][1]) : null };
    return paths[w][c];
  }
  function width(s, fc) {
    const k = fc.px / G[fc.w].upm;
    let x = 0;
    for (const ch of String(s)) x += glyph(fc.w, ch).adv * k + fc.ls;
    return x;
  }
  HG.measureText = (ctx, s) => ({ width: width(s, face(ctx)) });

  function run(ctx, s, x, y, stroke) {
    const fc = face(ctx);
    const k = fc.px / G[fc.w].upm;
    const total = width(s, fc);
    const al = ctx.textAlign;
    let x0 = al === 'center' ? x - total / 2 : al === 'right' || al === 'end' ? x - total : x;
    const bl = ctx.textBaseline;
    const cap = 0.72 * fc.px;
    const y0 = bl === 'middle' ? y + cap / 2 : bl === 'top' ? y + cap : y;
    for (const ch of String(s)) {
      const g = glyph(fc.w, ch);
      if (g.p) {
        ctx.save();
        ctx.translate(x0, y0);
        ctx.scale(k, -k);
        if (stroke) {
          ctx.lineWidth = ctx.lineWidth / k;
          ctx.stroke(g.p);
        } else ctx.fill(g.p);
        ctx.restore();
      }
      x0 += g.adv * k + fc.ls;
    }
  }
  HG.fillText = (ctx, s, x, y) => run(ctx, s, x, y, false);
  HG.strokeText = (ctx, s, x, y) => run(ctx, s, x, y, true);
})();

// Core: math, easing, seeded noise, colour, Path2D builders, cel shading, glow/bloom, camera.

<script>
// ---- src/world/20-hg-core.js

// The world is real 3D in metres. The planet is a sphere of radius R centred at (0, −R, 0); the hero stands

(function () {

    { id: 'rat', S: 0.0, E: 1.6, hit: 0.8, hook: 0.88, bite: 0.96, yank: 1.0, chomp: 1.2, gulp: 1.28, g1: 3.2, side: 1, weapon: 'cleaver', power: 1 },
    { id: 'goblin', S: 1.6, E: 3.2, hit: 1.6, hook: 2.0, bite: 2.2, yank: 2.4, chomp: 2.8, gulp: 2.9, g1: 4.6, side: -1, weapon: 'ice', power: 12 },
    { id: 'knight', S: 3.2, E: 4.8, hit: 3.2, hook: 3.6, bite: 3.8, yank: 4.0, chomp: 4.4, gulp: 4.5, g1: 7.2, side: 1, weapon: 'sword', power: 480 },
    { id: 'bear', S: 4.8, E: 6.4, hit: 4.8, hook: 5.2, bite: 5.4, yank: 5.6, chomp: 6.0, gulp: 6.1, g1: 11.5, side: -1, weapon: 'green', power: 3900 },
    { id: 'golem', S: 6.4, E: 8.0, hit: 6.4, hook: 6.8, bite: 7.0, yank: 7.2, chomp: 7.6, gulp: 7.7, g1: 28, side: 1, weapon: 'hammer', power: 21000 },
    { id: 'dragon', S: 8.0, E: 10.8, fire: 8.4, hit: 9.2, hook: 9.4, bite: 9.6, yank: 9.8, chomp: 10.4, gulp: 10.5, g1: 100, side: -1, weapon: 'ice', power: 88000 },
    { id: 'tower', S: 10.8, E: 13.2, hit: 11.2, hook: 11.4, bite: 11.6, yank: 11.6, chomp: 12.4, gulp: 12.5, g1: 450, side: 1, weapon: 'hammer', power: 1200000 },
    { id: 'island', S: 13.2, E: 16.0, hit: null, hook: 13.6, bite: 14.4, yank: 14.4, chomp: 15.2, gulp: 15.3, g1: 20000, side: -1, weapon: null, power: 48000000 },
    { id: 'archipelago', S: 16.0, E: 18.8, hit: null, hook: 16.4, bite: 16.6, yank: 16.8, chomp: 17.6, gulp: 18.1, g1: 1500000, side: 1, weapon: null, power: 595430090 },
    { id: 'moon', S: 18.8, E: 22.8, hit: null, hook: 19.2, bite: 20.0, yank: 20.4, chomp: 21.2, gulp: 21.5, g1: 2200000, side: 1, weapon: null, power: Infinity },
  ];
  HG.level = (id) => HG.LEVELS.find((l) => l.id === id);
  HG.levelAt = (T) => { let L = HG.LEVELS[0]; for (const l of HG.LEVELS) if (T >= l.S) L = l; return L; };

  // ------------------------------------------------------------------ growth g(T): hero height in metres

    for (let i = 0; i < n - 1; i++) { dx.push(keys[i + 1][0] - keys[i][0]); dy.push((keys[i + 1][1] - keys[i][1]) / dx[i]); }

    [0.0, Math.log(11000)], [0.3, Math.log(9500)], [0.5, Math.log(2100)], [0.72, Math.log(760)], [1.25, Math.log(700)],
    [3.0, Math.log(690)], [6.0, Math.log(660)], [7.9, Math.log(620)], [9.0, Math.log(560)], [10.6, Math.log(580)],
    [12.2, Math.log(540)], [12.8, Math.log(500)], [13.4, Math.log(380)], [15.9, Math.log(360)], [17.5, Math.log(400)], [18.8, Math.log(380)],

    [18.6, 0.42], [19.6, 0.16], [22.8, 0.12], [25.2, 0.05], [25.21, 0.02], [30, 0.0],
  ]);
  // Where the hero's body centre sits on screen (px): x shifts away from the prey, y sinks as the sky matters.
  // (+ moves the hero LEFT: cx = 540 − SX)
  const SX = mono([
    [0, 0], [0.7, 40], [1.6, 0], [2.4, -20], [3.2, 0], [4.8, 0], [6.4, 0], [8.0, 0],
    [9.0, -60], [10.8, 0], [11.4, 120], [12.8, 60], [13.4, -260], [15.2, -220], [16.4, 0], [18.8, 120], [20.2, 150],
    [21.6, 170], [22.4, 60], [22.8, 0],
  ]);

    [0, 0], [0.7, 1080], [1.2, 1090], [6.4, 1080], [8.4, 1160], [10.6, 1100], [13.2, 1150], [16.0, 1100], [18.4, 1080],

  ]);

  HG.toCam = (cam, p) => {
    const x = p[0] - cam.C[0], y = p[1] - cam.C[1], z = p[2] - cam.C[2];

  };

  HG.project = (cam, p) => HG.camToScreen(cam, HG.toCam(cam, p));

      if (ina) out.push(a);
      if (ina !== inb) { const k = (near - a[2]) / (b[2] - a[2]); out.push([lerp(a[0], b[0], k), lerp(a[1], b[1], k), near]); }
    }

  };
  HG.pathOf = function (pts, closed) {
    const P = new Path2D();
    if (!pts.length) return P;
    P.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) P.lineTo(pts[i][0], pts[i][1]);
    if (closed !== false) P.closePath();
    return P;
  };

  // ------------------------------------------------------------------ shake (screen px), decaying hits

  HG.LEVELS.forEach((l, i) => {
    if (l.hit != null) SHAKES.push({ t: l.hit + 0.02, amp: 10 + i * 2, dur: 0.22, freq: 38, seed: 11 + i });
    SHAKES.push({ t: l.chomp, amp: 14 + i * 3, dur: 0.3, freq: 30, seed: 31 + i });
  });

    { t: 20.4, amp: 30, dur: 0.6, freq: 20, seed: 73 }, { t: 21.2, amp: 60, dur: 0.7, freq: 26, seed: 74 },
    { t: 23.2, amp: 34, dur: 0.6, freq: 24, seed: 75 }, { t: 25.2, amp: 50, dur: 0.5, freq: 30, seed: 76 });
  HG.SHAKES = SHAKES;
  HG.shakeAt = function (T) {
    let x = 0, y = 0;
    for (const h of SHAKES) {
      const a = T - h.t;
      if (a < 0 || a > h.dur) continue;
      const k = Math.pow(1 - a / h.dur, 2) * h.amp;
      x += BH.noise1(a * h.freq, h.seed) * k;
      y += BH.noise1(a * h.freq, h.seed + 7.7) * k;
    }
    return { x, y };
  };
})();

  HG.mixc = (a, b, t) => BH.mix(a, b, clamp(t, 0, 1));

  // ------------------------------------------------------------------ altitude → space
  // 0 in the red sky, 1 in black space. Camera altitude 25 km → 900 km.
  HG.spaceK = (cam) => sstep(Math.log(25000), Math.log(900000), Math.log(Math.max(1, cam.alt)));

  // Horizon screen y for a near-flat view (dip angle from altitude).
  function horizonY(cam) {
    const h = Math.max(0.1, cam.alt), dip = Math.acos(HG.R / (HG.R + h));
    return cam.cy - cam.F * Math.tan(cam.phi - dip);
  }
  HG.horizonY = horizonY;

  // ------------------------------------------------------------------ sky + stars
  HG.drawSky = function (ctx, cam, T) {
    const k = HG.spaceK(cam);
    ctx.fillStyle = PAL.space;
    ctx.fillRect(-50, -50, 1180, 2020);
    const hy = clamp(horizonY(cam), -2400, 4000);
    if (k < 1) {
      ctx.save();
      ctx.globalAlpha = 1 - k;
      const g = ctx.createRadialGradient(540, hy + 150, 0, 540, hy + 150, 1900);
      g.addColorStop(0, PAL.skyHot); g.addColorStop(0.12, PAL.skyRed); g.addColorStop(0.34, PAL.skyWine);
      g.addColorStop(0.56, PAL.skyPlum); g.addColorStop(0.78, PAL.skyNight); g.addColorStop(1, '#04071E');
      ctx.fillStyle = g;
      ctx.fillRect(-50, -50, 1180, 2020);
      BH.glow(ctx, 540, hy, 700, '#FF4A1E', 0.3 * (1 - k));
      ctx.restore();
    }
    // stars: fixed to the sky direction (drift with pitch), fade in with altitude, jitter on the burp
    const sa = sstep(0.15, 0.8, k);
    if (sa > 0.01) {
      const r = BH.rng(4242);
      const burp = HG.burpShake ? HG.burpShake(T) : 0;
      ctx.save();
      for (let i = 0; i < 240; i++) {
        const sx = r() * 1180 - 50, sy0 = r() * 3600 - 1400, mag = r(), tw = 0.6 + 0.4 * Math.sin(T * (2 + r() * 5) + i);
        const sy = sy0 + (cam.phi - 0.3) * 1400;
        if (sy < -20 || sy > 1940) continue;
        const jx = burp * BH.noise1(T * 40 + i, 3) * 9, jy = burp * BH.noise1(T * 40 + i, 9) * 9;
        const rad = 1 + mag * mag * 3.2;
        ctx.globalAlpha = sa * tw * (0.35 + 0.65 * mag);
        ctx.fillStyle = mag > 0.93 ? '#FFD6C8' : mag > 0.7 ? '#C8D4FF' : '#FFFFFF';
        ctx.beginPath(); ctx.arc(sx + jx, sy + jy, rad, 0, TAU); ctx.fill();
        if (mag > 0.9) {
          ctx.globalAlpha = sa * tw * 0.5;
          ctx.fillRect(sx + jx - rad * 4, sy + jy - 0.6, rad * 8, 1.2);
          ctx.fillRect(sx + jx - 0.6, sy + jy - rad * 4, 1.2, rad * 8);
        }
      }
      ctx.restore();
      // a faint violet nebula band
      ctx.save();
      ctx.globalAlpha = sa * 0.35;
      BH.glow(ctx, 820, 300 + (cam.phi - 0.3) * 1400, 600, '#5A1A8A', 0.6);
      BH.glow(ctx, 200, 900 + (cam.phi - 0.3) * 1400, 500, '#2A1A7A', 0.5);
      ctx.restore();
    }
  };

  // ------------------------------------------------------------------ the red moon
  // Hangs in the sky from frame 0 (az 16° right, el 24°), far enough to keep its size as the camera pulls back.
  const MOON_R = 1.737e6, MOON_D = 3.3e7;
  const MOON_DIR = (() => { const az = 0.2, el = 0.3; return [Math.sin(az) * Math.cos(el), Math.sin(el), Math.cos(az) * Math.cos(el)]; })();
  HG.MOON = { R: MOON_R, D: MOON_D, dir: MOON_DIR, home: [MOON_DIR[0] * MOON_D, MOON_DIR[1] * MOON_D, MOON_DIR[2] * MOON_D] };
  const MARIA = [[-0.3, -0.25, 0.28], [0.25, -0.1, 0.2], [0.05, 0.3, 0.24], [-0.42, 0.25, 0.12], [0.45, 0.35, 0.1], [0.2, -0.5, 0.12]];
  const CRATERS = [[-0.1, -0.55, 0.09], [0.55, -0.35, 0.07], [-0.6, -0.05, 0.08], [0.35, 0.62, 0.06], [-0.25, 0.62, 0.07], [0.62, 0.1, 0.05], [0.0, 0.05, 0.06]];
  // st: {pos (world), bite: 0..1 bite progress (0 = whole), rot, chew}
  HG.drawMoon = function (ctx, cam, st) {
    const q = HG.toCam(cam, st.pos);
    if (q[2] <= 0) return null;
    const s = HG.camToScreen(cam, q), r = (cam.F * MOON_R * (st.scale || 1)) / q[2];
    if (r < 0.5 || s[0] < -r - 200 || s[0] > 1080 + r + 200 || s[1] < -r - 200 || s[1] > 1920 + r + 200) return { x: s[0], y: s[1], r };
    const x = s[0], y = s[1];
    // halo
    BH.glow(ctx, x, y, r * 2.6, PAL.moonGlow, 0.35);
    BH.glow(ctx, x, y, r * 1.5, '#FF6A3A', 0.35);
    const need = r * 2 + 8;
    const useBuf = st.bite > 0;
    const B = useBuf ? BH.buf('hg-moon', Math.ceil(Math.min(2400, need)), Math.ceil(Math.min(2400, need))) : null;
    const c = useBuf ? B.ctx : ctx;
    const k = useBuf ? Math.min(1, 2400 / need) : 1;
    c.save();
    if (useBuf) {
      c.setTransform(1, 0, 0, 1, 0, 0); c.globalCompositeOperation = 'source-over'; c.globalAlpha = 1;
      c.clearRect(0, 0, B.cv.width, B.cv.height);
      c.translate(B.cv.width / 2, B.cv.height / 2); c.scale(k, k);
    } else c.translate(x, y);
    c.rotate(st.rot || 0);
    // body: cel sphere
    c.lineJoin = 'round';
    c.beginPath(); c.arc(0, 0, r, 0, TAU);
    c.fillStyle = PAL.ink; c.save(); c.lineWidth = Math.max(2, r * 0.03); c.strokeStyle = PAL.ink; c.stroke(); c.restore();
    const gr = c.createRadialGradient(-r * 0.35, -r * 0.4, r * 0.1, 0, 0, r);
    gr.addColorStop(0, PAL.moonLit); gr.addColorStop(0.55, PAL.moon); gr.addColorStop(1, PAL.moonDark);
    c.fillStyle = gr; c.fill();
    c.save();
    c.beginPath(); c.arc(0, 0, r, 0, TAU); c.clip();
    if (r > 6) {
      c.fillStyle = PAL.moonMare;
      c.globalAlpha = 0.8;
      for (const m of MARIA) { c.beginPath(); c.ellipse(m[0] * r, m[1] * r, m[2] * r * 1.2, m[2] * r, m[0], 0, TAU); c.fill(); }
      c.globalAlpha = 1;
      if (r > 20) for (const m of CRATERS) {
        c.fillStyle = PAL.moonDark; c.beginPath(); c.arc(m[0] * r, m[1] * r, m[2] * r, 0, TAU); c.fill();
        c.fillStyle = PAL.moonLit; c.beginPath(); c.arc(m[0] * r - m[2] * r * 0.25, m[1] * r - m[2] * r * 0.25, m[2] * r * 0.72, 0, TAU); c.fill();
        c.fillStyle = PAL.moon; c.beginPath(); c.arc(m[0] * r + m[2] * r * 0.06, m[1] * r + m[2] * r * 0.06, m[2] * r * 0.66, 0, TAU); c.fill();
      }
      // terminator crescent shade (lilac-cold, lower right) and a hot rim upper left
      c.globalCompositeOperation = 'multiply';
      c.fillStyle = '#8A6AC8';
      c.beginPath(); c.arc(0, 0, r, 0, TAU); c.arc(-r * 0.22, -r * 0.2, r * 1.02, 0, TAU, true); c.fill('evenodd');
      c.globalCompositeOperation = 'source-over';
      c.strokeStyle = '#FFD0A0'; c.globalAlpha = 0.85; c.lineWidth = Math.max(1.5, r * 0.035);
      c.beginPath(); c.arc(0, 0, r * 0.965, Math.PI * 1.05, Math.PI * 1.6); c.stroke();
      c.globalAlpha = 1;
    }
    c.restore();
    c.restore();
    if (useBuf) {
      // the bite: a scalloped arc of tooth marks punched out of the right side (destination-out)
      const bc = B.ctx, u = clamp(st.bite, 0, 1);
      bc.save();
      bc.globalCompositeOperation = 'destination-out';
      bc.translate(B.cv.width / 2, B.cv.height / 2); bc.scale(k, k);
      const bx = -r * lerp(1.9, 0.62, BH.E('power3.out', u)), by = -r * 0.05, br = r * 0.95;
      bc.beginPath(); bc.arc(bx, by, br, 0, TAU); bc.fill();
      for (let i = 0; i < 9; i++) {           // teeth scallops along the bite edge
        const a = Math.PI * (-0.38 + i * 0.095);
        bc.beginPath(); bc.arc(bx + Math.cos(a) * br, by + Math.sin(a) * br, r * 0.075, 0, TAU); bc.fill();
      }
      bc.restore();
      // crumbs rim on the bite edge
      ctx.save();
      ctx.drawImage(B.cv, x - B.cv.width / 2 / k, y - B.cv.height / 2 / k, B.cv.width / k, B.cv.height / k);
      ctx.restore();
    }
    return { x, y, r };
  };

  // ------------------------------------------------------------------ planet + sea
  function planetSilhouette(cam, n) {
    const O = [0, -HG.R, 0], C = cam.C;
    const v = [C[0] - O[0], C[1] - O[1], C[2] - O[2]], L = Math.hypot(v[0], v[1], v[2]);
    const uu = [v[0] / L, v[1] / L, v[2] / L];
    const cen = [O[0] + uu[0] * HG.R * HG.R / L, O[1] + uu[1] * HG.R * HG.R / L, O[2] + uu[2] * HG.R * HG.R / L];
    const rad = HG.R * Math.sqrt(Math.max(0, 1 - (HG.R * HG.R) / (L * L)));
    // basis perpendicular to uu
    let a = Math.abs(uu[0]) < 0.9 ? [1, 0, 0] : [0, 0, 1];
    const b1 = norm(cross(uu, a)), b2 = cross(uu, b1);
    const pts = [];
    for (let i = 0; i < n; i++) {
      const t = (i / n) * TAU, c = Math.cos(t), s = Math.sin(t);
      pts.push([cen[0] + (b1[0] * c + b2[0] * s) * rad, cen[1] + (b1[1] * c + b2[1] * s) * rad, cen[2] + (b1[2] * c + b2[2] * s) * rad]);
    }
    return pts;
  }
  function cross(a, b) { return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]]; }
  function norm(a) { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; }

  HG.drawPlanet = function (ctx, cam, T) {
    const k = HG.spaceK(cam);
    let P;
    if (cam.alt < 2e5) {
      // near-flat: the horizon is a line; fill everything below it (a very slight curve as we rise)
      const hy = horizonY(cam), bend = sstep(2e4, 2e5, cam.alt) * 60;
      P = new Path2D();
      P.moveTo(-60, hy + bend); P.quadraticCurveTo(540, hy - bend, 1140, hy + bend); P.lineTo(1140, 2000); P.lineTo(-60, 2000); P.closePath();
      HG._horizon = { y: hy, flat: true };
    } else {
      const sp = HG.projPoly(cam, planetSilhouette(cam, 160));
      P = HG.pathOf(sp);
      HG._horizon = { flat: false, pts: sp };
    }
    HG._planetPath = P;
    // sea: deep at the bottom, lit toward the horizon, red sky reflected at the rim
    const hy = HG._horizon.flat ? HG._horizon.y : 300;
    const g = ctx.createLinearGradient(0, hy, 0, hy + 1500);
    g.addColorStop(0, HG.mixc(PAL.seaRed, PAL.seaLit, k));
    g.addColorStop(0.08, PAL.seaLit);
    g.addColorStop(0.45, PAL.sea);
    g.addColorStop(1, PAL.seaDeep);
    ctx.save();
    // atmosphere limb glow (space only)
    if (k > 0.02) {
      ctx.save();
      ctx.globalAlpha = k;
      ctx.shadowColor = PAL.atmo; ctx.shadowBlur = 60;
      ctx.strokeStyle = '#FF6040'; ctx.lineWidth = 10; ctx.stroke(P);
      ctx.shadowBlur = 0;
      ctx.lineWidth = 3; ctx.strokeStyle = '#FFB090'; ctx.stroke(P);
      ctx.restore();
    }
    ctx.fillStyle = g;
    ctx.fill(P);
    ctx.restore();
    return P;
  };

  // The game's world-map seas (mint, sky blue, indigo, lime) as huge soft zones, seen once we are high.
  const ZONES = [[-30000, 70000, 42000, '#2FD3A6'], [-38000, 20000, 36000, '#7FD8F5'], [34000, 50000, 44000, '#4B2FA0'], [10000, -18000, 40000, '#6CC83A']];
  HG.drawSeaZones = function (ctx, cam, T) {
    const a = sstep(0.3, 0.75, cam.phi) * (1 - sstep(Math.log(4e5), Math.log(2e6), Math.log(Math.max(1, cam.alt))));
    if (a < 0.01) return;
    ctx.save();
    ctx.clip(HG._planetPath);
    for (const z of ZONES) {
      const pts = [];
      for (let i = 0; i < 40; i++) { const t = (i / 40) * TAU; pts.push(HG.ground(z[0] + Math.cos(t) * z[2], z[1] + Math.sin(t) * z[2])); }
      const P = HG.projPoly(cam, pts);
      if (P.length < 3) continue;
      let cx = 0, cy = 0; for (const p of P) { cx += p[0]; cy += p[1]; } cx /= P.length; cy /= P.length;
      let rr = 0; for (const p of P) rr = Math.max(rr, Math.hypot(p[0] - cx, p[1] - cy));
      const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, rr);
      g.addColorStop(0, BH.rgba(z[3], 0.55 * a)); g.addColorStop(0.7, BH.rgba(z[3], 0.3 * a)); g.addColorStop(1, BH.rgba(z[3], 0));
      ctx.fillStyle = g; ctx.fill(HG.pathOf(P));
    }
    ctx.restore();
  };

  // Sea sparkle + swell lines on the surface around a point, several octaves so the texture survives the zoom.
  HG.drawSeaTexture = function (ctx, cam, T) {
    ctx.save();
    ctx.clip(HG._planetPath);
    const ref = HG.scaleAt(cam, [0, 0, 0]);
    for (let o = 0; o < 7; o++) {
      const cell = 6 * Math.pow(5, o);             // 6 m … 94 km
      const px = cell * ref;
      const a = sstep(10, 40, px) * (1 - sstep(260, 700, px));
      if (a < 0.02) continue;
      ctx.globalAlpha = a * 0.55;
      ctx.strokeStyle = PAL.seaLit;
      ctx.lineWidth = 2.2;
      ctx.beginPath();
      const N = 9;
      for (let i = -N; i <= N; i++) for (let j = -N; j <= N; j++) {
        const h = BH.hash(i * 73 + j * 19 + o * 1000, 5);
        if (h < 0.55) continue;
        const x = (i + BH.hash(i, j + o * 31)) * cell, z = (j + BH.hash(j, i + o * 17)) * cell;
        if (onLand(x, z)) continue;
        const L = cell * 0.35 * (0.5 + h), wob = Math.sin(T * 1.7 + h * 9) * 0.2;
        const A = HG.project(cam, HG.ground(x - L, z)), B = HG.project(cam, HG.ground(x + L, z + wob * L));
        if (A[2] <= 0 || B[2] <= 0) continue;
        const M = HG.project(cam, HG.ground(x, z + L * 0.25));
        ctx.moveTo(A[0], A[1]); ctx.quadraticCurveTo(M[0], M[1], B[0], B[1]);
      }
      ctx.stroke();
    }
    ctx.restore();
  };

  // ------------------------------------------------------------------ islands (shape = radial profile, seeded)
  function islandShape(seed, n, rough) {
    const r = BH.rng(seed), pts = [];
    const f1 = r() * TAU, f2 = r() * TAU, f3 = r() * TAU;
    for (let i = 0; i < n; i++) {
      const a = (i / n) * TAU;
      const k = 1 + rough * (0.22 * Math.sin(a * 2 + f1) + 0.14 * Math.sin(a * 3 + f2) + 0.08 * Math.sin(a * 5 + f3) + (r() - 0.5) * 0.12);
      pts.push([Math.cos(a) * k, Math.sin(a) * k]);
    }
    return pts;
  }
  // Home island: the hero stands near its south shore. Radius ~1.6 km, centre 900 m behind him.
  const HOME = { cx: 1100, cz: 500, R: 1250, shape: islandShape(77, 48, 0.25) };
  HG.HOME = HOME;
  function inShape(sh, cx, cz, R, x, z) {
    const dx = (x - cx) / R, dz = (z - cz) / R, a = Math.atan2(dz, dx), rr = Math.hypot(dx, dz);
    const n = sh.length, f = ((a / TAU) * n + n) % n, i = Math.floor(f), u = f - i;
    const p0 = sh[i], p1 = sh[(i + 1) % n];
    return rr < lerp(Math.hypot(p0[0], p0[1]), Math.hypot(p1[0], p1[1]), u);
  }
  function onLand(x, z) { return inShape(HOME.shape, HOME.cx, HOME.cz, HOME.R, x, z); }
  HG.onLand = onLand;

  function islandPts(I, lift) {
    return I.shape.map((p) => HG.ground(I.cx + p[0] * I.R, I.cz + p[1] * I.R, lift || 0));
  }

  // Low-poly faceted ground: a jittered triangle grid per octave, clipped to the land, fading by projected size.
  function groundMesh(ctx, cam, clipPath, cols, seedBase, cx0, cz0, maxCell) {
    const ref = HG.scaleAt(cam, [0, 0, 0]);
    ctx.save();
    ctx.clip(clipPath);
    for (let o = 0; o < 8; o++) {
      const cell = 0.6 * Math.pow(4, o);
      if (cell > maxCell) break;
      const px = cell * ref;
      const a = sstep(14, 40, px) * (1 - sstep(300, 900, px));
      if (a < 0.02) continue;
      const N = 7, sd = seedBase + o * 97;
      const V = [];
      const ox = Math.round(cx0 / cell), oz = Math.round(cz0 / cell);
      for (let j = 0; j <= 2 * N; j++) {
        const row = [];
        for (let i = 0; i <= 2 * N; i++) {
          const gi = ox + i - N, gj = oz + j - N;
          const x = (gi + (BH.hash(gi * 13 + gj * 7, sd) - 0.5) * 0.7) * cell;
          const z = (gj + (BH.hash(gi * 5 + gj * 11, sd + 1) - 0.5) * 0.7) * cell;
          const q = HG.toCam(cam, HG.ground(x, z));
          row.push(q[2] > cam.d * 0.02 ? HG.camToScreen(cam, q) : null);
        }
        V.push(row);
      }
      ctx.globalAlpha = a;
      for (let j = 0; j < 2 * N; j++) for (let i = 0; i < 2 * N; i++) {
        const p00 = V[j][i], p10 = V[j][i + 1], p01 = V[j + 1][i], p11 = V[j + 1][i + 1];
        if (!p00 || !p10 || !p01 || !p11) continue;
        const gi = ox + i - N, gj = oz + j - N;
        for (let t = 0; t < 2; t++) {
          const h = BH.hash(gi * 31 + gj * 17 + t, sd + 5);
          ctx.fillStyle = cols[Math.floor(h * cols.length)];
          ctx.beginPath();
          if (t === 0) { ctx.moveTo(p00[0], p00[1]); ctx.lineTo(p10[0], p10[1]); ctx.lineTo(p11[0], p11[1]); }
          else { ctx.moveTo(p00[0], p00[1]); ctx.lineTo(p11[0], p11[1]); ctx.lineTo(p01[0], p01[1]); }
          ctx.closePath(); ctx.fill();
        }
      }
    }
    ctx.restore();
  }

  HG.drawHomeIsland = function (ctx, cam, T) {
    const top = HG.projPoly(cam, islandPts(HOME, 0));
    if (top.length < 3) return;
    const P = HG.pathOf(top);
    // beach ring (a slightly bigger outline in sand) + lit rim toward the camera
    const beach = HG.projPoly(cam, HOME.shape.map((p) => HG.ground(HOME.cx + p[0] * HOME.R * 1.035, HOME.cz + p[1] * HOME.R * 1.035)));
    if (beach.length > 2) {
      ctx.fillStyle = '#3E5C6E'; ctx.fill(HG.pathOf(beach));
    }
    ctx.fillStyle = PAL.ground[1];
    ctx.fill(P);
    groundMesh(ctx, cam, P, PAL.ground, 11, 0, 0, HOME.R * 0.5);
    ctx.save();
    ctx.lineWidth = 2.5; ctx.strokeStyle = PAL.ink; ctx.globalAlpha = 0.6; ctx.stroke(P);
    ctx.restore();
    HG._homePath = P;
  };

  // ------------------------------------------------------------------ pine forest (batched, far → near bands)
  const PINES = (() => {
    const out = [], cell = 55, N = Math.ceil(HOME.R / cell) + 1;
    for (let j = -N; j <= N; j++) for (let i = -N; i <= N; i++) {
      const h = BH.hash(i * 91 + j * 37, 3);
      if (h < 0.28) continue;
      const x = HOME.cx + (i + BH.hash(i, j + 5)) * cell, z = HOME.cz + (j + BH.hash(j, i + 9)) * cell;
      if (!onLand(x, z)) continue;
      if (z < 40 + Math.abs(x) * 0.25) continue;          // keep the stage in front of the hero clear
      out.push([x, z, lerp(11, 19, BH.hash(i, j, 7)), (i * 1000 + j) | 0]);
    }
    // a few close ones at the sides for parallax in the opening
    for (let k = 0; k < 14; k++) {
      const sd = k * 17 + 3, side = k % 2 ? 1 : -1;
      out.push([side * lerp(9, 40, BH.hash(sd, 1)), lerp(6, 34, BH.hash(sd, 2)), lerp(9, 15, BH.hash(sd, 3)), 9000 + k]);
    }
    return out;
  })();
  HG.drawPines = function (ctx, cam, T, zMin, zMax) {
    // bin by depth into 4 bands so far rows are drawn first and read lighter
    const bands = [[], [], [], []], dN = [];
    for (const p of PINES) {
      if (p[1] < zMin || p[1] >= zMax) continue;
      const base = HG.ground(p[0], p[1]), q = HG.toCam(cam, base);
      if (q[2] <= cam.d * 0.05) continue;
      const s = cam.F / q[2], hp = p[2] * s;
      if (hp < 2.2 || hp > 5000) continue;
      const sc = HG.camToScreen(cam, q);
      if (sc[0] < -hp || sc[0] > 1080 + hp || sc[1] < -40 || sc[1] - hp > 1960) continue;
      const b = clamp(Math.floor(Math.log(q[2] / cam.d) * 1.1 + 2), 0, 3);
      bands[3 - b].push([sc[0], sc[1], hp, p[3]]);
    }
    const fills = [PAL.pineFar, '#2A1A48', PAL.pineMid, PAL.pineNear];
    for (let b = 0; b < 4; b++) {
      if (!bands[b].length) continue;
      const P = new Path2D();
      let small = true;
      for (const t of bands[b]) {
        if (t[2] > 30) small = false;
        if (t[2] < 5) { P.moveTo(t[0], t[1] - t[2]); P.lineTo(t[0] + t[2] * 0.22, t[1]); P.lineTo(t[0] - t[2] * 0.22, t[1]); P.closePath(); }
        else BH.pinePath(t[0], t[1], t[2], t[3], P, 0);
      }
      ctx.save();
      if (!small) { ctx.lineJoin = 'round'; ctx.lineWidth = 3; ctx.strokeStyle = PAL.ink; ctx.stroke(P); }
      ctx.fillStyle = fills[b]; ctx.fill(P);
      if (!small) {             // red sky rim on the right-hand edges
        ctx.save(); ctx.clip(P); ctx.translate(-3, 1); ctx.globalAlpha = 0.9; ctx.fillStyle = PAL.pineRim;
        ctx.fill(P); ctx.translate(6.5, 0); ctx.fillStyle = fills[b]; ctx.fill(P); ctx.restore();
      }
      ctx.restore();
    }
  };

  // ------------------------------------------------------------------ rocks + grass near the feet (opening)
  const ROCKS = (() => {
    const out = [];
    for (let k = 0; k < 26; k++) {
      const a = BH.hash(k, 41) * TAU, rr = lerp(1.2, 30, Math.pow(BH.hash(k, 42), 1.4));
      const x = Math.cos(a) * rr, z = Math.sin(a) * rr * 0.8 + 2;
      if (z < 0.5 && Math.abs(x) < 3) continue;
      out.push([x, z, lerp(0.25, 1.4, BH.hash(k, 43)) * (1 + rr * 0.04), k]);
    }
    return out;
  })();
  HG.drawRocks = function (ctx, cam) {
    for (const p of ROCKS) {
      const q = HG.toCam(cam, HG.ground(p[0], p[1]));
      if (q[2] <= cam.d * 0.05) continue;
      const s = cam.F / q[2], hp = p[2] * s;
      if (hp < 3 || hp > 3000) continue;
      const c = HG.camToScreen(cam, q);
      const r = BH.rng(p[3] * 7 + 1), n = 7, P = [];
      for (let i = 0; i < n; i++) {
        const a = Math.PI + (i / (n - 1)) * Math.PI;
        P.push([c[0] + Math.cos(a) * hp * lerp(0.8, 1.15, r()), c[1] + Math.sin(a) * hp * lerp(0.6, 1, r())]);
      }
      const path = HG.pathOf(P);
      ctx.save();
      ctx.lineJoin = 'round'; ctx.lineWidth = 3; ctx.strokeStyle = PAL.ink; ctx.stroke(path);
      ctx.fillStyle = '#2A3C58'; ctx.fill(path);
      ctx.clip(path); ctx.fillStyle = '#4A5E80'; ctx.translate(-hp * 0.18, -hp * 0.2); ctx.globalAlpha = 0.7;
      ctx.beginPath(); ctx.ellipse(c[0], c[1] - hp * 0.2, hp * 0.6, hp * 0.4, 0, 0, TAU); ctx.fill();
      ctx.restore();
    }
  };

  // ------------------------------------------------------------------ clouds (world billboards at 1.2–3 km)
  const CLOUDS = (() => {
    const out = [];
    for (let k = 0; k < 34; k++) {
      const a = BH.hash(k, 61) * TAU, rr = lerp(1500, 26000, Math.pow(BH.hash(k, 62), 0.8));
      const x = Math.cos(a) * rr, z = Math.abs(Math.sin(a)) * rr * 1.1 + 800 - (k % 5 === 0 ? rr * 0.9 : 0);
      out.push([x, lerp(1300, 3000, BH.hash(k, 63)), z, lerp(900, 2600, BH.hash(k, 64)), k]);
    }
    return out;
  })();
  HG.drawClouds = function (ctx, cam, T) {
    const k = HG.spaceK(cam);
    const list = [];
    for (const c of CLOUDS) {
      const g = HG.ground(c[0] + T * 30, c[2], c[1]), q = HG.toCam(cam, g);
      if (q[2] <= 50) continue;
      const s = cam.F / q[2], w = c[3] * s;
      if (w < 8 || w > 6000) continue;
      const sc = HG.camToScreen(cam, q);
      if (sc[0] < -w * 2 || sc[0] > 1080 + w * 2 || sc[1] < -w || sc[1] > 1920 + w) continue;
      list.push([q[2], sc[0], sc[1], w, c[4]]);
    }
    list.sort((a, b) => b[0] - a[0]);
    const high = sstep(0.1, 0.6, sstep(Math.log(3000), Math.log(40000), Math.log(Math.max(1, cam.alt))));
    for (const c of list) {
      const r = BH.rng(c[4] * 13 + 7), n = 6, P = new Path2D(), w = c[3];
      for (let j = 0; j < n; j++) {
        const u = j / (n - 1), env = Math.sin(lerp(0.12, 0.88, u) * Math.PI), rr = w * lerp(0.14, 0.3, r()) * lerp(0.6, 1.1, env);
        const ex = c[1] + (u - 0.5) * w, ey = c[2] - rr * lerp(0.3, 0.7, env);
        P.moveTo(ex + rr, ey); P.arc(ex, ey, rr, 0, TAU);
      }
      P.rect(c[1] - w * 0.5, c[2] - w * 0.08, w, w * 0.08);
      ctx.save();
      ctx.globalAlpha = 0.9 * (1 - k * 0.7);
      ctx.clip(P);

      const lit = HG.mixc(PAL.cloud[2], '#E8F0FF', high), mid = HG.mixc(PAL.cloud[1], '#B8C8E8', high), dk = HG.mixc(PAL.cloud[0], '#7A8AB8', high);
      ctx.fillStyle = lit; ctx.fill(P);
      ctx.translate(0, w * 0.03); ctx.fillStyle = mid; ctx.fill(P);
      ctx.translate(0, w * 0.1); ctx.fillStyle = dk; ctx.fill(P);
      ctx.restore();
    }
  };

  // ------------------------------------------------------------------ edible islands
  // Biome palettes from the game's world map: [top, topLit, rim/sand, feature]
  const BIOMES = {
    meadow: ['#2F7A3A', '#6FCB5A', '#E8C878', '#1E4A2A'], snow: ['#9FC8E0', '#F3FBFF', '#D6F8FF', '#6E8FC2'],
    desert: ['#D8762E', '#FFBC69', '#FFE0A0', '#A0441A'], grave: ['#4A2A6A', '#8A5AC0', '#B08AE0', '#54FF00'],
    lava: ['#3A1450', '#7A3AA0', '#FF7A20', '#F51F00'], candy: ['#E06AA8', '#FFB0D8', '#FFE0F0', '#41A569'],
    plum: ['#4A2A55', '#7A4A88', '#A0709A', '#FFD200'], slate: ['#3A4A48', '#5E7470', '#8AA09A', '#90FF63'],
  };
  HG.BIOMES = BIOMES;
  // The neighbour island (shot 08) and the archipelago (shot 09). Positions in metres around the hero.
  // The neighbour sits just off the home island's west coast, 250 m of sea between them.
  HG.NEIGHBOUR = { id: 'neighbour', cx: -700, cz: 250, R: 340, shape: islandShape(501, 36, 0.4), biome: 'meadow', seed: 501 };

  // A portrait cluster around the hero's feet as the camera looks down at the "world map" (x ±26 km, z −14…62 km).
  HG.ARCHI = (() => {
    const names = ['snow', 'desert', 'grave', 'lava', 'meadow', 'candy', 'plum', 'slate'];
    const out = [];
    const r = BH.rng(9090);
    const spots = [[-19, 66], [3, 74], [21, 62], [-24, 44], [-5, 50], [15, 42], [26, 24], [-22, 22], [-9, 28], [10, 22],
      [-27, 2], [25, 4], [-16, -10], [17, -11], [1, 60], [-1, 36]];
    spots.forEach((sp, k) => {
      out.push({ id: 'a' + k, cx: (sp[0] + (r() - 0.5) * 3) * 1000, cz: (sp[1] + (r() - 0.5) * 3) * 1000, R: lerp(4200, 6800, r()),
        shape: islandShape(7000 + k, 28, 1.15), biome: names[k % names.length], seed: 7000 + k, order: k });
    });
    return out;
  })();

  // Draw an island. st: {pos (world centre, default on the ground), tilt (rad), lift (0..1: rock underside shown),
  // lights (0..1), waterfalls (0..1), bite (0..1 chunk missing), scale, spin}
  HG.drawIsland = function (ctx, cam, I, st) {
    st = st || {};
    const B = BIOMES[I.biome];
    const sc = st.scale == null ? 1 : st.scale;

    const tilt = st.tilt || 0, spin = st.spin || 0;
    const ct = Math.cos(tilt), stl = Math.sin(tilt), cs = Math.cos(spin), ss = Math.sin(spin);

      const y2 = y * ct - z * stl, z2 = y * stl + z * ct;

    const topW = I.shape.map((p) => W3(p[0] * R, 0, p[1] * R));
    const top = HG.projPoly(cam, topW);
    if (top.length < 3) return null;

    for (const p of top) { minx = Math.min(minx, p[0]); maxx = Math.max(maxx, p[0]); miny = Math.min(miny, p[1]); maxy = Math.max(maxy, p[1]); }
    if (maxx < -200 || minx > 1280 || maxy < -200 || miny > 2120) return { top, minx, maxx, miny, maxy };
    const size = Math.max(maxx - minx, maxy - miny);
    const lw = clamp(size * 0.006, 1.2, 4);
    ctx.save();
    ctx.lineJoin = 'round';
    // rocky underside (only when lifted): a jagged cone down to a tip
    const lift = st.lift || 0;
    if (lift > 0) {
      const tip = W3(R * 0.05, -R * lerp(0.1, 0.75, lift), R * 0.02);
      const rim = I.shape.map((p, i) => W3(p[0] * R * 0.96, -R * 0.06 * (1 + BH.hash(i, I.seed)), p[1] * R * 0.96));
      const tipS = HG.project(cam, tip);
      const rimS = rim.map((p) => HG.project(cam, p));
      ctx.fillStyle = PAL.cliff;
      ctx.strokeStyle = PAL.ink; ctx.lineWidth = lw;
      for (let i = 0; i < rimS.length; i++) {
        const a = rimS[i], b = rimS[(i + 1) % rimS.length];
        const mid = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
        ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.lineTo(lerp(mid[0], tipS[0], 0.55), lerp(mid[1], tipS[1], 0.55)); ctx.closePath();
        ctx.fillStyle = i % 3 === 0 ? PAL.cliffLit : i % 3 === 1 ? PAL.cliff : '#3A3060'; ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(lerp(a[0], tipS[0], 0.55), lerp(a[1], tipS[1], 0.55)); ctx.lineTo(lerp(b[0], tipS[0], 0.55), lerp(b[1], tipS[1], 0.55)); ctx.lineTo(tipS[0], tipS[1]); ctx.closePath();
        ctx.fillStyle = i % 2 ? '#2A2244' : '#231A3A'; ctx.fill(); ctx.stroke();
      }
      // waterfalls pouring off the rim

          ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = Math.max(1, size * 0.004);
          ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(a[0], a[1] + len * 0.9); ctx.stroke();
          BH.glow(ctx, a[0], a[1] + len, size * 0.03, '#DFF6FF', 0.4);
        }
        ctx.restore();
      }
    }
    // beach band + top
    const P = HG.pathOf(top);
    ctx.strokeStyle = PAL.ink; ctx.lineWidth = lw * 2; ctx.stroke(P);
    ctx.fillStyle = B[2]; ctx.fill(P);
    const inner = HG.projPoly(cam, I.shape.map((p) => W3(p[0] * R * 0.9, R * 0.004, p[1] * R * 0.9)));
    const Pi = HG.pathOf(inner);

    ctx.fillStyle = B[1]; ctx.globalAlpha = 0.85;

    const r = BH.rng(I.seed * 3 + 1);

      const fx = (r() - 0.5) * 1.3 * R, fz = (r() - 0.5) * 1.3 * R, fh = R * lerp(0.05, 0.14, r());
      const base = HG.project(cam, W3(fx, 0, fz)), tipp = HG.project(cam, W3(fx, fh, fz));

    }
    // lights (villages / torches) that go out when the island is taken
    const lights = st.lights == null ? 1 : st.lights;
    if (lights > 0.01 && size > 14) {
      for (let i = 0; i < 6; i++) {
        const lx = (r() - 0.5) * 1.1 * R, lz = (r() - 0.5) * 1.1 * R, l = HG.project(cam, W3(lx, R * 0.02, lz));
        const fl = 0.75 + 0.25 * Math.sin(st.T * 7 + i * 2.1);
        BH.glow(ctx, l[0], l[1], size * 0.07, '#FFB040', 0.8 * lights * fl);

  };
})();
