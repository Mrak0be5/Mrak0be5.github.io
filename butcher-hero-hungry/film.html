    const el = add(sh, [lerp(14, 4, d), lerp(52, 60, d)]);
    const wr = add(el, [lerp(36, 6 + 24 * kk, d), lerp(-16, 50, d)]);
    form(ctx, BH.limbPts(sh[0], sh[1], 26, el[0], el[1], 18, 22), m, { small: true, sd: 7, seed: seed });
    form(ctx, BH.limbPts(el[0], el[1], 18, wr[0], wr[1], 13, 14), m, { small: true, sd: 6, seed: seed + 1 });
    const fa = Math.atan2(wr[1] - el[1], wr[0] - el[0]);
    [-0.6, 0, 0.6].forEach(function (s) {
      const a = fa + s + lerp(0.9, 0.2, d), b0 = add(wr, [Math.cos(a) * 10, Math.sin(a) * 10]), tip = add(wr, [Math.cos(a + 0.5) * 30, Math.sin(a + 0.5) * 30]);
      form(ctx, [[b0[0] - Math.sin(a) * 6, b0[1] + Math.cos(a) * 6], sharp(tip), [b0[0] + Math.sin(a) * 6, b0[1] - Math.cos(a) * 6]], bm, { small: true, flat: true, lw: 2.6 });
    });
    form(ctx, BH.ellPts(wr[0], wr[1], 14, 12, fa, 8), m, { small: true, sd: 4 });
  }

  // ---------------------------------------------------------------- body
  const BODY = [[80, -202], [128, -178], [154, -128], [140, -62], [96, -18], [30, 0], [-40, -4], [-104, -28], [-150, -70], [-168, -114], [-146, -160], [-92, -194], [-10, -210]];
  const BELLY = [[160, -130], [146, -58], [100, -12], [30, 8], [-44, 4], [-110, -22], [-128, -12], [-96, -36], [-40, -22], [26, -26], [84, -44], [118, -84], [128, -128]];
  const BACK_SPIKES = [[92, -196, 46], [36, -208, 60], [-26, -206, 62], [-86, -190, 54], [-134, -162, 42]];

  // ---------------------------------------------------------------- flame at the mouth (first ~150 units)
  function flame(ctx, m, ang, f, T) {
    ctx.save();
    ctx.translate(m[0], m[1]); ctx.rotate(ang);
    const grow = BH.E('power2.out', clamp(f * 1.5, 0, 1)), Lf = 160 * (0.3 + 0.7 * grow);
    const W1 = 56 * (0.5 + 0.5 * f);
    // Cone along +x: scalloped edges whose bumps travel outward, a round front split into flame tongues.
    function cone(kw, kl, add0, seed) {
      const len = Lf * kl, n = 10, top = [], bot = [];
      for (let i = 0; i <= n; i++) {
        const x = len * i / n, u = x / Lf;
        for (let side = -1; side <= 1; side += 2) {
          const sc = 1 + 0.2 * Math.sin(x * 0.09 - T * 24 + seed + side * 1.7) * Math.min(1, u * 3);
          const w = ((5 + (W1 - 5) * Math.pow(u, 0.6)) * kw + add0) * sc;
          (side < 0 ? top : bot).push([x, side * w + BH.noise1(T * 8 + i * 0.7, seed + side) * 3 * u]);
        }
      }
      const pts = top.slice(), wE = (Math.abs(top[n][1]) + Math.abs(bot[n][1])) / 2, cy = (top[n][1] + bot[n][1]) / 2, cx = len - wE * 0.25;
      for (let j = 1; j < 8; j++) {       // front cap: alternating tongue tips (sharp) and notches
        const a = -Math.PI / 2 + j / 8 * Math.PI, tip = j % 2 === 1;
        const r = wE * (tip ? 1.2 + 0.25 * Math.sin(T * 17 + j * 2.3 + seed) : 0.78);
        const q = [cx + Math.cos(a) * r * (tip ? 1.25 : 1), cy + Math.sin(a) * r];
        pts.push(tip ? sharp(q) : q);
      }
      for (let i = n; i >= 0; i--) pts.push(bot[i]);
      return pts;
    }
    if (!BH.mono) BH.glow(ctx, Lf * 0.4, 0, Lf * 1.15, '#FF7D29', 0.5 * f);
    const lw = 3 * BH.lwK;
    ctx.lineJoin = 'round';
    // dark smoke rim: a bigger copy of the cone behind the fire, thickest at the far end
    const SM = BH.spline(cone(1.1, 1.04, 4, 13), true);
    ctx.lineWidth = lw * 2; ctx.strokeStyle = BH.mono || '#140406'; ctx.stroke(SM);
    ctx.fillStyle = BH.mono || '#43161F'; ctx.fill(SM);
    if (!BH.mono) {
      ctx.fillStyle = '#FF3D1F'; ctx.fill(BH.spline(cone(1, 1, 0, 1), true));
      ctx.fillStyle = '#FF8E00'; ctx.fill(BH.spline(cone(0.7, 0.86, -2, 5), true));
      ctx.fillStyle = '#FFE36A'; ctx.fill(BH.spline(cone(0.46, 0.7, -1, 9), true));
      ctx.fillStyle = '#FFFBE6'; ctx.beginPath(); ctx.ellipse(16, 0, 22 * f + 6, 6 * f + 3, 0, 0, TAU); ctx.fill();
      // muzzle burst star at the lips
      const star = [];
      for (let i = 0; i < 14; i++) { const a = i / 14 * TAU + T * 4, r = (i % 2 ? 12 : 30) * (0.6 + 0.4 * f); star.push([Math.cos(a) * r * 0.8, Math.sin(a) * r]); }
      ctx.fillStyle = 'rgba(255,227,106,0.9)'; ctx.fill(BH.poly(star));
      // smoke puffs peeling off the far end + embers flung out of the cone
      for (let i = 0; i < 3; i++) {
        const s = fr(T * 1.8 + i / 3), side = i % 2 ? 1 : -1, r = (8 + 10 * s) * (1 - s * 0.5) * f;
        const x = Lf * (0.9 + 0.35 * s), y = side * (W1 * 0.9 + s * 26);
        ctx.fillStyle = BH.rgba('#43161F', 1 - s); ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
      }
      for (let i = 0; i < 7; i++) {
        const s = fr(T * 1.6 + i * 0.31), x = 30 + s * Lf * 1.15, y = (BH.hash(i, 3) - 0.5) * 2 * (W1 * 0.6 + s * 60), r = 5 * (1 - s) + 2;
        ctx.fillStyle = i % 2 ? '#FFE36A' : '#FF8E00';
        ctx.beginPath(); ctx.moveTo(x, y - r); ctx.lineTo(x + r, y); ctx.lineTo(x, y + r); ctx.lineTo(x - r, y); ctx.closePath(); ctx.fill();
      }
    }
    ctx.restore();
  }

  // ---------------------------------------------------------------- draw
  function draw(ctx, st) {
    const px = st.px == null ? 1 : st.px;
    LOD = px < 0.15 ? 0 : px < 0.5 ? 1 : 2;
    const det = LOD === 2;
    const P = pose(st), T = P.T;
    ctx.save();
    ctx.translate(0, P.bob);
    if (P.pitch) { ctx.translate(0, -105); ctx.rotate(P.pitch); ctx.translate(0, 105); }

    const L = 360;
    // far wing
    wing(ctx, P.wings[0], [74, -204], [-110, -176], L, 0.06, true, det);
    // far legs
    if (LOD > 0) {
      hindLeg(ctx, P, [26, -14], FAR.hide, FAR.black, det, 11);
      foreLeg(ctx, P, [22, -12], FAR.hide, FAR.black, det, 21);
    }
    // tail
    const tw = function (i) { return P.tailAmp * Math.sin(T * P.tailFreq - i * 1.1) * (i / 4); };
    const dr = P.tailDroop;
    const TC = [[-120, -100], [-196, -96 + tw(1) + 20 * dr], [-262, -80 + tw(2) + 60 * dr], [-318, -80 + tw(3) + 100 * dr], [-356, -66 + tw(4) + 130 * dr]];
    const tcurve = BH.curve(TC, 48);
    const tailW = function (u) { return lerp(46, 9, Math.pow(u, 0.85)); };
    if (LOD > 0) {
      [0.2, 0.42, 0.62, 0.8].forEach(function (u, i) {
        const f = frameAt(tcurve, u, [0, -1]);
        spike(ctx, add(f.p, [f.n[0] * tailW(u) * 0.7, f.n[1] * tailW(u) * 0.7]), f.n, [-f.t[0], -f.t[1]], 34 - i * 5, 38 - i * 6, 16, DM.black);
      });
    }
    // spade
    const tEnd = frameAt(tcurve, 1, [0, -1]), ta = Math.atan2(tEnd.t[1], tEnd.t[0]);
    const spade = [[-14, 0], [4, -30, 1], [22, -16], [58, 0, 1], [22, 16], [4, 30, 1]].map(function (p) { const q = rot(p, ta); return [tEnd.p[0] + q[0], tEnd.p[1] + q[1], p[2]]; });
    form(ctx, spade, DM.black, { small: true, sd: 5, peak: [tEnd.p[0] + Math.cos(ta) * 14, tEnd.p[1] + Math.sin(ta) * 14] });
    form(ctx, BH.ribbon(TC, tailW, 26), DM.hide, { seed: 61, sd: 12, dd: 4, peak: TC[1],
      inner: function (c) {
        if (LOD === 0) return;
        const bs = offsetCurve(TC, function (u) { return tailW(u) * 0.95; }, [0, 1], 16);
        BH.form(c, BH.ribbon(bs, function (u) { return tailW(u) * 0.42; }, 16), mt(DM.belly, { small: true, sd: 5, inner: function (c2) {
          if (!det) return;
          c2.globalCompositeOperation = 'multiply';
          for (let i = 1; i < 8; i++) {
            const f = frameAt(tcurve, i / 8, [0, 1]), w = tailW(i / 8);
            inkStroke(c2, [add(f.p, [f.n[0] * w * 0.35, f.n[1] * w * 0.35]), add(f.p, [f.n[0] * w * 1.2, f.n[1] * w * 1.2])], 3, '#C8784A');
          }
          c2.globalCompositeOperation = 'source-over';
        } }));
      } });

    // neck
    const Hj = P.Hj, N0 = [96, -128];
    const N2 = add(Hj, rot([-50 * P.hs, 34 * P.hs], P.hr));
    const und = 10 * Math.sin(T * 4.2 + 1.6) * (1 - P.fire);
    const N1 = add(L2(N0, N2, 0.5), [-18 + und, -6]);
    const NC = [N0, N1, N2, add(Hj, rot([-6 * P.hs, 10 * P.hs], P.hr))];
    const ncurve = BH.curve(NC, 48);
    const neckW = function (u) { return lerp(64, 40, Math.pow(u, 0.8)); };
    const throat = [0.9, 0.5];
    if (LOD > 0) {
      [0.28, 0.5, 0.72].forEach(function (u, i) {
        const f = frameAt(ncurve, u, [-throat[0], -throat[1]]);
        spike(ctx, add(f.p, [f.n[0] * neckW(u) * 0.72, f.n[1] * neckW(u) * 0.72]), f.n, [-f.t[0], -f.t[1]], 36 - i * 3, 44 - i * 4, 18, DM.black);
      });
    }
    form(ctx, BH.ribbon(NC, neckW, 24), DM.hide, { seed: 63, sd: 12, dd: 4, peak: N1,
      inner: function (c) {
        if (LOD === 0) return;
        const bs = offsetCurve(NC, function (u) { return neckW(u) * 0.92; }, throat, 16);
        BH.form(c, BH.ribbon(bs, function (u) { return neckW(u) * 0.48; }, 16), mt(DM.belly, { small: true, sd: 6, inner: function (c2) {
          if (!det) return;
          c2.globalCompositeOperation = 'multiply';
          for (let i = 1; i < 6; i++) {
            const f = frameAt(ncurve, i / 6, throat), w = neckW(i / 6);
            inkStroke(c2, [add(f.p, [f.n[0] * w * 0.4, f.n[1] * w * 0.4]), add(f.p, [f.n[0] * w * 1.2, f.n[1] * w * 1.2])], 3.2, '#C8784A');
          }
          c2.globalCompositeOperation = 'source-over';
        } }));
      } });

    // back plates + body
    if (LOD > 0) BACK_SPIKES.forEach(function (s, i) { spike(ctx, [s[0], s[1] + 22], rot([0, -1], -0.25 - i * 0.06), [-1, 0], s[2] * 0.8, s[2], 22, DM.black, { small: false, seed: 40 + i }); });
    form(ctx, BODY, DM.hide, { peak: [-10, -140], seed: 65, h: 0.55,
      inner: function (c) {
        if (LOD === 0) return;
        BH.form(c, BELLY, mt(DM.belly, { peak: [20, -30], seed: 67, h: 0.35, inner: function (c2) {
          if (!det) return;
          c2.globalCompositeOperation = 'multiply';
          [[132, -120, 104, -104], [128, -72, 96, -64], [96, -26, 74, -40], [48, -6, 36, -30], [-6, -4, -8, -26], [-58, -10, -54, -30]].forEach(function (q) {
            inkStroke(c2, [[q[0] + 20, q[1] + 16], [q[2], q[3]]], 3.6, '#C8784A');
          });
          c2.globalCompositeOperation = 'source-over';
        } }));
        if (!det) return;
        // flank scales: faint chevrons in multiply
        c.globalCompositeOperation = 'multiply';
        for (let r = 0; r < 3; r++) for (let q = 0; q < 5; q++) {
          const x = -100 + q * 48 + (r % 2) * 24, y = -160 + r * 34 + Math.abs(q - 2) * 4;
          inkStroke(c, [[x - 12, y - 6], [x, y + 4], [x + 12, y - 6]], 3, '#D896B4');
        }
        c.globalCompositeOperation = 'source-over';
      } });

    // head
    head(ctx, P, det);

    // near legs
    if (LOD > 0) {
      hindLeg(ctx, P, [0, 0], DM.hide, DM.black, det, 13);
      foreLeg(ctx, P, [0, 0], DM.hide, DM.black, det, 23);
    }
    // near wing
    wing(ctx, P.wings[1], [26, -186], [-150, -150], L, -0.2, false, det);

    // flame at the mouth
    if (P.fire > 0.01) {
      const ja = P.jaw * 0.95;
      flame(ctx, toWorld(P, mouthLocal(ja)), P.hr + ja * 0.45, P.fire, T);
    }
    ctx.restore();
  }

  // mouth point in the fire pose (no bob, no pitch): where the engine starts its fire stream
  const FP = pose({ T: 0, phase: 'alive', u: 1, fire: 1 });
  const MOUTH = toWorld(FP, mouthLocal(FP.jaw * 0.95)).map(function (v) { return Math.round(v); });

  HG.prey.dragon = {
    units: 700,
    hook: [124, -120],
    pivot: [0, -105],
    mouth: MOUTH,
    fireAngle: +(FP.hr + FP.jaw * 0.95 * 0.45).toFixed(3),
    draw: draw,
  };
})();

<script>
// ---- src/world/35-prey-tower.js
// 35-prey-tower.js — HG.prey.tower: the game's Boss Tower (vampire-lands masonry), yanked out of the
// ground like a carrot. Five boss floors: Lava Crab (balcony arch), two horned Vikings, the Berserker on a
// balcony, the Vampire King, the Lich under the spire. Reuses the boss rigs of 16-bh-bosses.js.
// units = 1000 (ground → pole tip), faces right, ground contact (0, 0), up = −y.
(function () {
  'use strict';
  const HG = (window.HG = window.HG || {});
  const BH = window.BH;
  HG.prey = HG.prey || {};
  const TAU = Math.PI * 2, clamp = BH.clamp, lerp = BH.lerp, mix = BH.mix;
  const INK = '#0C0714';
  const BM = BH.BOSSMAT;

  // ------------------------------------------------------------------ geometry
  const LEAN = 0.06;                                   // lean to the right, units x per unit up
  const LX = (y) => -y * LEAN;
  // floors bottom → top: y0 (bottom), y1 (top), half widths, cornice {h, w}
  const FL = [
    { id: 'plinth', y0: 0, y1: -60, w0: 178, w1: 170, cor: { h: 10, w: 176 } },
    { id: 'crab', y0: -70, y1: -212, w0: 160, w1: 154, cor: { h: 16, w: 170 } },
    { id: 'viking', y0: -228, y1: -352, w0: 150, w1: 145, cor: { h: 14, w: 160 } },
    { id: 'bers', y0: -366, y1: -520, w0: 140, w1: 134, cor: { h: 14, w: 150 } },
    { id: 'king', y0: -534, y1: -672, w0: 130, w1: 124, cor: { h: 12, w: 140 } },
    { id: 'lich', y0: -684, y1: -800, w0: 118, w1: 112, cor: null },
  ];
  const ROOF = { y0: -790, eave: 134, tip: -984, tipDx: 22 };
  const POLE = -1000;
  const roofCX = (y) => { // centre line of the cone (bends a little right near the tip)
    const k = clamp((ROOF.y0 - y) / (ROOF.y0 - ROOF.tip), 0, 1);
    return LX(y) + ROOF.tipDx * k * k;
  };
  const HOOK = [Math.round(roofCX(-925)), -925];
  const PIVOT = [Math.round(LX(-500)), -500];

  // wall bands (fraction of the half width) — 4-step cel faces of an octagonal drum, lit from upper-left
  const BANDS = [[-1, -0.66, '#66589A'], [-0.66, 0.06, '#4B406E'], [0.06, 0.68, '#3E3462'], [0.68, 1, '#2B2349']];
  const COR_BANDS = [[-1, -0.66, '#7A6CB0'], [-0.66, 0.06, '#5C5088'], [0.06, 0.68, '#4C4176'], [0.68, 1, '#342B56']];
  const ROOF_BANDS = [[-1, -0.42, '#B23C66'], [-0.42, 0.22, '#86204A'], [0.22, 1, '#56102E']];

  // materials (lw in device px: the engine keeps BH.lwK ≈ 1/px)
  const M = BH.M;
  const DIRT = { fill: '#5B3F33', ramp: ['#24160F', '#3D2A21', '#5B3F33', '#7A5A48', '#9A7A62'], gain: 0.85, h: 0.3,
    shade: '#B0A6C0', sd: 46, rim: '#9A90D8', rd: 5, hi: '#8A6A55', hd: 7, lw: 3.2, seed: 11 };
  const CLOD = { fill: '#5B3F33', rim: '#9A90D8', rd: 2.4, hi: '#8A6A55', hd: 3.5, lw: 2.6 };
  const ROCK = M(BM.stone, { fill: '#6E6A8E', ramp: ['#24223A', '#44405E', '#6E6A8E', '#9894B4', '#C4C0DA'], sd: 10, rd: 2.4, hd: 3, lw: 2.6, k: 1, rings: [0.5], zs: [0.8], h: 0.5 });
  const TURF = { fill: '#2A5566', ramp: ['#0E2230', '#1E3849', '#2A5566', '#3E7384', '#5C94A2'], gain: 0.8, h: 0.3,
    rim: '#7F8DD6', rd: 2, hi: '#5C94A2', hd: 3, lw: 2.8 };
  const BANNER = M(BM.lining, { sd: 8, rd: 1.6, hd: 2, lw: 2.4, k: 1, rings: [0.5], zs: [0.8], h: 0.25 });
  const FLAG = M(BM.lining, { sd: 6, rd: 1.4, hd: 1.6, lw: 2.4, flat: true });
  const GOLD = M(BH.MAT.gold, { sd: 3, rd: 1, hd: 1.2, lw: 2, k: 1, rings: [0.5], zs: [0.8] });
  const WOOD = M(BH.MAT.leather, { sd: 8, rd: 1.6, hd: 2, lw: 2.4, flat: true });
  // viking + lich
  const VSKIN = { fill: '#F2A77A', ramp: ['#9A4A34', '#C8704E', '#F2A77A', '#FFC89E', '#FFE4CC'], gain: 0.85, h: 0.55,
    shade: '#D6A2B8', sd: 9, rim: '#9AA6FF', rd: 1.6, hi: '#FFD8B8', hd: 2, lw: 2.2, k: 1, rings: [0.5], zs: [0.8] };
  const BEARD = { fill: '#E07A2A', ramp: ['#6E2A10', '#A8481A', '#E07A2A', '#F5A04A', '#FFC880'], gain: 0.9, h: 0.5,
    shade: '#C890A8', sd: 7, rim: '#FFB080', rd: 1.4, hi: '#FFC880', hd: 1.6, lw: 2.2, k: 1, rings: [0.5], zs: [0.8] };
  const HELM = M(BH.MAT.metal, { sd: 7, rd: 1.4, hd: 2, lw: 2.2, k: 1, rings: [0.5], zs: [0.8] });
  const HORN = M(BM.horn, { sd: 4, lw: 2 });
  const FUR = M(BM.mane, { sd: 8, lw: 2.2, k: 1, rings: [0.5], zs: [0.8] });
  const TUNIC = { fill: '#3A5A9E', ramp: ['#16204A', '#26386E', '#3A5A9E', '#5A7EC8', '#86A8E8'], gain: 0.9, h: 0.45,
    shade: '#A8A0D0', sd: 9, rim: '#A0B0FF', rd: 1.6, hi: '#5A7EC8', hd: 1.6, lw: 2.2, k: 1, rings: [0.5], zs: [0.8] };
  const GROBE = { fill: '#2E8A4A', ramp: ['#0C331A', '#17562C', '#2E8A4A', '#4DB868', '#86E69A'], gain: 0.9, h: 0.5,
    shade: '#8CA8C8', sd: 10, rim: '#7AF0FF', rd: 1.8, hi: '#86E69A', hd: 1.6, lw: 2.2, k: 1, rings: [0.5], zs: [0.8] };
  const BONE = M(BM.horn, { sd: 7, lw: 2.2 });

  // ------------------------------------------------------------------ small helpers
  let LW = 1;           // units per device px for hand strokes (set per draw)
  function P(pts) { return BH.poly(pts); }
  // many small polygons in one path: one ink pass + one fill (cheap)
  function multi(list) { const Q = new Path2D(); list.forEach(function (pts) { BH.poly(pts, Q); }); return Q; }
  function fillP(ctx, Pp, col) { ctx.fillStyle = BH.mono || col; ctx.fill(Pp); }
  function inkP(ctx, Pp, w) { ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.lineWidth = w * 2 * BH.lwK; ctx.strokeStyle = BH.mono || INK; ctx.stroke(Pp); }
  function line(ctx, pts, w, col) {
    ctx.strokeStyle = BH.mono || col; ctx.lineWidth = w * BH.lwK; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.stroke();
  }
  // flat inked shape (no clip / shading passes: cheap)
  function flat(ctx, pts, fill, lw, curved) {
    const Q = curved === false ? BH.poly(pts) : BH.spline(pts, true);
    if (lw > 0) inkP(ctx, Q, lw);
    fillP(ctx, Q, fill);
    return Q;
  }
  function dot(ctx, x, y, r, col) { ctx.fillStyle = BH.mono || col; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); }
  function glow(ctx, x, y, r, col, a) { if (!BH.mono && a > 0.01) BH.glow(ctx, x, y, r, col, a); }
  function fract(x) { return x - Math.floor(x); }
  // run fn with outlines scaled for a rig drawn at scale s (rig lw stays ~device px)
  function rigLw(s, fn) { const k = BH.lwK; BH.lwK = LW / s; try { fn(); } finally { BH.lwK = k; } }
  function clipAbove(ctx, y) { ctx.beginPath(); ctx.rect(-3000, -4000, 6000, 4000 + y); ctx.clip(); }
  // pointed (lancet) arch: bottom yb, springline ys, apex ya, half width hw, centre cx
  function archPath(cx, yb, ys, ya, hw) {
    const Pp = new Path2D();
    Pp.moveTo(cx - hw, yb); Pp.lineTo(cx - hw, ys);

    // ---------- windows (per floor, in floor space)
    const W = {};
    function cxF(i, y) { return LX(y) + dxs[i]; }
    // pass 1: structure
    walls(ctx, dxs, lod);
    FL.forEach(function (f, i) {
      const d = dxs[i];
      if (f.id === 'plinth') door(ctx, d, T, lod);
      if (f.id === 'crab') {
        W.crab = { x: cxF(i, -140), yb: -84, ys: -150, ya: -196, hw: 84, fr: 10, seed: 1, c0: '#FF5A14', c1: '#FFB020', dark: '#2A0A10' };
        windowBack(ctx, W.crab, st, lod);
        banner(ctx, cxF(i, -150) - 124, -204, 30, 104, T, 1, flying ? 18 : 0);
        banner(ctx, cxF(i, -150) + 124, -204, 30, 104, T, 2, flying ? 18 : 0);
      }
      if (f.id === 'viking') {
        W.v1 = { x: cxF(i, -290) - 58, yb: -242, ys: -290, ya: -326, hw: 33, fr: 8, seed: 2, c0: '#FF9A20', c1: '#FFE060' };
        W.v2 = { x: cxF(i, -290) + 60, yb: -242, ys: -290, ya: -326, hw: 33, fr: 8, seed: 3, c0: '#FF9A20', c1: '#FFE060' };
        windowBack(ctx, W.v1, st, lod); windowBack(ctx, W.v2, st, lod);
        if (lod >= 1) slits(ctx, [[cxF(i, -300) - 122, -276, 44, 8], [cxF(i, -300) + 124, -276, 44, 8]], T);
      }
      if (f.id === 'bers') {
        W.bers = { x: cxF(i, -450), yb: -380, ys: -468, ya: -510, hw: 72, fr: 10, seed: 4, c0: '#FF3A20', c1: '#FF8A30', dark: '#2A0810' };
        windowBack(ctx, W.bers, st, lod);
        banner(ctx, cxF(i, -470) - 106, -510, 26, 92, T, 3, flying ? 18 : 0);
        banner(ctx, cxF(i, -470) + 106, -510, 26, 92, T, 4, flying ? 18 : 0);
      }
      if (f.id === 'king') {
        W.king = { x: cxF(i, -600), yb: -548, ys: -606, ya: -652, hw: 66, fr: 9, seed: 5, c0: '#E0203A', c1: '#FF6A50', dark: '#22060E' };
        windowBack(ctx, W.king, st, lod);
        if (lod >= 1) slits(ctx, [[cxF(i, -600) - 102, -566, 48, 8], [cxF(i, -600) + 104, -566, 48, 8]], T + 0.7);
      }
      if (f.id === 'lich') {
        W.lich = { x: cxF(i, -730), yb: -698, ys: -734, ya: -766, hw: 52, fr: 8, seed: 6, c0: '#22E0E0', c1: '#80FFFF', dark: '#06161A', gl: 1.4 };
        windowBack(ctx, W.lich, st, lod);
        if (lod >= 1) slits(ctx, [[cxF(i, -740) - 88, -712, 40, 7], [cxF(i, -740) + 90, -712, 40, 7]], T + 1.3);
      }
    });
    cornices(ctx, dxs, lod);
    cracks(ctx, crackK, dxs);

    // pass 2: bosses (in front of their windows), sills / parapet
    const small = px < 0.26;
    const shakeK = alive ? 0.6 + 0.4 * attack : 1;
    try {
      // Lava Crab (mirrored so it faces right)
      {
        const w = W.crab;
        if (small) blobFace(ctx, w.x, w.yb - 40, 40, '#C0392B', '#FFE040', 'crab');
        else {
          ctx.save(); clipAbove(ctx, w.yb + 2);
          const bounce = alive ? Math.abs(Math.sin(T * 6)) * 4 * (0.4 + attack) : dead ? Math.sin(T * 40) * 3 : Math.sin(T * 25) * 3;
          ctx.translate(w.x - 4, w.yb - bounce); ctx.scale(-1, 1);
          rigLw(0.36, function () { BH.lavaCrab(ctx, 0, 0, 0.36, { t: T, fuse: alive ? 0.15 : dead ? 0.15 + 0.5 * u : hooked ? 0.65 + 0.3 * u : 0.95, strain: alive ? attack : 1 }); });
          ctx.restore();
        }
        sill(ctx, w.x, w.yb - 2, w.hw + 16, 14);
      }
      // Vikings
      [W.v1, W.v2].forEach(function (w, k) {
        const fall = flying && k === 0;
        if (small) { blobFace(ctx, w.x, w.yb - 30, 22, '#F2A77A', INK, 'horns'); sill(ctx, w.x, w.yb - 2, w.hw + 10, 12); return; }
        if (fall) {
          sill(ctx, w.x, w.yb - 2, w.hw + 10, 12);
          const a = u;
          viking(ctx, w.x - 40 - 120 * a, w.yb + 30 + 220 * a * a, 0.85, { t: T, alarm: 1, shake: 1, fist: 1, flail: true, rot: -0.6 - a * 4, seed: 1 });
          return;
        }
        ctx.save(); clipAbove(ctx, w.yb + 2);
        const lean = alive ? 6 * attack : 0;
        const pk = alive ? Math.max(0, Math.sin(T * 2.3 + k * 2)) * 4 : 0;
        viking(ctx, w.x + (k ? 6 : -4) + lean * (k ? 1 : -1), w.yb - 32 - pk, 0.85, { t: T, alarm: alarm, shake: shakeK, fist: 1, f: k ? 1 : -1, axe: k === 1, seed: k * 3, flail: hooked, rot: (k ? 0.1 : -0.1) * (alive ? attack : 1) });
        ctx.restore();
        sill(ctx, w.x, w.yb - 2, w.hw + 10, 12);
      });
      // Berserker on the balcony
      {
        const w = W.bers, i = 3, rg = alive ? 0.3 + 0.7 * attack : 1;
        if (small) blobFace(ctx, w.x, w.yb - 110, 30, '#E0302A', '#FFE040', 'bers');
        else {
          ctx.save(); clipAbove(ctx, -366);
          const jump = alive ? Math.abs(Math.sin(T * 8)) * 6 * (0.5 + attack) : Math.abs(Math.sin(T * 14)) * 5;
          const sway = Math.sin(T * (alive ? 9 : 16)) * 0.06;
          ctx.translate(w.x, -350 - jump); ctx.rotate(sway);
          rigLw(0.4, function () { BH.berserker(ctx, 0, 0, 0.4, { t: T, rage: rg, steam: rg }); });
          ctx.restore();
        }
        // parapet with corbels
        const cx = cxF(i, -390), y0 = -366, y1 = -412, hw = 98;
        if (lod >= 1) for (let c = -2; c <= 2; c++) {
          const x = cx + c * 38, cp = P([[x - 10, y0], [x + 10, y0], [x + 5, y0 + 22], [x - 5, y0 + 22]]);
          inkP(ctx, cp, 1.8); fillP(ctx, cp, c < 0 ? '#5C5088' : '#3E3462');
        }
        const PP = P([[cx - hw, y0], [cx + hw, y0], [cx + hw, y1], [cx - hw, y1]]);
        inkP(ctx, PP, 3);
        if (!BH.mono) {
          COR_BANDS.forEach(function (b) { fillP(ctx, P(bandQuad(cx, y0, hw, cx, y1, hw, b[0], b[1])), b[2]); });
          for (let c = -3; c <= 3; c++) { const x = cx + c * 26; const ap = archPath(x, y0 - 8, y1 + 16, y1 + 8, 7); fillP(ctx, ap, '#170C26'); }
          const cap = P([[cx - hw - 6, y1 - 6], [cx + hw + 6, y1 - 6], [cx + hw + 6, y1 + 4], [cx - hw - 6, y1 + 4]]);
          inkP(ctx, cap, 2.4); fillP(ctx, cap, '#5C5088');
          fillP(ctx, P([[cx - hw - 6, y1 - 6], [cx + hw + 6, y1 - 6], [cx + hw + 6, y1 - 2], [cx - hw - 6, y1 - 2]]), '#A898DA');
        }
      }
      // Vampire King
      {
        const w = W.king;
        if (small) blobFace(ctx, w.x, w.yb - 46, 28, '#9CC8F0', '#FFE040', 'king');
        else {
          ctx.save(); clipAbove(ctx, w.yb + 2);
          const wob = alive ? Math.sin(T * 3) * 0.05 : dead ? Math.sin(T * 30) * 0.08 : Math.sin(T * 22) * 0.12;
          const arms = alive ? 0.25 + 0.2 * Math.sin(T * 7) * attack : hooked || flying ? 0.5 + 0.5 * Math.sin(T * 18) : 0.1;
          rigLw(0.52, function () {
            BH.vking(ctx, w.x + 2, w.yb + 8, 0.52, { t: T, tilt: wob, arms: clamp(arms, 0, 1), brow: alarm, jaw: alarm ? 0.8 + 0.2 * Math.sin(T * 20) : 0.2 + 0.2 * attack,
              look: [alarm ? 0 : 2, 0], eyes: 1, legs: false, chained: false, capeFlow: flying ? [16, -10] : [0, 0] });
          });
          ctx.restore();
        }
        sill(ctx, w.x, w.yb - 2, w.hw + 14, 13);
      }
      // Lich
      {
        const w = W.lich;
        if (small) blobFace(ctx, w.x, w.yb - 30, 22, '#EFE2C0', '#33FFFF', 'crown');
        else if (flying) {
          // tumbling out of the window, off to the right
          sill(ctx, w.x, w.yb - 2, w.hw + 10, 12);
          const a = u;
          lich(ctx, w.x + 70 + 150 * a, w.yb - 10 + 60 * a + 160 * a * a, 0.85, { t: T, alarm: 1, cast: 1, rot: 0.5 + a * 3.5 });
        } else {
          ctx.save(); clipAbove(ctx, w.yb + 2);
          lich(ctx, w.x - 4, w.yb - 34 - (alive ? 2 * attack : 0), 0.85, { t: T, alarm: alarm, cast: alive ? 0.4 + 0.6 * attack : 1 });
          ctx.restore();
          sill(ctx, w.x, w.yb - 2, w.hw + 10, 12);
        }
      }
    } finally { }

    // pass 3: roof on top
    roof(ctx, st, roofDx, lod);
    // alarm marks when the weapon lands / the hook bites
    if ((dead || hooked) && !small) {
      const pop = dead ? BH.E('back.out(2.4)', BH.sstep(0.05, 0.3, u)) : 1;
      const wig = Math.sin(T * 24) * 0.12;
      if (pop > 0.01) {
        bang(ctx, W.king.x + 70, W.king.ya - 6, 1.1 * pop, 0.25 + wig);
        bang(ctx, W.crab.x - 96, W.crab.ya + 4, 1.2 * pop, -0.3 - wig);
        bang(ctx, W.v2.x + 44, W.v2.ya - 4, 0.9 * pop, 0.3 + wig);
      }
    }
    debris(ctx, st, dead ? 1 - u * 0.5 : hooked ? 0.6 : 0);
  }

  HG.prey.tower = {
    units: 1000,
    hook: HOOK,
    pivot: PIVOT,
    draw(ctx, st) {
      const k0 = BH.lwK, px = Math.max(st.px || 1, 1e-4);
      // the engine keeps BH.lwK ≈ 1/px (≈3 px outlines); on a bench that leaves it at 1, emulate that
      const K = k0 === 1 ? 1 / px : k0;
      BH.lwK = K; LW = K;
      const fx0 = BH.lowFx; BH.lowFx = true;   // flat cel + crescents; facets are hand-painted where they matter
      ctx.save();
      try { drawTower(ctx, st); } finally { ctx.restore(); BH.lwK = k0; BH.lowFx = fx0; }
    },
  };
})();

</script>
